<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>صفحه پیدا نشد | محمدحسین صنعتی</title>
    <!-- Font Awesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
    <!-- فونت وزیرمتن -->
    <link href="https://cdn.jsdelivr.net/gh/rastikerdar/vazirmatn@v33.003/Vazirmatn-font-face.css" rel="stylesheet" />
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Vazirmatn', sans-serif;
            background-color: #0b0b0b;
            color: #e0e0e0;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 1.5rem;
            position: relative;
        }

        /* افکت پس‌زمینه */
        body::before {
            content: '';
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: radial-gradient(circle at 20% 30%, rgba(255, 215, 0, 0.03) 0%, transparent 50%),
                        radial-gradient(circle at 80% 70%, rgba(0, 150, 255, 0.03) 0%, transparent 50%);
            z-index: 0;
        }

        .container {
            max-width: 550px;
            width: 100%;
            background: rgba(20, 20, 20, 0.7);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.06);
            border-radius: 2rem;
            padding: 3rem 2.5rem;
            text-align: center;
            box-shadow: 0 25px 60px rgba(0, 0, 0, 0.8);
            position: relative;
            z-index: 1;
        }

        /* آیکون خطا */
        .error-icon {
            font-size: 5rem;
            color: #f5c842;
            margin-bottom: 0.3rem;
            display: inline-block;
            animation: float 3s ease-in-out infinite;
            text-shadow: 0 0 40px rgba(245, 200, 66, 0.2);
        }

        @keyframes float {
            0% { transform: translateY(0px); }
            50% { transform: translateY(-10px); }
            100% { transform: translateY(0px); }
        }

        h1 {
            font-size: 6rem;
            font-weight: 900;
            background: linear-gradient(135deg, #f5c842 0%, #d4a020 100%);
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
            line-height: 1;
            margin: 0.2rem 0 0.3rem;
            letter-spacing: -2px;
        }

        .subtitle {
            font-size: 1.5rem;
            font-weight: 700;
            color: #f0f0f0;
            margin-bottom: 0.5rem;
        }

        .message {
            font-size: 1rem;
            color: #a8a8a8;
            margin: 0 auto 2rem;
            line-height: 1.8;
        }

        .message i {
            color: #f5c842;
            margin: 0 4px;
        }

        /* دکمه رفرش */
        .btn-refresh {
            display: inline-flex;
            align-items: center;
            gap: 12px;
            padding: 0.9rem 2.8rem;
            border-radius: 60px;
            font-family: 'Vazirmatn', sans-serif;
            font-size: 1.05rem;
            font-weight: 600;
            text-decoration: none;
            background: #f5c842;
            color: #0b0b0b;
            border: none;
            cursor: pointer;
            box-shadow: 0 6px 24px rgba(245, 200, 66, 0.25);
            transition: all 0.25s ease;
        }

        .btn-refresh:hover {
            background: #ffd95e;
            transform: translateY(-3px);
            box-shadow: 0 12px 32px rgba(245, 200, 66, 0.35);
        }

        .btn-refresh:active {
            transform: scale(0.95);
        }

        .btn-refresh i {
            font-size: 1.2rem;
        }

        /* بخش آپدیت */
        .update-section {
            margin-top: 2.5rem;
            padding-top: 2rem;
            border-top: 1px solid rgba(255, 255, 255, 0.06);
        }

        .update-info {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            color: #888;
            font-size: 0.9rem;
            flex-wrap: wrap;
        }

        .update-info i {
            color: #f5c842;
            font-size: 1rem;
        }

        .update-info .date {
            color: #b0b0b0;
            font-weight: 500;
            background: rgba(255, 255, 255, 0.05);
            padding: 0.2rem 1rem;
            border-radius: 30px;
            border: 1px solid rgba(255, 255, 255, 0.06);
        }

        .update-info .version {
            color: #f5c842;
            font-weight: 600;
        }

        /* ریسپانسیو */
        @media (max-width: 500px) {
            .container {
                padding: 2rem 1.5rem;
                border-radius: 1.5rem;
            }

            h1 {
                font-size: 4.5rem;
            }

            .subtitle {
                font-size: 1.2rem;
            }

            .error-icon {
                font-size: 4rem;
            }

            .btn-refresh {
                width: 100%;
                justify-content: center;
                padding: 0.8rem 1.5rem;
            }

            .update-info {
                font-size: 0.8rem;
                flex-direction: column;
                gap: 6px;
            }
        }
    </style>
</head>
<body>
    <div class="container">

        <!-- آیکون -->
        <div class="error-icon">
            <i class="fas fa-sad-tear"></i>
        </div>

        <h1>۴۰۴</h1>
        <p class="subtitle">صفحه پیدا نشد!</p>

        <p class="message">
            <i class="fas fa-exclamation-triangle"></i>
            صفحه‌ای که دنبالش هستی در دسترس نیست.
        </p>

        <!-- فقط یک دکمه رفرش -->
        <button onclick="location.reload()" class="btn-refresh">
            <i class="fas fa-sync-alt"></i> رفرش صفحه
        </button>

        <!-- بخش آپدیت -->
        <div class="update-section">
            <div class="update-info">
                <i class="fas fa-code-branch"></i>
                <span>آخرین بروزرسانی:</span>
                <span class="date">۲۸ تیر ۱۴۰۴</span>
                <span class="version">v2.1.0</span>
                <i class="fas fa-check-circle" style="color: #4caf50;"></i>
            </div>
            <div class="update-info" style="margin-top: 6px; font-size: 0.8rem; color: #666;">
                <i class="fas fa-clock"></i>
                <span>رفرش خودکار در ۳۰ ثانیه</span>
            </div>
        </div>

    </div>

    <!-- اسکریپت رفرش خودکار (اختیاری) -->
    <script>
        // رفرش خودکار بعد از 30 ثانیه (میتونی حذفش کنی)
        setTimeout(function() {
            location.reload();
        }, 30000);
    </script>
</body>
</html>
