<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>صفحه پیدا نشد | محمدحسین صنعتی</title>
    <!-- Font Awesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
    <!-- فونت وزیرمتن (همان فونت سایت اصلی) -->
    <link href="https://cdn.jsdelivr.net/gh/rastikerdar/vazirmatn@v33.003/Vazirmatn-font-face.css" rel="stylesheet" />
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Vazirmatn', sans-serif;
            background-color: #0b0b0b;
            color: #e0e0e0;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 1.5rem;
            position: relative;
            overflow-x: hidden;
        }

        /* افکت پس‌زمینه شبیه به سایت اصلی */
        body::before {
            content: '';
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: radial-gradient(circle at 20% 30%, rgba(255, 215, 0, 0.03) 0%, transparent 50%),
                        radial-gradient(circle at 80% 70%, rgba(0, 150, 255, 0.03) 0%, transparent 50%);
            z-index: 0;
        }

        .container {
            max-width: 780px;
            width: 100%;
            background: rgba(20, 20, 20, 0.7);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.06);
            border-radius: 2.5rem;
            padding: 3.5rem 3rem;
            text-align: center;
            box-shadow: 0 25px 60px rgba(0, 0, 0, 0.8);
            position: relative;
            z-index: 1;
            transition: all 0.3s ease;
        }

        /* آیکون خطا با افکت */
        .error-icon {
            font-size: 6.5rem;
            color: #f5c842;
            margin-bottom: 0.5rem;
            display: inline-block;
            animation: float 3s ease-in-out infinite;
            text-shadow: 0 0 40px rgba(245, 200, 66, 0.2);
        }

        @keyframes float {
            0% { transform: translateY(0px); }
            50% { transform: translateY(-12px); }
            100% { transform: translateY(0px); }
        }

        h1 {
            font-size: 7rem;
            font-weight: 900;
            background: linear-gradient(135deg, #f5c842 0%, #d4a020 100%);
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
            line-height: 1;
            margin: 0.2rem 0 0.5rem;
            letter-spacing: -2px;
            text-shadow: 0 0 60px rgba(245, 200, 66, 0.15);
        }

        .subtitle {
            font-size: 1.8rem;
            font-weight: 700;
            color: #f0f0f0;
            margin-bottom: 0.75rem;
            letter-spacing: -0.5px;
        }

        .message {
            font-size: 1.1rem;
            color: #a8a8a8;
            max-width: 480px;
            margin: 0 auto 2.5rem;
            line-height: 1.9;
            padding: 0 0.5rem;
        }

        .message i {
            color: #f5c842;
            margin: 0 4px;
        }

        /* دکمه‌ها با استایل مینیمال */
        .actions {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            gap: 1rem;
            margin-top: 0.5rem;
        }

        .btn {
            display: inline-flex;
            align-items: center;
            gap: 10px;
            padding: 0.9rem 2.2rem;
            border-radius: 60px;
            font-family: 'Vazirmatn', sans-serif;
            font-size: 1rem;
            font-weight: 600;
            text-decoration: none;
            transition: all 0.25s ease;
            border: 1px solid transparent;
            cursor: pointer;
        }

        .btn-primary {
            background: #f5c842;
            color: #0b0b0b;
            box-shadow: 0 6px 24px rgba(245, 200, 66, 0.25);
        }

        .btn-primary:hover {
            background: #ffd95e;
            transform: translateY(-3px);
            box-shadow: 0 12px 32px rgba(245, 200, 66, 0.35);
        }

        .btn-secondary {
            background: transparent;
            color: #d0d0d0;
            border-color: rgba(255, 255, 255, 0.15);
        }

        .btn-secondary:hover {
            background: rgba(255, 255, 255, 0.05);
            border-color: rgba(255, 255, 255, 0.3);
            transform: translateY(-3px);
            color: #ffffff;
        }

        .btn i {
            font-size: 1.1rem;
        }

        /* لینک‌های اجتماعی پایین */
        .social-links {
            margin-top: 3rem;
            display: flex;
            justify-content: center;
            gap: 1.8rem;
            flex-wrap: wrap;
            border-top: 1px solid rgba(255, 255, 255, 0.06);
            padding-top: 2.2rem;
        }

        .social-links a {
            color: #888;
            font-size: 1.4rem;
            transition: all 0.2s ease;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            width: 48px;
            height: 48px;
            border-radius: 50%;
            background: rgba(255, 255, 255, 0.03);
            border: 1px solid rgba(255, 255, 255, 0.05);
            text-decoration: none;
        }

        .social-links a:hover {
            color: #f5c842;
            background: rgba(245, 200, 66, 0.08);
            border-color: rgba(245, 200, 66, 0.2);
            transform: translateY(-4px);
        }

        /* دکمه بازگشت به صفحه اصلی (همان استایل دکمه‌های سایت) */
        .btn-home {
            background: transparent;
            color: #f5c842;
            border: 1px solid rgba(245, 200, 66, 0.25);
            padding: 0.7rem 2rem;
            border-radius: 60px;
            font-family: 'Vazirmatn', sans-serif;
            font-size: 0.95rem;
            font-weight: 600;
            text-decoration: none;
            transition: all 0.25s ease;
            display: inline-flex;
            align-items: center;
            gap: 10px;
        }

        .btn-home:hover {
            background: rgba(245, 200, 66, 0.08);
            border-color: #f5c842;
            transform: translateY(-2px);
        }

        /* ریسپانسیو */
        @media (max-width: 600px) {
            .container {
                padding: 2.5rem 1.5rem;
                border-radius: 1.8rem;
            }

            h1 {
                font-size: 5rem;
            }

            .subtitle {
                font-size: 1.4rem;
            }

            .error-icon {
                font-size: 4.5rem;
            }

            .message {
                font-size: 1rem;
                padding: 0;
            }

            .actions {
                flex-direction: column;
                align-items: center;
            }

            .btn {
                width: 100%;
                justify-content: center;
                padding: 0.8rem 1.5rem;
            }

            .social-links {
                gap: 1.2rem;
            }

            .social-links a {
                width: 44px;
                height: 44px;
                font-size: 1.2rem;
            }
        }

        @media (max-width: 400px) {
            h1 {
                font-size: 4rem;
            }
            .container {
                padding: 2rem 1rem;
            }
        }
    </style>
</head>
<body>
    <div class="container">

        <!-- آیکون با فونت‌آوسام -->
        <div class="error-icon">
            <i class="fas fa-sad-tear"></i>
        </div>

        <h1>۴۰۴</h1>
        <p class="subtitle">اوه! گم شدی؟</p>

        <p class="message">
            <i class="fas fa-compass"></i>
            به نظر میرسه صفحهای که دنبالش هستی، یا جابجا شده یا اصلاً وجود نداره.
            <br>
            نگران نباش، از اینجا میتونی به مسیر درست برگردی.
        </p>

        <!-- دکمه‌های اکشن -->
        <div class="actions">
            <a href="https://zeroxgame74-afk.github.io/mohamad-hossein-/" class="btn btn-primary">
                <i class="fas fa-home"></i> بازگشت به خانه
            </a>
            <a href="https://zeroxgame74-afk.github.io/mohamad-hossein-/#projects" class="btn btn-secondary">
                <i class="fas fa-th-list"></i> دیدن پروژه‌ها
            </a>
        </div>

        <!-- لینک‌های اجتماعی (مثل فوتر سایت) -->
        <div class="social-links">
            <a href="#" aria-label="اینستاگرم"><i class="fab fa-instagram"></i></a>
            <a href="#" aria-label="لینکدین"><i class="fab fa-linkedin-in"></i></a>
            <a href="#" aria-label="گیت‌هاب"><i class="fab fa-github"></i></a>
            <a href="#" aria-label="تلگرام"><i class="fab fa-telegram-plane"></i></a>
        </div>

        <!-- یک لینک کوچک با استایل خاص (اختیاری) -->
        <div style="margin-top: 2rem;">
            <a href="https://zeroxgame74-afk.github.io/mohamad-hossein-/" class="btn-home">
                <i class="fas fa-arrow-left"></i> برگشت به سایت اصلی
            </a>
        </div>

    </div>
</body>
</html>
