<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>MH Assistant | دستیار هوشمند</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Arabic:wght@300;400;500;600;700&family=Vazirmatn:wght@400;600;700;800;900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">

  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    
    html, body {
      height: 100%;
      width: 100%;
      overflow: hidden;
    }

    body {
      background: #0b0b0e;
      color: #eaeef2;
      font-family: 'Noto Sans Arabic', 'Segoe UI', sans-serif;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 0.5rem;
      background-image: 
        radial-gradient(circle at 20% 30%, rgba(255, 200, 80, 0.05) 0%, transparent 50%),
        radial-gradient(circle at 80% 70%, rgba(255, 200, 80, 0.03) 0%, transparent 50%);
    }

    .chat-container {
      width: 100%;
      max-width: 100%;
      height: 100vh;
      max-height: 100vh;
      background: rgba(255, 255, 255, 0.02);
      backdrop-filter: blur(16px);
      border: 1px solid rgba(255, 215, 100, 0.08);
      border-radius: 28px;
      padding: 1.2rem 1.5rem 1.2rem;
      box-shadow: 0 32px 96px -16px rgba(0, 0, 0, 0.8), inset 0 1px 0 rgba(255, 215, 100, 0.05);
      display: flex;
      flex-direction: column;
      transition: 0.4s cubic-bezier(0.34, 1.56, 0.64, 1);
    }

    .chat-container:hover {
      border-color: rgba(255, 215, 100, 0.15);
    }

    /* ===== هدر ===== */
    .chat-header {
      display: flex;
      align-items: center;
      gap: 0.8rem;
      padding-bottom: 0.8rem;
      border-bottom: 1px solid rgba(255, 215, 100, 0.06);
      margin-bottom: 0.8rem;
      flex-shrink: 0;
    }

    .chat-avatar {
      width: 50px;
      height: 50px;
      background: linear-gradient(145deg, #f5b042, #d48f2b);
      border-radius: 18px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: 'Vazirmatn', sans-serif;
      font-weight: 900;
      font-size: 1.6rem;
      color: #0b0b0e;
      box-shadow: 0 8px 24px -6px rgba(200, 150, 50, 0.3);
      flex-shrink: 0;
      animation: floatLogo 3s ease-in-out infinite;
      position: relative;
    }

    .chat-avatar::after {
      content: '';
      position: absolute;
      inset: -3px;
      border-radius: 20px;
      background: linear-gradient(145deg, rgba(245, 176, 66, 0.3), transparent);
      z-index: -1;
      animation: glowRing 3s ease-in-out infinite;
    }

    @keyframes glowRing {
      0%, 100% { opacity: 0.5; transform: scale(1); }
      50% { opacity: 1; transform: scale(1.05); }
    }

    @keyframes floatLogo {
      0%, 100% { transform: translateY(0); }
      50% { transform: translateY(-6px); }
    }

    .chat-title {
      font-family: 'Vazirmatn', sans-serif;
      font-weight: 800;
      font-size: 1.4rem;
      color: #f5efe6;
      letter-spacing: -0.5px;
    }

    .chat-title .highlight {
      background: linear-gradient(145deg, #f5b042, #d48f2b);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
    }

    .chat-title small {
      display: block;
      font-family: 'Noto Sans Arabic', sans-serif;
      font-weight: 300;
      font-size: 0.7rem;
      color: #b0a99b;
      margin-top: 1px;
      letter-spacing: 0.5px;
      -webkit-text-fill-color: #b0a99b;
    }

    .chat-title small i {
      color: #f5b042;
      -webkit-text-fill-color: #f5b042;
      animation: pulseIcon 2s ease-in-out infinite;
    }

    @keyframes pulseIcon {
      0%, 100% { transform: scale(1); }
      50% { transform: scale(1.3); }
    }

    .chat-status {
      margin-right: auto;
      background: rgba(245, 176, 66, 0.12);
      border: 1px solid rgba(245, 176, 66, 0.15);
      border-radius: 40px;
      padding: 0.15rem 1rem;
      font-size: 0.65rem;
      color: #f5b042;
      font-family: 'Vazirmatn', sans-serif;
      font-weight: 600;
      display: flex;
      align-items: center;
      gap: 0.4rem;
      backdrop-filter: blur(4px);
      flex-shrink: 0;
    }

    .chat-status i {
      font-size: 0.5rem;
      color: #4caf50;
      animation: pulseDot 1.8s ease-in-out infinite;
    }

    @keyframes pulseDot {
      0%, 100% { opacity: 1; transform: scale(1); }
      50% { opacity: 0.2; transform: scale(0.6); }
    }

    /* ===== پیام‌ها (قفل اسکرول) ===== */
    .messages {
      flex: 1;
      overflow-y: auto;
      margin-bottom: 0.8rem;
      display: flex;
      flex-direction: column;
      gap: 0.8rem;
      padding-right: 0.2rem;
      min-height: 0;
      scroll-behavior: smooth;
      scrollbar-width: thin;
      scrollbar-color: rgba(255, 215, 100, 0.15) transparent;
    }

    .messages::-webkit-scrollbar { width: 4px; }
    .messages::-webkit-scrollbar-track { background: transparent; }
    .messages::-webkit-scrollbar-thumb { background: rgba(255, 215, 100, 0.25); border-radius: 10px; }

    /* ===== قفل اسکرول خودکار ===== */
    .messages.locked {
      overflow-y: auto !important;
    }

    .message {
      display: flex;
      gap: 0.7rem;
      align-items: flex-start;
      animation: msgIn 0.4s cubic-bezier(0.22, 1, 0.36, 1);
      flex-shrink: 0;
    }

    .message.bot { flex-direction: row; }
    .message.user { flex-direction: row-reverse; }

    @keyframes msgIn {
      0% { opacity: 0; transform: translateY(16px) scale(0.96); }
      100% { opacity: 1; transform: translateY(0) scale(1); }
    }

    .message .avatar {
      width: 34px;
      height: 34px;
      border-radius: 12px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 0.9rem;
      flex-shrink: 0;
      background: rgba(255, 255, 255, 0.04);
      border: 1px solid rgba(255, 215, 100, 0.06);
      color: #b0a99b;
    }

    .message.bot .avatar {
      background: rgba(245, 176, 66, 0.12);
      color: #f5b042;
      border-color: rgba(245, 176, 66, 0.1);
    }

    .message.user .avatar {
      background: rgba(255, 255, 255, 0.06);
      color: #eaeef2;
    }

    .message .bubble {
      max-width: 82%;
      padding: 0.6rem 1.2rem;
      border-radius: 18px;
      font-family: 'Noto Sans Arabic', sans-serif;
      font-size: 0.9rem;
      line-height: 1.9;
      word-break: break-word;
      background: rgba(255, 255, 255, 0.03);
      border: 1px solid rgba(255, 215, 100, 0.06);
      color: #d6d0c4;
      box-shadow: 0 2px 12px -4px rgba(0, 0, 0, 0.2);
    }

    .message.bot .bubble {
      background: rgba(255, 215, 100, 0.04);
      border-color: rgba(255, 215, 100, 0.08);
      border-top-right-radius: 4px;
    }

    .message.user .bubble {
      background: rgba(245, 176, 66, 0.08);
      border-color: rgba(245, 176, 66, 0.12);
      border-top-left-radius: 4px;
      color: #f5efe6;
    }

    .message .bubble strong { color: #f5b042; font-weight: 700; }
    .message .bubble i { color: #f5b042; margin-left: 0.3rem; }

    .message .bubble .site-card {
      background: rgba(255, 255, 255, 0.03);
      border: 1px solid rgba(255, 215, 100, 0.08);
      border-radius: 14px;
      padding: 0.6rem 0.8rem;
      margin: 0.4rem 0;
      display: flex;
      align-items: center;
      gap: 0.8rem;
      transition: 0.3s;
    }

    .message .bubble .site-card:hover {
      background: rgba(255, 215, 100, 0.04);
      border-color: rgba(255, 215, 100, 0.15);
      transform: translateX(-4px);
    }

    .message .bubble .site-card .site-img {
      width: 44px;
      height: 44px;
      border-radius: 10px;
      object-fit: cover;
      background: #0b0b0e;
      border: 1px solid rgba(255, 215, 100, 0.05);
      flex-shrink: 0;
    }

    .message .bubble .site-card .site-info {
      flex: 1;
    }

    .message .bubble .site-card .site-info .site-name {
      font-family: 'Vazirmatn', sans-serif;
      font-weight: 700;
      color: #f5efe6;
      font-size: 0.85rem;
    }

    .message .bubble .site-card .site-info .site-desc {
      font-size: 0.7rem;
      color: #b0a99b;
    }

    .message .bubble .site-card .site-link {
      color: #f5b042;
      text-decoration: none;
      font-size: 0.7rem;
      font-weight: 600;
      padding: 0.2rem 0.8rem;
      border: 1px solid rgba(245, 176, 66, 0.15);
      border-radius: 40px;
      transition: 0.3s;
      display: inline-flex;
      align-items: center;
      gap: 0.3rem;
      flex-shrink: 0;
    }

    .message .bubble .site-card .site-link:hover {
      background: rgba(245, 176, 66, 0.08);
      border-color: #f5b042;
      transform: scale(1.04);
    }

    /* ===== دکمه‌های سریع ===== */
    .quick-replies {
      display: flex;
      flex-wrap: wrap;
      gap: 0.5rem;
      margin-bottom: 0.5rem;
      flex-shrink: 0;
    }

    .quick-replies button {
      background: rgba(255, 255, 255, 0.03);
      border: 1px solid rgba(255, 215, 100, 0.08);
      color: #b0a99b;
      padding: 0.2rem 1rem;
      border-radius: 40px;
      font-family: 'Vazirmatn', sans-serif;
      font-size: 0.7rem;
      font-weight: 600;
      cursor: pointer;
      transition: 0.3s;
      backdrop-filter: blur(4px);
      display: inline-flex;
      align-items: center;
      gap: 0.4rem;
    }

    .quick-replies button i { color: #f5b042; font-size: 0.65rem; }

    .quick-replies button:hover {
      background: rgba(245, 176, 66, 0.08);
      border-color: rgba(245, 176, 66, 0.2);
      color: #f5efe6;
      transform: translateY(-2px) scale(1.02);
      box-shadow: 0 4px 16px -6px rgba(245, 176, 66, 0.1);
    }

    /* ===== ورودی ===== */
    .input-area {
      display: flex;
      align-items: center;
      gap: 0.6rem;
      background: rgba(255, 255, 255, 0.02);
      border: 1px solid rgba(255, 215, 100, 0.06);
      border-radius: 60px;
      padding: 0.2rem 0.2rem 0.2rem 1rem;
      transition: 0.3s;
      flex-shrink: 0;
    }

    .input-area:focus-within {
      border-color: rgba(245, 176, 66, 0.25);
      background: rgba(255, 255, 255, 0.04);
      box-shadow: 0 0 0 3px rgba(245, 176, 66, 0.04);
    }

    .input-area input {
      flex: 1;
      background: transparent;
      border: none;
      color: #eaeef2;
      font-family: 'Noto Sans Arabic', sans-serif;
      font-size: 0.9rem;
      padding: 0.6rem 0;
      outline: none;
      min-width: 0;
    }

    .input-area input::placeholder { color: #5f5a50; font-weight: 300; }

    .input-area button {
      background: linear-gradient(145deg, #f5b042, #d48f2b);
      border: none;
      color: #0b0b0e;
      width: 44px;
      height: 44px;
      border-radius: 50%;
      font-size: 1.1rem;
      cursor: pointer;
      transition: 0.3s cubic-bezier(0.34, 1.56, 0.64, 1);
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
      box-shadow: 0 4px 16px -6px rgba(245, 176, 66, 0.25);
    }

    .input-area button:hover {
      transform: scale(1.06) rotate(-3deg);
      box-shadow: 0 8px 28px -6px rgba(245, 176, 66, 0.4);
    }

    .input-area button:active { transform: scale(0.93); }

    /* ===== تایپینگ ===== */
    .typing-indicator {
      display: none;
      padding: 0.3rem 1rem;
      background: rgba(255, 215, 100, 0.04);
      border: 1px solid rgba(255, 215, 100, 0.06);
      border-radius: 40px;
      color: #b0a99b;
      font-size: 0.75rem;
      align-self: flex-start;
      margin-bottom: 0.3rem;
      animation: msgIn 0.3s ease;
      flex-shrink: 0;
    }

    .typing-indicator i {
      color: #f5b042;
      animation: pulseIcon 1s ease-in-out infinite;
    }

    .typing-indicator.show { display: inline-flex; align-items: center; gap: 0.4rem; }

    /* ===== اسکرول ===== */
    ::-webkit-scrollbar { width: 4px; }
    ::-webkit-scrollbar-track { background: transparent; }
    ::-webkit-scrollbar-thumb { background: rgba(255, 215, 100, 0.2); border-radius: 10px; }

    /* ===== ریسپانسیو ===== */
    @media (max-width: 600px) {
      .chat-container { padding: 0.8rem 1rem; border-radius: 20px; }
      .chat-title { font-size: 1.1rem; }
      .chat-avatar { width: 42px; height: 42px; font-size: 1.3rem; }
      .message .bubble { font-size: 0.8rem; padding: 0.4rem 1rem; max-width: 90%; }
      .input-area input { font-size: 0.8rem; }
      .quick-replies button { font-size: 0.65rem; padding: 0.15rem 0.8rem; }
      .message .bubble .site-card { flex-wrap: wrap; }
      .message .bubble .site-card .site-img { width: 36px; height: 36px; }
      .chat-status { font-size: 0.55rem; padding: 0.1rem 0.6rem; }
    }

    @media (max-width: 400px) {
      .chat-container { padding: 0.6rem 0.6rem; border-radius: 16px; }
      .message .avatar { width: 28px; height: 28px; font-size: 0.7rem; }
      .chat-title { font-size: 0.95rem; }
      .chat-avatar { width: 36px; height: 36px; font-size: 1.1rem; }
      .input-area button { width: 38px; height: 38px; font-size: 0.9rem; }
    }
  </style>
</head>
<body>

<div class="chat-container">
  
  <!-- ===== هدر ===== -->
  <div class="chat-header">
    <div class="chat-avatar">M</div>
    <div class="chat-title">
      <span class="highlight">MH Assistant</span>
      <small><i class="fas fa-robot"></i> پردازش کلمه‌به‌کلمه</small>
    </div>
    <div class="chat-status">
      <i class="fas fa-circle"></i> آنلاین
    </div>
  </div>

  <!-- ===== پیام‌ها (قفل اسکرول) ===== -->
  <div class="messages locked" id="messagesBox">
    <div class="message bot">
      <div class="avatar"><i class="fas fa-robot"></i></div>
      <div class="bubble">
        <i class="fas fa-hand-peace"></i> سلام! من <strong>MH Assistant</strong> هستم.<br>
        <strong>هر کلمه‌ای</strong> بگی، پردازش میکنم و جواب میدم.<br>
        <span style="color:#f5b042; font-size:0.8rem;">👇 حتی یه کلمه واحد بپرس، میفهمم!</span>
      </div>
    </div>
  </div>

  <!-- ===== دکمه‌های سریع ===== -->
  <div class="quick-replies">
    <button onclick="askQuestion('کی')"><i class="fas fa-question"></i> کی</button>
    <button onclick="askQuestion('سایت')"><i class="fas fa-laptop-code"></i> سایت</button>
    <button onclick="askQuestion('طراحی')"><i class="fas fa-palette"></i> طراحی</button>
    <button onclick="askQuestion('برنامه')"><i class="fas fa-puzzle-piece"></i> برنامه</button>
    <button onclick="askQuestion('مهارت')"><i class="fas fa-code"></i> مهارت</button>
    <button onclick="askQuestion('ارتباط')"><i class="fas fa-share-alt"></i> ارتباط</button>
  </div>

  <!-- ===== ورودی ===== -->
  <div class="input-area">
    <input type="text" id="userInput" placeholder="هر چیزی بگو..." autocomplete="off">
    <button onclick="sendMessage()" aria-label="ارسال">
      <i class="fas fa-paper-plane"></i>
    </button>
  </div>

</div>

<script>
  // ============================================================
  //  دیتابیس کامل اطلاعات
  // ============================================================
  const siteData = {
    name: 'mohamad hossein snti',
    job: 'توسعه‌دهنده وب و طراح گرافیک',
    startYear: '۱۴۰۳',
    skills: ['HTML', 'CSS', 'JavaScript', 'طراحی گرافیک', 'تولید محتوا', 'UI/UX', 'React', 'Node.js'],
    goal: 'ترکیب هنر و تکنولوژی برای خلق فضاهای دیجیتال خاص',
    bio: 'توسعه‌دهنده وب و طراح گرافیک از سال ۱۴۰۳. عاشق کد تمیز، طراحی مینیمال و تجربه کاربری روان.',
    
    sites: [
      { 
        name: 'ZEROX', 
        desc: 'پلتفرم تخصصی گیم و اخبار', 
        link: 'https://zeroxgame74-afk.github.io/zeroxgamee/',
        img: 'https://uploadkon.ir/uploads/511301_26Zerox-۱۲۱۲.jpg'
      },
      { 
        name: 'کالفود', 
        desc: 'پلتفرم سفارش غذای لذیذ', 
        link: 'https://zeroxgame74-afk.github.io/call-food.ir/',
        img: 'https://uploadkon.ir/uploads/481d01_26call-food-۱۲۱۲۳.jpg'
      },
      { 
        name: 'کوروش گیم', 
        desc: 'فروشگاه اکانت گیم', 
        link: 'https://zeroxgame74-afk.github.io/Kourosh-Game.ir/',
        img: 'https://uploadkon.ir/uploads/d66b01_26Kourosh-Gameir۱۲.jpg'
      }
    ],
    
    designs: [
      { 
        name: 'گفتند زلف یار...', 
        desc: 'ادای احترام به نام علی (ع)',
        img: 'https://uploadkon.ir/uploads/6d9428_26ya-ali-m-h-snti.jpg'
      },
      { 
        name: 'اهواز... خاک غسل‌شده', 
        desc: 'یاد شهدای جنوب ایران',
        img: 'https://uploadkon.ir/uploads/99ce24_26jonoob-iran.png'
      }
    ],
    
    apps: 'در حال توسعه',
    
    social: {
      telegram: 'https://t.me/@mohamad_hossein_ev18',
      instagram: 'https://www.instagram.com/mohamad_hossein_ev18'
    }
  };

  // ============================================================
  //  موتور پردازش کلمه‌به‌کلمه
  // ============================================================
  function getSmartReply(input) {
    const text = input.trim().toLowerCase();
    const words = text.split(/\s+/);
    
    // تشخیص موضوعات
    const detected = {
      identity: false, sites: false, designs: false, 
      apps: false, skills: false, social: false,
      greeting: false, feeling: false, thank: false
    };

    const keywords = {
      identity: ['کی', 'هستی', 'کیا', 'کیایی', 'چه', 'کاره', 'خودت', 'معرفی', 'شناخت', 'درباره', 'من', 'بیو', 'رزومه'],
      sites: ['سایت', 'وب', 'پروژه', 'لینک', 'zerox', 'کالفود', 'کوروش', 'گیم', 'نمونه', 'کار', 'ساختی'],
      designs: ['طراحی', 'گرافیک', 'هنری', 'عکس', 'تصویر', 'یا علی', 'اهواز', 'شهید', 'پالت', 'نقاشی'],
      apps: ['برنامه', 'اپ', 'نرم', 'افزار', 'ابزار', 'اپلیکیشن', 'موبایل'],
      skills: ['مهارت', 'توانایی', 'بلد', 'تخصص', 'چه چیزایی', 'یاد', 'چه کارهایی'],
      social: ['تلگرام', 'اینستاگرام', 'شبکه', 'اجتماعی', 'تماس', 'ارتباط', 'پیام', 'آیدی'],
      greeting: ['سلام', 'درود', 'هی', 'الو', 'هلو', 'صبح', 'عصر', 'شب'],
      feeling: ['خوب', 'چطوری', 'حالت', 'اوضاع', 'خبر', 'چی می‌کنی', 'خوشی'],
      thank: ['ممنون', 'مرسی', 'متشکرم', 'دمت گرم', 'دستت', 'تشکر', 'سپاس']
    };

    words.forEach(word => {
      for (const [topic, kws] of Object.entries(keywords)) {
        if (kws.some(kw => word.includes(kw) || kw.includes(word))) {
          detected[topic] = true;
        }
      }
    });

    // اولویت‌بندی پاسخ‌ها
    if (detected.identity || text === 'کی' || text === 'هستی') {
      return `
        <i class="fas fa-robot"></i> <strong>من ربات دستیار MH Assistant هستم!</strong><br><br>
        <i class="fas fa-user-astronaut"></i> ساخته‌شده توسط <strong>${siteData.name}</strong><br>
        <i class="fas fa-code"></i> وظیفه‌ام: پاسخ به سوالات شما<br>
        <i class="fas fa-heart" style="color:#f5b042;"></i> هدفم: کمک سریع و هوشمندانه<br><br>
        <span style="color:#b0a99b; font-size:0.8rem;">
          <i class="fas fa-smile"></i> هر سوالی داری، بپرس!
        </span>
      `;
    }

    if (detected.sites || text === 'سایت' || text === 'پروژه') {
      let reply = `<i class="fas fa-laptop-code"></i> <strong>سایت‌های ${siteData.name}:</strong><br>`;
      siteData.sites.forEach(s => {
        reply += `
          <div class="site-card">
            <img class="site-img" src="${s.img}" alt="${s.name}" onerror="this.style.display='none'">
            <div class="site-info">
              <div class="site-name">🎮 ${s.name}</div>
              <div class="site-desc">${s.desc}</div>
            </div>
            <a href="${s.link}" target="_blank" class="site-link">
              <i class="fas fa-external-link-alt"></i> مشاهده
            </a>
          </div>
        `;
      });
      return reply;
    }

    if (detected.designs || text === 'طراحی' || text === 'گرافیک') {
      let reply = `<i class="fas fa-palette"></i> <strong>طراحی‌های ${siteData.name}:</strong><br>`;
      siteData.designs.forEach(d => {
        reply += `
          <div style="background:rgba(255,255,255,0.02); border:1px solid rgba(255,215,100,0.06); border-radius:12px; padding:0.4rem 0.8rem; margin:0.3rem 0; display:flex; align-items:center; gap:0.6rem;">
            <div style="font-size:1.3rem; color:#f5b042;"><i class="fas fa-paint-brush"></i></div>
            <div>
              <div style="font-family:'Vazirmatn',sans-serif; font-weight:600; color:#f5efe6; font-size:0.85rem;">🖼 ${d.name}</div>
              <div style="font-size:0.75rem; color:#b0a99b;">${d.desc}</div>
            </div>
          </div>
        `;
      });
      return reply;
    }

    if (detected.apps || text === 'برنامه' || text === 'اپ') {
      return `
        <i class="fas fa-puzzle-piece"></i> بخش <strong>برنامه‌ها</strong> ${siteData.apps} است.<br>
        به زودی اپلیکیشن‌های جدید اضافه می‌شه.<br>
        <i class="fas fa-code" style="color:#f5b042;"></i> منتظر آپدیت‌ها باش!
      `;
    }

    if (detected.skills || text === 'مهارت' || text === 'تخصص') {
      return `
        <i class="fas fa-code"></i> <strong>مهارت‌ها:</strong><br>
        ${siteData.skills.map(s => `🔹 ${s}`).join('<br>')}<br><br>
        <span style="color:#b0a99b; font-size:0.8rem;">
          <i class="fas fa-rocket"></i> همیشه در حال یادگیری
        </span>
      `;
    }

    if (detected.social || text === 'ارتباط' || text === 'تماس') {
      return `
        <i class="fas fa-share-alt"></i> <strong>راه‌های ارتباطی:</strong><br>
        <div style="display:flex; gap:0.6rem; margin-top:0.4rem; flex-wrap:wrap;">
          <a href="${siteData.social.telegram}" target="_blank" style="color:#f5b042; text-decoration:none; background:rgba(255,215,100,0.05); padding:0.3rem 1rem; border-radius:40px; border:1px solid rgba(255,215,100,0.1); display:inline-flex; align-items:center; gap:0.4rem; font-size:0.8rem; transition:0.3s;">
            <i class="fab fa-telegram-plane"></i> تلگرام
          </a>
          <a href="${siteData.social.instagram}" target="_blank" style="color:#f5b042; text-decoration:none; background:rgba(255,215,100,0.05); padding:0.3rem 1rem; border-radius:40px; border:1px solid rgba(255,215,100,0.1); display:inline-flex; align-items:center; gap:0.4rem; font-size:0.8rem; transition:0.3s;">
            <i class="fab fa-instagram"></i> اینستاگرام
          </a>
        </div>
      `;
    }

    if (detected.greeting) {
      return `
        <i class="fas fa-hand-peace"></i> سلام! خوش اومدی به <strong>MH Assistant</strong>.<br>
        من دستیار هوشمند اینجام.<br>
        <span style="color:#b0a99b; font-size:0.8rem;">
          <i class="fas fa-lightbulb"></i> هر چیزی بپرس، پردازش میکنم!
        </span>
      `;
    }

    if (detected.feeling) {
      return `
        <i class="fas fa-smile"></i> ممنون! من <strong>MH Assistant</strong> هستم و عالی‌ام.<br>
        <i class="fas fa-rocket" style="color:#f5b042;"></i> منتظر سوال بعدی‌ات.
      `;
    }

    if (detected.thank) {
      return `
        <i class="fas fa-heart" style="color:#f5b042;"></i> خواهش می‌کنم!<br>
        خوشحالم که به عنوان <strong>MH Assistant</strong> کمک کردم.
      `;
    }

    // پاسخ پیش‌فرض
    return `
      <i class="fas fa-robot"></i> <strong>من MH Assistant هستم!</strong><br>
      کلمه "<strong>${words[0] || '...'}</strong>" رو پردازش کردم.<br>
      می‌تونی از اینا بپرسی:<br><br>
      <span style="color:#f5b042; display:inline-block; background:rgba(245,176,66,0.04); padding:0.15rem 0.7rem; border-radius:40px; border:1px solid rgba(245,176,66,0.06); margin:0.15rem; font-size:0.85rem;">
        <i class="fas fa-question"></i> کی
      </span>
      <span style="color:#f5b042; display:inline-block; background:rgba(245,176,66,0.04); padding:0.15rem 0.7rem; border-radius:40px; border:1px solid rgba(245,176,66,0.06); margin:0.15rem; font-size:0.85rem;">
        <i class="fas fa-laptop-code"></i> سایت
      </span>
      <span style="color:#f5b042; display:inline-block; background:rgba(245,176,66,0.04); padding:0.15rem 0.7rem; border-radius:40px; border:1px solid rgba(245,176,66,0.06); margin:0.15rem; font-size:0.85rem;">
        <i class="fas fa-palette"></i> طراحی
      </span>
      <span style="color:#f5b042; display:inline-block; background:rgba(245,176,66,0.04); padding:0.15rem 0.7rem; border-radius:40px; border:1px solid rgba(245,176,66,0.06); margin:0.15rem; font-size:0.85rem;">
        <i class="fas fa-code"></i> مهارت
      </span>
    `;
  }

  // ============================================================
  //  توابع اصلی با قفل اسکرول
  // ============================================================

  const messagesBox = document.getElementById('messagesBox');
  const userInput = document.getElementById('userInput');
  let isTyping = false;
  let isUserScrolled = false;

  // تشخیص اسکرول دستی کاربر
  messagesBox.addEventListener('scroll', function() {
    const isAtBottom = messagesBox.scrollHeight - messagesBox.scrollTop <= messagesBox.clientHeight + 50;
    if (!isAtBottom) {
      isUserScrolled = true;
    } else {
      isUserScrolled = false;
    }
  });

  function scrollToBottom() {
    if (!isUserScrolled) {
      messagesBox.scrollTop = messagesBox.scrollHeight;
    }
  }

  function sendMessage() {
    const text = userInput.value.trim();
    if (!text || isTyping) return;

    addMessage('user', text);
    userInput.value = '';
    userInput.focus();

    isTyping = true;
    showTyping();

    setTimeout(() => {
      hideTyping();
      const reply = getSmartReply(text);
      addMessage('bot', reply);
      isTyping = false;
    }, 400);
  }

  function askQuestion(text) {
    userInput.value = text;
    sendMessage();
  }

  function addMessage(type, content) {
    const div = document.createElement('div');
    div.className = `message ${type}`;

    const avatar = document.createElement('div');
    avatar.className = 'avatar';
    avatar.innerHTML = type === 'bot' ? '<i class="fas fa-robot"></i>' : '<i class="fas fa-user"></i>';

    const bubble = document.createElement('div');
    bubble.className = 'bubble';
    bubble.innerHTML = content;

    div.appendChild(avatar);
    div.appendChild(bubble);
    messagesBox.appendChild(div);
    
    // اسکرول فقط اگر کاربر پایین نرفته باشه
    setTimeout(scrollToBottom, 50);
  }

  function showTyping() {
    let typing = document.querySelector('.typing-indicator');
    if (!typing) {
      typing = document.createElement('div');
      typing.className = 'typing-indicator';
      typing.innerHTML = '<i class="fas fa-robot"></i> <strong>MH Assistant</strong> در حال پردازش...';
      messagesBox.appendChild(typing);
    }
    typing.classList.add('show');
    setTimeout(scrollToBottom, 50);
  }

  function hideTyping() {
    const typing = document.querySelector('.typing-indicator');
    if (typing) typing.classList.remove('show');
  }

  userInput.addEventListener('keydown', function(e) {
    if (e.key === 'Enter') {
      e.preventDefault();
      sendMessage();
    }
  });

  window.addEventListener('load', function() {
    messagesBox.scrollTop = messagesBox.scrollHeight;
  });
</script>

</body>
</html>
