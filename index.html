<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Mohamad Hossein Sanati | Portfolio</title>
    
    <!-- فونت‌ها -->
    <link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@400;700;800;900&family=Noto+Sans+Arabic:wght@300;400;500;700&display=swap" rel="stylesheet" />
    
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Noto Sans Arabic', sans-serif;
            background: #f8f9fc;
            color: #1a1a2e;
            line-height: 1.8;
            transition: background 0.3s, color 0.3s;
        }

        body.dark {
            background: #0f0f1a;
            color: #e8e8f0;
        }

        h1, h2, h3, h4, h5, h6 {
            font-family: 'Vazirmatn', sans-serif;
            font-weight: 800;
            letter-spacing: -0.5px;
        }

        /* ===== HEADER ===== */
        header {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            padding: 14px 56px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: rgba(248, 249, 252, 0.8);
            backdrop-filter: blur(14px);
            -webkit-backdrop-filter: blur(14px);
            border-bottom: 1px solid rgba(0, 0, 0, 0.04);
            z-index: 1000;
            transition: 0.3s;
            flex-direction: row-reverse; /* ===== لوگو سمت راست، منو سمت چپ ===== */
        }

        body.dark header {
            background: rgba(15, 15, 26, 0.8);
            border-bottom: 1px solid rgba(255, 255, 255, 0.04);
        }

        /* ===== LOGO ===== */
        .logo {
            display: flex;
            align-items: center;
            gap: 12px;
            text-decoration: none;
        }

        .logo img {
            height: 44px;
            width: auto;
            display: block;
            transition: 0.3s;
        }

        .logo:hover img {
            transform: scale(1.03);
        }

        .logo .name {
            font-family: 'Vazirmatn', sans-serif;
            font-size: 20px;
            font-weight: 800;
            color: #1a1a2e;
        }

        body.dark .logo .name {
            color: #e8e8f0;
        }

        .logo .lname {
            font-family: 'Vazirmatn', sans-serif;
            font-weight: 300;
            color: #6c6c8a;
        }

        body.dark .logo .lname {
            color: #a8a8c0;
        }

        /* ===== NAV ===== */
        nav {
            display: flex;
            align-items: center;
            gap: 32px;
        }

        nav a {
            font-family: 'Noto Sans Arabic', sans-serif;
            text-decoration: none;
            color: inherit;
            font-size: 14px;
            font-weight: 500;
            position: relative;
            padding: 4px 0;
            transition: 0.3s;
            opacity: 0.7;
        }

        nav a:hover {
            opacity: 1;
        }

        nav a::after {
            content: '';
            position: absolute;
            bottom: -2px;
            right: 0;
            width: 0;
            height: 2.5px;
            background: #6c5ce7;
            transition: 0.3s;
            border-radius: 4px;
        }

        nav a:hover::after {
            width: 100%;
        }

        .theme-toggle {
            background: none;
            border: 1px solid rgba(0, 0, 0, 0.08);
            border-radius: 50%;
            width: 40px;
            height: 40px;
            font-size: 18px;
            cursor: pointer;
            transition: 0.3s;
            background: transparent;
            color: inherit;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        body.dark .theme-toggle {
            border-color: rgba(255, 255, 255, 0.08);
        }

        .theme-toggle:hover {
            transform: rotate(20deg) scale(1.05);
        }

        /* ===== HERO ===== */
        .hero {
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            text-align: center;
            padding: 120px 24px 60px;
            max-width: 800px;
            margin: 0 auto;
        }

        .hero h1 {
            font-family: 'Vazirmatn', sans-serif;
            font-size: 52px;
            font-weight: 900;
            line-height: 1.2;
            margin-bottom: 16px;
        }

        .hero h1 .highlight {
            background: linear-gradient(135deg, #6c5ce7, #a29bfe);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        .hero .subtitle {
            font-family: 'Noto Sans Arabic', sans-serif;
            font-size: 20px;
            font-weight: 300;
            color: #6c6c8a;
            margin-bottom: 32px;
        }

        body.dark .hero .subtitle {
            color: #a8a8c0;
        }

        .hero p {
            font-family: 'Noto Sans Arabic', sans-serif;
            font-size: 17px;
            font-weight: 400;
            max-width: 560px;
            color: #4a4a6a;
            margin-bottom: 40px;
        }

        body.dark .hero p {
            color: #b8b8d0;
        }

        .btn-group {
            display: flex;
            gap: 16px;
            flex-wrap: wrap;
            justify-content: center;
        }

        .btn {
            font-family: 'Noto Sans Arabic', sans-serif;
            padding: 14px 36px;
            border-radius: 100px;
            font-size: 15px;
            font-weight: 600;
            border: none;
            cursor: pointer;
            transition: 0.3s;
            text-decoration: none;
            display: inline-block;
        }

        .btn-primary {
            background: #6c5ce7;
            color: #fff;
        }

        .btn-primary:hover {
            background: #5a4bd1;
            transform: translateY(-2px);
            box-shadow: 0 8px 30px rgba(108, 92, 231, 0.3);
        }

        .btn-outline {
            background: transparent;
            color: #1a1a2e;
            border: 2px solid rgba(26, 26, 46, 0.1);
        }

        body.dark .btn-outline {
            color: #e8e8f0;
            border-color: rgba(232, 232, 240, 0.15);
        }

        .btn-outline:hover {
            border-color: #6c5ce7;
            color: #6c5ce7;
        }

        /* ===== RESPONSIVE ===== */
        @media (max-width: 768px) {
            header {
                padding: 12px 20px;
            }

            .logo img {
                height: 36px;
            }

            .logo .name {
                font-size: 16px;
            }

            nav {
                gap: 18px;
            }

            nav a {
                font-size: 13px;
            }

            .hero h1 {
                font-size: 34px;
            }

            .hero .subtitle {
                font-size: 17px;
            }

            .hero p {
                font-size: 15px;
            }

            .btn {
                padding: 12px 28px;
                font-size: 14px;
            }
        }

        @media (max-width: 480px) {
            .logo .name {
                display: none;
            }

            .logo .lname {
                display: none;
            }

            nav a:not(:last-child) {
                display: none;
            }

            .hero h1 {
                font-size: 28px;
            }
        }
    </style>
</head>
<body>

    <!-- ===== HEADER ===== -->
    <header>
        <!-- لوگو سمت راست -->
        <a href="#" class="logo">
            <img src="https://uploadkon.ir/uploads/7ad824_26155.png" alt="Mohamad Hossein Sanati Logo" />
            <span class="name">محمدحسین</span>
            <span class="lname">ثناتی</span>
        </a>

        <!-- منو سمت چپ -->
        <nav>
            <a href="#home">خانه</a>
            <a href="#about">درباره</a>
            <a href="#work">نمونه‌کار</a>
            <a href="#contact">تماس</a>
            <button class="theme-toggle" id="themeToggle">🌙</button>
        </nav>
    </header>

    <!-- ===== HERO ===== -->
    <section class="hero" id="home">
        <h1>
            سلام، من <br />
            <span class="highlight">محمدحسین ثناتی</span> هستم
        </h1>
        <p class="subtitle">توسعه‌دهنده وب | عاشق کدنویسی مینیمال</p>
        <p>
            به دنیای دیجیتال من خوش آمدید. اینجا جایی است که ایده‌ها به کد تبدیل می‌شوند
            و خلاقیت با تکنولوژی گره می‌خورد.
        </p>
        <div class="btn-group">
            <a href="#work" class="btn btn-primary">مشاهده نمونه‌کارها</a>
            <a href="#contact" class="btn btn-outline">ارتباط با من</a>
        </div>
    </section>

    <script>
        const toggle = document.getElementById('themeToggle');
        const body = document.body;

        toggle.addEventListener('click', () => {
            body.classList.toggle('dark');
            toggle.textContent = body.classList.contains('dark') ? '☀️' : '🌙';
        });

        document.querySelectorAll('nav a[href^="#"]').forEach(link => {
            link.addEventListener('click', (e) => {
                e.preventDefault();
                const target = document.querySelector(link.getAttribute('href'));
                if (target) {
                    target.scrollIntoView({ behavior: 'smooth' });
                }
            });
        });
    </script>

</body>
</html>
