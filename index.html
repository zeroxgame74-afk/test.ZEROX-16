    <link rel="preconnect" href="https://fonts.googleapis.com" />

    <!-- ===== Font Awesome 6 ===== -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css" />

    <style>
        /* ========== RESET ========== */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html,
        body {
            height: 100%;
            width: 100%;
        }

        body {
            background: #0b0b0e;
            color: #eaeef2;
            font-family: 'Vazirmatn', 'Segoe UI', sans-serif;
            font-weight: 400;
            line-height: 1.8;
            overflow-x: hidden;
            background-image: radial-gradient(circle at 30% 20%, rgba(255, 200, 80, 0.03) 0%, transparent 60%);
        }

        ::-webkit-scrollbar {
            width: 6px;
        }
        ::-webkit-scrollbar-track {
            background: #0b0b0e;
        }
        ::-webkit-scrollbar-thumb {
            background: #f5b042;
            border-radius: 10px;
        }
        ::-webkit-scrollbar-thumb:hover {
            background: #d48f2b;
        }

        .container {
            min-height: 100vh;
            width: 100%;
            max-width: 1100px;
            margin: 0 auto;
            padding: 2rem 2.5rem;
            display: flex;
            flex-direction: column;
            justify-content: center;
        }

        /* ========== هدر ========== */
        .header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0.5rem 0 1.8rem 0;
            border-bottom: 1px solid rgba(255, 215, 100, 0.06);
            flex-wrap: wrap;
            gap: 1rem;
        }

        .logo-area {
            display: flex;
            align-items: center;
            gap: 0.9rem;
        }

        .logo {
            width: 56px;
            height: 56px;
            background: linear-gradient(145deg, #f5b042, #d48f2b);
            border-radius: 18px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-family: 'Vazirmatn', sans-serif;
            font-weight: 900;
            font-size: 2rem;
            color: #0b0b0e;
            box-shadow: 0 8px 18px -6px rgba(200, 150, 50, 0.25);
            flex-shrink: 0;
            transition: 0.3s cubic-bezier(0.34, 1.56, 0.64, 1);
            animation: floatLogo 4s ease-in-out infinite;
        }

        @keyframes floatLogo {
            0%,
            100% {
                transform: translateY(0px);
            }
            50% {
                transform: translateY(-6px);
            }
        }

        .logo:hover {
            transform: scale(1.08) rotate(-4deg);
            box-shadow: 0 12px 28px -8px rgba(200, 150, 50, 0.4);
        }

        .brand {
            display: flex;
            flex-direction: column;
            line-height: 1.2;
        }

        .brand-name {
            font-family: 'Vazirmatn', sans-serif;
            font-weight: 800;
            font-size: 1.5rem;
            letter-spacing: -0.5px;
            color: #f5f0e8;
            position: relative;
            display: inline-block;
        }

        .brand-name::after {
            content: '';
            position: absolute;
            bottom: -2px;
            right: 0;
            width: 0;
            height: 2px;
            background: linear-gradient(90deg, #f5b042, transparent);
            transition: width 0.6s cubic-bezier(0.22, 1, 0.36, 1);
        }

        .brand-name:hover::after {
            width: 100%;
        }

        .brand-sub {
            font-family: 'Vazirmatn', sans-serif;
            font-weight: 300;
            font-size: 0.8rem;
            color: #b0a99b;
            letter-spacing: 1px;
        }

        /* ========== دکمه همبرگر ========== */
        .hamburger {
            display: flex;
            flex-direction: column;
            gap: 5px;
            cursor: pointer;
            padding: 0.6rem 0.8rem;
            background: rgba(255, 255, 255, 0.03);
            border-radius: 14px;
            border: 1px solid rgba(255, 215, 100, 0.08);
            transition: 0.3s;
            z-index: 1001;
            position: relative;
        }

        .hamburger:hover {
            background: rgba(255, 215, 100, 0.08);
            border-color: rgba(255, 215, 100, 0.15);
            transform: scale(1.05);
        }

        .hamburger span {
            display: block;
            width: 28px;
            height: 2.5px;
            background: #eaeef2;
            border-radius: 4px;
            transition: 0.3s ease;
        }

        .hamburger.active span:nth-child(1) {
            transform: rotate(45deg) translate(5px, 6px);
            background: #f5b042;
        }
        .hamburger.active span:nth-child(2) {
            opacity: 0;
            transform: scaleX(0);
        }
        .hamburger.active span:nth-child(3) {
            transform: rotate(-45deg) translate(5px, -6px);
            background: #f5b042;
        }

        /* ========== منوی همبرگری ========== */
        .nav-overlay {
            position: fixed;
            top: 0;
            right: -100%;
            width: 100%;
            height: 100vh;
            background: rgba(11, 11, 14, 0.98);
            backdrop-filter: blur(20px);
            display: flex;
            align-items: center;
            justify-content: center;
            transition: right 0.6s cubic-bezier(0.22, 1, 0.36, 1);
            z-index: 1000;
        }

        .nav-overlay.open {
            right: 0;
        }

        .nav-menu {
            display: flex;
            flex-direction: column;
            gap: 2rem;
            text-align: center;
            padding: 2rem;
            max-width: 500px;
            width: 100%;
        }

        .nav-menu a {
            color: #d6d0c4;
            text-decoration: none;
            font-family: 'Vazirmatn', sans-serif;
            font-weight: 700;
            font-size: 2rem;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 1.2rem;
            transition: 0.3s;
            padding: 0.8rem 1.5rem;
            border-radius: 20px;
            letter-spacing: 0.5px;
            border: 1px solid transparent;
            position: relative;
            overflow: hidden;
        }

        .nav-menu a::before {
            content: '';
            position: absolute;
            top: 0;
            right: 0;
            width: 0;
            height: 100%;
            background: rgba(255, 215, 100, 0.05);
            transition: width 0.4s cubic-bezier(0.22, 1, 0.36, 1);
            z-index: -1;
            border-radius: 20px;
        }

        .nav-menu a:hover::before {
            width: 100%;
        }

        .nav-menu a i {
            font-size: 1.8rem;
            color: #f5b042;
            width: 2.5rem;
            transition: 0.3s;
        }

        .nav-menu a:hover {
            color: #f5efe6;
            background: rgba(255, 215, 100, 0.06);
            border-color: rgba(255, 215, 100, 0.1);
            transform: scale(1.04) translateX(-4px);
        }

        .nav-menu a:hover i {
            transform: scale(1.2) rotate(-8deg) translateX(-4px);
        }

        .nav-menu a.active {
            color: #f5efe6;
            background: rgba(255, 215, 100, 0.08);
            border-color: rgba(255, 215, 100, 0.15);
        }

        .nav-menu a.active i {
            color: #f5b042;
            transform: scale(1.1);
            animation: pulseIcon 2s ease-in-out infinite;
        }

        @keyframes pulseIcon {
            0%,
            100% {
                transform: scale(1.1);
            }
            50% {
                transform: scale(1.25);
            }
        }

        /* ========== محتوای اصلی ========== */
        .main-content {
            flex: 1;
            display: flex;
            flex-direction: column;
            justify-content: center;
            padding: 2rem 0 1.5rem 0;
        }

        /* ===== کارت خوش‌آمدگویی ===== */
        .hero-card {
            position: relative;
            border-radius: 32px;
            overflow: hidden;
            margin-bottom: 2.5rem;
            box-shadow: 0 16px 48px -12px rgba(0, 0, 0, 0.4);
            transition: 0.4s cubic-bezier(0.34, 1.56, 0.64, 1);
            min-height: 260px;
            display: flex;
            align-items: center;
        }

        .hero-card .hero-bg {
            position: absolute;
            top: 0;
            right: 0;
            width: 100%;
            height: 100%;
            object-fit: cover;
            z-index: 0;
            transition: 0.6s cubic-bezier(0.34, 1.56, 0.64, 1);
        }

        .hero-card:hover .hero-bg {
            transform: scale(1.04);
        }

        .hero-card .hero-overlay {
            position: absolute;
            top: 0;
            right: 0;
            width: 100%;
            height: 100%;
            background: linear-gradient(135deg, rgba(11, 11, 14, 0.85) 0%, rgba(11, 11, 14, 0.4) 50%, rgba(11, 11, 14, 0.7) 100%);
            z-index: 1;
            backdrop-filter: blur(2px);
        }

        .hero-card .hero-content {
            position: relative;
            z-index: 2;
            padding: 2.5rem 3rem;
            width: 100%;
            display: flex;
            flex-direction: column;
            gap: 0.8rem;
        }

        .hero-card .hero-content h1 {
            font-family: 'Vazirmatn', sans-serif;
            font-weight: 800;
            font-size: 2.2rem;
            color: #f5efe6;
            line-height: 1.3;
            text-shadow: 0 2px 20px rgba(0, 0, 0, 0.3);
        }

        .hero-card .hero-content h1 span {
            color: #f5b042;
        }

        .hero-card .hero-content .hero-sub {
            font-family: 'Vazirmatn', sans-serif;
            font-size: 1.05rem;
            color: #d6d0c4;
            max-width: 600px;
            text-shadow: 0 2px 12px rgba(0, 0, 0, 0.3);
        }

        .hero-card .hero-buttons {
            display: flex;
            gap: 1rem;
            flex-wrap: wrap;
            margin-top: 0.3rem;
        }

        .hero-card .hero-buttons a {
            display: inline-flex;
            align-items: center;
            gap: 0.6rem;
            padding: 0.6rem 1.8rem;
            border-radius: 40px;
            font-family: 'Vazirmatn', sans-serif;
            font-weight: 600;
            font-size: 0.95rem;
            text-decoration: none;
            transition: 0.3s cubic-bezier(0.34, 1.56, 0.64, 1);
            border: 1px solid rgba(255, 215, 100, 0.15);
            background: rgba(255, 255, 255, 0.05);
            backdrop-filter: blur(8px);
            color: #f5efe6;
            position: relative;
            overflow: hidden;
        }

        .hero-card .hero-buttons a::before {
            content: '';
            position: absolute;
            top: 0;
            right: 0;
            width: 0;
            height: 100%;
            background: rgba(255, 215, 100, 0.08);
            transition: width 0.4s cubic-bezier(0.22, 1, 0.36, 1);
        }

        .hero-card .hero-buttons a:hover::before {
            width: 100%;
        }

        .hero-card .hero-buttons a i {
            font-size: 1.1rem;
            color: #f5b042;
            transition: 0.3s;
        }

        .hero-card .hero-buttons a:hover {
            border-color: rgba(255, 215, 100, 0.3);
            transform: translateY(-2px) scale(1.03);
            box-shadow: 0 8px 32px -8px rgba(245, 176, 66, 0.15);
            background: rgba(255, 255, 255, 0.08);
        }

        .hero-card .hero-buttons a:hover i {
            transform: scale(1.1) rotate(-4deg);
        }

        .hero-card .hero-buttons a.btn-primary {
            background: linear-gradient(145deg, rgba(245, 176, 66, 0.15), rgba(212, 143, 43, 0.05));
            border-color: rgba(245, 176, 66, 0.25);
        }

        .hero-card .hero-buttons a.btn-primary:hover {
            background: linear-gradient(145deg, rgba(245, 176, 66, 0.25), rgba(212, 143, 43, 0.1));
            border-color: rgba(245, 176, 66, 0.4);
        }

        /* ===== بخش‌های دیگر ===== */
        .tab-content {
            display: none;
            animation: fadeUp 0.5s cubic-bezier(0.22, 1, 0.36, 1);
        }

        .tab-content.active {
            display: block;
        }

        @keyframes fadeUp {
            0% {
                opacity: 0;
                transform: translateY(30px) scale(0.98);
            }
            100% {
                opacity: 1;
                transform: translateY(0) scale(1);
            }
        }

        .tab-content h2 {
            font-family: 'Vazirmatn', sans-serif;
            font-weight: 800;
            font-size: 2.6rem;
            color: #f5efe6;
            margin-bottom: 1.5rem;
            letter-spacing: -0.5px;
            border-right: 6px solid #f5b042;
            padding-right: 1.5rem;
            position: relative;
        }

        .tab-content h2 i {
            transition: 0.3s;
        }

        .tab-content h2:hover i {
            transform: rotate(10deg) scale(1.1);
        }

        .tab-content p {
            font-family: 'Vazirmatn', sans-serif;
            font-weight: 400;
            font-size: 1.1rem;
            color: #d6d0c4;
            margin-bottom: 0.8rem;
            line-height: 2;
        }

        /* ===== کارت‌های خانه ===== */
        .bio-intro {
            max-width: 800px;
            margin: 0 auto 2.5rem auto;
            padding: 1.5rem 2rem;
            background: rgba(255, 255, 255, 0.02);
            border-radius: 24px;
            border: 1px solid rgba(255, 215, 100, 0.06);
            transition: 0.3s;
            position: relative;
            overflow: hidden;
        }

        .bio-intro::before {
            content: '';
            position: absolute;
            top: -50%;
            right: -50%;
            width: 200%;
            height: 200%;
            background: radial-gradient(circle at 30% 40%, rgba(255, 215, 100, 0.03), transparent 70%);
            animation: shimmerBg 8s ease-in-out infinite alternate;
            pointer-events: none;
        }

        @keyframes shimmerBg {
            0% {
                transform: translate(-10%, -10%);
            }
            100% {
                transform: translate(10%, 10%);
            }
        }

        .bio-intro:hover {
            border-color: rgba(255, 215, 100, 0.15);
            transform: translateY(-3px);
            box-shadow: 0 12px 40px -12px rgba(0, 0, 0, 0.4);
        }

        .bio-intro p {
            font-size: 1.15rem;
            line-height: 2.2;
            margin-bottom: 1rem;
            position: relative;
            z-index: 1;
        }

        .bio-intro p:last-child {
            margin-bottom: 0;
        }

        .home-design-cards {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
            gap: 1.8rem;
            margin-top: 2rem;
        }

        .home-design-card {
            background: rgba(255, 255, 255, 0.02);
            border-radius: 24px;
            padding: 2rem 1.5rem;
            border: 1px solid rgba(255, 215, 100, 0.06);
            transition: 0.4s cubic-bezier(0.34, 1.56, 0.64, 1);
            text-align: center;
            position: relative;
            overflow: hidden;
        }

        .home-design-card::after {
            content: '';
            position: absolute;
            bottom: 0;
            right: 0;
            width: 100%;
            height: 3px;
            background: linear-gradient(90deg, #f5b042, transparent);
            transform: scaleX(0);
            transform-origin: right;
            transition: transform 0.5s cubic-bezier(0.22, 1, 0.36, 1);
        }

        .home-design-card:hover::after {
            transform: scaleX(1);
        }

        .home-design-card:hover {
            background: rgba(255, 215, 100, 0.04);
            border-color: rgba(255, 215, 100, 0.12);
            transform: translateY(-8px) scale(1.01);
            box-shadow: 0 16px 40px -12px rgba(0, 0, 0, 0.5);
        }

        .home-design-card .icon {
            font-size: 2.8rem;
            color: #f5b042;
            margin-bottom: 1rem;
            display: inline-block;
            animation: floatIcon 3s ease-in-out infinite;
        }

        .home-design-card:nth-child(2) .icon {
            animation-delay: 0.5s;
        }
        .home-design-card:nth-child(3) .icon {
            animation-delay: 1s;
        }

        @keyframes floatIcon {
            0%,
            100% {
                transform: translateY(0px);
            }
            50% {
                transform: translateY(-6px);
            }
        }

        .home-design-card .icon i {
            background: rgba(255, 215, 100, 0.08);
            padding: 0.8rem;
            border-radius: 20px;
            transition: 0.4s cubic-bezier(0.34, 1.56, 0.64, 1);
        }

        .home-design-card:hover .icon i {
            background: rgba(255, 215, 100, 0.15);
            transform: scale(1.1) rotate(-6deg);
            box-shadow: 0 8px 24px -8px rgba(245, 176, 66, 0.2);
        }

        .home-design-card h3 {
            font-family: 'Vazirmatn', sans-serif;
            font-weight: 700;
            font-size: 1.4rem;
            color: #f5efe6;
            margin-bottom: 0.5rem;
        }

        .home-design-card p {
            font-family: 'Vazirmatn', sans-serif;
            font-size: 0.95rem;
            color: #b0a99b;
            margin: 0;
        }

        /* ===== بخش VOD ===== */
        .vod-section {
            margin: 1.5rem 0;
            text-align: center;
        }

        .vod-section .vod-title {
            font-family: 'Vazirmatn', sans-serif;
            font-weight: 800;
            font-size: 2rem;
            color: #f5efe6;
            margin-bottom: 1.5rem;
            padding-right: 1rem;
            border-right: 4px solid #f5b042;
            display: inline-block;
            text-align: right;
        }

        .vod-hero-slider {
            position: relative;
            border-radius: 24px;
            overflow: hidden;
            margin: 0 auto 2rem auto;
            aspect-ratio: 16/9;
            min-height: 220px;
            max-width: 100%;
            box-shadow: 0 12px 40px -8px rgba(0, 0, 0, 0.5);
            background: #0b0b0e;
        }

        .vod-hero-slider .hero-slide {
            position: absolute;
            top: 0;
            right: 0;
            width: 100%;
            height: 100%;
            opacity: 0;
            transition: opacity 0.8s ease-in-out;
            z-index: 0;
        }

        .vod-hero-slider .hero-slide.active {
            opacity: 1;
            z-index: 1;
        }

        .vod-hero-slider .hero-slide .hero-img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            transition: 0.6s cubic-bezier(0.34, 1.56, 0.64, 1);
        }

        .vod-hero-slider .hero-slide.active .hero-img {
            animation: zoomIn 8s ease-in-out infinite alternate;
        }

        @keyframes zoomIn {
            0% {
                transform: scale(1);
            }
            100% {
                transform: scale(1.08);
            }
        }

        .vod-hero-slider .hero-slide .hero-overlay {
            position: absolute;
            bottom: 0;
            right: 0;
            width: 100%;
            height: 100%;
            background: linear-gradient(to top, rgba(0, 0, 0, 0.9) 0%, rgba(0, 0, 0, 0.4) 50%, rgba(0, 0, 0, 0.1) 100%);
            display: flex;
            flex-direction: column;
            justify-content: flex-end;
            padding: 2.5rem 2rem;
        }

        .vod-hero-slider .hero-slide .hero-overlay .hero-badge {
            display: inline-block;
            background: rgba(245, 176, 66, 0.15);
            border: 1px solid rgba(245, 176, 66, 0.2);
            border-radius: 40px;
            padding: 0.2rem 1rem;
            font-family: 'Vazirmatn', sans-serif;
            font-weight: 600;
            font-size: 0.7rem;
            color: #f5b042;
            margin-bottom: 0.5rem;
            align-self: flex-start;
            backdrop-filter: blur(4px);
        }

        .vod-hero-slider .hero-slide .hero-overlay h3 {
            font-family: 'Vazirmatn', sans-serif;
            font-weight: 800;
            font-size: 1.8rem;
            color: #f5efe6;
            margin-bottom: 0.3rem;
            text-shadow: 0 2px 16px rgba(0, 0, 0, 0.4);
        }

        .vod-hero-slider .hero-slide .hero-overlay p {
            font-family: 'Vazirmatn', sans-serif;
            font-size: 0.95rem;
            color: #d6d0c4;
            max-width: 80%;
            margin-bottom: 1rem;
            text-shadow: 0 2px 12px rgba(0, 0, 0, 0.3);
        }

        .vod-hero-slider .hero-slide .hero-overlay .hero-btn {
            display: inline-flex;
            align-items: center;
            gap: 0.6rem;
            padding: 0.5rem 1.8rem;
            border-radius: 40px;
            font-family: 'Vazirmatn', sans-serif;
            font-weight: 600;
            font-size: 0.9rem;
            text-decoration: none;
            background: linear-gradient(145deg, #f5b042, #d48f2b);
            color: #0b0b0e;
            border: none;
            transition: 0.3s cubic-bezier(0.34, 1.56, 0.64, 1);
            align-self: flex-start;
            box-shadow: 0 4px 20px -6px rgba(245, 176, 66, 0.3);
        }

        .vod-hero-slider .hero-slide .hero-overlay .hero-btn:hover {
            transform: scale(1.04);
            box-shadow: 0 8px 32px -6px rgba(245, 176, 66, 0.5);
        }

        .vod-hero-slider .hero-slide .hero-overlay .hero-btn i {
            font-size: 0.9rem;
        }

        .hero-slider-nav {
            position: absolute;
            top: 50%;
            transform: translateY(-50%);
            z-index: 5;
            background: rgba(0, 0, 0, 0.5);
            backdrop-filter: blur(8px);
