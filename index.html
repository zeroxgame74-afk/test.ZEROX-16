<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <title>Tiva AI - دستیار هوشمند</title>

    <link href="https://cdn.jsdelivr.net/gh/rastikerdar/vazirmatn@v33.003/Vazirmatn-font-face.css" rel="stylesheet" />
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css" />

    <style>
        /* ===== ریست کامل ===== */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html,
        body {
            width: 100%;
            height: 100%;
            overflow: hidden;
            font-family: 'Vazirmatn', sans-serif;
            background: #070714;
            position: fixed;
            top: 0;
            left: 0;
        }

        /* ===== پس‌زمینه ===== */
        .bg {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 0;
            background: radial-gradient(ellipse at 30% 40%, #0d0d2b, #050510);
        }

        .bg .dot {
            position: absolute;
            border-radius: 50%;
            animation: floatDot 10s infinite linear;
            opacity: 0.3;
        }

        .bg .dot:nth-child(1) {
            width: 4px;
            height: 4px;
            background: #00d4ff;
            left: 15%;
            animation-duration: 12s;
            box-shadow: 0 0 20px #00d4ff;
        }
        .bg .dot:nth-child(2) {
            width: 3px;
            height: 3px;
            background: #a855f7;
            left: 45%;
            animation-duration: 15s;
            animation-delay: 2s;
            box-shadow: 0 0 15px #a855f7;
        }
        .bg .dot:nth-child(3) {
            width: 5px;
            height: 5px;
            background: #ec4899;
            left: 75%;
            animation-duration: 11s;
            animation-delay: 4s;
            box-shadow: 0 0 25px #ec4899;
        }
        .bg .dot:nth-child(4) {
            width: 3px;
            height: 3px;
            background: #f59e0b;
            left: 90%;
            animation-duration: 14s;
            animation-delay: 1s;
            box-shadow: 0 0 15px #f59e0b;
        }

        @keyframes floatDot {
            0% {
                transform: translateY(100vh) scale(0);
                opacity: 0;
            }
            15% {
                opacity: 0.4;
            }
            85% {
                opacity: 0.4;
            }
            100% {
                transform: translateY(-10vh) scale(2);
                opacity: 0;
            }
        }

        /* ================================================================
                   صفحه اول (Welcome Page)
                   ================================================================ */
        #welcomePage {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 10;
            display: flex;
            align-items: center;
            justify-content: center;
            background: radial-gradient(ellipse at 30% 40%, #0d0d2b, #050510);
            transition: opacity 0.6s ease, transform 0.6s ease;
        }

        #welcomePage.hide {
            opacity: 0;
            transform: scale(1.05);
            pointer-events: none;
        }

        .welcome-card {
            text-align: center;
            padding: 30px;
            max-width: 500px;
            width: 90%;
            background: rgba(10, 10, 30, 0.5);
            backdrop-filter: blur(30px);
            border-radius: 40px;
            border: 1px solid rgba(255, 255, 255, 0.04);
            padding: 50px 40px;
            box-shadow: 0 30px 80px rgba(0, 0, 0, 0.5);
        }

        .welcome-avatar {
            width: 150px;
            height: 150px;
            border-radius: 50%;
            background: linear-gradient(135deg, #00d4ff, #7c3aed);
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0 auto 20px;
            font-size: 68px;
            color: #fff;
            box-shadow: 0 0 80px rgba(0, 212, 255, 0.2), 0 0 160px rgba(124, 58, 237, 0.1);
            animation: floatAvatar 3s ease-in-out infinite;
            border: 2px solid rgba(0, 212, 255, 0.1);
        }

        @keyframes floatAvatar {
            0%,
            100% {
                transform: translateY(0);
            }
            50% {
                transform: translateY(-12px);
            }
        }

        .welcome-title {
            font-size: 40px;
            font-weight: 900;
            color: #fff;
            margin-bottom: 4px;
        }

        .welcome-title span {
            background: linear-gradient(90deg, #00d4ff, #a855f7);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .welcome-sub {
            font-size: 14px;
            color: rgba(255, 255, 255, 0.25);
            margin-bottom: 6px;
            letter-spacing: 1px;
        }

        .welcome-sub i {
            color: #00d4ff;
        }

        .welcome-desc {
            font-size: 15px;
            color: rgba(255, 255, 255, 0.2);
            line-height: 2;
            margin-bottom: 30px;
            padding: 0 10px;
        }

        .welcome-desc i {
            color: #a855f7;
            margin: 0 4px;
        }

        .welcome-features {
            display: flex;
            justify-content: center;
            gap: 20px;
            margin-bottom: 30px;
            flex-wrap: wrap;
        }

        .welcome-features span {
            font-size: 12px;
            color: rgba(255, 255, 255, 0.15);
            background: rgba(255, 255, 255, 0.02);
            padding: 6px 16px;
            border-radius: 30px;
            border: 1px solid rgba(255, 255, 255, 0.02);
        }

        .welcome-features span i {
            color: #00d4ff;
            margin-left: 4px;
        }

        .btn-enter {
            padding: 16px 50px;
            border-radius: 60px;
            border: none;
            background: linear-gradient(135deg, #00d4ff, #7c3aed);
            color: #fff;
            font-size: 18px;
            font-weight: 700;
            cursor: pointer;
            transition: 0.3s ease;
            display: inline-flex;
            align-items: center;
            gap: 12px;
            font-family: 'Vazirmatn', sans-serif;
            box-shadow: 0 0 40px rgba(0, 212, 255, 0.15);
            animation: btnPulse 2.5s ease-in-out infinite;
        }

        .btn-enter:hover {
            transform: scale(1.05);
            box-shadow: 0 0 70px rgba(0, 212, 255, 0.3);
        }

        @keyframes btnPulse {
            0%,
            100% {
                box-shadow: 0 0 40px rgba(0, 212, 255, 0.15);
            }
            50% {
                box-shadow: 0 0 80px rgba(0, 212, 255, 0.35);
            }
        }

        /* ================================================================
                   صفحه چت (Chat Page)
                   ================================================================ */
        #chatPage {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 5;
            display: flex;
            align-items: center;
            justify-content: center;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.6s ease;
        }

        #chatPage.show {
            opacity: 1;
            pointer-events: all;
        }

        .hero {
            width: 92%;
            max-width: 720px;
            height: 90vh;
            max-height: 700px;
            background: rgba(10, 10, 30, 0.8);
            backdrop-filter: blur(20px);
            border-radius: 32px;
            border: 1px solid rgba(255, 255, 255, 0.04);
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.6);
            display: flex;
            flex-direction: column;
            overflow: hidden;
            position: relative;
        }

        /* ===== هدر چت ===== */
        .header {
            padding: 14px 18px 12px;
            border-bottom: 1px solid rgba(255, 255, 255, 0.03);
            display: flex;
            align-items: center;
            justify-content: space-between;
            flex-shrink: 0;
            min-height: 56px;
        }

        .header .logo {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .header .logo i {
            font-size: 22px;
            color: #00d4ff;
            animation: iconPulse 2.5s ease-in-out infinite;
        }

        @keyframes iconPulse {
            0%,
            100% {
                transform: scale(1);
            }
            50% {
                transform: scale(1.1);
            }
        }

        .header .logo h1 {
            font-size: 18px;
            color: #fff;
            font-weight: 800;
        }

        .header .logo h1 span {
            background: linear-gradient(90deg, #00d4ff, #a855f7);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .header .right {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .header .status {
            display: flex;
            align-items: center;
            gap: 6px;
            font-size: 11px;
            color: rgba(255, 255, 255, 0.25);
        }

        .header .status .led {
            width: 6px;
            height: 6px;
            border-radius: 50%;
            background: #22c55e;
            animation: ledBlink 2s ease-in-out infinite;
        }

        @keyframes ledBlink {
            0%,
            100% {
                opacity: 1;
            }
            50% {
                opacity: 0.2;
            }
        }

        /* ===== دکمه همبرگر ===== */
        .hamburger {
            width: 36px;
            height: 36px;
            border-radius: 50%;
            border: none;
            background: rgba(255, 255, 255, 0.03);
            color: rgba(255, 255, 255, 0.4);
            font-size: 18px;
            cursor: pointer;
            transition: 0.3s ease;
            display: flex;
            align-items: center;
            justify-content: center;
            position: relative;
        }

        .hamburger:hover {
            background: rgba(255, 255, 255, 0.06);
            color: #fff;
            transform: rotate(90deg);
        }

        .hamburger.active {
            transform: rotate(90deg);
            color: #00d4ff;
        }

        /* ===== منوی کناری ===== */
        .side-menu {
            position: absolute;
            top: 0;
            right: -320px;
            width: 300px;
            height: 100%;
            background: rgba(10, 10, 30, 0.95);
            backdrop-filter: blur(30px);
            border-left: 1px solid rgba(255, 255, 255, 0.04);
            z-index: 20;
            transition: right 0.4s cubic-bezier(0.4, 0, 0.2, 1);
            display: flex;
            flex-direction: column;
            padding: 20px 0;
            border-radius: 0 32px 32px 0;
        }

        .side-menu.open {
            right: 0;
        }

        .side-menu .menu-header {
            padding: 0 20px 16px;
            border-bottom: 1px solid rgba(255, 255, 255, 0.04);
            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        .side-menu .menu-header h3 {
            color: #fff;
            font-size: 16px;
            font-weight: 700;
        }

        .side-menu .menu-header h3 i {
            color: #00d4ff;
            margin-left: 8px;
        }

        .side-menu .menu-header .close-menu {
            background: none;
            border: none;
            color: rgba(255, 255, 255, 0.2);
            font-size: 20px;
            cursor: pointer;
            transition: 0.3s;
        }

        .side-menu .menu-header .close-menu:hover {
            color: #fff;
            transform: rotate(90deg);
        }

        .side-menu .menu-actions {
            padding: 14px 20px;
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
            border-bottom: 1px solid rgba(255, 255, 255, 0.03);
        }

        .side-menu .menu-actions button {
            padding: 8px 16px;
            border-radius: 30px;
            border: 1px solid rgba(255, 255, 255, 0.04);
            background: rgba(255, 255, 255, 0.02);
            color: rgba(255, 255, 255, 0.3);
            font-size: 12px;
            cursor: pointer;
            transition: 0.3s;
            font-family: 'Vazirmatn', sans-serif;
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .side-menu .menu-actions button:hover {
            background: rgba(255, 255, 255, 0.04);
            color: #fff;
        }

        .side-menu .menu-actions button.danger:hover {
            border-color: rgba(239, 68, 68, 0.2);
            color: #ef4444;
        }

        .side-menu .menu-actions button i {
            font-size: 12px;
        }

        /* ===== لیست تاریخچه ===== */
        .history-list {
            flex: 1;
            overflow-y: auto;
            padding: 10px 14px;
        }

        .history-list::-webkit-scrollbar {
            width: 3px;
        }
        .history-list::-webkit-scrollbar-thumb {
            background: rgba(0, 212, 255, 0.1);
            border-radius: 10px;
        }

        .history-item {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 10px 14px;
            border-radius: 12px;
            margin-bottom: 4px;
            background: rgba(255, 255, 255, 0.02);
            transition: 0.3s;
            cursor: pointer;
            border: 1px solid transparent;
        }

        .history-item:hover {
            background: rgba(255, 255, 255, 0.04);
            border-color: rgba(255, 255, 255, 0.03);
        }

        .history-item.pinned {
            border-color: rgba(0, 212, 255, 0.1);
            background: rgba(0, 212, 255, 0.03);
        }

        .history-item .h-text {
            flex: 1;
            color: rgba(255, 255, 255, 0.5);
            font-size: 13px;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            margin-left: 10px;
        }

        .history-item .h-text i {
            color: #a855f7;
            margin-left: 6px;
            font-size: 11px;
        }

        .history-item .h-actions {
            display: flex;
            gap: 4px;
            flex-shrink: 0;
        }

        .history-item .h-actions button {
            background: none;
            border: none;
            color: rgba(255, 255, 255, 0.1);
            font-size: 12px;
            cursor: pointer;
            transition: 0.3s;
            padding: 4px 6px;
            border-radius: 6px;
        }

        .history-item .h-actions button:hover {
            color: rgba(255, 255, 255, 0.4);
            background: rgba(255, 255, 255, 0.03);
        }

        .history-item .h-actions button.pin-btn:hover {
            color: #f59e0b;
        }

        .history-item .h-actions button.delete-btn:hover {
            color: #ef4444;
        }

        .history-empty {
            color: rgba(255, 255, 255, 0.08);
            text-align: center;
            font-size: 13px;
            padding: 40px 0;
        }

        .history-empty i {
            font-size: 32px;
            display: block;
            margin-bottom: 10px;
            color: rgba(255, 255, 255, 0.04);
        }

        /* ===== بخش مشخصات ===== */
        .profile {
            padding: 10px 18px 10px;
            display: flex;
            align-items: center;
            gap: 12px;
            flex-shrink: 0;
            border-bottom: 1px solid rgba(255, 255, 255, 0.03);
            min-height: 60px;
        }

        .profile .avatar {
            width: 44px;
            height: 44px;
            border-radius: 50%;
            background: linear-gradient(135deg, #00d4ff, #7c3aed);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 20px;
            color: #fff;
            flex-shrink: 0;
            box-shadow: 0 0 30px rgba(0, 212, 255, 0.1);
        }

        .profile .info {
            flex: 1;
            min-width: 0;
        }

        .profile .info .name {
            font-size: 14px;
            font-weight: 700;
            color: #fff;
        }

        .profile .info .name i {
            color: #f59e0b;
            font-size: 11px;
            margin-right: 4px;
        }

        .profile .info .desc {
            font-size: 11px;
            color: rgba(255, 255, 255, 0.25);
            margin-top: 1px;
        }

        .profile .info .desc i {
            margin-left: 4px;
            color: #a855f7;
        }

        .profile .version {
            font-size: 10px;
            color: rgba(255, 255, 255, 0.08);
            background: rgba(255, 255, 255, 0.02);
            padding: 3px 10px;
            border-radius: 30px;
            border: 1px solid rgba(255, 255, 255, 0.02);
            flex-shrink: 0;
        }

        /* ===== بخش پیام‌ها ===== */
        .chat-area {
            flex: 1;
            padding: 12px 18px;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 8px;
            min-height: 0;
            scroll-behavior: smooth;
        }

        .chat-area::-webkit-scrollbar {
            width: 3px;
        }
        .chat-area::-webkit-scrollbar-thumb {
            background: rgba(0, 212, 255, 0.1);
            border-radius: 10px;
        }

        .msg {
            max-width: 82%;
            padding: 9px 14px;
            border-radius: 14px;
            font-size: 14px;
            line-height: 1.7;
            animation: msgIn 0.25s ease forwards;
            opacity: 0;
            word-wrap: break-word;
        }

        @keyframes msgIn {
            0% {
                opacity: 0;
                transform: translateY(6px);
            }
            100% {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .msg.user {
            align-self: flex-end;
            background: linear-gradient(135deg, #00d4ff, #7c3aed);
            color: #fff;
            border-bottom-right-radius: 4px;
        }

        .msg.ai {
            align-self: flex-start;
            background: rgba(255, 255, 255, 0.04);
            color: rgba(255, 255, 255, 0.75);
            border-bottom-left-radius: 4px;
            border: 1px solid rgba(255, 255, 255, 0.02);
        }

        .msg.ai .dot-load {
            display: inline-flex;
            gap: 4px;
        }

        .msg.ai .dot-load span {
            width: 5px;
            height: 5px;
            background: rgba(255, 255, 255, 0.15);
            border-radius: 50%;
            animation: dotJump 1.2s ease-in-out infinite;
        }

        .msg.ai .dot-load span:nth-child(2) {
            animation-delay: 0.2s;
        }
        .msg.ai .dot-load span:nth-child(3) {
            animation-delay: 0.4s;
        }

        @keyframes dotJump {
            0%,
            80%,
            100% {
                transform: scale(0.5);
                opacity: 0.3;
            }
            40% {
                transform: scale(1);
                opacity: 1;
            }
        }

        /* ===== بخش ورودی ===== */
        .input-area {
            padding: 10px 18px 14px;
            border-top: 1px solid rgba(255, 255, 255, 0.03);
            display: flex;
            gap: 8px;
            flex-shrink: 0;
            min-height: 60px;
        }

        .input-area input {
            flex: 1;
            padding: 10px 16px;
            border-radius: 40px;
            border: 1px solid rgba(255, 255, 255, 0.04);
            background: rgba(255, 255, 255, 0.02);
            color: #fff;
            font-family: 'Vazirmatn', sans-serif;
            font-size: 14px;
            outline: none;
            transition: 0.2s;
        }

        .input-area input::placeholder {
            color: rgba(255, 255, 255, 0.12);
        }

        .input-area input:focus {
            border-color: rgba(0, 212, 255, 0.08);
            background: rgba(255, 255, 255, 0.03);
        }

        .input-area input:disabled {
            opacity: 0.3;
        }

        .input-area button {
            padding: 10px 22px;
            border-radius: 40px;
            border: none;
            background: linear-gradient(135deg, #00d4ff, #7c3aed);
            color: #fff;
            font-weight: 700;
            font-size: 14px;
            cursor: pointer;
            transition: 0.2s;
            display: flex;
            align-items: center;
            gap: 8px;
            flex-shrink: 0;
            font-family: 'Vazirmatn', sans-serif;
        }

        .input-area button:hover:not(:disabled) {
            transform: scale(1.03);
        }

        .input-area button:disabled {
            opacity: 0.3;
            cursor: not-allowed;
        }

        /* ===== اورلی ===== */
        .menu-overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.3);
            z-index: 15;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.4s ease;
        }

        .menu-overlay.show {
            opacity: 1;
            pointer-events: all;
        }

        /* ===== ریسپانسیو ===== */
        @media (max-width: 600px) {
            .welcome-card {
                padding: 30px 20px;
                border-radius: 28px;
                margin: 20px;
            }
            .welcome-avatar {
                width: 110px;
                height: 110px;
                font-size: 48px;
            }
            .welcome-title {
                font-size: 28px;
            }
            .welcome-desc {
                font-size: 13px;
            }
            .btn-enter {
                padding: 14px 32px;
                font-size: 16px;
            }
            .welcome-features span {
                font-size: 10px;
                padding: 4px 12px;
            }

            .hero {
                width: 100%;
                height: 100vh;
                max-height: 100vh;
                border-radius: 0;
            }
            .header {
                padding: 10px 14px 8px;
                min-height: 48px;
            }
            .header .logo h1 {
                font-size: 16px;
            }
            .profile {
                padding: 8px 14px 8px;
                min-height: 52px;
                gap: 10px;
            }
            .profile .avatar {
                width: 38px;
                height: 38px;
                font-size: 17px;
            }
            .profile .info .name {
                font-size: 13px;
            }
            .profile .info .desc {
                font-size: 10px;
            }
            .profile .version {
                font-size: 9px;
                padding: 2px 8px;
            }
            .chat-area {
                padding: 8px 14px;
                gap: 6px;
            }
            .msg {
                max-width: 90%;
                font-size: 13px;
                padding: 8px 12px;
            }
            .input-area {
                padding: 8px 14px 12px;
                min-height: 54px;
                gap: 6px;
                flex-wrap: wrap;
            }
            .input-area input {
                font-size: 13px;
                padding: 8px 14px;
                flex: 1 1 100%;
            }
            .input-area button {
                padding: 8px 16px;
                font-size: 13px;
                width: 100%;
                justify-content: center;
            }

            .side-menu {
                width: 280px;
                right: -290px;
            }
            .side-menu.open {
                right: 0;
            }
            .hamburger {
                width: 32px;
                height: 32px;
                font-size: 16px;
            }
        }

        @media (max-width: 380px) {
            .welcome-avatar {
                width: 90px;
                height: 90px;
                font-size: 38px;
            }
            .welcome-title {
                font-size: 24px;
            }
            .btn-enter {
                padding: 12px 24px;
                font-size: 14px;
            }
            .side-menu {
                width: 250px;
                right: -260px;
            }
            .side-menu.open {
                right: 0;
            }
        }
    </style>
</head>
<body>

    <!-- ===== پس‌زمینه ===== -->
    <div class="bg">
        <div class="dot"></div>
        <div class="dot"></div>
        <div class="dot"></div>
        <div class="dot"></div>
    </div>

    <!-- ============================================================
    صفحه اول (Welcome)
    ============================================================ -->
    <div id="welcomePage">
        <div class="welcome-card">
            <div class="welcome-avatar">
                <i class="fas fa-brain"></i>
            </div>
            <h1 class="welcome-title">
                <span>Tiva</span> AI
            </h1>
            <p class="welcome-sub">
                <i class="fas fa-circle-check"></i>
                نسخه 2.0 · دستیار هوشمند
            </p>
            <p class="welcome-desc">
                <i class="fas fa-comment"></i> پاسخ‌های آنی · کاملاً آفلاین
                <br />
                <i class="fas fa-star"></i> بدون نیاز به اینترنت · حریم خصوصی کامل
            </p>
            <div class="welcome-features">
                <span><i class="fas fa-clock"></i> آنی</span>
                <span><i class="fas fa-shield-halved"></i> امن</span>
                <span><i class="fas fa-brain"></i> هوشمند</span>
            </div>
            <button class="btn-enter" id="enterBtn">
                <i class="fas fa-paper-plane"></i>
                شروع مکالمه
            </button>
        </div>
    </div>

    <!-- ============================================================
    صفحه چت
    ============================================================ -->
    <div id="chatPage">
        <div class="hero">

            <!-- ===== منوی همبرگر ===== -->
            <div class="menu-overlay" id="menuOverlay"></div>

            <div class="side-menu" id="sideMenu">
                <div class="menu-header">
                    <h3><i class="fas fa-clock"></i> تاریخچه</h3>
                    <button class="close-menu" id="closeMenuBtn">
                        <i class="fas fa-xmark"></i>
                    </button>
                </div>
                <div class="menu-actions">
                    <button id="pinAllBtn"><i class="fas fa-thumbtack"></i> سنجاق همه</button>
                    <button id="unpinAllBtn"><i class="fas fa-thumbtack-slash"></i> آزاد کردن</button>
                    <button id="clearHistoryBtn" class="danger"><i class="fas fa-trash-can"></i> پاک کردن</button>
                </div>
                <div class="history-list" id="historyList">
                    <!-- تاریخچه اینجا ساخته میشه -->
                </div>
            </div>

            <!-- ===== هدر ===== -->
            <div class="header">
                <div class="logo">
                    <i class="fas fa-microchip"></i>
                    <h1><span>Tiva</span> AI</h1>
                </div>
                <div class="right">
                    <div class="status">
                        <span class="led"></span>
                        <span>آماده</span>
                    </div>
                    <button class="hamburger" id="hamburgerBtn">
                        <i class="fas fa-bars"></i>
                    </button>
                </div>
            </div>

            <!-- ===== مشخصات ===== -->
            <div class="profile">
                <div class="avatar">
                    <i class="fas fa-user"></i>
                </div>
                <div class="info">
                    <div class="name">
                        Tiva <i class="fas fa-circle-check"></i>
                    </div>
                    <div class="desc">
                        <i class="fas fa-comment"></i> دستیار هوشمند
                    </div>
                </div>
                <div class="version">v2.0</div>
            </div>

            <!-- ===== پیام‌ها ===== -->
            <div class="chat-area" id="chatArea">
                <div class="msg ai">
                    <i class="fas fa-hand-peace" style="margin-left:6px;"></i>
                    سلام! من <strong>Tiva</strong> هستم. هر سوالی داری بپرس.
                </div>
            </div>

            <!-- ===== ورودی ===== -->
            <div class="input-area">
                <input type="text" id="userInput" placeholder="سوال خود را بنویس..." />
                <button id="sendBtn">
                    <i class="fas fa-paper-plane"></i> ارسال
                </button>
            </div>

        </div>
    </div>

    <script>
        // ============================================================
        //  Tiva AI - با پردازش هوشمند و تاریخچه
        // ============================================================

        // ===== المنت‌ها =====
        const welcomePage = document.getElementById('welcomePage');
        const chatPage = document.getElementById('chatPage');
        const enterBtn = document.getElementById('enterBtn');
        const chatArea = document.getElementById('chatArea');
        const userInput = document.getElementById('userInput');
        const sendBtn = document.getElementById('sendBtn');
        const hamburgerBtn = document.getElementById('hamburgerBtn');
        const sideMenu = document.getElementById('sideMenu');
        const menuOverlay = document.getElementById('menuOverlay');
        const closeMenuBtn = document.getElementById('closeMenuBtn');
        const historyList = document.getElementById('historyList');
        const clearHistoryBtn = document.getElementById('clearHistoryBtn');
        const pinAllBtn = document.getElementById('pinAllBtn');
        const unpinAllBtn = document.getElementById('unpinAllBtn');

        // ===== تاریخچه =====
        let history = [];
        let pinnedIds = new Set();
        let messageIdCounter = 0;

        // ===== بارگذاری تاریخچه =====
        function loadHistory() {
            try {
                const saved = localStorage.getItem('tiva_history');
                if (saved) {
                    const data = JSON.parse(saved);
                    history = data.history || [];
                    pinnedIds = new Set(data.pinnedIds || []);
                    messageIdCounter = data.counter || 0;
                }
            } catch (e) {}
        }

        // ===== ذخیره تاریخچه =====
        function saveHistory() {
            try {
                localStorage.setItem('tiva_history', JSON.stringify({
                    history: history,
                    pinnedIds: Array.from(pinnedIds),
                    counter: messageIdCounter
                }));
            } catch (e) {}
        }

        // ===== افزودن به تاریخچه =====
        function addToHistory(text, isUser) {
            const id = ++messageIdCounter;
            history.push({ id, text, isUser, timestamp: Date.now() });
            renderHistory();
            saveHistory();
        }

        // ===== حذف =====
        function deleteHistoryItem(id) {
            history = history.filter(item => item.id !== id);
            pinnedIds.delete(id);
            renderHistory();
            saveHistory();
        }

        // ===== سنجاق =====
        function togglePin(id) {
            if (pinnedIds.has(id)) pinnedIds.delete(id);
            else pinnedIds.add(id);
            renderHistory();
            saveHistory();
        }

        // ===== پاک کردن کل =====
        function clearHistory() {
            if (history.length === 0) return;
            if (confirm('آیا مطمئنی می‌خوای کل تاریخچه رو پاک کنی؟')) {
                history = [];
                pinnedIds.clear();
                renderHistory();
                saveHistory();
            }
        }

        // ===== سنجاق همه =====
        function pinAll() {
            history.forEach(item => pinnedIds.add(item.id));
            renderHistory();
            saveHistory();
        }

        // ===== آزاد کردن همه =====
        function unpinAll() {
            pinnedIds.clear();
            renderHistory();
            saveHistory();
        }

        // ===== رندر تاریخچه =====
        function renderHistory() {
            if (history.length === 0) {
                historyList.innerHTML = `
                            <div class="history-empty">
                                <i class="fas fa-clock"></i>
                                هنوز پیامی وجود ندارد
                            </div>
                        `;
                return;
            }

            const sorted = [...history].sort((a, b) => {
                const aPinned = pinnedIds.has(a.id) ? 1 : 0;
                const bPinned = pinnedIds.has(b.id) ? 1 : 0;
                if (aPinned !== bPinned) return bPinned - aPinned;
                return b.timestamp - a.timestamp;
            });

            let html = '';
            sorted.forEach(item => {
                const isPinned = pinnedIds.has(item.id);
                const icon = item.isUser ? 'fas fa-user' : 'fas fa-robot';
                const label = item.isUser ? 'شما' : 'Tiva';
                html += `
                            <div class="history-item ${isPinned ? 'pinned' : ''}">
                                <div class="h-text">
                                    <i class="${icon}"></i>
                                    ${label}: ${item.text.substring(0, 40)}${item.text.length > 40 ? '...' : ''}
                                </div>
                                <div class="h-actions">
                                    <button class="pin-btn" onclick="togglePin(${item.id})" title="${isPinned ? 'آزاد کردن' : 'سنجاق'}">
                                        <i class="fas ${isPinned ? 'fa-thumbtack' : 'fa-thumbtack-slash'}"></i>
                                    </button>
                                    <button class="delete-btn" onclick="deleteHistoryItem(${item.id})" title="حذف">
                                        <i class="fas fa-trash-can"></i>
                                    </button>
                                </div>
                            </div>
                        `;
            });

            historyList.innerHTML = html;
        }

        // ===== نمایش پیام =====
        function showMessage(type, content, saveToHistory = false) {
            const div = document.createElement('div');
            div.className = `msg ${type}`;

            if (type === 'ai' && content === '...') {
                div.innerHTML = `
                            <div class="dot-load">
                                <span></span><span></span><span></span>
                            </div>
                        `;
            } else {
                div.textContent = content;
                if (saveToHistory && content !== '...') {
                    addToHistory(content, type === 'user');
                }
            }

            chatArea.appendChild(div);
            chatArea.scrollTop = chatArea.scrollHeight;
            return div;
        }

        // ============================================================
        //  🧠 پردازش هوشمند Tiva - اینجا مغز AI هست!
        // ============================================================
        function processQuestion(text) {
            const clean = text.trim().toLowerCase();

            // ===== ۱. تشخیص سوالات کلی =====
            if (clean.includes('سلام') || clean.includes('درود') || clean.includes('هی')) {
                return 'سلام! چطور می‌تونم کمکت کنم؟';
            }

            if (clean.includes('خوبی') || clean.includes('چطوری')) {
                return 'عالی‌ام! ممنون که پرسیدی. تو چطوری؟';
            }

            if (clean.includes('اسم') && (clean.includes('ت') || clean.includes('چی'))) {
                return 'اسم من Tiva هست. دستیار هوشمند شما!';
            }

            if (clean.includes('کی') && clean.includes('هستی')) {
                return 'من Tiva هستم، یک دستیار هوشمند که برای کمک به شما ساخته شدم.';
            }

            if (clean.includes('چیکار') || clean.includes('کاری') && clean.includes('میکنی')) {
                return 'به سوالاتت جواب می‌دم، ایده می‌دم و در هر چیزی که نیاز داری کمک می‌کنم.';
            }

            if (clean.includes('چه کاری') && clean.includes('بلدی')) {
                return 'بلدم به سوالات جواب بدم، ایده بدم، راهنمایی کنم و کلی چیز دیگه!';
            }

            if (clean.includes('ممنون') || clean.includes('مرسی')) {
                return 'خواهش می‌کنم! هر وقت نیاز داشتی من اینجام.';
            }

            if (clean.includes('خداحافظ') || clean.includes('بای')) {
                return 'خداحافظ! روز خوبی داشته باشی 🌟';
            }

            if (clean.includes('عشق') || clean.includes('دوستت')) {
                return '❤️ ممنون! تو هم عشقی!';
            }

            // ===== ۲. تشخیص تاریخ و ساعت =====
            if (clean.includes('تاریخ') || clean.includes('امروز')) {
                return `امروز ${new Date().toLocaleDateString('fa-IR')} هست.`;
            }

            if (clean.includes('ساعت') || clean.includes('چند')) {
                return `ساعت الان ${new Date().toLocaleTimeString('fa-IR')} هست.`;
            }

            // ===== ۳. تشخیص جوک =====
            if (clean.includes('خنده') || clean.includes('جک') || clean.includes('لطیفه')) {
                const jokes = [
                    '😂 یه جوک: چرا کامپیوترها خوشحال نیستن؟ چون مادربردشون خرابه!',
                    '😂 به یه کامپیوتر گفتن چطوری؟ گفت: بوت آپ!',
                    '😂 چرا برنامه‌نویس‌ها همیشه خوابن؟ چون به کداشون استراحت می‌دن!',
                    '😂 یه سایت به سایت دیگه گفت: چرا اینقدر لگ داری؟ گفت: دیتابیسم پر از استرسه!'
                ];
                return jokes[Math.floor(Math.random() * jokes.length)];
            }

            // ===== ۴. تشخیص سوالات خاص =====
            if (clean.includes('کی') && clean.includes('ساخته')) {
                return 'من توسط یک توسعه‌دهنده حرفه‌ای ساخته شدم تا به شما کمک کنم!';
            }

            if (clean.includes('سن') || clean.includes('چند سال')) {
                return 'من همونقدر سالم که اولین بار اجرا شدم! (تازه متولد شدم!)';
            }

            if (clean.includes('رنگ') && clean.includes('دوست')) {
                const colors = ['آبی', 'بنفش', 'نارنجی', 'طلایی'];
                return `رنگ مورد علاقه من ${colors[Math.floor(Math.random() * colors.length)]} هست!`;
            }

            // ===== ۵. تشخیص سوالات ریاضی ساده =====
            const mathMatch = clean.match(/(\d+)\s*([+\-*/])\s*(\d+)/);
            if (mathMatch) {
                const num1 = parseInt(mathMatch[1]);
                const op = mathMatch[2];
                const num2 = parseInt(mathMatch[3]);
                let result;
                switch (op) {
                    case '+':
                        result = num1 + num2;
                        break;
                    case '-':
                        result = num1 - num2;
                        break;
                    case '*':
                        result = num1 * num2;
                        break;
                    case '/':
                        result = num1 / num2;
                        break;
                    default:
                        result = 'نمی‌دونم!';
                }
                return `جوابش میشه: ${result}`;
            }

            // ===== ۶. تشخیص سوالات "چرا" و "چطور" =====
            if (clean.includes('چرا') || clean.includes('چطور') || clean.includes('چگونه')) {
                const responses = [
                    'سوال خوبی پرسیدی! ولی برای جواب دقیق‌تر، کمی بیشتر توضیح بده.',
                    'هوم... بذار فکر کنم. این سوال نیاز به تفکر داره!',
                    'جالب بود! راستش رو بخوای جوابش رو نمی‌دونم، ولی می‌تونیم با هم فکر کنیم.',
                    'سوال پیچیده‌ای پرسیدی! بیشتر توضیح بده تا بهتر کمک کنم.'
                ];
                return responses[Math.floor(Math.random() * responses.length)];
            }

            // ===== ۷. تشخیص سوالات "آیا" =====
            if (clean.includes('آیا')) {
                const answers = ['بله!', 'خیر!', 'ممکنه!', 'قطعاً!', 'نه دقیقاً!'];
                return answers[Math.floor(Math.random() * answers.length)];
            }

            // ===== ۸. تشخیص سوالات "چه" و "کدام" =====
            if (clean.includes('چه') || clean.includes('کدام')) {
                const responses = [
                    'فکر می‌کنم بهترین گزینه همین باشه!',
                    'بستگی به شرایط داره، ولی می‌تونم کمک کنم.',
                    'سوال خوبی پرسیدی! بذار فکر کنم...',
                    'راستش رو بخوای مطمئن نیستم، ولی می‌تونیم بررسی کنیم.'
                ];
                return responses[Math.floor(Math.random() * responses.length)];
            }

            // ===== ۹. پاسخ پیش‌فرض (هوشمندانه) =====
            const fallbacks = [
                'سوال خوبی پرسیدی! ولی فعلاً دانش من محدوده. می‌تونی ساده‌تر بپرسی؟',
                'متوجه شدم! ولی برای جواب دقیق‌تر، کمی بیشتر توضیح بده.',
                'آره! ولی راستش رو بخوای فعلاً نمی‌دونم. سعی کن ساده‌تر بپرسی.',
                'جالب بود! ولی راستش رو بخوای جوابش رو نمی‌دونم. شاید با هم فکر کنیم!',
                'هوم... این یه سوال چالش‌برانگیزه! بیشتر توضیح بده تا بهتر کمک کنم.'
            ];
            return fallbacks[Math.floor(Math.random() * fallbacks.length)];
        }

        // ===== ارسال پیام =====
        function sendMessage() {
            const text = userInput.value.trim();
            if (!text) return;

            showMessage('user', text, true);
            userInput.value = '';
            userInput.disabled = true;
            sendBtn.disabled = true;

            const loading = showMessage('ai', '...');

            setTimeout(() => {
                loading.remove();
                const reply = processQuestion(text);
                showMessage('ai', reply, true);
                userInput.disabled = false;
                sendBtn.disabled = false;
                userInput.focus();
            }, 200);
        }

        // ===== منو =====
        function toggleMenu() {
            sideMenu.classList.toggle('open');
            menuOverlay.classList.toggle('show');
            hamburgerBtn.classList.toggle('active');
        }

        function closeMenu() {
            sideMenu.classList.remove('open');
            menuOverlay.classList.remove('show');
            hamburgerBtn.classList.remove('active');
        }

        // ===== رویدادها =====
        enterBtn.addEventListener('click', function() {
            welcomePage.classList.add('hide');
            chatPage.classList.add('show');
            loadHistory();
            renderHistory();
            setTimeout(() => userInput.focus(), 400);
        });

        hamburgerBtn.addEventListener('click', toggleMenu);
        closeMenuBtn.addEventListener('click', closeMenu);
        menuOverlay.addEventListener('click', closeMenu);

        clearHistoryBtn.addEventListener('click', clearHistory);
        pinAllBtn.addEventListener('click', pinAll);
        unpinAllBtn.addEventListener('click', unpinAll);

        sendBtn.addEventListener('click', sendMessage);
        userInput.addEventListener('keydown', function(e) {
            if (e.key === 'Enter') sendMessage();
        });

        setTimeout(() => userInput.focus(), 500);

        // ===== توابع گلوبال =====
        window.deleteHistoryItem = deleteHistoryItem;
        window.togglePin = togglePin;
    </script>

</body>
</html>
