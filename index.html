<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Zerox Games | Original</title>
    
    <!-- Font Awesome 6 (آیکون‌های خفن) -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" />
    
    <!-- Google Fonts: استعداد + اردکان -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Estedad:wght@400;700;900&family=Ardakan:wght@400;700&display=swap" rel="stylesheet" />
    
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background: #0b0d15;
            color: #fff;
            font-family: 'Estedad', sans-serif;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 2rem 1rem;
            position: relative;
            overflow-x: hidden;
        }

        /* پس‌زمینه داینامیک با ذرات */
        body::before {
            content: '';
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: radial-gradient(circle at 30% 40%, #1a1f35, #07080e);
            z-index: -2;
        }

        .particles {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: -1;
            overflow: hidden;
        }

        .particle {
            position: absolute;
            width: 4px;
            height: 4px;
            background: rgba(255, 215, 0, 0.6);
            border-radius: 50%;
            animation: floatParticle 18s infinite linear;
            box-shadow: 0 0 15px gold;
        }

        @keyframes floatParticle {
            0% { transform: translateY(110vh) rotate(0deg); opacity: 0.2; }
            50% { opacity: 1; }
            100% { transform: translateY(-10vh) rotate(720deg); opacity: 0; }
        }

        /* کارت اصلی */
        .hero-card {
            max-width: 1000px;
            width: 100%;
            background: rgba(20, 25, 45, 0.75);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 215, 0, 0.25);
            border-radius: 48px;
            padding: 3rem 2.5rem;
            text-align: center;
            box-shadow: 0 30px 80px rgba(0, 0, 0, 0.8), 0 0 0 1px rgba(255, 215, 0, 0.1) inset;
            transition: 0.4s ease;
            animation: fadeUp 1s ease-out;
        }

        @keyframes fadeUp {
            0% { opacity: 0; transform: translateY(60px) scale(0.96); }
            100% { opacity: 1; transform: translateY(0) scale(1); }
        }

        .hero-card:hover {
            border-color: #ffd700;
            box-shadow: 0 40px 100px rgba(255, 215, 0, 0.2), 0 0 0 2px rgba(255, 215, 0, 0.2) inset;
        }

        /* لوگو و عنوان */
        .logo-wrapper {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 1rem;
            flex-wrap: wrap;
            margin-bottom: 1.2rem;
        }

        .logo-icon {
            font-size: 4.5rem;
            color: #ffd700;
            filter: drop-shadow(0 0 20px rgba(255, 215, 0, 0.5));
            animation: pulseGlow 2.5s infinite alternate;
        }

        @keyframes pulseGlow {
            0% { filter: drop-shadow(0 0 10px gold); }
            100% { filter: drop-shadow(0 0 40px #ffaa00); }
        }

        .main-title {
            font-family: 'Ardakan', sans-serif;
            font-weight: 900;
            font-size: 4rem;
            letter-spacing: 2px;
            background: linear-gradient(135deg, #ffd700, #ffb800, #ff8c00);
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
            text-shadow: 0 0 40px rgba(255, 200, 0, 0.3);
        }

        .sub-title {
            font-family: 'Estedad', sans-serif;
            font-weight: 700;
            font-size: 1.3rem;
            color: #b9c4e6;
            margin-top: -0.5rem;
            letter-spacing: 3px;
            opacity: 0.9;
        }

        .sub-title i {
            color: #ffd700;
            margin: 0 6px;
        }

        /* تقسیم‌کننده */
        .divider {
            width: 120px;
            height: 3px;
            background: linear-gradient(90deg, transparent, #ffd700, transparent);
            margin: 1.8rem auto;
            border-radius: 10px;
        }

        /* توضیحات */
        .desc {
            font-family: 'Estedad', sans-serif;
            font-size: 1.2rem;
            line-height: 2rem;
            color: #d0d9f0;
            max-width: 650px;
            margin: 0 auto 2.5rem auto;
        }

        .desc i {
            color: #ffd700;
            margin: 0 4px;
        }

        /* شبکه ویژگی‌ها */
        .features-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(160px, 1fr));
            gap: 1.8rem;
            margin: 2.5rem 0 3rem;
        }

        .feature-item {
            background: rgba(255, 215, 0, 0.06);
            border-radius: 28px;
            padding: 1.4rem 0.8rem;
            border: 1px solid rgba(255, 215, 0, 0.15);
            transition: 0.3s ease;
            backdrop-filter: blur(4px);
        }

        .feature-item:hover {
            transform: translateY(-8px) scale(1.02);
            border-color: #ffd700;
            background: rgba(255, 215, 0, 0.12);
            box-shadow: 0 12px 30px rgba(255, 215, 0, 0.15);
        }

        .feature-item i {
            font-size: 2.6rem;
            color: #ffd700;
            display: block;
            margin-bottom: 10px;
        }

        .feature-item span {
            font-family: 'Ardakan', sans-serif;
            font-weight: 700;
            font-size: 1.1rem;
            color: #f0f4ff;
        }

        /* دکمه‌ها */
        .btn-group {
            display: flex;
            flex-wrap: wrap;
            align-items: center;
            justify-content: center;
            gap: 1.5rem;
            margin-top: 1rem;
        }

        .btn {
            font-family: 'Estedad', sans-serif;
            font-weight: 700;
            padding: 1rem 2.8rem;
            border-radius: 60px;
            font-size: 1.1rem;
            border: none;
            cursor: pointer;
            transition: 0.3s ease;
            display: inline-flex;
            align-items: center;
            gap: 12px;
            text-decoration: none;
            background: transparent;
            color: #fff;
            border: 2px solid #ffd700;
        }

        .btn-primary {
            background: #ffd700;
            color: #0b0d15;
            border: 2px solid #ffd700;
            box-shadow: 0 0 30px rgba(255, 215, 0, 0.3);
        }

        .btn-primary:hover {
            background: #ffed4a;
            transform: scale(1.06);
            box-shadow: 0 0 60px rgba(255, 215, 0, 0.6);
        }

        .btn-outline:hover {
            background: rgba(255, 215, 0, 0.12);
            transform: scale(1.05);
            border-color: #ffed4a;
        }

        .btn i {
            font-size: 1.3rem;
        }

        /* فوتر */
        .footer-note {
            margin-top: 3rem;
            font-family: 'Estedad', sans-serif;
            font-size: 0.95rem;
            color: #6b7399;
            letter-spacing: 1px;
        }

        .footer-note i {
            color: #ffd700;
            margin: 0 5px;
        }

        /* ریسپانسیو */
        @media (max-width: 700px) {
            .hero-card { padding: 2rem 1.5rem; }
            .main-title { font-size: 2.8rem; }
            .logo-icon { font-size: 3.2rem; }
            .sub-title { font-size: 1rem; }
            .desc { font-size: 1rem; }
            .features-grid { grid-template-columns: 1fr 1fr; gap: 1rem; }
            .btn { padding: 0.8rem 1.8rem; font-size: 0.95rem; }
        }

        @media (max-width: 460px) {
            .features-grid { grid-template-columns: 1fr; }
            .main-title { font-size: 2.2rem; }
        }
    </style>
</head>
<body>

    <!-- ذرات پس‌زمینه (JS تولید می‌کنه) -->
    <div class="particles" id="particlesContainer"></div>

    <!-- کارت اصلی -->
    <div class="hero-card">

        <!-- لوگو + نام -->
        <div class="logo-wrapper">
            <i class="fas fa-gamepad logo-icon"></i>
            <h1 class="main-title">Zerox Games</h1>
        </div>
        <p class="sub-title">
            <i class="fas fa-star"></i> original studio <i class="fas fa-star"></i>
        </p>

        <div class="divider"></div>

        <!-- توضیح -->
        <p class="desc">
            <i class="fas fa-rocket"></i> استودیوی <strong>Zerox</strong> با ایده‌های تازه و 
            بازیسازی حرفه‌ای، مرزهای سرگرمی رو جابه‌جا میکنه. 
            <i class="fas fa-fire"></i>
        </p>

        <!-- ویژگی‌ها -->
        <div class="features-grid">
            <div class="feature-item">
                <i class="fas fa-cubes"></i>
                <span>بازی‌سازی 3D</span>
            </div>
            <div class="feature-item">
                <i class="fas fa-paint-brush"></i>
                <span>طراحی هنری</span>
            </div>
            <div class="feature-item">
                <i class="fas fa-code"></i>
                <span>کدنویسی پیشرفته</span>
            </div>
            <div class="feature-item">
                <i class="fas fa-globe"></i>
                <span>انتشار جهانی</span>
            </div>
        </div>

        <!-- دکمه‌ها -->
        <div class="btn-group">
            <a href="#" class="btn btn-primary">
                <i class="fas fa-play"></i> پروژه‌ها
            </a>
            <a href="#" class="btn btn-outline">
                <i class="fas fa-users"></i> همکاری
            </a>
            <a href="#" class="btn btn-outline">
                <i class="fas fa-envelope"></i> تماس
            </a>
        </div>

        <div class="footer-note">
            <i class="fas fa-bolt"></i> Zerox Games · Since 2026 <i class="fas fa-bolt"></i>
        </div>
    </div>

    <!-- اسکریپت تولید ذرات -->
    <script>
        (function createParticles() {
            const container = document.getElementById('particlesContainer');
            const count = 45;
            for (let i = 0; i < count; i++) {
                const p = document.createElement('div');
                p.className = 'particle';
                const size = Math.random() * 5 + 2;
                p.style.width = size + 'px';
                p.style.height = size + 'px';
                p.style.left = Math.random() * 100 + '%';
                p.style.animationDuration = (Math.random() * 20 + 12) + 's';
                p.style.animationDelay = (Math.random() * 20) + 's';
                p.style.opacity = Math.random() * 0.5 + 0.2;
                const colors = ['#ffd700', '#ffaa00', '#ffdd44', '#ffb347'];
                p.style.background = colors[Math.floor(Math.random() * colors.length)];
                p.style.boxShadow = `0 0 ${size * 3}px ${p.style.background}`;
                container.appendChild(p);
            }
        })();
    </script>

</body>
</html>
