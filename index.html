<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Gaming Live | زنده‌ترین سایت گیمینگ</title>

    <link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@700;900&display=swap" rel="stylesheet" />
    <link href="https://fonts.googleapis.com/css2?family=Stedad&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css" />

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background: #0b0e1a;
            color: #e5e9f0;
            font-family: 'Stedad', sans-serif;
            padding: 20px;
            transition: 0.3s;
            min-height: 100vh;
        }

        body.light-mode {
            background: #f0f2f8;
            color: #1a1f2e;
        }

        h1,
        h2,
        h3,
        .heading {
            font-family: 'Vazirmatn', sans-serif;
            font-weight: 900;
            color: #f7c948;
            text-shadow: 0 0 20px rgba(247, 201, 72, 0.3);
        }

        p,
        .text {
            font-family: 'Stedad', sans-serif;
            font-size: 1.05rem;
            line-height: 1.9;
        }

        .container {
            max-width: 1300px;
            margin: 0 auto;
        }

        /* ====== هدر ====== */
        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 15px 0;
            border-bottom: 2px solid #f7c94855;
            flex-wrap: wrap;
            gap: 15px;
        }

        .logo i {
            font-size: 2.5rem;
            color: #f7c948;
            margin-left: 10px;
        }

        .logo span {
            font-family: 'Vazirmatn', sans-serif;
            font-weight: 900;
            font-size: 1.8rem;
            color: #fff;
        }

        .header-controls {
            display: flex;
            gap: 15px;
            align-items: center;
        }

        .header-controls button {
            background: #1f2742;
            border: none;
            color: #f7c948;
            font-size: 1.5rem;
            padding: 10px 16px;
            border-radius: 50px;
            cursor: pointer;
            transition: 0.3s;
        }

        .header-controls button:hover {
            transform: scale(1.1);
            background: #f7c948;
            color: #0b0e1a;
        }

        /* ====== هیرو با تایمر زنده ====== */
        .hero {
            background: linear-gradient(145deg, #141a2b, #1f2742);
            padding: 50px 30px;
            border-radius: 40px;
            margin: 30px 0;
            text-align: center;
            border: 1px solid #f7c94833;
            position: relative;
            overflow: hidden;
        }

        .hero .live-badge {
            position: absolute;
            top: 20px;
            right: 30px;
            background: #ff0040;
            padding: 8px 20px;
            border-radius: 50px;
            font-family: 'Vazirmatn', sans-serif;
            font-weight: 900;
            font-size: 0.9rem;
            animation: pulse-badge 1.5s infinite;
        }

        @keyframes pulse-badge {
            0%,
            100% {
                opacity: 1;
                transform: scale(1);
            }
            50% {
                opacity: 0.6;
                transform: scale(0.95);
            }
        }

        .hero .live-badge i {
            margin-left: 8px;
            animation: blink-dot 1s infinite;
        }

        @keyframes blink-dot {
            0%,
            100% {
                opacity: 1;
            }
            50% {
                opacity: 0;
            }
        }

        .hero h1 {
            font-size: 3.2rem;
        }

        .timer-box {
            background: #0b0e1a88;
            padding: 20px 40px;
            border-radius: 60px;
            display: inline-block;
            margin: 20px auto;
            border: 2px solid #f7c948;
        }

        .timer-box span {
            font-family: 'Vazirmatn', sans-serif;
            font-weight: 900;
            font-size: 3rem;
            color: #fff;
            min-width: 60px;
            display: inline-block;
        }

        .timer-box .colon {
            color: #f7c948;
            font-size: 2.5rem;
        }

        /* ====== گرید بازی‌ها ====== */
        .game-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
            gap: 25px;
            margin: 35px 0;
        }

        .game-card {
            background: #161e32;
            padding: 25px 15px;
            border-radius: 30px;
            text-align: center;
            border: 1px solid #f7c94822;
            transition: 0.4s;
            cursor: pointer;
            position: relative;
        }

        .game-card:hover {
            transform: translateY(-10px) scale(1.02);
            border-color: #f7c948;
            box-shadow: 0 15px 40px #f7c94833;
        }

        .game-card .online-dot {
            position: absolute;
            top: 15px;
            left: 20px;
            width: 12px;
            height: 12px;
            background: #4caf50;
            border-radius: 50%;
            animation: blink-dot 1.2s infinite;
        }

        .game-card i {
            font-size: 4rem;
            color: #f7c948;
            margin-bottom: 12px;
        }

        .game-card h3 {
            font-size: 1.5rem;
        }

        .game-card .players {
            font-size: 0.9rem;
            color: #aab2c9;
            margin-top: 8px;
        }

        .game-card .players i {
            font-size: 0.8rem;
            margin-left: 5px;
            color: #4caf50;
        }

        /* ====== چت زنده ====== */
        .chat-section {
            background: #101624;
            padding: 30px;
            border-radius: 40px;
            border: 1px solid #f7c94844;
            margin: 35px 0;
        }

        .chat-box {
            background: #0b0e1a;
            border-radius: 30px;
            padding: 20px;
            max-height: 300px;
            overflow-y: auto;
            margin: 20px 0;
            border: 1px solid #f7c94833;
        }

        .chat-box::-webkit-scrollbar {
            width: 6px;
        }
        .chat-box::-webkit-scrollbar-thumb {
            background: #f7c948;
            border-radius: 10px;
        }

        .chat-message {
            padding: 10px 18px;
            margin: 6px 0;
            background: #1a2340;
            border-radius: 20px;
            display: flex;
            align-items: center;
            gap: 12px;
            animation: slideIn 0.4s ease;
        }

        @keyframes slideIn {
            from {
                opacity: 0;
                transform: translateX(30px);
            }
            to {
                opacity: 1;
                transform: translateX(0);
            }
        }

        .chat-message .user {
            font-family: 'Vazirmatn', sans-serif;
            font-weight: 900;
            color: #f7c948;
            min-width: 80px;
        }

        .chat-message .time {
            font-size: 0.7rem;
            color: #888;
            margin-right: auto;
        }

        .chat-input-group {
            display: flex;
            gap: 12px;
            flex-wrap: wrap;
        }

        .chat-input-group input {
            flex: 1;
            padding: 14px 22px;
            border-radius: 60px;
            border: 2px solid #f7c94855;
            background: #0b0e1a;
            color: #fff;
            font-family: 'Stedad', sans-serif;
            font-size: 1rem;
            outline: none;
            transition: 0.3s;
            min-width: 150px;
        }

        .chat-input-group input:focus {
            border-color: #f7c948;
            box-shadow: 0 0 25px #f7c94844;
        }

        .chat-input-group button {
            background: #f7c948;
            color: #0b0e1a;
            border: none;
            padding: 14px 35px;
            border-radius: 60px;
            font-family: 'Vazirmatn', sans-serif;
            font-weight: 900;
            font-size: 1rem;
            cursor: pointer;
            transition: 0.3s;
        }

        .chat-input-group button:hover {
            transform: scale(1.05);
            box-shadow: 0 0 40px #f7c94888;
        }

        /* ====== نوتیفیکیشن ====== */
        .notification {
            position: fixed;
            bottom: 30px;
            left: 30px;
            background: #1f2742;
            padding: 18px 30px;
            border-radius: 60px;
            border-right: 6px solid #f7c948;
            box-shadow: 0 10px 40px #00000099;
            font-family: 'Vazirmatn', sans-serif;
            font-weight: 700;
            transform: translateX(-150%);
            transition: 0.6s cubic-bezier(0.34, 1.56, 0.64, 1);
            z-index: 999;
            display: flex;
            align-items: center;
            gap: 15px;
        }

        .notification.show {
            transform: translateX(0);
        }

        .notification i {
            font-size: 1.8rem;
            color: #f7c948;
        }

        /* ====== دکمه اسکرول به بالا ====== */
        .scroll-top {
            position: fixed;
            bottom: 100px;
            right: 30px;
            background: #f7c948;
            color: #0b0e1a;
            border: none;
            border-radius: 50%;
            width: 55px;
            height: 55px;
            font-size: 1.8rem;
            cursor: pointer;
            display: none;
            transition: 0.3s;
            box-shadow: 0 0 30px #f7c94866;
            z-index: 99;
        }

        .scroll-top:hover {
            transform: scale(1.1);
        }

        /* ====== ریسپانسیو ====== */
        @media (max-width: 768px) {
            .hero h1 {
                font-size: 2.2rem;
            }
            .timer-box span {
                font-size: 2rem;
                min-width: 40px;
            }
            .timer-box {
                padding: 15px 25px;
            }
            .chat-input-group input {
                min-width: 100%;
            }
            .chat-input-group button {
                width: 100%;
            }
        }
    </style>
</head>
<body>

    <!-- ====== نوتیفیکیشن ====== -->
    <div class="notification" id="notification">
        <i class="fas fa-bell"></i>
        <span id="notifText">🎮 یه بازیکن جدید وارد شد!</span>
    </div>

    <!-- ====== دکمه اسکرول ====== -->
    <button class="scroll-top" id="scrollTop"><i class="fas fa-chevron-up"></i></button>

    <div class="container">

        <!-- ====== هدر ====== -->
        <header>
            <div class="logo">
                <i class="fas fa-gamepad"></i>
                <span>GamingLive</span>
            </div>
            <div class="header-controls">
                <button id="themeToggle" title="تغییر تم">
                    <i class="fas fa-moon"></i>
                </button>
                <button id="notifToggle" title="نوتیفیکیشن تست">
                    <i class="fas fa-bell"></i>
                </button>
            </div>
        </header>

        <!-- ====== هیرو با تایمر ====== -->
        <section class="hero">
            <div class="live-badge">
                <i class="fas fa-circle"></i> زنده
            </div>
            <i class="fas fa-trophy" style="font-size: 4rem; color: #f7c948;"></i>
            <h1>مسابقه زنده <span style="color:#fff;">بازی روز</span></h1>
            <p style="font-size: 1.2rem;">تا شروع مسابقه وقت داری:</p>
            <div class="timer-box">
                <span id="hours">00</span>
                <span class="colon">:</span>
                <span id="minutes">05</span>
                <span class="colon">:</span>
                <span id="seconds">00</span>
            </div>
            <div>
                <button class="btn" style="background:#f7c948; color:#0b0e1a; border:none; padding:14px 40px; border-radius:60px; font-family:'Vazirmatn'; font-weight:900; font-size:1.1rem; cursor:pointer; margin-top:15px;" onclick="resetTimer()">
                    <i class="fas fa-rotate"></i> ریست تایمر
                </button>
            </div>
        </section>

        <!-- ====== بازی‌ها ====== -->
        <h2><i class="fas fa-fire" style="margin-left:15px; color:#f7c948;"></i>بازی‌های آنلاین</h2>
        <div class="game-grid" id="gameGrid">
            <!-- توسط JS پر میشه -->
        </div>

        <!-- ====== چت زنده ====== -->
        <section class="chat-section">
            <h2><i class="fas fa-comments" style="margin-left:15px;"></i>چت زنده گیمینگ</h2>
            <div class="chat-box" id="chatBox">
                <!-- پیام‌ها اینجا میاد -->
            </div>
            <div class="chat-input-group">
                <input type="text" id="chatInput" placeholder="پیامتو بزن..." />
                <button id="sendChat"><i class="fas fa-paper-plane"></i> بفرست</button>
            </div>
        </section>

        <!-- ====== فوتر ====== -->
        <footer style="text-align:center; padding:30px 0; border-top:1px solid #f7c94833; margin-top:30px;">
            <p style="font-family:'Vazirmatn';">
                <i class="fas fa-crown" style="color:#f7c948;"></i>
                ساخته شده با <i class="fas fa-heart" style="color:#ff4477;"></i> برای گیمرها
            </p>
        </footer>

    </div>

    <script>
        // =============================================
        // ۱. تایمر معکوس زنده (همیشه آپدیت میشه)
        // =============================================
        let totalSeconds = 300; // ۵ دقیقه

        function updateTimer() {
            if (totalSeconds <= 0) {
                document.getElementById('hours').textContent = '00';
                document.getElementById('minutes').textContent = '00';
                document.getElementById('seconds').textContent = '00';
                // نوتیفیکیشن وقت تمام
                showNotification('⏰ وقت مسابقه تموم شد!');
                return;
            }
            const hrs = Math.floor(totalSeconds / 3600);
            const mins = Math.floor((totalSeconds % 3600) / 60);
            const secs = totalSeconds % 60;

            document.getElementById('hours').textContent = String(hrs).padStart(2, '0');
            document.getElementById('minutes').textContent = String(mins).padStart(2, '0');
            document.getElementById('seconds').textContent = String(secs).padStart(2, '0');

            totalSeconds--;
        }

        // ریست تایمر
        function resetTimer() {
            totalSeconds = 300;
            showNotification('🔄 تایمر ریست شد! ۵ دقیقه وقت داری.');
        }

        // اجرای تایمر هر ۱ ثانیه
        setInterval(updateTimer, 1000);
        updateTimer();

        // =============================================
        // ۲. لیست بازی‌ها (با تعداد آنلاین تصادفی)
        // =============================================
        const games = [
            { name: 'Cyberpunk 2077', icon: 'fa-robot' },
            { name: 'God of War', icon: 'fa-hat-wizard' },
            { name: 'FIFA 24', icon: 'fa-futbol' },
            { name: 'Call of Duty', icon: 'fa-crosshairs' },
            { name: 'Minecraft', icon: 'fa-cubes' },
            { name: 'Fortnite', icon: 'fa-bolt' }
        ];

        const grid = document.getElementById('gameGrid');

        function renderGames() {
            grid.innerHTML = '';
            games.forEach(game => {
                const players = Math.floor(Math.random() * 500) + 50;
                const card = document.createElement('div');
                card.className = 'game-card';
                card.innerHTML = `
                    <div class="online-dot"></div>
                    <i class="fas ${game.icon}"></i>
                    <h3>${game.name}</h3>
                    <div class="players">
                        <i class="fas fa-user"></i> ${players} نفر آنلاین
                    </div>
                `;
                // کلیک روی کارت
                card.addEventListener('click', () => {
                    showNotification(`🎮 وارد بازی ${game.name} شدی!`);
                });
                grid.appendChild(card);
            });
        }

        renderGames();

        // بروزرسانی تعداد بازیکنان هر ۵ ثانیه
        setInterval(() => {
            const allCards = document.querySelectorAll('.game-card .players');
            allCards.forEach((p, index) => {
                const newCount = Math.floor(Math.random() * 500) + 50;
                p.innerHTML = `<i class="fas fa-user"></i> ${newCount} نفر آنلاین`;
            });
        }, 5000);

        // =============================================
        // ۳. چت زنده (با ذخیره تاریخچه)
        // =============================================
        const chatBox = document.getElementById('chatBox');
        const chatInput = document.getElementById('chatInput');
        const sendBtn = document.getElementById('sendChat');

        const users = ['🎮 علی', '🔥 سارا', '⚡ رضا', '🕹️ نیما', '💪 مریم'];

        function addChatMessage(user, text) {
            const div = document.createElement('div');
            div.className = 'chat-message';
            const now = new Date();
            const time = now.getHours().toString().padStart(2, '0') + ':' + now.getMinutes().toString().padStart(2, '0');
            div.innerHTML = `
                <span class="user">${user}</span>
                <span>${text}</span>
                <span class="time">${time}</span>
            `;
            chatBox.appendChild(div);
            chatBox.scrollTop = chatBox.scrollHeight;
        }

        // پیام‌های اولیه
        addChatMessage('🤖 سیستم', 'به چت زنده خوش اومدی!');
        addChatMessage('🎮 علی', 'چه خبر بچه‌ها؟');

        // ارسال پیام
        function sendMessage() {
            const text = chatInput.value.trim();
            if (!text) return;
            const randomUser = users[Math.floor(Math.random() * users.length)];
            addChatMessage(randomUser, text);
            chatInput.value = '';
            // نوتیفیکیشن برای پیام جدید
            showNotification(`💬 ${randomUser}: ${text.substring(0, 20)}${text.length > 20 ? '...' : ''}`);
        }

        sendBtn.addEventListener('click', sendMessage);
        chatInput.addEventListener('keypress', (e) => {
            if (e.key === 'Enter') sendMessage();
        });

        // پیام‌های تصادفی هر ۸ ثانیه (شبیه‌سازی کاربران واقعی)
        const randomMessages = [
            'چقد این بازی قشنگه!', 'کسی آنلاینه؟', 'بیایید تیم بزنیم',
            'بهترین بازی تاریخ', 'من تازه وارد شدم', 'چه خبر؟',
            'این سایت خفنه والا', 'کی میاد کالاف؟', 'فورتنایت رایگان شد؟'
        ];

        setInterval(() => {
            const msg = randomMessages[Math.floor(Math.random() * randomMessages.length)];
            const user = users[Math.floor(Math.random() * users.length)];
            addChatMessage(user, msg);
            showNotification(`💬 ${user}: ${msg}`);
        }, 8000);

        // =============================================
        // ۴. نوتیفیکیشن پاپ‌آپ
        // =============================================
        const notifEl = document.getElementById('notification');
        const notifText = document.getElementById('notifText');
        let notifTimeout = null;

        function showNotification(text) {
            notifText.textContent = text;
            notifEl.classList.add('show');
            clearTimeout(notifTimeout);
            notifTimeout = setTimeout(() => {
                notifEl.classList.remove('show');
            }, 4000);
        }

        // دکمه تست نوتیفیکیشن
        document.getElementById('notifToggle').addEventListener('click', () => {
            const msgs = ['🎯 یه کیل جدید ثبت شد!', '🔥 ۱۰۰ نفر آنلاین شدن!', '💎 جایزه گرفتی!'];
            showNotification(msgs[Math.floor(Math.random() * msgs.length)]);
        });

        // =============================================
        // ۵. دارک/لایت مود
        // =============================================
        let isDark = true;
        document.getElementById('themeToggle').addEventListener('click', () => {
            document.body.classList.toggle('light-mode');
            isDark = !isDark;
            document.getElementById('themeToggle').innerHTML = isDark ?
                '<i class="fas fa-moon"></i>' :
                '<i class="fas fa-sun"></i>';
            showNotification(isDark ? '🌙 حالت شب' : '☀️ حالت روز');
        });

        // =============================================
        // ۶. دکمه اسکرول به بالا
        // =============================================
        const scrollBtn = document.getElementById('scrollTop');
        window.addEventListener('scroll', () => {
            if (window.scrollY > 500) {
                scrollBtn.style.display = 'block';
            } else {
                scrollBtn.style.display = 'none';
            }
        });

        scrollBtn.addEventListener('click', () => {
            window.scrollTo({ top: 0, behavior: 'smooth' });
        });

        // =============================================
        // ۷. نوتیفیکیشن خوش‌آمدگویی بعد از ۲ ثانیه
        // =============================================
        setTimeout(() => {
            showNotification('🎮 به GamingLive خوش اومدی!');
        }, 2000);
    </script>

</body>
</html>
