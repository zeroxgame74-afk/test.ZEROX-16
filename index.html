<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>صفحه خفن انیمیشنی</title>

    <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/rastikerdar/vazirmatn@v33.003/Vazirmatn-font-face.css" />
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css" />

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Vazirmatn', sans-serif;
            background: linear-gradient(135deg, #0f0c29, #302b63, #24243e);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
            overflow-x: hidden;
        }

        /* ===== انیمیشن پس‌زمینه ===== */
        .bg-animation {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 0;
            overflow: hidden;
            pointer-events: none;
        }

        .bg-animation span {
            position: absolute;
            display: block;
            width: 40px;
            height: 40px;
            background: rgba(255, 215, 0, 0.05);
            border-radius: 50%;
            animation: floatBg 15s infinite linear;
            bottom: -100px;
        }

        .bg-animation span:nth-child(1) {
            left: 10%;
            animation-duration: 18s;
            animation-delay: 0s;
            width: 60px;
            height: 60px;
        }
        .bg-animation span:nth-child(2) {
            left: 25%;
            animation-duration: 22s;
            animation-delay: 2s;
            width: 30px;
            height: 30px;
        }
        .bg-animation span:nth-child(3) {
            left: 45%;
            animation-duration: 20s;
            animation-delay: 4s;
            width: 80px;
            height: 80px;
        }
        .bg-animation span:nth-child(4) {
            left: 65%;
            animation-duration: 25s;
            animation-delay: 1s;
            width: 45px;
            height: 45px;
        }
        .bg-animation span:nth-child(5) {
            left: 85%;
            animation-duration: 19s;
            animation-delay: 3s;
            width: 55px;
            height: 55px;
        }
        .bg-animation span:nth-child(6) {
            left: 50%;
            animation-duration: 23s;
            animation-delay: 5s;
            width: 35px;
            height: 35px;
        }

        @keyframes floatBg {
            0% {
                transform: translateY(0) rotate(0deg) scale(1);
                opacity: 0;
            }
            10% {
                opacity: 1;
            }
            90% {
                opacity: 1;
            }
            100% {
                transform: translateY(-110vh) rotate(720deg) scale(1.5);
                opacity: 0;
            }
        }

        /* ===== کارت اصلی ===== */
        .hero {
            position: relative;
            z-index: 1;
            background: rgba(255, 255, 255, 0.05);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 1px solid rgba(255, 255, 255, 0.08);
            border-radius: 40px;
            padding: 60px 50px;
            max-width: 750px;
            width: 100%;
            text-align: center;
            box-shadow: 0 30px 80px rgba(0, 0, 0, 0.6);
            animation: fadeInUp 0.8s ease forwards;
            opacity: 0;
        }

        @keyframes fadeInUp {
            0% {
                opacity: 0;
                transform: translateY(60px) scale(0.95);
            }
            100% {
                opacity: 1;
                transform: translateY(0) scale(1);
            }
        }

        /* ===== آواتار با انیمیشن چرخش ===== */
        .avatar {
            width: 110px;
            height: 110px;
            background: linear-gradient(145deg, #f7971e, #ffd200);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0 auto 20px;
            font-size: 52px;
            color: #1a1a2e;
            box-shadow: 0 15px 50px rgba(255, 210, 0, 0.3);
            animation: floatAvatar 3s ease-in-out infinite, pulseGlow 2s ease-in-out infinite;
            transition: 0.3s;
        }

        .avatar:hover {
            animation-play-state: paused;
            transform: scale(1.1) rotate(10deg);
        }

        @keyframes floatAvatar {
            0%,
            100% {
                transform: translateY(0);
            }
            50% {
                transform: translateY(-12px);
            }
        }

        @keyframes pulseGlow {
            0%,
            100% {
                box-shadow: 0 15px 50px rgba(255, 210, 0, 0.3);
            }
            50% {
                box-shadow: 0 20px 70px rgba(255, 210, 0, 0.6);
            }
        }

        /* ===== برچسب با انیمیشن چشمک ===== */
        .badge {
            display: inline-block;
            background: rgba(255, 255, 255, 0.08);
            padding: 6px 22px;
            border-radius: 50px;
            font-size: 13px;
            color: #ddd;
            border: 1px solid rgba(255, 255, 255, 0.06);
            margin-bottom: 16px;
            animation: blinkBadge 2s ease-in-out infinite;
        }

        @keyframes blinkBadge {
            0%,
            100% {
                opacity: 1;
            }
            50% {
                opacity: 0.4;
            }
        }

        .badge i {
            color: #ffd700;
            margin-left: 6px;
            animation: spinIcon 4s linear infinite;
        }

        @keyframes spinIcon {
            0% {
                transform: rotate(0deg);
            }
            100% {
                transform: rotate(360deg);
            }
        }

        /* ===== عنوان با انیمیشن گرادیانت متحرک ===== */
        h1 {
            font-size: 44px;
            font-weight: 900;
            color: #fff;
            margin-bottom: 12px;
            line-height: 1.2;
            animation: slideTitle 1s ease 0.3s both;
        }

        @keyframes slideTitle {
            0% {
                opacity: 0;
                transform: translateX(-30px);
            }
            100% {
                opacity: 1;
                transform: translateX(0);
            }
        }

        h1 span {
            background: linear-gradient(90deg, #f7971e, #ffd700, #f7971e);
            background-size: 300% 100%;
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            animation: gradientMove 3s ease-in-out infinite;
        }

        @keyframes gradientMove {
            0% {
                background-position: 0% 50%;
            }
            50% {
                background-position: 100% 50%;
            }
            100% {
                background-position: 0% 50%;
            }
        }

        /* ===== زیرنویس ===== */
        .subtitle {
            font-size: 18px;
            color: rgba(255, 255, 255, 0.65);
            line-height: 1.9;
            margin-bottom: 30px;
            animation: fadeInUp 1s ease 0.5s both;
        }

        .subtitle i {
            animation: pulseIcon 1.5s ease-in-out infinite;
        }

        @keyframes pulseIcon {
            0%,
            100% {
                transform: scale(1);
            }
            50% {
                transform: scale(1.3);
                color: #ffd700;
            }
        }

        /* ===== دکمه‌ها با انیمیشن ===== */
        .btn-group {
            display: flex;
            flex-wrap: wrap;
            gap: 14px;
            justify-content: center;
            margin-bottom: 35px;
            animation: fadeInUp 1s ease 0.7s both;
        }

        .btn {
            padding: 14px 34px;
            border-radius: 60px;
            text-decoration: none;
            font-weight: 700;
            font-size: 16px;
            display: inline-flex;
            align-items: center;
            gap: 10px;
            border: none;
            cursor: pointer;
            transition: 0.3s ease;
            position: relative;
            overflow: hidden;
        }

        .btn-primary {
            background: linear-gradient(135deg, #f7971e, #ffd700);
            color: #1a1a2e;
            box-shadow: 0 8px 30px rgba(255, 210, 0, 0.25);
            animation: btnPulse 2s ease-in-out infinite;
        }

        @keyframes btnPulse {
            0%,
            100% {
                box-shadow: 0 8px 30px rgba(255, 210, 0, 0.25);
            }
            50% {
                box-shadow: 0 8px 50px rgba(255, 210, 0, 0.55);
            }
        }

        .btn-primary:hover {
            transform: scale(1.08) translateY(-3px);
            box-shadow: 0 12px 55px rgba(255, 210, 0, 0.7);
            animation-play-state: paused;
        }

        .btn-secondary {
            background: rgba(255, 255, 255, 0.06);
            color: #fff;
            border: 1px solid rgba(255, 255, 255, 0.12);
            backdrop-filter: blur(10px);
        }

        .btn-secondary:hover {
            background: rgba(255, 255, 255, 0.16);
            transform: scale(1.06) translateY(-3px);
        }

        /* انیمیشن موج روی دکمه */
        .btn::after {
            content: '';
            position: absolute;
            top: -50%;
            left: -50%;
            width: 200%;
            height: 200%;
            background: radial-gradient(circle, rgba(255, 255, 255, 0.2) 0%, transparent 70%);
            opacity: 0;
            transition: 0.5s;
            transform: scale(0);
        }

        .btn:hover::after {
            opacity: 1;
            transform: scale(1);
            animation: rippleWave 0.8s ease-out;
        }

        @keyframes rippleWave {
            0% {
                transform: scale(0);
                opacity: 0.8;
            }
            100% {
                transform: scale(2);
                opacity: 0;
            }
        }

        /* ===== ویژگی‌ها با انیمیشن ===== */
        .features {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(140px, 1fr));
            gap: 14px;
            margin: 25px 0 30px;
            animation: fadeInUp 1s ease 0.9s both;
        }

        .feature-item {
            background: rgba(255, 255, 255, 0.03);
            padding: 14px 10px;
            border-radius: 16px;
            color: rgba(255, 255, 255, 0.75);
            font-size: 14px;
            font-weight: 600;
            border: 1px solid rgba(255, 255, 255, 0.04);
            transition: 0.4s ease;
            animation: featureSlide 0.8s ease both;
            animation-delay: calc(0.2s * var(--i, 0));
        }

        .feature-item:nth-child(1) {
            --i: 1;
        }
        .feature-item:nth-child(2) {
            --i: 2;
        }
        .feature-item:nth-child(3) {
            --i: 3;
        }
        .feature-item:nth-child(4) {
            --i: 4;
        }

        @keyframes featureSlide {
            0% {
                opacity: 0;
                transform: translateY(30px) scale(0.9);
            }
            100% {
                opacity: 1;
                transform: translateY(0) scale(1);
            }
        }

        .feature-item:hover {
            background: rgba(255, 215, 0, 0.08);
            transform: translateY(-6px) scale(1.03);
            border-color: rgba(255, 215, 0, 0.2);
            box-shadow: 0 10px 30px rgba(255, 215, 0, 0.05);
        }

        .feature-item i {
            color: #ffd700;
            margin-left: 6px;
            animation: pulseIcon 2s ease-in-out infinite;
        }

        /* ===== شبکه اجتماعی با انیمیشن ===== */
        .social-row {
            display: flex;
            justify-content: center;
            gap: 18px;
            flex-wrap: wrap;
            padding-top: 20px;
            border-top: 1px solid rgba(255, 255, 255, 0.06);
            animation: fadeInUp 1s ease 1.1s both;
        }

        .social-row a {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            width: 50px;
            height: 50px;
            border-radius: 50%;
            background: rgba(255, 255, 255, 0.04);
            color: rgba(255, 255, 255, 0.5);
            font-size: 22px;
            border: 1px solid rgba(255, 255, 255, 0.04);
            text-decoration: none;
            transition: 0.4s ease;
            animation: socialPop 0.6s ease both;
            animation-delay: calc(0.1s * var(--s, 0));
        }

        .social-row a:nth-child(1) {
            --s: 1;
        }
        .social-row a:nth-child(2) {
            --s: 2;
        }
        .social-row a:nth-child(3) {
            --s: 3;
        }
        .social-row a:nth-child(4) {
            --s: 4;
        }
        .social-row a:nth-child(5) {
            --s: 5;
        }

        @keyframes socialPop {
            0% {
                opacity: 0;
                transform: scale(0) rotate(-180deg);
            }
            100% {
                opacity: 1;
                transform: scale(1) rotate(0deg);
            }
        }

        .social-row a:hover {
            background: rgba(255, 215, 0, 0.15);
            color: #ffd700;
            transform: translateY(-6px) scale(1.12);
            border-color: rgba(255, 215, 0, 0.25);
            box-shadow: 0 8px 25px rgba(255, 215, 0, 0.15);
        }

        /* ===== ریسپانسیو ===== */
        @media (max-width: 600px) {
            .hero {
                padding: 35px 20px;
                border-radius: 28px;
            }
            h1 {
                font-size: 28px;
            }
            .btn {
                padding: 12px 24px;
                font-size: 14px;
            }
            .features {
                grid-template-columns: 1fr 1fr;
            }
            .avatar {
                width: 80px;
                height: 80px;
                font-size: 38px;
            }
        }
    </style>
</head>
<body>

    <!-- ===== پس‌زمینه متحرک ===== -->
    <div class="bg-animation">
        <span></span><span></span><span></span>
        <span></span><span></span><span></span>
    </div>

    <!-- ===== کارت اصلی ===== -->
    <div class="hero">

        <div class="avatar">
            <i class="fa-solid fa-bolt"></i>
        </div>

        <div class="badge">
            <i class="fa-solid fa-circle-check"></i> نسخه 3.0
        </div>

        <h1>
            سلام، من <span>توسعه‌دهنده</span> ام
        </h1>

        <p class="subtitle">
            <i class="fa-solid fa-code"></i>
            طراحی UI/UX ، توسعه فرانت‌اند و ساخت تجربه‌های دیجیتال خفن
        </p>

        <div class="btn-group">
            <a href="#" class="btn btn-primary">
                <i class="fa-solid fa-rocket"></i> شروع کنید
            </a>
            <a href="#" class="btn btn-secondary">
                <i class="fa-regular fa-eye"></i> نمونه کارها
            </a>
        </div>

        <div class="features">
            <div class="feature-item">
                <i class="fa-solid fa-palette"></i> طراحی مدرن
            </div>
            <div class="feature-item">
                <i class="fa-solid fa-bolt"></i> فوق‌العاده سریع
            </div>
            <div class="feature-item">
                <i class="fa-solid fa-mobile-screen"></i> واکنش‌گرا
            </div>
            <div class="feature-item">
                <i class="fa-regular fa-heart"></i> با عشق
            </div>
        </div>

        <div class="social-row">
            <a href="#"><i class="fa-brands fa-github"></i></a>
            <a href="#"><i class="fa-brands fa-linkedin-in"></i></a>
            <a href="#"><i class="fa-brands fa-x-twitter"></i></a>
            <a href="#"><i class="fa-brands fa-instagram"></i></a>
            <a href="#"><i class="fa-brands fa-youtube"></i></a>
        </div>

    </div>

</body>
</html>
