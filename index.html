<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>پَرگار · نقشه‌ذهنی هوشمند</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
  <link href="https://cdn.jsdelivr.net/gh/rastikerdar/vazir-font@v30.1.0/dist/font-face.css" rel="stylesheet" type="text/css" />
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: 'Vazir', 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    }

    body {
      background-color: #E93625;
      color: #FFFFFF;
      transition: background 0.2s, color 0.2s;
      padding: 16px 12px 90px 12px;
      min-height: 100vh;
    }

    /* حالت شب (با رنگ‌های تیره‌تر پرتقالی) */
    body.dark {
      background-color: #7A1A0F;
      color: #FFFFFF;
    }
    body.dark .card {
      background: #A8281A;
      box-shadow: 0 8px 20px rgba(0,0,0,0.4);
    }
    body.dark .input-group input,
    body.dark .input-group textarea,
    body.dark .input-group select {
      background: #C93520;
      color: #FFFFFF;
      border-color: #E93625;
    }
    body.dark .progress-ring-bg {
      stroke: #C93520;
    }
    body.dark .chip {
      background: #C93520;
      color: #FFFFFF;
    }
    body.dark .tab-btn {
      background: #A8281A;
      color: #FFD6CC;
    }
    body.dark .tab-btn.active {
      background: #FFFFFF;
      color: #E93625;
    }
    body.dark .footer {
      background: #7A1A0F;
      border-top: 1px solid #A8281A;
    }
    body.dark .goal-badge {
      background: #C93520;
      color: #FFFFFF;
    }
    body.dark .mind-node {
      background: #C93520;
      border-color: #E93625;
      color: #FFFFFF;
    }
    body.dark .matrix-cell {
      background: #A8281A;
      border-color: #C93520;
    }
    body.dark .task-item {
      border-bottom-color: #C93520;
    }
    body.dark .header {
      border-bottom-color: #C93520;
    }
    body.dark .goal-item {
      border-bottom-color: #C93520;
    }

    .container {
      max-width: 500px;
      margin: 0 auto;
    }

    .header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 20px;
      padding-bottom: 8px;
      border-bottom: 2px solid rgba(255,255,255,0.2);
    }

    .logo {
      display: flex;
      align-items: center;
      gap: 8px;
      font-size: 1.7rem;
      font-weight: 700;
      letter-spacing: -0.5px;
    }
    .logo i {
      color: #FFFFFF;
      font-size: 2rem;
    }
    .logo span {
      color: #FFFFFF;
      -webkit-text-fill-color: #FFFFFF;
    }

    .theme-toggle {
      background: rgba(255,255,255,0.15);
      border: none;
      font-size: 1.6rem;
      color: #FFFFFF;
      cursor: pointer;
      padding: 6px 12px;
      border-radius: 30px;
      transition: 0.2s;
    }
    .theme-toggle:hover {
      background: rgba(255,255,255,0.25);
    }

    .card {
      background: rgba(255,255,255,0.15);
      backdrop-filter: blur(10px);
      border-radius: 28px;
      padding: 20px 18px;
      margin-bottom: 20px;
      transition: 0.2s;
      border: 1px solid rgba(255,255,255,0.1);
    }
    .card-title {
      font-weight: 700;
      font-size: 1.2rem;
      display: flex;
      align-items: center;
      gap: 8px;
      margin-bottom: 14px;
      color: #FFFFFF;
    }
    .card-title i {
      color: #FFFFFF;
      width: 26px;
      text-align: center;
    }

    .circle-progress-wrap {
      display: flex;
      flex-direction: column;
      align-items: center;
      margin: 6px 0 10px;
    }
    .progress-ring {
      transform: rotate(-90deg);
      width: 120px;
      height: 120px;
    }
    .progress-ring-bg {
      fill: none;
      stroke: rgba(255,255,255,0.3);
      stroke-width: 8;
    }
    .progress-ring-fg {
      fill: none;
      stroke: #FFFFFF;
      stroke-width: 8;
      stroke-linecap: round;
      stroke-dasharray: 314.159;
      stroke-dashoffset: 314.159;
      transition: stroke-dashoffset 0.4s ease;
    }
    .progress-label {
      margin-top: 6px;
      font-weight: 700;
      font-size: 1.1rem;
      color: #FFFFFF;
    }
    .progress-sub {
      font-size: 0.8rem;
      opacity: 0.8;
      color: #FFFFFF;
    }

    .goal-badge {
      display: inline-block;
      background: rgba(255,255,255,0.2);
      color: #FFFFFF;
      padding: 6px 14px;
      border-radius: 30px;
      font-size: 0.8rem;
      font-weight: 700;
      margin: 4px 4px 4px 0;
    }

    .goal-item {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 8px 0;
      border-bottom: 1px solid rgba(255,255,255,0.1);
    }
    .goal-item:last-child {
      border-bottom: none;
    }
    .goal-text {
      font-weight: 500;
      font-size: 0.95rem;
      color: #FFFFFF;
    }
    .goal-type {
      font-size: 0.7rem;
      background: rgba(255,255,255,0.15);
      padding: 3px 10px;
      border-radius: 50px;
      color: #FFFFFF;
    }

    .matrix-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 8px;
      margin: 12px 0 6px;
    }
    .matrix-cell {
      background: rgba(255,255,255,0.12);
      border-radius: 16px;
      padding: 10px 6px;
      text-align: center;
      font-size: 0.75rem;
      font-weight: 600;
      border: 1px solid rgba(255,255,255,0.08);
      color: #FFFFFF;
    }
    .matrix-cell i {
      display: block;
      font-size: 1.4rem;
      margin-bottom: 4px;
      color: #FFFFFF;
    }
    .matrix-cell .task-count {
      background: #FFFFFF;
      color: #E93625;
      border-radius: 50px;
      padding: 0 10px;
      font-size: 0.7rem;
      display: inline-block;
      font-weight: 700;
    }

    .input-group {
      display: flex;
      gap: 8px;
      margin: 10px 0;
      flex-wrap: wrap;
    }
    .input-group input, 
    .input-group textarea,
    .input-group select {
      flex: 1;
      min-width: 140px;
      padding: 10px 14px;
      border-radius: 40px;
      border: 1px solid rgba(255,255,255,0.2);
      background: rgba(255,255,255,0.1);
      color: #FFFFFF;
      font-size: 0.9rem;
      outline: none;
      transition: 0.15s;
    }
    .input-group input::placeholder,
    .input-group textarea::placeholder {
      color: rgba(255,255,255,0.6);
    }
    .input-group input:focus,
    .input-group textarea:focus {
      border-color: #FFFFFF;
      box-shadow: 0 0 0 3px rgba(255,255,255,0.2);
    }
    .input-group select option {
      background: #E93625;
      color: #FFFFFF;
    }
    .input-group button {
      background: #FFFFFF;
      border: none;
      color: #E93625;
      padding: 0 22px;
      border-radius: 40px;
      font-weight: 700;
      font-size: 0.9rem;
      cursor: pointer;
      transition: 0.15s;
      display: flex;
      align-items: center;
      gap: 6px;
    }
    .input-group button:hover {
      background: #f0f0f0;
      transform: scale(0.97);
    }
    .input-group button i {
      font-size: 1rem;
    }

    .task-list {
      margin: 12px 0 4px;
    }
    .task-item {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 8px 4px;
      border-bottom: 1px solid rgba(255,255,255,0.08);
      font-size: 0.9rem;
      color: #FFFFFF;
    }
    .task-item .task-text {
      display: flex;
      align-items: center;
      gap: 10px;
    }
    .task-item .task-text i {
      color: #FFFFFF;
      width: 20px;
      cursor: pointer;
    }
    .task-item .task-actions i {
      margin: 0 4px;
      color: rgba(255,255,255,0.5);
      cursor: pointer;
      transition: 0.1s;
    }
    .task-item .task-actions i:hover {
      color: #FFFFFF;
    }
    .task-done .task-text span {
      text-decoration: line-through;
      opacity: 0.5;
    }

    .mindmap-preview {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
      justify-content: center;
      margin: 12px 0 4px;
    }
    .mind-node {
      background: rgba(255,255,255,0.15);
      padding: 10px 16px;
      border-radius: 40px;
      font-weight: 600;
      font-size: 0.85rem;
      border: 1px solid rgba(255,255,255,0.1);
      display: flex;
      align-items: center;
      gap: 6px;
      color: #FFFFFF;
    }
    .mind-node i {
      color: #FFFFFF;
    }

    .tab-bar {
      display: flex;
      gap: 8px;
      margin: 14px 0 8px;
      flex-wrap: wrap;
    }
    .tab-btn {
      background: rgba(255,255,255,0.1);
      border: none;
      padding: 8px 18px;
      border-radius: 40px;
      font-weight: 600;
      font-size: 0.8rem;
      color: rgba(255,255,255,0.7);
      cursor: pointer;
      transition: 0.1s;
      display: flex;
      align-items: center;
      gap: 6px;
    }
    .tab-btn.active {
      background: #FFFFFF;
      color: #E93625;
    }
    .tab-btn i {
      font-size: 0.9rem;
    }

    .stat-row {
      display: flex;
      justify-content: space-around;
      padding: 8px 0;
    }
    .stat-item {
      text-align: center;
    }
    .stat-item .num {
      font-size: 1.6rem;
      font-weight: 700;
      color: #FFFFFF;
    }
    .stat-item .label {
      font-size: 0.7rem;
      opacity: 0.7;
      color: #FFFFFF;
    }

    .footer {
      position: fixed;
      bottom: 0;
      right: 0;
      left: 0;
      background: rgba(233, 54, 37, 0.95);
      backdrop-filter: blur(10px);
      padding: 10px 16px 16px;
      border-top: 1px solid rgba(255,255,255,0.1);
      display: flex;
      justify-content: space-around;
      align-items: center;
      z-index: 10;
      max-width: 500px;
      margin: 0 auto;
    }
    body.dark .footer {
      background: rgba(122, 26, 15, 0.95);
    }
    .footer-item {
      display: flex;
      flex-direction: column;
      align-items: center;
      font-size: 0.65rem;
      opacity: 0.6;
      transition: 0.1s;
      cursor: default;
      gap: 2px;
      color: #FFFFFF;
    }
    .footer-item i {
      font-size: 1.5rem;
      color: #FFFFFF;
    }
    .footer-item.active {
      opacity: 1;
      font-weight: 700;
    }

    @media (max-width: 480px) {
      .matrix-grid {
        gap: 6px;
      }
      .input-group input {
        min-width: 100px;
      }
    }

    ::-webkit-scrollbar {
      width: 6px;
    }
    ::-webkit-scrollbar-track {
      background: rgba(255,255,255,0.1);
    }
    ::-webkit-scrollbar-thumb {
      background: rgba(255,255,255,0.3);
      border-radius: 20px;
    }
  </style>
</head>
<body>
<div class="container" id="app">

  <div class="header">
    <div class="logo">
      <i class="fas fa-compass"></i>
      <span>پَرگار</span>
    </div>
    <button class="theme-toggle" id="themeToggle" aria-label="تغییر تم">
      <i class="fas fa-moon"></i>
    </button>
  </div>

  <div class="card">
    <div class="card-title"><i class="fas fa-chart-pie"></i> پیشرفت کلی</div>
    <div class="circle-progress-wrap">
      <svg class="progress-ring" viewBox="0 0 120 120">
        <circle class="progress-ring-bg" cx="60" cy="60" r="50" />
        <circle class="progress-ring-fg" id="progressCircle" cx="60" cy="60" r="50" />
      </svg>
      <div class="progress-label" id="progressPercent">۰٪</div>
      <div class="progress-sub">از اهداف کوتاه‌مدت</div>
    </div>
    <div style="display: flex; justify-content: center; gap: 14px; flex-wrap: wrap; margin-top: 4px;">
      <span class="goal-badge"><i class="fas fa-bullseye"></i> کوتاه: ۳</span>
      <span class="goal-badge"><i class="fas fa-flag"></i> بلند: ۲</span>
    </div>
  </div>

  <div class="card">
    <div class="card-title"><i class="fas fa-th-large"></i> اولویت‌بندی (آیزنهاور)</div>
    <div class="matrix-grid">
      <div class="matrix-cell"><i class="fas fa-exclamation-triangle"></i> فوری/مهم <span class="task-count" id="urgentImportantCount">۰</span></div>
      <div class="matrix-cell"><i class="fas fa-calendar-alt"></i> غیرفوری/مهم <span class="task-count" id="notUrgentImportantCount">۰</span></div>
      <div class="matrix-cell"><i class="fas fa-bolt"></i> فوری/غیرمهم <span class="task-count" id="urgentNotImportantCount">۰</span></div>
      <div class="matrix-cell"><i class="fas fa-trash-alt"></i> غیرفوری/غیرمهم <span class="task-count" id="notUrgentNotImportantCount">۰</span></div>
    </div>

    <div class="input-group">
      <input type="text" id="taskInput" placeholder="تسک جدید ..." />
      <select id="prioritySelect">
        <option value="urgent-important">فوری·مهم</option>
        <option value="noturgent-important">غیرفوری·مهم</option>
        <option value="urgent-notimportant">فوری·غیرمهم</option>
        <option value="noturgent-notimportant">غیرفوری·غیرمهم</option>
      </select>
      <button id="addTaskBtn"><i class="fas fa-plus"></i> افزودن</button>
    </div>

    <div class="task-list" id="taskListContainer">
      <div class="task-item"><div class="task-text"><i class="fas fa-circle" style="color:#FFFFFF;"></i><span>نمونه تسک</span></div><div class="task-actions"><i class="fas fa-check-circle" title="انجام شد"></i><i class="fas fa-trash" title="حذف"></i></div></div>
    </div>
  </div>

  <div class="card">
    <div class="card-title"><i class="fas fa-sitemap"></i> نقشه‌ذهنی · ایده‌ها</div>
    <div class="mindmap-preview" id="mindmapContainer">
      <span class="mind-node"><i class="fas fa-rocket"></i> هدف بزرگ</span>
      <span class="mind-node"><i class="fas fa-code"></i> فرعی ۱</span>
      <span class="mind-node"><i class="fas fa-paint-brush"></i> فرعی ۲</span>
      <span class="mind-node"><i class="fas fa-chart-line"></i> فرعی ۳</span>
    </div>
    <div class="input-group" style="margin-top: 10px;">
      <input type="text" id="mindInput" placeholder="ایده یا گام جدید ..." />
      <button id="addMindNodeBtn"><i class="fas fa-plus"></i></button>
    </div>
  </div>

  <div class="card">
    <div class="card-title"><i class="fas fa-chart-bar"></i> گزارش عملکرد</div>
    <div class="tab-bar">
      <button class="tab-btn active" data-period="week"><i class="fas fa-calendar-week"></i> هفته</button>
      <button class="tab-btn" data-period="month"><i class="fas fa-calendar-alt"></i> ماه</button>
    </div>
    <div class="stat-row" id="statsDisplay">
      <div class="stat-item"><div class="num" id="statTasks">۰</div><div class="label">تسک انجام‌شده</div></div>
      <div class="stat-item"><div class="num" id="statProgress">۰٪</div><div class="label">میانگین پیشرفت</div></div>
      <div class="stat-item"><div class="num" id="statGoals">۰</div><div class="label">اهداف فعال</div></div>
    </div>
  </div>

  <div class="footer">
    <div class="footer-item active"><i class="fas fa-location-dot"></i> <span>موقعیت</span></div>
    <div class="footer-item"><i class="fas fa-bell"></i> <span>یادآور</span></div>
    <div class="footer-item"><i class="fas fa-brain"></i> <span>ذهن</span></div>
    <div class="footer-item"><i class="fas fa-moon" id="footerMoon"></i> <span>شب</span></div>
  </div>
</div>

<script>
  (function() {
    let tasks = [
      { id: 1, text: 'طراحی اولیه پَرگار', priority: 'urgent-important', done: false },
      { id: 2, text: 'بررسی ماتریس آیزنهاور', priority: 'noturgent-important', done: false },
      { id: 3, text: 'مرور نقشه ذهنی', priority: 'urgent-notimportant', done: false },
    ];
    let mindNodes = ['هدف بزرگ', 'فرعی ۱', 'فرعی ۲', 'فرعی ۳'];
    let nextTaskId = 4;
    let currentPeriod = 'week';

    const taskListContainer = document.getElementById('taskListContainer');
    const taskInput = document.getElementById('taskInput');
    const prioritySelect = document.getElementById('prioritySelect');
    const addTaskBtn = document.getElementById('addTaskBtn');
    const mindInput = document.getElementById('mindInput');
    const addMindBtn = document.getElementById('addMindNodeBtn');
    const mindmapContainer = document.getElementById('mindmapContainer');
    const progressCircle = document.getElementById('progressCircle');
    const progressPercent = document.getElementById('progressPercent');
    const themeToggle = document.getElementById('themeToggle');

    const statTasks = document.getElementById('statTasks');
    const statProgress = document.getElementById('statProgress');
    const statGoals = document.getElementById('statGoals');

    const uiCounts = {
      urgentImportant: document.getElementById('urgentImportantCount'),
      notUrgentImportant: document.getElementById('notUrgentImportantCount'),
      urgentNotImportant: document.getElementById('urgentNotImportantCount'),
      notUrgentNotImportant: document.getElementById('notUrgentNotImportantCount'),
    };

    function getPriorityLabel(priority) {
      const map = {
        'urgent-important': 'فوری·مهم',
        'noturgent-important': 'غیرفوری·مهم',
        'urgent-notimportant': 'فوری·غیرمهم',
        'noturgent-notimportant': 'غیرفوری·غیرمهم'
      };
      return map[priority] || priority;
    }

    function calcProgress() {
      const total = tasks.length;
      if (total === 0) return 0;
      const done = tasks.filter(t => t.done).length;
      return Math.round((done / total) * 100);
    }

    function updateProgressCircle() {
      const percent = calcProgress();
      const circumference = 314.159;
      const offset = circumference - (percent / 100) * circumference;
      progressCircle.style.strokeDashoffset = offset;
      progressPercent.textContent = percent + '%';
    }

    function countTasksByPriority() {
      const counts = {
        'urgent-important': 0,
        'noturgent-important': 0,
        'urgent-notimportant': 0,
        'noturgent-notimportant': 0
      };
      tasks.forEach(t => {
        if (t.done) return;
        if (counts.hasOwnProperty(t.priority)) counts[t.priority]++;
      });
      return counts;
    }

    function renderTasks() {
      taskListContainer.innerHTML = '';
      tasks.forEach(task => {
        const div = document.createElement('div');
        div.className = `task-item${task.done ? ' task-done' : ''}`;
        const iconColor = task.done ? 'rgba(255,255,255,0.3)' : '#FFFFFF';
        div.innerHTML = `
          <div class="task-text">
            <i class="fas fa-circle" style="color:${iconColor};" data-taskid="${task.id}"></i>
            <span>${task.text}</span>
            <span style="font-size:0.6rem; background:rgba(255,255,255,0.15); padding:2px 8px; border-radius:30px; color:#FFFFFF;">${getPriorityLabel(task.priority)}</span>
          </div>
          <div class="task-actions">
            <i class="fas fa-check-circle" data-taskid="${task.id}" title="انجام/بازگشت"></i>
            <i class="fas fa-trash" data-taskid="${task.id}" title="حذف"></i>
          </div>
        `;
        taskListContainer.appendChild(div);
      });

      taskListContainer.querySelectorAll('.task-actions i.fa-check-circle').forEach(btn => {
        btn.addEventListener('click', function(e) {
          e.stopPropagation();
          const id = parseInt(this.dataset.taskid);
          toggleTaskDone(id);
        });
      });
      taskListContainer.querySelectorAll('.task-actions i.fa-trash').forEach(btn => {
        btn.addEventListener('click', function(e) {
          e.stopPropagation();
          const id = parseInt(this.dataset.taskid);
          deleteTask(id);
        });
      });
      taskListContainer.querySelectorAll('.task-text i.fa-circle').forEach(icon => {
        icon.addEventListener('click', function(e) {
          const id = parseInt(this.dataset.taskid);
          toggleTaskDone(id);
        });
      });

      const counts = countTasksByPriority();
      uiCounts.urgentImportant.textContent = counts['urgent-important'];
      uiCounts.notUrgentImportant.textContent = counts['noturgent-important'];
      uiCounts.urgentNotImportant.textContent = counts['urgent-notimportant'];
      uiCounts.notUrgentNotImportant.textContent = counts['noturgent-notimportant'];

      const doneTasks = tasks.filter(t => t.done).length;
      statTasks.textContent = doneTasks;
      const prog = calcProgress();
      statProgress.textContent = prog + '%';
      const activeGoals = tasks.filter(t => !t.done).length;
      statGoals.textContent = activeGoals;

      updateProgressCircle();
    }

    function addTask(text, priority) {
      if (!text.trim()) return;
      tasks.push({ id: nextTaskId++, text: text.trim(), priority: priority, done: false });
      renderTasks();
    }

    function deleteTask(id) {
      tasks = tasks.filter(t => t.id !== id);
      renderTasks();
    }

    function toggleTaskDone(id) {
      const task = tasks.find(t => t.id === id);
      if (task) {
        task.done = !task.done;
        renderTasks();
      }
    }

    function renderMindMap() {
      mindmapContainer.innerHTML = '';
      mindNodes.forEach(node => {
        const span = document.createElement('span');
        span.className = 'mind-node';
        span.innerHTML = `<i class="fas fa-circle-nodes"></i> ${node}`;
        mindmapContainer.appendChild(span);
      });
    }

    function addMindNode(text) {
      if (!text.trim()) return;
      mindNodes.push(text.trim());
      renderMindMap();
    }

    function toggleTheme() {
      document.body.classList.toggle('dark');
      const icon = themeToggle.querySelector('i');
      if (document.body.classList.contains('dark')) {
        icon.className = 'fas fa-sun';
      } else {
        icon.className = 'fas fa-moon';
      }
      const moonIcon = document.getElementById('footerMoon');
      if (document.body.classList.contains('dark')) {
        moonIcon.className = 'fas fa-sun';
      } else {
        moonIcon.className = 'fas fa-moon';
      }
    }

    addTaskBtn.addEventListener('click', function() {
      const text = taskInput.value.trim();
      const priority = prioritySelect.value;
      if (text) {
        addTask(text, priority);
        taskInput.value = '';
      }
    });

    taskInput.addEventListener('keypress', function(e) {
      if (e.key === 'Enter') {
        addTaskBtn.click();
      }
    });

    addMindBtn.addEventListener('click', function() {
      const text = mindInput.value.trim();
      if (text) {
        addMindNode(text);
        mindInput.value = '';
      }
    });
    mindInput.addEventListener('keypress', function(e) {
      if (e.key === 'Enter') {
        addMindBtn.click();
      }
    });

    themeToggle.addEventListener('click', toggleTheme);

    document.querySelectorAll('.tab-btn').forEach(btn => {
      btn.addEventListener('click', function() {
        document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
        this.classList.add('active');
        currentPeriod = this.dataset.period;
        const factor = currentPeriod === 'week' ? 1 : 4;
        const done = tasks.filter(t => t.done).length;
        statTasks.textContent = done * factor;
        statProgress.textContent = Math.min(100, calcProgress() * factor) + '%';
        statGoals.textContent = tasks.filter(t => !t.done).length * factor;
      });
    });

    document.getElementById('footerMoon').addEventListener('click', toggleTheme);

    renderTasks();
    renderMindMap();
    updateProgressCircle();

    if (tasks.length < 4) {
      tasks.push({ id: nextTaskId++, text: 'تنظیم یادآور موقعیت', priority: 'noturgent-important', done: false });
      renderTasks();
    }

    if (mindNodes.length === 0) {
      mindNodes = ['ایده اصلی', 'گام اول', 'گام دوم', 'بررسی'];
      renderMindMap();
    }

  })();
</script>
</body>
</html>
