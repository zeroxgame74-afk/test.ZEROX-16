<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=yes">
  <title>ZEROX STUDIOS | انیمیشن‌های خفن</title>
  <!-- ===== Font Awesome 6 (Free) ===== -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
  <style>
    /* ==================== RESET & BASE ==================== */
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      background: #0b0b0b;
      color: #f0f0f0;
      font-family: 'Vazirmatn', 'Segoe UI', Tahoma, sans-serif;
      line-height: 1.6;
      padding: 0 0 30px 0;
      background-image: radial-gradient(circle at 20% 30%, #1a1a2e 0%, #0b0b0b 80%);
      min-height: 100vh;
    }

    /* ==================== اسکرول باری خفن ==================== */
    ::-webkit-scrollbar {
      width: 10px;
      background: #1a1a2e;
    }
    ::-webkit-scrollbar-track {
      background: #0d0d1a;
      border-radius: 10px;
    }
    ::-webkit-scrollbar-thumb {
      background: linear-gradient(180deg, #ff5500, #ff8c00);
      border-radius: 10px;
      box-shadow: 0 0 15px #ff5500aa;
    }

    /* ==================== کانتینر ==================== */
    .container {
      max-width: 1200px;
      margin: 0 auto;
      padding: 0 16px;
    }

    /* ==================== هدر / لوگو ==================== */
    .header {
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 25px 0 15px 0;
      border-bottom: 2px solid #ff550033;
      margin-bottom: 25px;
      flex-wrap: wrap;
      gap: 12px;
    }
    .header img {
      height: 65px;
      filter: drop-shadow(0 0 20px #ff5500aa);
      transition: 0.3s;
    }
    .header img:hover {
      transform: scale(1.05);
      filter: drop-shadow(0 0 35px #ff8800);
    }
    .header h1 {
      font-size: 1.7rem;
      font-weight: 900;
      background: linear-gradient(135deg, #ff7b00, #ffcc00);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      text-shadow: 0 0 30px #ff550066;
      letter-spacing: 1px;
      margin-right: 8px;
    }
    .header .sub {
      font-size: 0.9rem;
      color: #bbbbbb;
      background: #1e1e2fcc;
      padding: 4px 18px;
      border-radius: 50px;
      border: 1px solid #ff550066;
      backdrop-filter: blur(4px);
    }

    /* ==================== کارت‌ها (عمومی) ==================== */
    .card-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
      gap: 24px;
      margin: 30px 0;
    }

    .card {
      background: #14141fdd;
      backdrop-filter: blur(8px);
      border: 1px solid #2a2a3f;
      border-radius: 28px;
      padding: 18px 16px 20px 16px;
      transition: 0.3s ease;
      box-shadow: 0 10px 30px -10px #000000aa;
      display: flex;
      flex-direction: column;
      position: relative;
      overflow: hidden;
    }
    .card::before {
      content: '';
      position: absolute;
      top: -50%;
      left: -50%;
      width: 200%;
      height: 200%;
      background: radial-gradient(circle at 30% 40%, #ff550022, transparent 70%);
      opacity: 0.3;
      pointer-events: none;
    }
    .card:hover {
      transform: translateY(-6px) scale(1.01);
      border-color: #ff7b00aa;
      box-shadow: 0 20px 40px -8px #ff550044;
    }

    .card img, .card .thumb {
      width: 100%;
      aspect-ratio: 16/9;
      object-fit: cover;
      border-radius: 18px;
      margin-bottom: 12px;
      background: #1e1e2e;
      border: 1px solid #2f2f4a;
      transition: 0.3s;
    }
    .card img:hover {
      filter: brightness(1.1);
    }

    .card .badge {
      display: inline-block;
      background: #ff5500cc;
      padding: 2px 14px;
      border-radius: 40px;
      font-size: 0.7rem;
      font-weight: 700;
      letter-spacing: 0.5px;
      color: #fff;
      width: fit-content;
      margin-bottom: 8px;
      backdrop-filter: blur(2px);
      border: 1px solid #ffaa00aa;
    }

    .card h3 {
      font-size: 1.2rem;
      margin: 6px 0 8px 0;
      color: #fff;
      font-weight: 800;
      line-height: 1.4;
    }
    .card p {
      color: #c0c0d0;
      font-size: 0.9rem;
      flex: 1;
    }
    .card .meta {
      display: flex;
      justify-content: space-between;
      font-size: 0.75rem;
      color: #8888aa;
      margin-top: 10px;
      border-top: 1px solid #2a2a44;
      padding-top: 10px;
    }
    .card .btn {
      background: linear-gradient(135deg, #ff5500, #ff8800);
      border: none;
      color: #fff;
      padding: 8px 18px;
      border-radius: 40px;
      font-weight: 700;
      margin-top: 12px;
      cursor: pointer;
      transition: 0.3s;
      text-align: center;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      font-size: 0.9rem;
      box-shadow: 0 4px 15px #ff550066;
      text-decoration: none;
      width: fit-content;
    }
    .card .btn i {
      font-size: 1rem;
    }
    .card .btn:hover {
      transform: scale(1.04);
      box-shadow: 0 6px 25px #ff8800aa;
      background: linear-gradient(135deg, #ff6600, #ffaa00);
    }

    /* ==================== بخش‌های خاص ==================== */
    .section-title {
      font-size: 1.8rem;
      font-weight: 900;
      margin: 45px 0 20px 0;
      display: flex;
      align-items: center;
      gap: 12px;
      border-right: 6px solid #ff7b00;
      padding-right: 18px;
      background: linear-gradient(135deg, #ffffff, #ffbb77);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }
    .section-title i {
      -webkit-text-fill-color: initial;
      color: #ff8800;
      font-size: 2rem;
    }

    /* ==================== کارت موسیقی ==================== */
    .music-card .cover {
      width: 100%;
      aspect-ratio: 1/1;
      object-fit: cover;
      border-radius: 20px;
    }
    .music-card audio {
      width: 100%;
      margin: 10px 0;
      border-radius: 40px;
      background: #1f1f32;
      height: 38px;
    }
    .music-card audio::-webkit-media-controls-panel {
      background: #1f1f32;
    }

    /* ==================== زروکس اُلد (گالری) ==================== */
    .old-gallery {
      display: flex;
      gap: 10px;
      flex-wrap: wrap;
      margin: 10px 0;
    }
    .old-gallery img {
      width: 70px;
      height: 70px;
      object-fit: cover;
      border-radius: 16px;
      border: 2px solid #2f2f4a;
      transition: 0.3s;
      cursor: pointer;
    }
    .old-gallery img:hover {
      transform: scale(1.08);
      border-color: #ff8800;
    }

    /* ==================== دکمه بازگشت / تاپ ==================== */
    .back-top {
      position: fixed;
      bottom: 30px;
      left: 30px;
      background: #ff5500cc;
      backdrop-filter: blur(8px);
      color: #fff;
      border: none;
      border-radius: 60px;
      padding: 12px 18px;
      font-size: 1.2rem;
      box-shadow: 0 0 30px #ff550066;
      cursor: pointer;
      transition: 0.3s;
      z-index: 999;
      border: 1px solid #ffaa00aa;
    }
    .back-top:hover {
      transform: scale(1.1);
      background: #ff7700;
    }

    /* ==================== مدال ==================== */
    .modal {
      display: none;
      position: fixed;
      top: 0; left: 0; width: 100%; height: 100%;
      background: #000000dd;
      backdrop-filter: blur(10px);
      justify-content: center;
      align-items: center;
      z-index: 9999;
      padding: 20px;
      animation: fadeIn 0.3s;
    }
    .modal.active {
      display: flex;
    }
    .modal-content {
      background: #1a1a2eee;
      border: 1px solid #ff880066;
      border-radius: 40px;
      max-width: 700px;
      width: 100%;
      max-height: 90vh;
      overflow-y: auto;
      padding: 30px 28px;
      box-shadow: 0 30px 80px #000000ee;
      position: relative;
    }
    .modal-content h2 {
      font-size: 1.8rem;
      margin-bottom: 10px;
      color: #ffaa55;
    }
    .modal-content p {
      color: #d0d0e0;
      line-height: 1.9;
      white-space: pre-wrap;
    }
    .modal-close {
      position: sticky;
      top: 0;
      float: left;
      background: #ff3300;
      border: none;
      color: #fff;
      font-size: 1.6rem;
      width: 44px;
      height: 44px;
      border-radius: 60px;
      cursor: pointer;
      transition: 0.2s;
      box-shadow: 0 0 20px #ff330066;
    }
    .modal-close:hover {
      transform: rotate(90deg);
      background: #ff5500;
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: scale(0.95); }
      to { opacity: 1; transform: scale(1); }
    }

    /* ==================== ریسپانسیو ==================== */
    @media (max-width: 600px) {
      .header h1 { font-size: 1.3rem; }
      .header img { height: 50px; }
      .section-title { font-size: 1.3rem; }
      .card-grid { grid-template-columns: 1fr; }
      .modal-content { padding: 20px 16px; }
    }

    /* فونتها استعداد اردیبهشت (اردکان) — ما از فونت سیستمی استفاده می‌کنیم ولی اسمش رو میذاریم برای احترام */
    @font-face {
      font-family: 'Vazirmatn';
      src: local('Vazirmatn'), local('Vazir'), url('https://cdn.jsdelivr.net/gh/rastikerdar/vazirmatn@v33.003/Vazirmatn-font-face.css') format('woff2');
      font-display: swap;
    }
    /* fallback: استفاده از فونت پیش‌فرض با استایل اردکان‌گونه */
    body {
      font-family: 'Vazirmatn', 'Tahoma', 'IRANSans', system-ui, sans-serif;
    }

    /* ==================== انیمیشن‌های خفن ==================== */
    .glow-text {
      text-shadow: 0 0 20px #ff8800aa, 0 0 60px #ff550066;
    }
    .pulse {
      animation: pulse 2s infinite;
    }
    @keyframes pulse {
      0% { opacity: 0.8; transform: scale(0.98); }
      50% { opacity: 1; transform: scale(1.02); }
      100% { opacity: 0.8; transform: scale(0.98); }
    }
  </style>
</head>

  function renderCards(containerId, data, templateFn) {
    const container = document.getElementById(containerId);
    if (!container) return;
    container.innerHTML = data.map((item, index) => templateFn(item, index)).join('');
  }

  // ----- ویدیوها -----
  function videoTemplate(v) {
    return `
      <div class="card">
        <img src="${v.thumb}" alt="${v.title}" class="thumb">
        <span class="badge"><i class="fas fa-skull"></i> ${v.category}</span>
        <h3>${v.title}</h3>
        <p>${v.desc}</p>
        <div class="meta"><span><i class="far fa-calendar-alt"></i> ${v.date}</span><span><i class="far fa-clock"></i> ${v.time}</span></div>
        <a href="${v.link}" target="_blank" class="btn"><i class="fas fa-play"></i> تماشا در آپارات</a>
        <button class="btn" style="background:#2a2a4f; box-shadow:none; margin-top:6px;" onclick="showModal('${v.title.replace(/'/g, "\\'")}', '${v.fullText.replace(/'/g, "\\'")}')"><i class="fas fa-align-left"></i> متن کامل</button>
      </div>
    `;
  }

  // ================================================================
  // ==================== مودال ====================
  // ================================================================
  const modal = document.getElementById('detailModal');
  const modalTitle = document.getElementById('modalTitle');
  const modalBody = document.getElementById('modalBody');
  const modalClose = document.getElementById('modalClose');

  function showModal(title, text) {
    modalTitle.textContent = title;
    modalBody.innerHTML = `<p>${text}</p>`;
    modal.classList.add('active');
    document.body.style.overflow = 'hidden';
  }

  function closeModal() {
    modal.classList.remove('active');
    document.body.style.overflow = '';
  }

  modalClose.addEventListener('click', closeModal);
  modal.addEventListener('click', (e) => {
    if (e.target === modal) closeModal();
  });
  document.addEventListener('keydown', (e) => { if (e.key === 'Escape') closeModal(); });

  // ================================================================
  // ==================== دکمه بازگشت به بالا ====================
  // ================================================================
  document.getElementById('backTop').addEventListener('click', () => {
    window.scrollTo({ top: 0, behavior: 'smooth' });
  });

  // ================================================================
  // ==================== اجرای رندر ====================

  renderCards('newsGrid', newsData, newsTemplate);
  renderCards('storiesGrid', storiesData, storyTemplate);
  renderCards('musicGrid', musicData, musicTemplate);
  renderCards('oldGrid', oldData, oldTemplate);
