<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Zerox Game Studio · Original</title>

  <!-- Fonts -->
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet" />

  <!-- Font Awesome -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css" />

  <style>
    /* ===== RESET & BASE ===== */
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }
    body {
      background: #0a0a0a;
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      font-family: 'Inter', sans-serif;
      padding: 2rem;
    }

    /* ===== STEAM-STYLE PURCHASE CARD ===== */
    .purchase-card {
      max-width: 1100px;
      width: 100%;
      background: #0f0f0f;
      border: 1px solid #1a1a1a;
      border-radius: 16px;
      padding: 2.5rem;
      display: grid;
      grid-template-columns: 1fr 1.2fr;
      gap: 2.5rem;
      box-shadow: 0 30px 80px rgba(0,0,0,0.9), 0 0 60px rgba(255,255,255,0.02);
      transition: 0.4s;
      position: relative;
      overflow: hidden;
    }
    .purchase-card::before {
      content: '';
      position: absolute;
      inset: 0;
      background: radial-gradient(circle at 20% 30%, rgba(255,255,255,0.02) 0%, transparent 60%);
      pointer-events: none;
    }

    /* ===== LEFT COLUMN - COVER ===== */
    .cover-section {
      display: flex;
      flex-direction: column;
      gap: 1.2rem;
      position: relative;
      z-index: 1;
    }

    .studio-badge {
      display: flex;
      align-items: center;
      gap: 10px;
      font-size: 0.75rem;
      font-weight: 600;
      letter-spacing: 2px;
      text-transform: uppercase;
      color: #666;
      border-bottom: 1px solid #1a1a1a;
      padding-bottom: 0.8rem;
    }
    .studio-badge .logo-icon {
      width: 28px;
      height: 28px;
      background: #1a1a1a;
      border-radius: 4px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: 900;
      font-size: 0.7rem;
      color: #fff;
      border: 1px solid #333;
    }

    .cover-art {
      width: 100%;
      aspect-ratio: 16/9;
      background: #121212;
      border-radius: 12px;
      overflow: hidden;
      border: 1px solid #1a1a1a;
      position: relative;
      transition: 0.4s;
    }
    .cover-art img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
      filter: brightness(0.85) contrast(1.1);
      transition: 0.5s;
    }
    .cover-art:hover img {
      filter: brightness(1) contrast(1.1);
      transform: scale(1.02);
    }
    .cover-art .cover-overlay {
      position: absolute;
      inset: 0;
      background: linear-gradient(0deg, rgba(0,0,0,0.6) 10%, transparent 60%);
      pointer-events: none;
    }
    .cover-art .platform-tag {
      position: absolute;
      bottom: 1rem;
      right: 1rem;
      display: flex;
      gap: 10px;
      color: #888;
      font-size: 0.9rem;
      background: rgba(0,0,0,0.6);
      padding: 0.3rem 1rem;
      border-radius: 30px;
      backdrop-filter: blur(4px);
      border: 1px solid rgba(255,255,255,0.05);
    }
    .cover-art .platform-tag i {
      font-size: 0.9rem;
    }

    .game-badge {
      display: flex;
      gap: 1rem;
      font-size: 0.7rem;
      color: #555;
      letter-spacing: 1px;
      text-transform: uppercase;
    }
    .game-badge span {
      border: 1px solid #222;
      padding: 0.2rem 1rem;
      border-radius: 20px;
    }

    /* ===== RIGHT COLUMN - INFO ===== */
    .info-section {
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      gap: 1.5rem;
      position: relative;
      z-index: 1;
    }

    .game-title {
      font-size: 2.8rem;
      font-weight: 800;
      color: #fff;
      letter-spacing: -1px;
      line-height: 1.05;
    }
    .game-title .sub {
      display: block;
      font-size: 1rem;
      font-weight: 300;
      color: #666;
      letter-spacing: 2px;
      margin-top: 0.3rem;
    }

    .game-desc {
      color: #999;
      font-size: 0.95rem;
      font-weight: 300;
      line-height: 1.8;
      max-width: 90%;
      border-right: 2px solid #222;
      padding-right: 1.2rem;
    }

    .game-meta {
      display: flex;
      flex-wrap: wrap;
      gap: 1.5rem;
      font-size: 0.8rem;
      color: #666;
      border-top: 1px solid #1a1a1a;
      border-bottom: 1px solid #1a1a1a;
      padding: 1rem 0;
    }
    .game-meta .meta-item {
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .game-meta .meta-item i {
      color: #444;
      font-size: 0.9rem;
    }

    /* ===== PRICE & BUY ===== */
    .purchase-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 1.5rem;
      margin-top: 0.5rem;
      flex-wrap: wrap;
    }

    .price-box {
      display: flex;
      align-items: baseline;
      gap: 10px;
    }
    .price-box .price {
      font-size: 2.4rem;
      font-weight: 800;
      color: #fff;
      letter-spacing: -1px;
    }
    .price-box .price small {
      font-size: 1rem;
      font-weight: 400;
      color: #666;
    }
    .price-box .original-price {
      font-size: 1rem;
      color: #444;
      text-decoration: line-through;
      font-weight: 300;
    }

    .btn-buy {
      background: transparent;
      border: 1px solid rgba(255,255,255,0.15);
      color: #fff;
      font-size: 1rem;
      font-weight: 600;
      padding: 0.9rem 2.8rem;
      border-radius: 40px;
      cursor: pointer;
      transition: all 0.4s;
      letter-spacing: 1.5px;
      text-transform: uppercase;
      position: relative;
      overflow: hidden;
      font-family: 'Inter', sans-serif;
      background: rgba(255,255,255,0.02);
    }
    .btn-buy::before {
      content: '';
      position: absolute;
      inset: 0;
      background: linear-gradient(90deg, transparent, rgba(255,255,255,0.05), transparent);
      transform: translateX(-100%);
      transition: 0.6s;
    }
    .btn-buy:hover::before {
      transform: translateX(100%);
    }
    .btn-buy:hover {
      background: rgba(255,255,255,0.06);
      border-color: rgba(255,255,255,0.3);
      transform: scale(1.02);
      box-shadow: 0 0 40px rgba(255,255,255,0.02);
    }
    .btn-buy:active {
      transform: scale(0.97);
    }
    .btn-buy i {
      margin-right: 10px;
      font-size: 0.9rem;
    }

    /* ===== RESPONSIVE ===== */
    @media (max-width: 850px) {
      .purchase-card {
        grid-template-columns: 1fr;
        gap: 1.8rem;
        padding: 1.8rem;
      }
      .game-title {
        font-size: 2.2rem;
      }
      .game-desc {
        max-width: 100%;
      }
      .purchase-row {
        flex-direction: column;
        align-items: stretch;
      }
      .price-box {
        justify-content: center;
      }
      .btn-buy {
        text-align: center;
        padding: 0.9rem 2rem;
      }
    }
    @media (max-width: 480px) {
      .purchase-card {
        padding: 1.2rem;
        border-radius: 12px;
      }
      .game-title {
        font-size: 1.8rem;
      }
      .price-box .price {
        font-size: 1.8rem;
      }
      .btn-buy {
        font-size: 0.85rem;
        padding: 0.8rem 1.5rem;
      }
      .game-meta {
        flex-direction: column;
        gap: 0.8rem;
      }
    }
  </style>
</head>
<body>

  <!-- ========================================== -->
  <!-- ===== STEAM-STYLE PURCHASE CARD ===== -->
  <!-- ========================================== -->
  <div class="purchase-card">

    <!-- ===== LEFT: COVER ===== -->
    <div class="cover-section">
      <div class="studio-badge">
        <span class="logo-icon">Z</span>
        <span>Zerox Game Studio</span>
        <span style="color:#333; margin-right:auto;">| original</span>
      </div>

      <div class="cover-art">
        <img 
          src="https://uploadkon.ir/uploads/713431_26Negar-1788164380627.jpg" 
          alt="SilentGears Cover"
          loading="lazy"
        />
        <div class="cover-overlay"></div>
        <div class="platform-tag">
          <i class="fab fa-windows"></i>
          <i class="fab fa-android"></i>
        </div>
      </div>

      <div class="game-badge">
        <span><i class="far fa-star" style="margin-left:6px;"></i> Action</span>
        <span><i class="far fa-clock" style="margin-left:6px;"></i> Coming Soon</span>
      </div>
    </div>

    <!-- ===== RIGHT: INFO ===== -->
    <div class="info-section">
      <div>
        <h1 class="game-title">
          SilentGears
          <span class="sub">چرخ‌دنده‌ساکت</span>
        </h1>

        <p class="game-desc">
          یک بازی اکشن-ماجرایی ریتم‌محور در دنیایی پساآخرالزمانی. 
          راز چرخ‌دنده‌های خاموش را کشف کن.
        </p>
      </div>

      <div class="game-meta">
        <span class="meta-item"><i class="fas fa-tag"></i> اکشن • ماجرایی</span>
        <span class="meta-item"><i class="fas fa-user"></i> تکنفره</span>
        <span class="meta-item"><i class="fas fa-hourglass-half"></i> ۱۲–۱۶ ساعت</span>
        <span class="meta-item"><i class="fas fa-flag"></i> ۳ پایان</span>
      </div>

      <div class="purchase-row">
        <div class="price-box">
          <span class="price">$19.99 <small>USD</small></span>
          <span class="original-price">$29.99</span>
        </div>
        <button class="btn-buy">
          <i class="fas fa-shopping-cart"></i> خرید بازی
        </button>
      </div>
    </div>

  </div>

</body>
</html>
