<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Zerox | پلتفرم ویدیو</title>
    <link href="https://cdn.jsdelivr.net/gh/rastikerdar/vazirmatn@v33.003/Vazirmatn-font-face.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Vazirmatn', sans-serif;
            background: #f1f1f1;
            color: #0f0f0f;
            direction: rtl;
        }

        /* ===== هدر ===== */
        .header {
            background: #ffffff;
            padding: 10px 20px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            border-bottom: 1px solid #e5e5e5;
            position: sticky;
            top: 0;
            z-index: 1000;
            flex-wrap: wrap;
            gap: 10px;
        }

        .header-left {
            display: flex;
            align-items: center;
            gap: 14px;
        }

        .menu-toggle {
            font-size: 22px;
            color: #606060;
            cursor: pointer;
            padding: 4px;
            transition: 0.3s;
        }

        .menu-toggle:hover {
            color: #ff0000;
        }

        .logo {
            font-size: 24px;
            font-weight: 900;
            color: #ff0000;
            display: flex;
            align-items: center;
            gap: 6px;
            cursor: pointer;
            user-select: none;
        }

        .logo i {
            font-size: 28px;
        }

        .search-box {
            display: flex;
            align-items: center;
            background: #f0f0f0;
            border: 1px solid #d3d3d3;
            border-radius: 40px;
            padding: 2px 16px;
            flex: 1;
            max-width: 550px;
            min-width: 160px;
            transition: 0.3s;
        }

        .search-box:focus-within {
            border-color: #1a73e8;
            box-shadow: 0 0 0 2px rgba(26, 115, 232, 0.2);
        }

        .search-box input {
            flex: 1;
            border: none;
            background: transparent;
            padding: 9px 0;
            font-family: 'Vazirmatn', sans-serif;
            font-size: 15px;
            outline: none;
            color: #0f0f0f;
        }

        .search-box input::placeholder {
            color: #888;
        }

        .search-box i {
            color: #606060;
            font-size: 18px;
            cursor: pointer;
            padding: 6px 4px;
            transition: 0.3s;
        }

        .search-box i:hover {
            color: #ff0000;
        }

        .header-icons {
            display: flex;
            align-items: center;
            gap: 16px;
            font-size: 20px;
            color: #606060;
        }

        .header-icons i {
            cursor: pointer;
            transition: 0.3s;
            position: relative;
        }

        .header-icons i:hover {
            color: #ff0000;
        }

        .badge {
            position: absolute;
            top: -8px;
            right: -8px;
            background: #ff0000;
            color: #fff;
            font-size: 10px;
            padding: 1px 6px;
            border-radius: 50%;
            font-weight: 700;
        }

        .avatar {
            width: 34px;
            height: 34px;
            border-radius: 50%;
            background: #ff0000;
            color: #fff;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: 700;
            font-size: 14px;
            cursor: pointer;
            transition: 0.3s;
        }

        .avatar:hover {
            transform: scale(1.08);
        }

        /* ===== بدنه ===== */
        .container {
            display: flex;
            min-height: calc(100vh - 70px);
        }

        /* ===== سایدبار ===== */
        .sidebar {
            width: 230px;
            background: #fff;
            padding: 12px 6px;
            height: calc(100vh - 70px);
            position: sticky;
            top: 70px;
            overflow-y: auto;
            border-left: 1px solid #e5e5e5;
            flex-shrink: 0;
            transition: 0.3s;
        }

        .sidebar.closed {
            width: 0;
            padding: 0;
            overflow: hidden;
            border: none;
        }

        .sidebar-item {
            display: flex;
            align-items: center;
            gap: 14px;
            padding: 10px 16px;
            border-radius: 10px;
            cursor: pointer;
            color: #606060;
            font-size: 14px;
            transition: 0.2s;
            margin-bottom: 2px;
        }

        .sidebar-item:hover {
            background: #f0f0f0;
        }

        .sidebar-item.active {
            background: #f0f0f0;
            color: #ff0000;
            font-weight: 700;
        }

        .sidebar-item i {
            width: 20px;
            font-size: 18px;
        }

        .sidebar-divider {
            height: 1px;
            background: #e5e5e5;
            margin: 10px 16px;
        }

        .sidebar-label {
            color: #888;
            font-size: 13px;
            padding: 6px 16px;
            font-weight: 700;
        }

        /* ===== محتوای اصلی ===== */
        .main-content {
            flex: 1;
            padding: 20px 24px;
            background: #f9f9f9;
        }

        /* ===== چیپس‌ها ===== */
        .chips {
            display: flex;
            gap: 10px;
            overflow-x: auto;
            padding-bottom: 14px;
            margin-bottom: 20px;
            scrollbar-width: none;
            -webkit-overflow-scrolling: touch;
        }

        .chips::-webkit-scrollbar {
            display: none;
        }

        .chip {
            padding: 8px 18px;
            border-radius: 30px;
            background: #f0f0f0;
            color: #0f0f0f;
            font-size: 14px;
            white-space: nowrap;
            cursor: pointer;
            transition: 0.3s;
            border: 1px solid #d3d3d3;
            font-family: 'Vazirmatn', sans-serif;
            user-select: none;
        }

        .chip:hover {
            background: #e0e0e0;
        }

        .chip.active {
            background: #0f0f0f;
            color: #fff;
            border-color: #0f0f0f;
        }

        /* ===== گرید ویدیوها ===== */
        .video-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
            gap: 20px;
        }

        .video-card {
            background: #fff;
            border-radius: 12px;
            overflow: hidden;
            cursor: pointer;
            transition: 0.3s;
            box-shadow: 0 1px 4px rgba(0,0,0,0.08);
        }

        .video-card:hover {
            transform: translateY(-4px);
            box-shadow: 0 6px 20px rgba(0,0,0,0.12);
        }

        .video-thumb {
            position: relative;
            aspect-ratio: 16/9;
            overflow: hidden;
            background: #000;
        }

        .video-thumb video {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .video-duration {
            position: absolute;
            bottom: 8px;
            right: 8px;
            background: rgba(0,0,0,0.85);
            padding: 2px 8px;
            border-radius: 4px;
            font-size: 12px;
            font-weight: 700;
            color: #fff;
        }

        .video-info {
            padding: 12px 14px;
        }

        .video-title {
            font-size: 15px;
            font-weight: 700;
            line-height: 1.5;
            display: -webkit-box;
            -webkit-line-clamp: 2;
            -webkit-box-orient: vertical;
            overflow: hidden;
        }

        .video-channel {
            display: flex;
            align-items: center;
            gap: 8px;
            margin-top: 8px;
            color: #606060;
            font-size: 13px;
        }

        .video-channel .ch-avatar {
            width: 26px;
            height: 26px;
            border-radius: 50%;
            background: #ff0000;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 11px;
            font-weight: 700;
            color: #fff;
            flex-shrink: 0;
        }

        .video-meta {
            color: #888;
            font-size: 12px;
            margin-top: 4px;
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .video-meta i {
            font-size: 3px;
            color: #aaa;
        }

        /* ===== مودال ===== */
        .modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: rgba(0,0,0,0.85);
            z-index: 2000;
            padding: 30px 16px;
            align-items: center;
            justify-content: center;
        }

        .modal.active {
            display: flex;
        }

        .modal-content {
            background: #fff;
            border-radius: 16px;
            max-width: 880px;
            width: 100%;
            max-height: 92vh;
            overflow-y: auto;
            position: relative;
            animation: modalIn 0.3s ease;
        }

        @keyframes modalIn {
            from {
                transform: scale(0.9);
                opacity: 0;
            }
            to {
                transform: scale(1);
                opacity: 1;
            }
        }

        .modal-close {
            position: absolute;
            top: 12px;
            left: 12px;
            font-size: 24px;
            color: #fff;
            cursor: pointer;
            background: rgba(0,0,0,0.6);
            width: 40px;
            height: 40px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: 0.3s;
            z-index: 10;
            border: none;
        }

        .modal-close:hover {
            background: #ff0000;
            transform: rotate(90deg);
        }

        .modal-video {
            width: 100%;
            aspect-ratio: 16/9;
            background: #000;
        }

        .modal-video video {
            width: 100%;
            height: 100%;
            display: block;
        }

        .modal-info {
            padding: 20px 24px;
        }

        .modal-title {
            font-size: 20px;
            font-weight: 700;
        }

        .modal-channel {
            display: flex;
            align-items: center;
            gap: 12px;
            margin-top: 12px;
        }

        .modal-channel .ch-avatar {
            width: 40px;
            height: 40px;
            border-radius: 50%;
            background: #ff0000;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 16px;
            font-weight: 700;
            color: #fff;
            flex-shrink: 0;
        }

        .modal-actions {
            display: flex;
            gap: 10px;
            margin-top: 14px;
            flex-wrap: wrap;
        }

        .modal-btn {
            padding: 8px 18px;
            border-radius: 30px;
            border: none;
            background: #f0f0f0;
            font-family: 'Vazirmatn', sans-serif;
            font-size: 14px;
            font-weight: 500;
            cursor: pointer;
            transition: 0.3s;
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .modal-btn:hover {
            background: #e0e0e0;
        }

        .modal-btn.like {
            background: #ff0000;
            color: #fff;
        }

        .modal-btn.like:hover {
            background: #cc0000;
        }

        .modal-btn i {
            font-size: 16px;
        }

        /* ===== فوتر ===== */
        .footer {
            text-align: center;
            padding: 24px 20px;
            border-top: 1px solid #e5e5e5;
            margin-top: 24px;
            color: #888;
            font-size: 13px;
            background: #fff;
        }

        .footer i {
            color: #ff0000;
        }

        /* ===== ریسپانسیو ===== */
        @media (max-width: 1200px) {
            .video-grid {
                grid-template-columns: repeat(auto-fill, minmax(240px, 1fr));
                gap: 16px;
            }
        }

        @media (max-width: 992px) {
            .sidebar {
                width: 72px;
                padding: 8px 4px;
            }
            .sidebar-item span {
                display: none;
            }
            .sidebar-item {
                justify-content: center;
                padding: 12px;
            }
            .sidebar-label {
                display: none;
            }
            .sidebar-divider {
                margin: 6px 0;
            }
            .video-grid {
                grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
            }
            .search-box {
                max-width: 400px;
            }
        }

        @media (max-width: 768px) {
            .header {
                padding: 8px 12px;
            }
            .search-box {
                order: 3;
                flex: 1 1 100%;
                max-width: 100%;
                min-width: unset;
            }
            .sidebar {
                display: none;
            }
            .main-content {
                padding: 12px 12px;
            }
            .video-grid {
                grid-template-columns: repeat(auto-fill, minmax(160px, 1fr));
                gap: 12px;
            }
            .video-title {
                font-size: 13px;
            }
            .video-channel {
                font-size: 12px;
            }
            .video-meta {
                font-size: 11px;
            }
            .modal {
                padding: 12px 8px;
            }
            .modal-content {
                max-height: 96vh;
            }
            .modal-title {
                font-size: 17px;
            }
            .modal-info {
                padding: 14px 16px;
            }
            .chip {
                font-size: 12px;
                padding: 6px 14px;
            }
            .logo {
                font-size: 20px;
            }
            .logo i {
                font-size: 24px;
            }
            .header-icons {
                gap: 12px;
                font-size: 18px;
            }
        }

        @media (max-width: 480px) {
            .video-grid {
                grid-template-columns: 1fr 1fr;
                gap: 8px;
            }
            .video-info {
                padding: 8px 10px;
            }
            .video-title {
                font-size: 11px;
                -webkit-line-clamp: 2;
            }
            .video-channel {
                font-size: 10px;
                gap: 4px;
            }
            .video-channel .ch-avatar {
                width: 20px;
                height: 20px;
                font-size: 9px;
            }
            .video-meta {
                font-size: 10px;
            }
            .video-duration {
                font-size: 10px;
                padding: 1px 6px;
                bottom: 4px;
                right: 4px;
            }
            .modal-title {
                font-size: 15px;
            }
            .modal-btn {
                font-size: 12px;
                padding: 6px 14px;
            }
            .modal-actions {
                gap: 6px;
            }
            .chip {
                font-size: 11px;
                padding: 5px 12px;
            }
            .main-content {
                padding: 8px 8px;
            }
        }
    </style>
</head>
<body>

    <!-- ===== هدر ===== -->
    <header class="header">
        <div class="header-left">
            <i class="fas fa-bars menu-toggle" onclick="toggleSidebar()"></i>
            <div class="logo" onclick="location.reload()">
                <i class="fab fa-youtube"></i> Zerox
            </div>
        </div>

        <div class="search-box">
            <i class="fas fa-search" onclick="searchVideos()"></i>
            <input type="text" id="searchInput" placeholder="جستجو در Zerox..." onkeyup="if(event.key==='Enter') searchVideos()">
            <i class="fas fa-microphone" onclick="alert('🎤 حالت صوتی فعال شد!')"></i>
        </div>

        <div class="header-icons">
            <i class="fas fa-video" onclick="alert('📹 آپلود ویدیو جدید')"></i>
            <i class="fas fa-bell"><span class="badge">۳</span></i>
            <div class="avatar" onclick="alert('👤 پروفایل کاربر')">Z</div>
        </div>
    </header>

    <!-- ===== بدنه ===== -->
    <div class="container">

        <!-- ===== سایدبار ===== -->
        <nav class="sidebar" id="sidebar">
            <div class="sidebar-item active" onclick="filterVideos('همه')">
                <i class="fas fa-home"></i> <span>خانه</span>
            </div>
            <div class="sidebar-item" onclick="filterVideos('اکسپلور')">
                <i class="fas fa-compass"></i> <span>اکسپلور</span>
            </div>
            <div class="sidebar-item" onclick="filterVideos('داغ')">
                <i class="fas fa-fire"></i> <span>داغ‌ترین</span>
            </div>
            <div class="sidebar-item" onclick="filterVideos('تاریخچه')">
                <i class="fas fa-history"></i> <span>تاریخچه</span>
            </div>
            <div class="sidebar-divider"></div>
            <div class="sidebar-label">اشتراک‌ها</div>
            <div class="sidebar-item"><i class="fas fa-circle" style="color:#ff0000;"></i> <span>Zerox Academy</span></div>
            <div class="sidebar-item"><i class="fas fa-circle" style="color:#3ea6ff;"></i> <span>Game Zone</span></div>
            <div class="sidebar-item"><i class="fas fa-circle" style="color:#ffcc00;"></i> <span>Music Plus</span></div>
            <div class="sidebar-divider"></div>
            <div class="sidebar-label">کتابخانه</div>
            <div class="sidebar-item"><i class="fas fa-clock"></i> <span>بعداً تماشا</span></div>
            <div class="sidebar-item"><i class="fas fa-thumbs-up"></i> <span>لایک‌ها</span></div>
        </nav>

        <!-- ===== محتوای اصلی ===== -->
        <main class="main-content">

            <!-- ===== چیپس‌ها ===== -->
            <div class="chips" id="chipsContainer">
                <span class="chip active" onclick="filterVideos('همه')">همه</span>
                <span class="chip" onclick="filterVideos('آموزشی')">آموزشی</span>
                <span class="chip" onclick="filterVideos('گیمینگ')">گیمینگ</span>
                <span class="chip" onclick="filterVideos('موسیقی')">موسیقی</span>
                <span class="chip" onclick="filterVideos('ورزشی')">ورزشی</span>
                <span class="chip" onclick="filterVideos('برنامه‌نویسی')">برنامه‌نویسی</span>
                <span class="chip" onclick="filterVideos('تکنولوژی')">تکنولوژی</span>
                <span class="chip" onclick="filterVideos('فیلم')">فیلم</span>
            </div>

            <!-- ===== گرید ویدیوها ===== -->
            <div class="video-grid" id="videoGrid"></div>
        </main>
    </div>

    <!-- ===== مودال ===== -->
    <div class="modal" id="videoModal">
        <div class="modal-content">
            <button class="modal-close" onclick="closeModal()">✕</button>
            <div class="modal-video">
                <video id="modalVideo" controls autoplay></video>
            </div>
            <div class="modal-info">
                <div class="modal-title" id="modalTitle">عنوان ویدیو</div>
                <div class="modal-channel">
                    <div class="ch-avatar" id="modalChannelAvatar">Z</div>
                    <div>
                        <div style="font-weight:700;" id="modalChannelName">Zerox Academy</div>
                        <div style="color:#888;font-size:13px;" id="modalSubs">۱.۲ میلیون دنبال‌کننده</div>
                    </div>
                    <button class="modal-btn" style="background:#ff0000;color:#fff;margin-right:10px;" onclick="alert('✅ دنبال کردید!')">
                        <i class="fas fa-bell"></i> دنبال‌کن
                    </button>
                </div>
                <div class="modal-actions">
                    <button class="modal-btn like" onclick="likeVideo()">
                        <i class="fas fa-thumbs-up"></i> <span id="likeCount">۱۲۳۴</span>
                    </button>
                    <button class="modal-btn" onclick="alert('👎 دیسلایک کردید')">
                        <i class="fas fa-thumbs-down"></i> دیسلایک
                    </button>
                    <button class="modal-btn" onclick="alert('🔗 لینک کپی شد!')">
                        <i class="fas fa-share"></i> اشتراک
                    </button>
                    <button class="modal-btn" onclick="alert('💾 ذخیره شد')">
                        <i class="fas fa-save"></i> ذخیره
                    </button>
                </div>
            </div>
        </div>
    </div>

    <!-- ===== فوتر ===== -->
    <footer class="footer">
        <i class="fab fa-youtube"></i> Zerox &bull; ۲۰۲۶ &bull;
        <i class="fas fa-heart"></i> ساخته شده با عشق
    </footer>

        const videos = [

            { id: 2, title: 'بهترین بازی‌های ۲۰۲۶ - بررسی کامل', channel: 'Game Zone', avatar: 'G', category: 'گیمینگ', views: '۸۹۰ هزار', date: '۵ روز پیش', duration: '۰۸:۲۱', src: 'https://www.w3schools.com/html/mov_bbb.mp4', likes: 567 },
            { id: 3, title: 'آهنگ جدید با کیفیت ۴K - آرامش‌بخش', channel: 'Music Plus', avatar: 'M', category: 'موسیقی', views: '۵۶۰ هزار', date: '۱ هفته پیش', duration: '۰۴:۵۶', src: 'https://www.w3schools.com/html/mov_bbb.mp4', likes: 890 },
            { id: 4, title: 'بررسی آیفون ۱۷ پرو - هر آنچه باید بدانید', channel: 'Tech World', avatar: 'T', category: 'تکنولوژی', views: '۳.۴ میلیون', date: '۲ روز پیش', duration: '۱۵:۴۰', src: 'https://www.w3schools.com/html/mov_bbb.mp4', likes: 2100 },
            { id: 5, title: 'طراحی سایت با CSS مدرن - پروژه عملی', channel: 'Zerox Academy', avatar: 'Z', category: 'آموزشی', views: '۱.۷ میلیون', date: '۴ روز پیش', duration: '۲۲:۱۰', src: 'https://www.w3schools.com/html/mov_bbb.mp4', likes: 1567 },

        ];

        let currentVideos = [...videos];

        // ===== رنگ‌های کانال =====
        const channelColors = {
            'Zerox Academy': '#ff0000',
            'Game Zone': '#3ea6ff',
            'Music Plus': '#ffcc00',
            'Tech World': '#00ccff',
            'Sport World': '#00ff88',
            'AI Lab': '#cc00ff',
            'Zerox Live': '#ff6600',
            'Cine World': '#ff00aa',
            'Design Hub': '#00cc66'
        };

        function getChannelColor(name) {
            return channelColors[name] || '#ff0000';
        }

        // ===== رندر ویدیوها =====
        function renderVideos(list) {
            const grid = document.getElementById('videoGrid');
            if (list.length === 0) {
                grid.innerHTML = `
                    <div style="grid-column:1/-1;text-align:center;padding:80px 20px;color:#888;">
                        <i class="fas fa-search" style="font-size:48px;display:block;margin-bottom:16px;"></i>
                        <h3>نتیجه‌ای پیدا نشد</h3>
                        <p>ویدیویی با این دسته‌بندی وجود ندارد</p>
                    </div>
                `;
                return;
            }

            grid.innerHTML = list.map(v => `
                <div class="video-card" onclick="openModal(${v.id})">
                    <div class="video-thumb">
                        <video src="${v.src}" muted preload="metadata"></video>
                        <span class="video-duration">${v.duration}</span>
                    </div>
                    <div class="video-info">
                        <div class="video-title">${v.title}</div>
                        <div class="video-channel">
                            <div class="ch-avatar" style="background:${getChannelColor(v.channel)}">${v.avatar}</div>
                            ${v.channel}
                        </div>
                        <div class="video-meta">
                            ${v.views} بازدید <i class="fas fa-circle"></i> ${v.date}
                        </div>
                    </div>
                </div>
            `).join('');
        }

        // ===== فیلتر =====
        function filterVideos(category) {
            document.querySelectorAll('.chip').forEach(c => c.classList.remove('active'));
            document.querySelectorAll('.chip').forEach(c => {
                if (c.textContent.trim() === category) c.classList.add('active');
            });

            document.querySelectorAll('.sidebar-item').forEach(i => i.classList.remove('active'));
            document.querySelectorAll('.sidebar-item').forEach(i => {
                if (i.textContent.trim().includes(category)) i.classList.add('active');
            });

            if (category === 'همه') {
                currentVideos = [...videos];
            } else {
                currentVideos = videos.filter(v => v.category === category);
            }
            renderVideos(currentVideos);
        }

        // ===== جستجو =====
        function searchVideos() {
            const q = document.getElementById('searchInput').value.trim().toLowerCase();
            if (!q) { renderVideos(currentVideos); return; }

            const results = currentVideos.filter(v =>
                v.title.toLowerCase().includes(q) ||
                v.channel.toLowerCase().includes(q) ||
                v.category.toLowerCase().includes(q)
            );
            renderVideos(results);
        }

        // ===== مودال =====
        function openModal(id) {
            const v = videos.find(x => x.id === id);
            if (!v) return;

            const modal = document.getElementById('videoModal');
            const videoEl = document.getElementById('modalVideo');
            document.getElementById('modalTitle').textContent = v.title;
            document.getElementById('modalChannelName').textContent = v.channel;
            const avatar = document.getElementById('modalChannelAvatar');
            avatar.textContent = v.avatar;
            avatar.style.background = getChannelColor(v.channel);
            document.getElementById('likeCount').textContent = v.likes;

            videoEl.src = v.src;
            modal.classList.add('active');
            document.body.style.overflow = 'hidden';
            modal.dataset.videoId = id;
        }

        function closeModal() {
            const modal = document.getElementById('videoModal');
            const videoEl = document.getElementById('modalVideo');
            modal.classList.remove('active');
            videoEl.pause();
            videoEl.src = '';
            document.body.style.overflow = 'auto';
        }

        // ===== لایک =====
        function likeVideo() {
            const span = document.getElementById('likeCount');
            let current = parseInt(span.textContent.replace(/,/g, ''));
            current++;
            span.textContent = current.toLocaleString();

            const btn = document.querySelector('.modal-btn.like');
            btn.style.background = '#0066cc';
            setTimeout(() => btn.style.background = '#ff0000', 500);
        }

        // ===== سایدبار =====
        function toggleSidebar() {
            document.getElementById('sidebar').classList.toggle('closed');
        }

        // ===== رویدادها =====
        document.getElementById('videoModal').addEventListener('click', function(e) {
            if (e.target === this) closeModal();
        });

        document.addEventListener('keydown', function(e) {
            if (e.key === 'Escape') closeModal();
        });

        // ===== شروع =====
        renderVideos(videos);
    </script>
