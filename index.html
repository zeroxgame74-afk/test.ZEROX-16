<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>MH Assistant | در حال به‌روزرسانی</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Arabic:wght@300;400;500;600;700&family=Vazirmatn:wght@400;600;700;800;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        html,
        body {
            height: 100%;
            width: 100%;
            overflow: hidden;
            background: #0b0b0e;
        }
        body {
            display: flex;
            align-items: center;
            justify-content: center;
            font-family: 'Noto Sans Arabic', 'Segoe UI', sans-serif;
            padding: 8px;
        }
        .chat-container {
            width: 100%;
            max-width: 420px;
            height: 100%;
            max-height: 750px;
            background: rgba(255, 255, 255, 0.03);
            backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 215, 100, 0.08);
            border-radius: 24px;
            display: flex;
            flex-direction: column;
            padding: 12px 14px 12px;
            box-shadow: 0 20px 60px -12px rgba(0, 0, 0, 0.6);
            overflow: hidden;
        }
        @media (max-width: 480px) {
            .chat-container {
                max-height: 100vh;
                border-radius: 16px;
                padding: 10px 10px 10px;
            }
            body {
                padding: 4px;
            }
        }
        .chat-header {
            display: flex;
            align-items: center;
            gap: 10px;
            padding-bottom: 10px;
            border-bottom: 1px solid rgba(255, 215, 100, 0.06);
            margin-bottom: 8px;
            flex-shrink: 0;
        }
        .chat-avatar {
            width: 44px;
            height: 44px;
            background: linear-gradient(145deg, #f5b042, #d48f2b);
            border-radius: 14px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-family: 'Vazirmatn', sans-serif;
            font-weight: 900;
            font-size: 1.3rem;
            color: #0b0b0e;
            flex-shrink: 0;
        }
        .chat-title {
            font-family: 'Vazirmatn', sans-serif;
            font-weight: 800;
            font-size: 1.1rem;
            color: #f5efe6;
            flex: 1;
        }
        .chat-title .highlight {
            background: linear-gradient(145deg, #f5b042, #d48f2b);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }
        .chat-title small {
            display: block;
            font-family: 'Noto Sans Arabic', sans-serif;
            font-weight: 300;
            font-size: 0.55rem;
            color: #b0a99b;
            -webkit-text-fill-color: #b0a99b;
        }
        .chat-status {
            background: rgba(245, 176, 66, 0.1);
            border: 1px solid rgba(245, 176, 66, 0.1);
            border-radius: 40px;
            padding: 2px 10px;
            font-size: 0.5rem;
            color: #f5b042;
            font-family: 'Vazirmatn', sans-serif;
            font-weight: 600;
            display: flex;
            align-items: center;
            gap: 4px;
            flex-shrink: 0;
        }
        .chat-status i {
            font-size: 0.4rem;
            color: #f5b042;
            animation: pulseDot 1.2s ease-in-out infinite;
        }
        @keyframes pulseDot {
            0%, 100% { opacity: 0.4; transform: scale(0.9); }
            50% { opacity: 1; transform: scale(1.3); }
        }

        .messages {
            flex: 1;
            overflow-y: auto;
            margin-bottom: 8px;
            display: flex;
            flex-direction: column;
            gap: 6px;
            padding: 4px 2px;
            min-height: 0;
            scroll-behavior: smooth;
            justify-content: center; /* مرکز کردن محتوا */
            align-items: center;
        }
        .messages::-webkit-scrollbar {
            width: 3px;
        }
        .messages::-webkit-scrollbar-track {
            background: transparent;
        }
        .messages::-webkit-scrollbar-thumb {
            background: rgba(255, 215, 100, 0.2);
            border-radius: 10px;
        }

        /* کادر اطلاع‌رسانی جدید */
        .update-box {
            background: rgba(255, 215, 100, 0.04);
            border: 1px solid rgba(255, 215, 100, 0.12);
            border-radius: 20px;
            padding: 24px 20px;
            max-width: 320px;
            text-align: center;
            backdrop-filter: blur(4px);
            box-shadow: 0 8px 30px rgba(0,0,0,0.3);
            animation: floatUp 0.8s cubic-bezier(0.22, 1, 0.36, 1);
            margin: 0 4px;
        }
        @keyframes floatUp {
            0% { opacity: 0; transform: translateY(20px) scale(0.96); }
            100% { opacity: 1; transform: translateY(0) scale(1); }
        }
        .update-box .icon-big {
            font-size: 3.2rem;
            color: #f5b042;
            margin-bottom: 10px;
            display: block;
            filter: drop-shadow(0 0 12px rgba(245,176,66,0.2));
        }
        .update-box h2 {
            font-family: 'Vazirmatn', sans-serif;
            font-weight: 800;
            font-size: 1.3rem;
            background: linear-gradient(145deg, #f5b042, #d48f2b);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            margin-bottom: 6px;
        }
        .update-box .sub {
            color: #d6d0c4;
            font-size: 0.9rem;
            font-weight: 400;
            margin-bottom: 4px;
            line-height: 1.8;
        }
        .update-box .sub i {
            color: #f5b042;
            margin: 0 2px;
        }
        .update-box .highlight-text {
            color: #f5b042;
            font-weight: 600;
            font-size: 1rem;
            display: inline-block;
            margin-top: 6px;
            padding: 4px 14px;
            background: rgba(245,176,66,0.06);
            border-radius: 40px;
            border: 1px solid rgba(245,176,66,0.08);
        }
        .update-box .loader-dots {
            display: flex;
            justify-content: center;
            gap: 8px;
            margin-top: 14px;
        }
        .update-box .loader-dots span {
            width: 10px;
            height: 10px;
            background: #f5b042;
            border-radius: 50%;
            display: inline-block;
            animation: bounceDot 1.4s infinite ease-in-out both;
        }
        .update-box .loader-dots span:nth-child(1) { animation-delay: 0s; }
        .update-box .loader-dots span:nth-child(2) { animation-delay: 0.2s; }
        .update-box .loader-dots span:nth-child(3) { animation-delay: 0.4s; }
        @keyframes bounceDot {
            0%, 80%, 100% { transform: scale(0.4); opacity: 0.3; }
            40% { transform: scale(1); opacity: 1; }
        }

        .quick-replies {
            display: flex;
            flex-wrap: wrap;
            gap: 4px;
            margin-bottom: 6px;
            flex-shrink: 0;
            justify-content: center;
        }
        .quick-replies button {
            background: rgba(255, 255, 255, 0.03);
            border: 1px solid rgba(255, 215, 100, 0.08);
            color: #b0a99b;
            padding: 3px 10px;
            border-radius: 40px;
            font-family: 'Vazirmatn', sans-serif;
            font-size: 0.6rem;
            font-weight: 600;
            cursor: default; /* غیرفعال */
            display: inline-flex;
            align-items: center;
            gap: 4px;
            white-space: nowrap;
            opacity: 0.6;
            filter: grayscale(0.3);
            transition: 0.2s;
        }
        .quick-replies button i {
            color: #f5b042;
            font-size: 0.55rem;
        }
        .quick-replies button:hover {
            transform: none;
            background: rgba(255, 255, 255, 0.03);
            border-color: rgba(255, 215, 100, 0.08);
            color: #b0a99b;
        }

        .input-area {
            display: flex;
            align-items: center;
            gap: 6px;
            background: rgba(255, 255, 255, 0.02);
            border: 1px solid rgba(255, 215, 100, 0.06);
            border-radius: 60px;
            padding: 2px 2px 2px 12px;
            transition: 0.3s;
            flex-shrink: 0;
            opacity: 0.5;
        }
        .input-area:focus-within {
            border-color: rgba(245, 176, 66, 0.15);
        }
        .input-area input {
            flex: 1;
            background: transparent;
            border: none;
            color: #5f5a50;
            font-family: 'Noto Sans Arabic', sans-serif;
            font-size: 0.8rem;
            padding: 8px 0;
            outline: none;
            min-width: 0;
            cursor: not-allowed;
        }
        .input-area input::placeholder {
            color: #3d3a33;
        }
        .input-area button {
            background: rgba(245, 176, 66, 0.15);
            border: none;
            color: #5f5a50;
            width: 38px;
            height: 38px;
            border-radius: 50%;
            font-size: 0.9rem;
            cursor: not-allowed;
            transition: 0.2s;
            display: flex;
            align-items: center;
            justify-content: center;
            flex-shrink: 0;
        }
        .input-area button:hover {
            transform: scale(1);
            background: rgba(245, 176, 66, 0.15);
        }

        @media (max-width: 380px) {
            .chat-container {
                padding: 6px 6px 8px;
                border-radius: 12px;
            }
            .chat-title {
                font-size: 0.9rem;
            }
            .chat-avatar {
                width: 36px;
                height: 36px;
                font-size: 1rem;
            }
            .update-box {
                padding: 16px 12px;
                max-width: 260px;
            }
            .update-box h2 {
                font-size: 1.1rem;
            }
            .update-box .sub {
                font-size: 0.75rem;
            }
            .quick-replies button {
                font-size: 0.5rem;
                padding: 2px 6px;
            }
            .input-area input {
                font-size: 0.7rem;
                padding: 6px 0;
            }
            .input-area button {
                width: 32px;
                height: 32px;
                font-size: 0.75rem;
            }
        }
    </style>
</head>
<body>

    <div class="chat-container">
        <!-- هدر دقیقاً مثل قبل -->
        <div class="chat-header">
            <div class="chat-avatar">M</div>
            <div class="chat-title">
                <span class="highlight">MH Assistant</span>
                <small><i class="fas fa-robot"></i> دستیار شخصی</small>
            </div>
            <div class="chat-status">
                <i class="fas fa-circle"></i> به‌روزرسانی
            </div>
        </div>

        <!-- پیام‌ها: فقط باکس اطلاع‌رسانی -->
        <div class="messages" id="messagesBox">
            <div class="update-box">
                <span class="icon-big"><i class="fas fa-brain"></i></span>
                <h2>در حال ارتقا به هوش مصنوعی</h2>
                <div class="sub">
                    <i class="fas fa-cogs"></i> ربات در حال آپدیت است<br>
                    به‌زودی با <strong>بهترین</strong> هوش مصنوعی <br>
                    <span style="color:#f5b042;">برمی‌گردیم</span> <i class="fas fa-rocket"></i>
                </div>
                <div class="highlight-text">
                    <i class="fas fa-clock"></i> ۲۰۲۶ · نسخه جدید
                </div>
                <div class="loader-dots">
                    <span></span><span></span><span></span>
                </div>
            </div>
        </div>

        <!-- دکمه‌های سریع (غیرفعال) -->
        <div class="quick-replies">
            <button><i class="fas fa-question"></i> کی هستی؟</button>
            <button><i class="fas fa-laptop-code"></i> سایت‌ها</button>
            <button><i class="fas fa-palette"></i> طراحی‌ها</button>
            <button><i class="fas fa-code"></i> مهارت‌ها</button>
            <button><i class="fab fa-instagram"></i> اینستا</button>
            <button><i class="fab fa-telegram-plane"></i> تلگرام</button>
            <button><i class="fas fa-user-cog"></i> سازنده</button>
            <button><i class="fas fa-shopping-cart"></i> خرید</button>
        </div>

        <!-- ورودی غیرفعال -->
        <div class="input-area">
            <input type="text" id="userInput" placeholder="در حال به‌روزرسانی ..." autocomplete="off" disabled>
            <button>
                <i class="fas fa-paper-plane"></i>
            </button>
        </div>
    </div>

    <script>
        // (اختیاری) فقط برای نمایش پیام خوش‌آمد در کنسول
        console.log('MH Assistant | در حال به‌روزرسانی به هوش مصنوعی پیشرفته');
        // همه چیز غیرفعال است، فقط نمایش اطلاع‌رسانی
    </script>
</body>
</html>
