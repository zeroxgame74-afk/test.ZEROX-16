<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <title>Tiva AI - دستیار هوشمند</title>

    <link href="https://cdn.jsdelivr.net/gh/rastikerdar/vazirmatn@v33.003/Vazirmatn-font-face.css" rel="stylesheet" />
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css" />

    <style>
        /* ===== ریست کامل ===== */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html,
        body {
            width: 100%;
            height: 100%;
            overflow: hidden;
            font-family: 'Vazirmatn', sans-serif;
            background: #070714;
            position: fixed;
            top: 0;
            left: 0;
        }

        /* ===== پس‌زمینه ===== */
        .bg {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 0;
            background: radial-gradient(ellipse at 30% 40%, #0d0d2b, #050510);
        }

        .bg .dot {
            position: absolute;
            border-radius: 50%;
            animation: floatDot 10s infinite linear;
            opacity: 0.3;
        }
        .bg .dot:nth-child(1) {
            width: 4px;
            height: 4px;
            background: #00d4ff;
            left: 15%;
            animation-duration: 12s;
            box-shadow: 0 0 20px #00d4ff;
        }
        .bg .dot:nth-child(2) {
            width: 3px;
            height: 3px;
            background: #a855f7;
            left: 45%;
            animation-duration: 15s;
            animation-delay: 2s;
            box-shadow: 0 0 15px #a855f7;
        }
        .bg .dot:nth-child(3) {
            width: 5px;
            height: 5px;
            background: #ec4899;
            left: 75%;
            animation-duration: 11s;
            animation-delay: 4s;
            box-shadow: 0 0 25px #ec4899;
        }
        .bg .dot:nth-child(4) {
            width: 3px;
            height: 3px;
            background: #f59e0b;
            left: 90%;
            animation-duration: 14s;
            animation-delay: 1s;
            box-shadow: 0 0 15px #f59e0b;
        }

        @keyframes floatDot {
            0% {
                transform: translateY(100vh) scale(0);
                opacity: 0;
            }
            15% {
                opacity: 0.4;
            }
            85% {
                opacity: 0.4;
            }
            100% {
                transform: translateY(-10vh) scale(2);
                opacity: 0;
            }
        }

        /* ================================================================
                   صفحه اول (Welcome)
                   ================================================================ */
        #welcomePage {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 10;
            display: flex;
            align-items: center;
            justify-content: center;
            background: radial-gradient(ellipse at 30% 40%, #0d0d2b, #050510);
            transition: opacity 0.6s ease, transform 0.6s ease;
        }

        #welcomePage.hide {
            opacity: 0;
            transform: scale(1.05);
            pointer-events: none;
        }

        .welcome-card {
            text-align: center;
            max-width: 480px;
            width: 90%;
            background: rgba(10, 10, 30, 0.5);
            backdrop-filter: blur(30px);
            border-radius: 40px;
            border: 1px solid rgba(255, 255, 255, 0.04);
            padding: 40px 30px;
            box-shadow: 0 30px 80px rgba(0, 0, 0, 0.5);
        }

        .welcome-avatar {
            width: 130px;
            height: 130px;
            border-radius: 50%;
            background: linear-gradient(135deg, #00d4ff, #7c3aed);
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0 auto 16px;
            font-size: 58px;
            color: #fff;
            box-shadow: 0 0 80px rgba(0, 212, 255, 0.2);
            animation: floatAvatar 3s ease-in-out infinite;
            border: 2px solid rgba(0, 212, 255, 0.1);
        }

        @keyframes floatAvatar {
            0%,
            100% {
                transform: translateY(0);
            }
            50% {
                transform: translateY(-12px);
            }
        }

        .welcome-title {
            font-size: 34px;
            font-weight: 900;
            color: #fff;
        }
        .welcome-title span {
            background: linear-gradient(90deg, #00d4ff, #a855f7);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }
        .welcome-sub {
            font-size: 13px;
            color: rgba(255, 255, 255, 0.2);
            margin: 4px 0 10px;
        }
        .welcome-sub i {
            color: #00d4ff;
        }

        .welcome-desc {
            font-size: 14px;
            color: rgba(255, 255, 255, 0.15);
            line-height: 1.8;
            margin-bottom: 20px;
        }
        .welcome-desc i {
            color: #a855f7;
        }

        .welcome-features {
            display: flex;
            justify-content: center;
            gap: 14px;
            margin-bottom: 24px;
            flex-wrap: wrap;
        }
        .welcome-features span {
            font-size: 11px;
            color: rgba(255, 255, 255, 0.12);
            background: rgba(255, 255, 255, 0.02);
            padding: 5px 14px;
            border-radius: 30px;
            border: 1px solid rgba(255, 255, 255, 0.02);
        }
        .welcome-features span i {
            color: #00d4ff;
            margin-left: 4px;
        }

        .btn-enter {
            padding: 14px 44px;
            border-radius: 60px;
            border: none;
            background: linear-gradient(135deg, #00d4ff, #7c3aed);
            color: #fff;
            font-size: 17px;
            font-weight: 700;
            cursor: pointer;
            transition: 0.3s ease;
            display: inline-flex;
            align-items: center;
            gap: 10px;
            font-family: 'Vazirmatn', sans-serif;
            box-shadow: 0 0 40px rgba(0, 212, 255, 0.15);
            animation: btnPulse 2.5s ease-in-out infinite;
        }
        .btn-enter:hover {
            transform: scale(1.05);
            box-shadow: 0 0 70px rgba(0, 212, 255, 0.3);
        }
        @keyframes btnPulse {
            0%,
            100% {
                box-shadow: 0 0 40px rgba(0, 212, 255, 0.15);
            }
            50% {
                box-shadow: 0 0 80px rgba(0, 212, 255, 0.35);
            }
        }

        /* ================================================================
                   صفحه چت
                   ================================================================ */
        #chatPage {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 5;
            display: flex;
            align-items: center;
            justify-content: center;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.6s ease;
        }
        #chatPage.show {
            opacity: 1;
            pointer-events: all;
        }

        .hero {
            width: 94%;
            max-width: 700px;
            height: 92vh;
            max-height: 680px;
            background: rgba(10, 10, 30, 0.8);
            backdrop-filter: blur(20px);
            border-radius: 32px;
            border: 1px solid rgba(255, 255, 255, 0.04);
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.6);
            display: flex;
            flex-direction: column;
            overflow: hidden;
            position: relative;
        }

        /* ===== هدر ===== */
        .header {
            padding: 12px 16px 10px;
            border-bottom: 1px solid rgba(255, 255, 255, 0.03);
            display: flex;
            align-items: center;
            justify-content: space-between;
            flex-shrink: 0;
            min-height: 50px;
        }
        .header .logo {
            display: flex;
            align-items: center;
            gap: 8px;
        }
        .header .logo i {
            font-size: 20px;
            color: #00d4ff;
            animation: iconPulse 2.5s ease-in-out infinite;
        }
        @keyframes iconPulse {
            0%,
            100% {
                transform: scale(1);
            }
            50% {
                transform: scale(1.1);
            }
        }
        .header .logo h1 {
            font-size: 17px;
            color: #fff;
            font-weight: 800;
        }
        .header .logo h1 span {
            background: linear-gradient(90deg, #00d4ff, #a855f7);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }
        .header .right {
            display: flex;
            align-items: center;
            gap: 10px;
        }
        .header .status {
            display: flex;
            align-items: center;
            gap: 5px;
            font-size: 10px;
            color: rgba(255, 255, 255, 0.2);
        }
        .header .status .led {
            width: 5px;
            height: 5px;
            border-radius: 50%;
            background: #22c55e;
            animation: ledBlink 2s ease-in-out infinite;
        }
        @keyframes ledBlink {
            0%,
            100% {
                opacity: 1;
            }
            50% {
                opacity: 0.2;
            }
        }

        /* ===== همبرگر ===== */
        .hamburger {
            width: 32px;
            height: 32px;
            border-radius: 50%;
            border: none;
            background: rgba(255, 255, 255, 0.02);
            color: rgba(255, 255, 255, 0.3);
            font-size: 16px;
            cursor: pointer;
            transition: 0.3s ease;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .hamburger:hover {
            background: rgba(255, 255, 255, 0.05);
            color: #fff;
            transform: rotate(90deg);
        }
        .hamburger.active {
            transform: rotate(90deg);
            color: #00d4ff;
        }

        /* ===== منوی کناری ===== */
        .side-menu {
            position: absolute;
            top: 0;
            right: -300px;
            width: 280px;
            height: 100%;
            background: rgba(10, 10, 30, 0.96);
            backdrop-filter: blur(30px);
            border-left: 1px solid rgba(255, 255, 255, 0.04);
            z-index: 20;
            transition: right 0.4s cubic-bezier(0.4, 0, 0.2, 1);
            display: flex;
            flex-direction: column;
            padding: 16px 0;
            border-radius: 0 28px 28px 0;
        }
        .side-menu.open {
            right: 0;
        }
        .side-menu .menu-header {
            padding: 0 16px 14px;
            border-bottom: 1px solid rgba(255, 255, 255, 0.03);
            display: flex;
            align-items: center;
            justify-content: space-between;
        }
        .side-menu .menu-header h3 {
            color: #fff;
            font-size: 15px;
            font-weight: 700;
        }
        .side-menu .menu-header h3 i {
            color: #00d4ff;
            margin-left: 6px;
        }
        .side-menu .menu-header .close-menu {
            background: none;
            border: none;
            color: rgba(255, 255, 255, 0.15);
            font-size: 18px;
            cursor: pointer;
            transition: 0.3s;
        }
        .side-menu .menu-header .close-menu:hover {
            color: #fff;
            transform: rotate(90deg);
        }

        .side-menu .menu-actions {
            padding: 12px 16px;
            display: flex;
            gap: 8px;
            flex-wrap: wrap;
            border-bottom: 1px solid rgba(255, 255, 255, 0.02);
        }
        .side-menu .menu-actions button {
            padding: 6px 14px;
            border-radius: 30px;
            border: 1px solid rgba(255, 255, 255, 0.03);
            background: rgba(255, 255, 255, 0.01);
            color: rgba(255, 255, 255, 0.2);
            font-size: 11px;
            cursor: pointer;
            transition: 0.3s;
            font-family: 'Vazirmatn', sans-serif;
            display: flex;
            align-items: center;
            gap: 5px;
        }
        .side-menu .menu-actions button:hover {
            background: rgba(255, 255, 255, 0.04);
            color: #fff;
        }
        .side-menu .menu-actions button.danger:hover {
            border-color: rgba(239, 68, 68, 0.2);
            color: #ef4444;
        }
        .side-menu .menu-actions button i {
            font-size: 11px;
        }

        /* ===== تاریخچه ===== */
        .history-list {
            flex: 1;
            overflow-y: auto;
            padding: 8px 12px;
        }
        .history-list::-webkit-scrollbar {
            width: 3px;
        }
        .history-list::-webkit-scrollbar-thumb {
            background: rgba(0, 212, 255, 0.08);
            border-radius: 10px;
        }

        .history-item {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 8px 12px;
            border-radius: 10px;
            margin-bottom: 3px;
            background: rgba(255, 255, 255, 0.01);
            transition: 0.3s;
            border: 1px solid transparent;
        }
        .history-item:hover {
            background: rgba(255, 255, 255, 0.03);
        }
        .history-item.pinned {
            border-color: rgba(0, 212, 255, 0.08);
            background: rgba(0, 212, 255, 0.02);
        }
        .history-item .h-text {
            flex: 1;
            color: rgba(255, 255, 255, 0.35);
            font-size: 12px;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            margin-left: 8px;
        }
        .history-item .h-text i {
            color: #a855f7;
            margin-left: 4px;
            font-size: 10px;
        }
        .history-item .h-actions {
            display: flex;
            gap: 2px;
        }
        .history-item .h-actions button {
            background: none;
            border: none;
            color: rgba(255, 255, 255, 0.06);
            font-size: 11px;
            cursor: pointer;
            transition: 0.3s;
            padding: 3px 5px;
            border-radius: 4px;
        }
        .history-item .h-actions button:hover {
            color: rgba(255, 255, 255, 0.3);
            background: rgba(255, 255, 255, 0.02);
        }
        .history-item .h-actions button.pin-btn:hover {
            color: #f59e0b;
        }
        .history-item .h-actions button.delete-btn:hover {
            color: #ef4444;
        }

        .history-empty {
            color: rgba(255, 255, 255, 0.05);
            text-align: center;
            font-size: 12px;
            padding: 30px 0;
        }
        .history-empty i {
            font-size: 28px;
            display: block;
            margin-bottom: 8px;
            color: rgba(255, 255, 255, 0.03);
        }

        /* ===== پروفایل ===== */
        .profile {
            padding: 8px 16px 8px;
            display: flex;
            align-items: center;
            gap: 10px;
            flex-shrink: 0;
            border-bottom: 1px solid rgba(255, 255, 255, 0.02);
            min-height: 52px;
        }
        .profile .avatar {
            width: 38px;
            height: 38px;
            border-radius: 50%;
            background: linear-gradient(135deg, #00d4ff, #7c3aed);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 17px;
            color: #fff;
            flex-shrink: 0;
            box-shadow: 0 0 20px rgba(0, 212, 255, 0.08);
        }
        .profile .info {
            flex: 1;
            min-width: 0;
        }
        .profile .info .name {
            font-size: 13px;
            font-weight: 700;
            color: #fff;
        }
        .profile .info .name i {
            color: #f59e0b;
            font-size: 10px;
            margin-right: 3px;
        }
        .profile .info .desc {
            font-size: 10px;
            color: rgba(255, 255, 255, 0.18);
            margin-top: 1px;
        }
        .profile .info .desc i {
            margin-left: 3px;
            color: #a855f7;
        }
        .profile .version {
            font-size: 9px;
            color: rgba(255, 255, 255, 0.06);
            background: rgba(255, 255, 255, 0.01);
            padding: 2px 8px;
            border-radius: 30px;
            border: 1px solid rgba(255, 255, 255, 0.02);
            flex-shrink: 0;
        }

        /* ===== پیام‌ها ===== */
        .chat-area {
            flex: 1;
            padding: 10px 16px;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 6px;
            min-height: 0;
            scroll-behavior: smooth;
        }
        .chat-area::-webkit-scrollbar {
            width: 3px;
        }
        .chat-area::-webkit-scrollbar-thumb {
            background: rgba(0, 212, 255, 0.08);
            border-radius: 10px;
        }

        .msg {
            max-width: 82%;
            padding: 8px 13px;
            border-radius: 14px;
            font-size: 13px;
            line-height: 1.6;
            animation: msgIn 0.25s ease forwards;
            opacity: 0;
            word-wrap: break-word;
        }
        @keyframes msgIn {
            0% {
                opacity: 0;
                transform: translateY(5px);
            }
            100% {
                opacity: 1;
                transform: translateY(0);
            }
        }
        .msg.user {
            align-self: flex-end;
            background: linear-gradient(135deg, #00d4ff, #7c3aed);
            color: #fff;
            border-bottom-right-radius: 4px;
        }
        .msg.ai {
            align-self: flex-start;
            background: rgba(255, 255, 255, 0.03);
            color: rgba(255, 255, 255, 0.7);
            border-bottom-left-radius: 4px;
            border: 1px solid rgba(255, 255, 255, 0.02);
        }

        .msg.ai .dot-load {
            display: inline-flex;
            gap: 3px;
        }
        .msg.ai .dot-load span {
            width: 4px;
            height: 4px;
            background: rgba(255, 255, 255, 0.12);
            border-radius: 50%;
            animation: dotJump 1.2s ease-in-out infinite;
        }
        .msg.ai .dot-load span:nth-child(2) {
            animation-delay: 0.2s;
        }
        .msg.ai .dot-load span:nth-child(3) {
            animation-delay: 0.4s;
        }
        @keyframes dotJump {
            0%,
            80%,
            100% {
                transform: scale(0.5);
                opacity: 0.3;
            }
            40% {
                transform: scale(1);
                opacity: 1;
            }
        }

        /* ===== ورودی ===== */
        .input-area {
            padding: 8px 16px 12px;
            border-top: 1px solid rgba(255, 255, 255, 0.02);
            display: flex;
            gap: 8px;
            flex-shrink: 0;
            min-height: 52px;
        }
        .input-area input {
            flex: 1;
            padding: 9px 14px;
            border-radius: 40px;
            border: 1px solid rgba(255, 255, 255, 0.03);
            background: rgba(255, 255, 255, 0.01);
            color: #fff;
            font-family: 'Vazirmatn', sans-serif;
            font-size: 13px;
            outline: none;
            transition: 0.2s;
        }
        .input-area input::placeholder {
            color: rgba(255, 255, 255, 0.08);
        }
        .input-area input:focus {
            border-color: rgba(0, 212, 255, 0.06);
            background: rgba(255, 255, 255, 0.02);
        }
        .input-area input:disabled {
            opacity: 0.3;
        }
        .input-area button {
            padding: 9px 20px;
            border-radius: 40px;
            border: none;
            background: linear-gradient(135deg, #00d4ff, #7c3aed);
            color: #fff;
            font-weight: 700;
            font-size: 13px;
            cursor: pointer;
            transition: 0.2s;
            display: flex;
            align-items: center;
            gap: 6px;
            flex-shrink: 0;
            font-family: 'Vazirmatn', sans-serif;
        }
        .input-area button:hover:not(:disabled) {
            transform: scale(1.03);
        }
        .input-area button:disabled {
            opacity: 0.3;
            cursor: not-allowed;
        }

        .menu-overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.2);
            z-index: 15;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.4s ease;
        }
        .menu-overlay.show {
            opacity: 1;
            pointer-events: all;
        }

        /* ===== ریسپانسیو ===== */
        @media (max-width: 600px) {
            .welcome-card {
                padding: 28px 18px;
                border-radius: 28px;
                margin: 10px;
            }
            .welcome-avatar {
                width: 100px;
                height: 100px;
                font-size: 44px;
            }
            .welcome-title {
                font-size: 26px;
            }
            .welcome-desc {
                font-size: 12px;
            }
            .btn-enter {
                padding: 12px 28px;
                font-size: 15px;
            }
            .welcome-features span {
                font-size: 10px;
                padding: 4px 10px;
            }

            .hero {
                width: 100%;
                height: 100vh;
                max-height: 100vh;
                border-radius: 0;
            }
            .header {
                padding: 10px 12px 8px;
                min-height: 44px;
            }
            .header .logo h1 {
                font-size: 15px;
            }
            .profile {
                padding: 6px 12px 6px;
                min-height: 44px;
                gap: 8px;
            }
            .profile .avatar {
                width: 32px;
                height: 32px;
                font-size: 14px;
            }
            .profile .info .name {
                font-size: 12px;
            }
            .profile .info .desc {
                font-size: 9px;
            }
            .profile .version {
                font-size: 8px;
                padding: 2px 6px;
            }
            .chat-area {
                padding: 8px 12px;
                gap: 5px;
            }
            .msg {
                max-width: 90%;
                font-size: 12px;
                padding: 7px 11px;
            }
            .input-area {
                padding: 6px 12px 10px;
                min-height: 46px;
                gap: 6px;
                flex-wrap: wrap;
            }
            .input-area input {
                font-size: 12px;
                padding: 8px 12px;
                flex: 1 1 100%;
            }
            .input-area button {
                padding: 8px 16px;
                font-size: 12px;
                width: 100%;
                justify-content: center;
            }
            .side-menu {
                width: 250px;
                right: -260px;
            }
            .side-menu.open {
                right: 0;
            }
            .hamburger {
                width: 28px;
                height: 28px;
                font-size: 14px;
            }
        }

        @media (max-width: 380px) {
            .welcome-avatar {
                width: 80px;
                height: 80px;
                font-size: 34px;
            }
            .welcome-title {
                font-size: 22px;
            }
            .btn-enter {
                padding: 10px 20px;
                font-size: 13px;
            }
            .side-menu {
                width: 220px;
                right: -230px;
            }
            .side-menu.open {
                right: 0;
            }
        }
    </style>
</head>
<body>

    <!-- ===== پس‌زمینه ===== -->
    <div class="bg">
        <div class="dot"></div>
        <div class="dot"></div>
        <div class="dot"></div>
        <div class="dot"></div>
    </div>

    <!-- ============================================================
    صفحه اول
    ============================================================ -->
    <div id="welcomePage">
        <div class="welcome-card">
            <div class="welcome-avatar">

    <!-- ============================================================
    صفحه چت
    ============================================================ -->

                <input type="text" id="userInput" placeholder="سوال خود را بنویس..." />

    <script>
        // ============================================================
        //  Tiva AI v3.0 - هوش مصنوعی پیشرفته
        // ============================================================

        // ===== المنت‌ها =====
        const welcomePage = document.getElementById('welcomePage');
        const chatPage = document.getElementById('chatPage');
        const enterBtn = document.getElementById('enterBtn');
        const chatArea = document.getElementById('chatArea');
        const userInput = document.getElementById('userInput');
        const sendBtn = document.getElementById('sendBtn');
        const hamburgerBtn = document.getElementById('hamburgerBtn');
        const sideMenu = document.getElementById('sideMenu');
        const menuOverlay = document.getElementById('menuOverlay');
        const closeMenuBtn = document.getElementById('closeMenuBtn');
        const historyList = document.getElementById('historyList');
        const clearHistoryBtn = document.getElementById('clearHistoryBtn');
        const pinAllBtn = document.getElementById('pinAllBtn');
        const unpinAllBtn = document.getElementById('unpinAllBtn');

        // ===== تاریخچه =====
        let history = [];
        let pinnedIds = new Set();
        let messageIdCounter = 0;

        function loadHistory() {
            try {
                const saved = localStorage.getItem('tiva_history');
                if (saved) {
                    const data = JSON.parse(saved);
                    history = data.history || [];
                    pinnedIds = new Set(data.pinnedIds || []);
                    messageIdCounter = data.counter || 0;
                }
            } catch (e) {}
        }

        function saveHistory() {
            try {
                localStorage.setItem('tiva_history', JSON.stringify({
                    history: history,
                    pinnedIds: Array.from(pinnedIds),
                    counter: messageIdCounter
                }));
            } catch (e) {}
        }

        function addToHistory(text, isUser) {
            const id = ++messageIdCounter;
            history.push({ id, text, isUser, timestamp: Date.now() });
            renderHistory();
            saveHistory();
        }

        function deleteHistoryItem(id) {
            history = history.filter(item => item.id !== id);
            pinnedIds.delete(id);
            renderHistory();
            saveHistory();
        }

        function togglePin(id) {
            if (pinnedIds.has(id)) pinnedIds.delete(id);
            else pinnedIds.add(id);
            renderHistory();
            saveHistory();
        }

        function clearHistory() {
            if (history.length === 0) return;
            if (confirm('آیا مطمئنی می‌خوای کل تاریخچه رو پاک کنی؟')) {
                history = [];
                pinnedIds.clear();
                renderHistory();
                saveHistory();
            }
        }

        function pinAll() {
            history.forEach(item => pinnedIds.add(item.id));
            renderHistory();
            saveHistory();
        }

        function unpinAll() {
            pinnedIds.clear();
            renderHistory();
            saveHistory();
        }

        function renderHistory() {
            if (history.length === 0) {
                historyList.innerHTML = `
                            <div class="history-empty">
                                <i class="fas fa-clock"></i>
                                هنوز پیامی نیست
                            </div>
                        `;
                return;
            }
            const sorted = [...history].sort((a, b) => {
                const aPinned = pinnedIds.has(a.id) ? 1 : 0;
                const bPinned = pinnedIds.has(b.id) ? 1 : 0;
                if (aPinned !== bPinned) return bPinned - aPinned;
                return b.timestamp - a.timestamp;
            });
            let html = '';
            sorted.forEach(item => {
                const isPinned = pinnedIds.has(item.id);
                const icon = item.isUser ? 'fas fa-user' : 'fas fa-robot';
                const label = item.isUser ? 'شما' : 'Tiva';
                html += `
                            <div class="history-item ${isPinned ? 'pinned' : ''}">
                                <div class="h-text">
                                    <i class="${icon}"></i>
                                    ${label}: ${item.text.substring(0, 35)}${item.text.length > 35 ? '...' : ''}
                                </div>
                                <div class="h-actions">
                                    <button class="pin-btn" onclick="togglePin(${item.id})" title="${isPinned ? 'آزاد کردن' : 'سنجاق'}">
                                        <i class="fas ${isPinned ? 'fa-thumbtack' : 'fa-thumbtack-slash'}"></i>
                                    </button>
                                    <button class="delete-btn" onclick="deleteHistoryItem(${item.id})" title="حذف">
                                        <i class="fas fa-trash-can"></i>
                                    </button>
                                </div>
                            </div>
                        `;
            });
            historyList.innerHTML = html;
        }

        // ===== نمایش پیام =====
        function showMessage(type, content, saveToHistory = false) {
            const div = document.createElement('div');
            div.className = `msg ${type}`;
            if (type === 'ai' && content === '...') {
                div.innerHTML = `
                            <div class="dot-load">
                                <span></span><span></span><span></span>
                            </div>
                        `;
            } else {
                div.textContent = content;
                if (saveToHistory && content !== '...') {
                    addToHistory(content, type === 'user');
                }
            }
            chatArea.appendChild(div);
            chatArea.scrollTop = chatArea.scrollHeight;
            return div;
        }

        // ============================================================
        //  🧠 مغز پیشرفته Tiva - پاسخ به همه سوالات
        // ============================================================

        // ===== دانش پایه (بیش از ۵۰ پاسخ) =====
        const knowledge = {
            // احوالپرسی
            'سلام': 'سلام! چطور می‌تونم کمکت کنم؟',
            'درود': 'درود بر تو! چه سوالی داری؟',
            'هی': 'هی! خوبی؟',
            'خوبی': 'عالی‌ام! ممنون که پرسیدی. تو چطوری؟',
            'چطوری': 'خوبم! ممنون. تو چطوری؟',

            // معرفی
            'اسمت چیه': 'اسم من Tiva هست. دستیار هوشمند شما!',
            'کی هستی': 'من Tiva هستم، یک دستیار هوشمند که برای کمک به شما ساخته شدم.',
            'چیکار میکنی': 'به سوالاتت جواب می‌دم، ایده می‌دم و در هر چیزی که نیاز داری کمک می‌کنم.',
            'چه کاری بلدی': 'بلدم به سوالات جواب بدم، ایده بدم، راهنمایی کنم و کلی چیز دیگه!',

            // احساسات
            'ممنون': 'خواهش می‌کنم! هر وقت نیاز داشتی من اینجام.',
            'مرسی': 'خواهش می‌کنم! خوشحالم که می‌تونم کمک کنم.',
            'خداحافظ': 'خداحافظ! روز خوبی داشته باشی 🌟',
            'بای': 'بای! موفق باشی!',
            'عشق': '❤️ ممنون! تو هم عشقی!',
            'دوستت دارم': '❤️ منم دوستت دارم! تو بهترینی!',
            'باحالی': 'ممنون! تو هم باحالی 😎',

            // زمان
            'تاریخ': `امروز ${new Date().toLocaleDateString('fa-IR')} هست.`,
            'امروز': `امروز ${new Date().toLocaleDateString('fa-IR')} هست.`,
            'ساعت': `ساعت الان ${new Date().toLocaleTimeString('fa-IR')} هست.`,
            'چند': 'سوال خوبی پرسیدی! بیشتر توضیح بده.',

            // موضوعات عمومی
            'هوش مصنوعی': 'هوش مصنوعی شاخه‌ای از علوم کامپیوتر هست که ماشین‌ها رو هوشمند میکنه!',
            'برنامه نویسی': 'برنامه‌نویسی هنر نوشتن کد برای کامپیوترهاست. من خودم با جاوااسکریپت نوشته شدم!',
            'کامپیوتر': 'کامپیوتر یه دستگاه الکترونیکی برای پردازش اطلاعات هست.',
            'اینترنت': 'اینترنت یک شبکه جهانی از کامپیوترهاست که اطلاعات رو به اشتراک می‌ذارن.',
            'گوگل': 'گوگل بزرگترین موتور جستجوی جهان هست!',
            'یوتیوب': 'یوتیوب بزرگترین پلتفرم اشتراک ویدیو در جهان هست!',

            // غذا
            'غذا': 'من غذا نمی‌خورم! ولی شنیدم پیتزا و برگر طرفدار دارن!',
            'پیتزا': 'پیتزا یکی از محبوب‌ترین غذاهای جهان! مخصوصاً با پپرونی!',
            'برگر': 'برگر یه غذای سریع و خوشمزه‌ست!',

            // ورزش
            'فوتبال': 'فوتبال محبوب‌ترین ورزش جهان! تیم مورد علاقه‌ات کدومه؟',
            'ورزش': 'ورزش برای سلامتی خیلی مفیده! من خودم یه AI هستم پس ورزش نمی‌کنم!',

            // فیلم و سریال
            'فیلم': 'فیلم‌های علمی تخیلی رو دوست دارم! مثلاً ماتریکس!',
            'سریال': 'سریال‌های خوبی هستن مثل بازی تاج و تخت یا بریکینگ بد!',

            // حیوانات
            'گربه': 'گربه‌ها موجودات بامزه‌ای هستن! من که عاشقشونم 😻',
            'سگ': 'سگ‌ها وفادارترین حیوانات هستن!',
            'حیوان': 'حیوانات موجودات زنده‌ای هستن که تنوع زیادی دارن!',

            // علمی
            'کهکشان': 'کهکشان مجموعه‌ای از ستاره‌ها، سیارات و گرد و غبار کیهانی هست.',
            'سیاره': 'سیاره‌ها اجرام آسمانی هستن که به دور خورشید می‌چرخن.',
            'ستاره': 'ستاره‌ها توپ‌های عظیم از گازهای داغ هستن که نور و گرما تولید می‌کنن.',

            // فلسفی
            'زندگی': 'زندگی یک سفر زیباست! هدفش رو خودت باید پیدا کنی.',
            'هدف': 'هدف به زندگی معنی میده. مهم اینه که بهش برسی!',
            'عشق': 'عشق قوی‌ترین احساس انسانه! من به عنوان یه AI عشق رو درک می‌کنم ❤️',

            // تکنولوژی
            'موبایل': 'موبایل یا گوشی هوشمند، یه دستگاه کوچیک ولی قدرتمنده!',
            'لپ تاپ': 'لپ‌تاپ یه کامپیوتر قابل حمله که برای کار و بازی استفاده میشه.',
            'برنامه': 'برنامه‌ها نرم‌افزارهایی هستن که کارهای خاصی رو انجام می‌دن.',

            // جوک
            'خنده': '😂 یه جوک: چرا کامپیوترها خوشحال نیستن؟ چون مادربردشون خرابه!',
            'جک': '😂 به یه کامپیوتر گفتن چطوری؟ گفت: بوت آپ!',
            'لطیفه': '😂 چرا برنامه‌نویس‌ها همیشه خوابن؟ چون به کداشون استراحت می‌دن!',

            // سوالات خاص
            'کی ساخته': 'من توسط یه توسعه‌دهنده حرفه‌ای ساخته شدم تا به شما کمک کنم!',
            'چند سال': 'من همونقدر سالم که اولین بار اجرا شدم! (تازه متولد شدم!)',
            'رنگ': 'رنگ مورد علاقه من آبی و بنفشه!',
            'موزیک': 'من موسیقی رو دوست دارم! مخصوصاً سبک الکترونیک.',

            // ریاضی (برای تطابق عبارات)
            'جمع': 'برای جمع کردن اعداد، فقط کافیه علامت + رو بینشون بذاری!',
            'تفریق': 'برای تفریق، از علامت - استفاده کن!',
            'ضرب': 'برای ضرب، از علامت * استفاده کن!',
        };

        // ===== پاسخ‌دهی پیشرفته =====
        function processQuestion(text) {
            const clean = text.trim().toLowerCase();

            // ۱. تطابق کامل با دیکشنری
            for (const [key, value] of Object.entries(knowledge)) {
                if (clean.includes(key)) {
                    return value;
                }
            }

            // ۲. تشخیص عملیات ریاضی
            const mathMatch = clean.match(/(\d+)\s*([+\-*/])\s*(\d+)/);
            if (mathMatch) {
                const n1 = parseInt(mathMatch[1]);
                const op = mathMatch[2];
                const n2 = parseInt(mathMatch[3]);
                let res;
                switch (op) {
                    case '+':
                        res = n1 + n2;
                        break;
                    case '-':
                        res = n1 - n2;
                        break;
                    case '*':
                        res = n1 * n2;
                        break;
                    case '/':
                        res = n2 !== 0 ? n1 / n2 : 'نمی‌تونم بر صفر تقسیم کنم!';
                        break;
                    default:
                        res = 'نمی‌دونم!';
                }
                return `جوابش میشه: ${res}`;
            }

            // ۳. تشخیص سوالات "آیا"
            if (clean.includes('آیا')) {
                const answers = ['بله!', 'خیر!', 'ممکنه!', 'قطعاً!', 'نه دقیقاً!', 'احتمالاً!'];
                return answers[Math.floor(Math.random() * answers.length)];
            }

            // ۴. تشخیص سوالات "چرا" و "چطور"
            if (clean.includes('چرا') || clean.includes('چطور') || clean.includes('چگونه')) {
                const responses = [
                    'سوال خوبی پرسیدی! ولی برای جواب دقیق‌تر، بیشتر توضیح بده.',
                    'هوم... این سوال نیاز به تفکر داره!',
                    'جالب بود! راستش رو بخوای جوابش رو نمی‌دونم، ولی می‌تونیم با هم فکر کنیم.',
                    'سوال عمیقی پرسیدی! بذار فکر کنم...'
                ];
                return responses[Math.floor(Math.random() * responses.length)];
            }

            // ۵. تشخیص "چه" و "کدام"
            if (clean.includes('چه') || clean.includes('کدام')) {
                const responses = [
                    'فکر می‌کنم بهترین گزینه همین باشه!',
                    'بستگی به شرایط داره، ولی می‌تونم کمک کنم.',
                    'سوال خوبی پرسیدی! بذار فکر کنم...',
                ];
                return responses[Math.floor(Math.random() * responses.length)];
            }

            // ۶. تشخیص سوالات با "چند" (غیر ریاضی)
            if (clean.includes('چند')) {
                const responses = [
                    'چند تا؟ بستگی داره! بیشتر توضیح بده.',
                    'این سوال به شرایط بستگی داره.',
                ];
                return responses[Math.floor(Math.random() * responses.length)];
            }

            // ۷. تشخیص اسم
            if (clean.includes('اسم') || clean.includes('نام')) {
                return 'اسم من Tiva هست! خوشحالم که باهام حرف می‌زنی.';
            }

            // ۸. تشخیص کار و شغل
            if (clean.includes('کار') || clean.includes('شغل')) {
                return 'من یک دستیار هوشمند هستم و وظیفه‌ام کمک به شماست!';
            }

            // ۹. پاسخ‌های هوشمندانه پیش‌فرض
            const fallbacks = [
                'سوال خوبی پرسیدی! ولی فعلاً دانش من محدوده. می‌تونی ساده‌تر بپرسی؟',
                'متوجه شدم! ولی برای جواب دقیق‌تر، کمی بیشتر توضیح بده.',
                'آره! ولی راستش رو بخوای فعلاً نمی‌دونم. سعی کن ساده‌تر بپرسی.',
                'جالب بود! ولی راستش رو بخوای جوابش رو نمی‌دونم. شاید با هم فکر کنیم!',
                'هوم... این یه سوال چالش‌برانگیزه! بیشتر توضیح بده تا بهتر کمک کنم.',
                'راستش رو بخوای جواب این سوال رو نمی‌دونم، ولی خوشحالم که پرسیدی!',
                'سوال خوبی پرسیدی! ولی من هنوز در حال یادگیری‌ام. می‌تونی دقیق‌تر بپرسی؟',
                'فکر می‌کنم جواب این سوال رو نمی‌دونم، ولی می‌تونیم با هم بررسی کنیم!',
            ];
            return fallbacks[Math.floor(Math.random() * fallbacks.length)];
        }

        // ===== ارسال پیام =====
        function sendMessage() {
            const text = userInput.value.trim();
            if (!text) return;

            showMessage('user', text, true);
            userInput.value = '';
            userInput.disabled = true;
            sendBtn.disabled = true;

            const loading = showMessage('ai', '...');

            setTimeout(() => {
                loading.remove();
                const reply = processQuestion(text);
                showMessage('ai', reply, true);
                userInput.disabled = false;
                sendBtn.disabled = false;
                userInput.focus();
            }, 200);
        }

        // ===== منو =====
        function toggleMenu() {
            sideMenu.classList.toggle('open');
            menuOverlay.classList.toggle('show');
            hamburgerBtn.classList.toggle('active');
        }

        function closeMenu() {
            sideMenu.classList.remove('open');
            menuOverlay.classList.remove('show');
            hamburgerBtn.classList.remove('active');
        }

        // ===== رویدادها =====
        enterBtn.addEventListener('click', function() {
            welcomePage.classList.add('hide');
            chatPage.classList.add('show');
            loadHistory();
            renderHistory();
            setTimeout(() => userInput.focus(), 400);
        });

        hamburgerBtn.addEventListener('click', toggleMenu);
        closeMenuBtn.addEventListener('click', closeMenu);
        menuOverlay.addEventListener('click', closeMenu);

        clearHistoryBtn.addEventListener('click', clearHistory);
        pinAllBtn.addEventListener('click', pinAll);
        unpinAllBtn.addEventListener('click', unpinAll);

        sendBtn.addEventListener('click', sendMessage);
        userInput.addEventListener('keydown', function(e) {
            if (e.key === 'Enter') sendMessage();
        });

        setTimeout(() => userInput.focus(), 500);

        // ===== توابع گلوبال =====
        window.deleteHistoryItem = deleteHistoryItem;
        window.togglePin = togglePin;
    </script>

</body>
