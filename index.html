<!DOCTYPE html>
<html dir="rtl" lang="fa">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ممد رادیو</title>
  <!-- Font Awesome 6 (رایگان) -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
  <!-- فونت‌های اختصاصی -->
  <link href="https://fonts.googleapis.com/css2?family=Lalezar&family=Vazirmatn:wght@400;700;900&display=swap" rel="stylesheet">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: 'Vazirmatn', sans-serif;
      background: linear-gradient(145deg, #1a0b2e, #2d1b4e);
      color: #fff;
      min-height: 100vh;
      padding: 20px;
    }
    /* هدر با اسم "ممد" */
    .header {
      text-align: center;
      padding: 30px 0;
      background: rgba(255, 255, 255, 0.05);
      border-radius: 40px;
      backdrop-filter: blur(10px);
      border: 1px solid rgba(255, 255, 255, 0.1);
      margin-bottom: 30px;
    }
    .header h1 {
      font-family: 'Lalezar', cursive;
      font-size: 4rem;
      background: linear-gradient(135deg, #ff8a5c, #ff4d6d);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      text-shadow: 0 0 40px rgba(255, 77, 109, 0.3);
      letter-spacing: 2px;
    }
    .header span { font-size: 1.2rem; opacity: 0.8; }

    /* پخش‌کننده */
    .player {
      max-width: 500px;
      margin: 0 auto 40px;
      background: rgba(0,0,0,0.4);
      padding: 30px;
      border-radius: 60px;
      backdrop-filter: blur(12px);
      border: 1px solid rgba(255,255,255,0.15);
      box-shadow: 0 20px 60px rgba(0,0,0,0.6);
      text-align: center;
    }
    .player .cover {
      width: 120px;
      height: 120px;
      border-radius: 50%;
      background: linear-gradient(135deg, #ff8a5c, #ff4d6d);
      margin: 0 auto 20px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 3.5rem;
      box-shadow: 0 0 40px #ff4d6d55;
      animation: spin 20s linear infinite paused;
    }
    .player .cover i { animation: spin 20s linear infinite; }
    @keyframes spin { 100% { transform: rotate(360deg); } }

    .player .title {
      font-family: 'Vazirmatn', sans-serif;
      font-weight: 900;
      font-size: 1.6rem;
      background: linear-gradient(135deg, #ffd6a8, #ffb38b);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }
    .player .sub {
      font-family: 'Lalezar', cursive;
      font-size: 1.2rem;
      color: #aaa;
      margin: 5px 0 20px;
    }
    .player audio {
      width: 100%;
      border-radius: 50px;
      background: #222;
      height: 40px;
    }
    .player audio::-webkit-media-controls-panel { background: #2a1a3a; }

    /* لیست آهنگ‌ها با استایل "استعداد" و "اردیبهشت" */
    .playlist {
      max-width: 700px;
      margin: 0 auto;
      display: flex;
      flex-direction: column;
      gap: 12px;
    }
    .track {
      background: rgba(255,255,255,0.04);
      padding: 18px 25px;
      border-radius: 50px;
      backdrop-filter: blur(6px);
      border: 1px solid rgba(255,255,255,0.06);
      display: flex;
      align-items: center;
      gap: 18px;
      transition: 0.3s;
      cursor: pointer;
    }
    .track:hover {
      background: rgba(255, 138, 92, 0.15);
      border-color: #ff8a5c;
      transform: scale(1.01);
    }
    .track .icon {
      font-size: 1.8rem;
      color: #ff8a5c;
      width: 40px;
      text-align: center;
    }
    .track .info {
      flex: 1;
    }
    .track .info .name {
      font-family: 'Vazirmatn', sans-serif;
      font-weight: 700;
      font-size: 1.1rem;
    }
    .track .info .name i { 
      font-family: 'Lalezar', cursive; 
      font-weight: normal;
      color: #ffb38b;
      margin-right: 8px;
    }
    .track .info .artist {
      font-family: 'Lalezar', cursive;
      font-size: 0.95rem;
      color: #ccc;
    }
    .track .time {
      font-family: 'Vazirmatn', sans-serif;
      font-weight: 400;
      font-size: 0.9rem;
      color: #888;
    }
    /* برچسب‌های استعداد و اردیبهشت */
    .badge {
      display: inline-block;
      padding: 2px 14px;
      border-radius: 30px;
      font-size: 0.7rem;
      font-weight: 900;
      letter-spacing: 0.5px;
      margin-right: 10px;
    }
    .badge-estedad {
      background: #ff8a5c33;
      color: #ff8a5c;
      border: 1px solid #ff8a5c;
      font-family: 'Vazirmatn', sans-serif;
    }
    .badge-ordibehesht {
      background: #4d6dff33;
      color: #6d8aff;
      border: 1px solid #6d8aff;
      font-family: 'Lalezar', cursive;
    }

    .footer {
      text-align: center;
      margin-top: 50px;
      opacity: 0.5;
      font-size: 0.9rem;
    }
  </style>
</head>
<body>

<div class="header">
  <h1>ممد</h1>
  <span><i class="fa-solid fa-headphones"></i> رادیو ممد – همیشه آنلاین</span>
</div>

<div class="player">
  <div class="cover">
    <i class="fa-solid fa-record-vinyl"></i>
  </div>
  <div class="title">آهنگ شاد شماره ۱</div>
  <div class="sub"><i class="fa-regular fa-star"></i> استعداد ویژه</div>
  <audio controls autoplay>
    <source src="https://www.soundhelix.com/examples/mp3/SoundHelix-Song-1.mp3" type="audio/mpeg">
  </audio>
</div>

<div class="playlist">
  <!-- ترک ۱ با تگ استعداد -->
  <div class="track">
    <div class="icon"><i class="fa-solid fa-music"></i></div>
    <div class="info">
      <div class="name">
        <i class="fa-regular fa-gem"></i> آهنگ شماره یک
        <span class="badge badge-estedad">استعداد</span>
      </div>
      <div class="artist">خواننده: ممد آرتیست</div>
    </div>
    <div class="time">۳:۴۲</div>
  </div>

  <!-- ترک ۲ با تگ اردیبهشت -->
  <div class="track">
    <div class="icon"><i class="fa-solid fa-cloud-moon"></i></div>
    <div class="info">
      <div class="name">
        <i class="fa-regular fa-calendar"></i> بهار اردیبهشت
        <span class="badge badge-ordibehesht">اردیبهشت</span>
      </div>
      <div class="artist">خواننده: گلنار</div>
    </div>
    <div class="time">۴:۱۵</div>
  </div>

  <!-- ترک ۳ با آیکون awesome -->
  <div class="track">
    <div class="icon"><i class="fa-solid fa-fire"></i></div>
    <div class="info">
      <div class="name">
        <i class="fa-regular fa-sun"></i> داغ ترین آهنگ
        <span class="badge badge-estedad">استعداد</span>
        <span class="badge badge-ordibehesht">اردیبهشت</span>
      </div>
      <div class="artist">خواننده: تیم ممد</div>
    </div>
    <div class="time">۲:۵۸</div>
  </div>
</div>

<div class="footer">
  <i class="fa-regular fa-copyright"></i> تمام حقوق برای ممد رادیو محفوظ است
  <br>
  <i class="fa-solid fa-code"></i> ساخته شده با <i class="fa-regular fa-heart" style="color: #ff4d6d;"></i> و فونت‌های awesome
</div>

</body>
</html>
