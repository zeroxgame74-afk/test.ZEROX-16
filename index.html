<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>دستیار mohamad hossein snti</title>

  <!-- فونت‌های مشابه سایت اصلی -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Arabic:wght@300;400;500;600;700&family=Vazirmatn:wght@400;600;700;800;900&display=swap" rel="stylesheet">
  
  <!-- Font Awesome 6 -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">

  <style>
    /* ===== بازنشانی و رنگ‌های اصلی ===== */
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      background: #0b0b0e;
      color: #eaeef2;
      font-family: 'Noto Sans Arabic', 'Segoe UI', sans-serif;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 1.5rem;
      background-image: radial-gradient(circle at 30% 20%, rgba(255, 200, 80, 0.03) 0%, transparent 60%);
    }

    /* ===== جعبه ربات ===== */
    .chat-container {
      width: 100%;
      max-width: 720px;
      background: rgba(255, 255, 255, 0.02);
      backdrop-filter: blur(8px);
      border: 1px solid rgba(255, 215, 100, 0.08);
      border-radius: 32px;
      padding: 1.8rem 2rem 2rem;
      box-shadow: 0 24px 64px -16px rgba(0, 0, 0, 0.6);
      transition: 0.3s;
    }

    .chat-container:hover {
      border-color: rgba(255, 215, 100, 0.15);
      box-shadow: 0 28px 72px -16px rgba(0, 0, 0, 0.7);
    }

    /* ===== هدر ربات ===== */
    .chat-header {
      display: flex;
      align-items: center;
      gap: 1rem;
      padding-bottom: 1.2rem;
      border-bottom: 1px solid rgba(255, 215, 100, 0.06);
      margin-bottom: 1.2rem;
    }

    .chat-avatar {
      width: 52px;
      height: 52px;
      background: linear-gradient(145deg, #f5b042, #d48f2b);
      border-radius: 18px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: 'Vazirmatn', sans-serif;
      font-weight: 900;
      font-size: 1.6rem;
      color: #0b0b0e;
      box-shadow: 0 8px 18px -6px rgba(200, 150, 50, 0.25);
      flex-shrink: 0;
    }

    .chat-title {
      font-family: 'Vazirmatn', sans-serif;
      font-weight: 800;
      font-size: 1.4rem;
      color: #f5efe6;
      letter-spacing: -0.3px;
    }

    .chat-title small {
      display: block;
      font-family: 'Noto Sans Arabic', sans-serif;
      font-weight: 300;
      font-size: 0.75rem;
      color: #b0a99b;
      letter-spacing: 0.5px;
      margin-top: 2px;
    }

    .chat-status {
      margin-right: auto;
      background: rgba(245, 176, 66, 0.12);
      border: 1px solid rgba(245, 176, 66, 0.15);
      border-radius: 40px;
      padding: 0.2rem 1rem;
      font-size: 0.7rem;
      color: #f5b042;
      font-family: 'Vazirmatn', sans-serif;
      font-weight: 600;
      display: flex;
      align-items: center;
      gap: 0.4rem;
    }

    .chat-status i {
      font-size: 0.55rem;
      color: #4caf50;
      animation: pulseDot 1.8s ease-in-out infinite;
    }

    @keyframes pulseDot {
      0%, 100% { opacity: 1; transform: scale(1); }
      50% { opacity: 0.3; transform: scale(0.7); }
    }

    /* ===== جعبه پیام‌ها ===== */
    .messages {
      max-height: 380px;
      overflow-y: auto;
      padding-left: 0.2rem;
      margin-bottom: 1.2rem;
      display: flex;
      flex-direction: column;
      gap: 0.8rem;
      scrollbar-width: thin;
      scrollbar-color: rgba(255, 215, 100, 0.15) transparent;
    }

    .messages::-webkit-scrollbar {
      width: 4px;
    }
    .messages::-webkit-scrollbar-track {
      background: transparent;
    }
    .messages::-webkit-scrollbar-thumb {
      background: rgba(255, 215, 100, 0.2);
      border-radius: 10px;
    }

    /* ===== هر پیام ===== */
    .message {
      display: flex;
      gap: 0.7rem;
      align-items: flex-start;
      animation: msgIn 0.35s cubic-bezier(0.22, 1, 0.36, 1);
    }

    .message.bot {
      flex-direction: row;
    }

    .message.user {
      flex-direction: row-reverse;
    }

    @keyframes msgIn {
      0% { opacity: 0; transform: translateY(12px) scale(0.97); }
      100% { opacity: 1; transform: translateY(0) scale(1); }
    }

    .message .avatar {
      width: 34px;
      height: 34px;
      border-radius: 12px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 0.9rem;
      flex-shrink: 0;
      background: rgba(255, 255, 255, 0.04);
      border: 1px solid rgba(255, 215, 100, 0.06);
      color: #b0a99b;
    }

    .message.bot .avatar {
      background: rgba(245, 176, 66, 0.12);
      color: #f5b042;
      border-color: rgba(245, 176, 66, 0.1);
    }

    .message.user .avatar {
      background: rgba(255, 255, 255, 0.06);
      color: #eaeef2;
    }

    .message .bubble {
      max-width: 80%;
      padding: 0.6rem 1.2rem;
      border-radius: 18px;
      font-family: 'Noto Sans Arabic', sans-serif;
      font-size: 0.95rem;
      line-height: 1.8;
      word-break: break-word;
      background: rgba(255, 255, 255, 0.03);
      border: 1px solid rgba(255, 215, 100, 0.06);
      color: #d6d0c4;
      box-shadow: 0 2px 12px -4px rgba(0, 0, 0, 0.2);
    }

    .message.bot .bubble {
      background: rgba(255, 215, 100, 0.04);
      border-color: rgba(255, 215, 100, 0.08);
      border-top-right-radius: 4px;
    }

    .message.user .bubble {
      background: rgba(245, 176, 66, 0.08);
      border-color: rgba(245, 176, 66, 0.12);
      border-top-left-radius: 4px;
      color: #f5efe6;
    }

    .message .bubble strong {
      color: #f5b042;
      font-weight: 600;
    }

    .message .bubble i {
      color: #f5b042;
      margin-left: 0.3rem;
    }

    .message .bubble .fa-robot {
      font-size: 1rem;
    }

    /* ===== پیام‌های سریع (دکمه‌های پیشنهادی) ===== */
    .quick-replies {
      display: flex;
      flex-wrap: wrap;
      gap: 0.6rem;
      margin-top: 0.2rem;
    }

    .quick-replies button {
      background: rgba(255, 255, 255, 0.03);
      border: 1px solid rgba(255, 215, 100, 0.08);
      color: #b0a99b;
      padding: 0.3rem 1rem;
      border-radius: 40px;
      font-family: 'Vazirmatn', sans-serif;
      font-size: 0.75rem;
      font-weight: 600;
      cursor: pointer;
      transition: 0.3s;
      backdrop-filter: blur(4px);
      display: inline-flex;
      align-items: center;
      gap: 0.5rem;
    }

    .quick-replies button i {
      color: #f5b042;
      font-size: 0.7rem;
    }

    .quick-replies button:hover {
      background: rgba(245, 176, 66, 0.08);
      border-color: rgba(245, 176, 66, 0.2);
      color: #f5efe6;
      transform: translateY(-2px);
      box-shadow: 0 4px 16px -6px rgba(245, 176, 66, 0.1);
    }

    /* ===== ورودی ===== */
    .input-area {
      display: flex;
      align-items: center;
      gap: 0.8rem;
      background: rgba(255, 255, 255, 0.02);
      border: 1px solid rgba(255, 215, 100, 0.06);
      border-radius: 60px;
      padding: 0.3rem 0.3rem 0.3rem 1.2rem;
      transition: 0.3s;
      margin-top: 0.5rem;
    }

    .input-area:focus-within {
      border-color: rgba(245, 176, 66, 0.25);
      background: rgba(255, 255, 255, 0.04);
      box-shadow: 0 0 0 3px rgba(245, 176, 66, 0.05);
    }

    .input-area input {
      flex: 1;
      background: transparent;
      border: none;
      color: #eaeef2;
      font-family: 'Noto Sans Arabic', sans-serif;
      font-size: 0.95rem;
      padding: 0.6rem 0;
      outline: none;
      min-width: 0;
    }

    .input-area input::placeholder {
      color: #5f5a50;
      font-weight: 300;
    }

    .input-area button {
      background: linear-gradient(145deg, #f5b042, #d48f2b);
      border: none;
      color: #0b0b0e;
      width: 44px;
      height: 44px;
      border-radius: 50%;
      font-size: 1.1rem;
      cursor: pointer;
      transition: 0.3s cubic-bezier(0.34, 1.56, 0.64, 1);
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
      box-shadow: 0 4px 16px -6px rgba(245, 176, 66, 0.25);
    }

    .input-area button:hover {
      transform: scale(1.08);
      box-shadow: 0 8px 24px -6px rgba(245, 176, 66, 0.4);
    }

    .input-area button:active {
      transform: scale(0.95);
    }

    .input-area button i {
      margin: 0;
    }

    /* ===== ریسپانسیو ===== */
    @media (max-width: 600px) {
      .chat-container {
        padding: 1.2rem 1rem;
        border-radius: 24px;
      }
      .chat-title {
        font-size: 1.1rem;
      }
      .chat-avatar {
        width: 42px;
        height: 42px;
        font-size: 1.2rem;
      }
      .message .bubble {
        font-size: 0.85rem;
        padding: 0.5rem 1rem;
        max-width: 90%;
      }
      .input-area input {
        font-size: 0.85rem;
      }
      .quick-replies button {
        font-size: 0.7rem;
        padding: 0.2rem 0.8rem;
      }
    }

    @media (max-width: 400px) {
      .chat-container {
        padding: 1rem 0.8rem;
      }
      .chat-status {
        font-size: 0.6rem;
        padding: 0.1rem 0.6rem;
      }
      .message .avatar {
        width: 28px;
        height: 28px;
        font-size: 0.7rem;
      }
    }

    /* ===== اسکرول‌بار کلی ===== */
    ::-webkit-scrollbar {
      width: 5px;
    }
    ::-webkit-scrollbar-track {
      background: #0b0b0e;
    }
    ::-webkit-scrollbar-thumb {
      background: #f5b042;
      border-radius: 10px;
    }
  </style>
</head>
<body>

<div class="chat-container">
  
  <!-- هدر -->
  <div class="chat-header">
    <div class="chat-avatar">M</div>
    <div class="chat-title">
      دستیار mohamad hossein
      <small><i class="fas fa-robot" style="color:#f5b042;"></i> همراه همیشگی</small>
    </div>
    <div class="chat-status">
      <i class="fas fa-circle"></i> آنلاین
    </div>
  </div>

  <!-- محوطه پیام‌ها -->
  <div class="messages" id="messagesBox">
    <!-- پیام خوش‌آمدگویی (ربات) -->
    <div class="message bot">
      <div class="avatar"><i class="fas fa-robot"></i></div>
      <div class="bubble">
        <i class="fas fa-hand-peace"></i> سلام! من <strong>دستیار mohamad hossein</strong> هستم.<br>
        می‌تونم درباره <strong>سایت‌ها، طراحی‌ها، پروژه‌ها</strong> و هرچیزی که توی سایت هست کمک کنم.<br>
        <span style="color:#f5b042; font-size:0.85rem;">👇 یه سوال بپرس یا از دکمه‌های زیر استفاده کن.</span>
      </div>
    </div>
  </div>

  <!-- دکمه‌های سریع -->
  <div class="quick-replies" id="quickReplies">
    <button onclick="askQuestion('معرفی کن')"><i class="fas fa-user-astronaut"></i> معرفی</button>
    <button onclick="askQuestion('سایت‌ها')"><i class="fas fa-laptop-code"></i> سایت‌ها</button>
    <button onclick="askQuestion('طراحی‌ها')"><i class="fas fa-palette"></i> طراحی‌ها</button>
    <button onclick="askQuestion('برنامه‌ها')"><i class="fas fa-puzzle-piece"></i> برنامه‌ها</button>
    <button onclick="askQuestion('درباره من')"><i class="fas fa-info-circle"></i> درباره من</button>
  </div>

  <!-- ورودی -->
  <div class="input-area">
    <input type="text" id="userInput" placeholder="سوال یا پیامت رو بنویس..." autocomplete="off">
    <button onclick="sendMessage()" aria-label="ارسال">
      <i class="fas fa-paper-plane"></i>
    </button>
  </div>

</div>

<script>
  // ============================================================
  //  دیتابیس پاسخ‌های هوشمند (همان محتوای سایت)
  // ============================================================
  const botResponses = {

    // ----- معرفی کلی -----
    'معرفی کن': `
      <i class="fas fa-user-astronaut"></i> من <strong>mohamad hossein snti</strong> هستم، توسعه‌دهنده وب و طراح گرافیک.<br>
      از سال ۱۴۰۳ وارد دنیای برنامه‌نویسی شدم و عاشق خلق چیزهای جدیدم.<br>
      <i class="fas fa-heart" style="color:#f5b042;"></i> ترکیب <strong>هنر و تکنولوژی</strong> هدف منه.
    `,
    'معرفی': `
      <i class="fas fa-user-astronaut"></i> من <strong>mohamad hossein snti</strong> هستم، توسعه‌دهنده وب و طراح گرافیک.<br>
      از سال ۱۴۰۳ وارد دنیای برنامه‌نویسی شدم و عاشق خلق چیزهای جدیدم.<br>
      <i class="fas fa-heart" style="color:#f5b042;"></i> ترکیب <strong>هنر و تکنولوژی</strong> هدف منه.
    `,

    // ----- سایت‌ها -----
    'سایت‌ها': `
      <i class="fas fa-laptop-code"></i> <strong>سایت‌های طراحی شده:</strong><br>
      🎮 <strong>ZEROX</strong> – پلتفرم تخصصی گیم و اخبار<br>
      🍔 <strong>کالفود</strong> – پلتفرم سفارش غذای لذیذ<br>
      🎮 <strong>کوروش گیم</strong> – فروشگاه اکانت گیم<br>
      <span style="color:#b0a99b; font-size:0.85rem;">برای مشاهده هرکدوم به بخش <strong>سایت‌های طراحی شده</strong> برو.</span>
    `,
    'سایت': `
      <i class="fas fa-laptop-code"></i> <strong>سایت‌های طراحی شده:</strong><br>
      🎮 <strong>ZEROX</strong> – پلتفرم تخصصی گیم و اخبار<br>
      🍔 <strong>کالفود</strong> – پلتفرم سفارش غذای لذیذ<br>
      🎮 <strong>کوروش گیم</strong> – فروشگاه اکانت گیم<br>
      <span style="color:#b0a99b; font-size:0.85rem;">برای مشاهده هرکدوم به بخش <strong>سایت‌های طراحی شده</strong> برو.</span>
    `,

    // ----- طراحی‌ها -----
    'طراحی‌ها': `
      <i class="fas fa-palette"></i> <strong>نمونه طراحی‌های هنری:</strong><br>
      🖼 <strong>«گفتند زلف یار...»</strong> – ادای احترام به نام علی (ع)<br>
      🖼 <strong>«اهواز... خاک غسل‌شده»</strong> – یاد شهدای جنوب ایران<br>
      <span style="color:#b0a99b; font-size:0.85rem;">هر دو در بخش <strong>طراحی‌هام</strong> قابل مشاهده و دانلود هستن.</span>
    `,
    'طراحی': `
      <i class="fas fa-palette"></i> <strong>نمونه طراحی‌های هنری:</strong><br>
      🖼 <strong>«گفتند زلف یار...»</strong> – ادای احترام به نام علی (ع)<br>
      🖼 <strong>«اهواز... خاک غسل‌شده»</strong> – یاد شهدای جنوب ایران<br>
      <span style="color:#b0a99b; font-size:0.85rem;">هر دو در بخش <strong>طراحی‌هام</strong> قابل مشاهده و دانلود هستن.</span>
    `,

    // ----- برنامه‌ها -----
    'برنامه‌ها': `
      <i class="fas fa-puzzle-piece"></i> بخش <strong>برنامه‌ها</strong> در حال توسعه است.<br>
      به زودی اپلیکیشن‌ها و ابزارهای جدیدی اضافه می‌شه.<br>
      <i class="fas fa-code" style="color:#f5b042;"></i> منتظر آپدیت‌های بعدی باش!
    `,
    'برنامه': `
      <i class="fas fa-puzzle-piece"></i> بخش <strong>برنامه‌ها</strong> در حال توسعه است.<br>
      به زودی اپلیکیشن‌ها و ابزارهای جدیدی اضافه می‌شه.<br>
      <i class="fas fa-code" style="color:#f5b042;"></i> منتظر آپدیت‌های بعدی باش!
    `,

    // ----- درباره من -----
    'درباره من': `
      <i class="fas fa-user"></i> <strong>mohamad hossein snti</strong><br>
      توسعه‌دهنده وب و طراح گرافیک از سال ۱۴۰۳.<br>
      عاشق کد تمیز، طراحی مینیمال و تجربه کاربری روان.<br>
      <i class="fas fa-rocket" style="color:#f5b042;"></i> هدف: ترکیب هنر و تکنولوژی برای خلق فضاهای دیجیتال خاص.
    `,
    'درباره': `
      <i class="fas fa-user"></i> <strong>mohamad hossein snti</strong><br>
      توسعه‌دهنده وب و طراح گرافیک از سال ۱۴۰۳.<br>
      عاشق کد تمیز، طراحی مینیمال و تجربه کاربری روان.<br>
      <i class="fas fa-rocket" style="color:#f5b042;"></i> هدف: ترکیب هنر و تکنولوژی برای خلق فضاهای دیجیتال خاص.
    `,

    // ----- پیش‌فرض (fallback) -----
    'default': `
      <i class="fas fa-question-circle"></i> متوجه نشدم!<br>
      می‌تونی از اینا بپرسی:<br>
      <span style="color:#f5b042;">معرفی</span> • <span style="color:#f5b042;">سایت‌ها</span> • <span style="color:#f5b042;">طراحی‌ها</span> • <span style="color:#f5b042;">برنامه‌ها</span> • <span style="color:#f5b042;">درباره من</span>
    `
  };

  // ============================================================
  //  توابع اصلی
  // ============================================================

  const messagesBox = document.getElementById('messagesBox');
  const userInput = document.getElementById('userInput');

  // ارسال پیام کاربر
  function sendMessage() {
    const text = userInput.value.trim();
    if (!text) return;

    addMessage('user', text);
    userInput.value = '';
    userInput.focus();

    // پاسخ ربات با تأخیر
    setTimeout(() => {
      const reply = getBotReply(text);
      addMessage('bot', reply);
      // اسکرول به پایین
      messagesBox.scrollTop = messagesBox.scrollHeight;
    }, 400);
  }

  // سوال از طریق دکمه‌های سریع
  function askQuestion(text) {
    userInput.value = text;
    sendMessage();
  }

  // اضافه کردن پیام به جعبه
  function addMessage(type, content) {
    const div = document.createElement('div');
    div.className = `message ${type}`;

    const avatar = document.createElement('div');
    avatar.className = 'avatar';
    avatar.innerHTML = type === 'bot' ? '<i class="fas fa-robot"></i>' : '<i class="fas fa-user"></i>';

    const bubble = document.createElement('div');
    bubble.className = 'bubble';
    bubble.innerHTML = content;

    div.appendChild(avatar);
    div.appendChild(bubble);
    messagesBox.appendChild(div);
    messagesBox.scrollTop = messagesBox.scrollHeight;
  }

  // پیدا کردن پاسخ مناسب
  function getBotReply(input) {
    const lower = input.trim().toLowerCase();

    // کلمات کلیدی
    const keywords = {
      'معرفی': ['معرفی', 'کی هستی', 'شناخت', 'درباره', 'خودت'],
      'سایت': ['سایت', 'وب', 'لینک', 'نمونه کار', 'پروژه', 'zerox', 'کالفود', 'کوروش', 'گیم'],
      'طراحی': ['طراحی', 'گرافیک', 'هنری', 'عکس', 'تصویر', 'یا علی', 'اهواز', 'شهید'],
      'برنامه': ['برنامه', 'اپ', 'نرم‌افزار', 'ابزار', 'اپلیکیشن'],
      'درباره من': ['درباره من', 'چه کاره', 'توسعه‌دهنده', 'فریلنسر']
    };

    // بررسی تطابق
    for (const [key, words] of Object.entries(keywords)) {
      for (const w of words) {
        if (lower.includes(w)) {
          return botResponses[key] || botResponses['default'];
        }
      }
    }

    // اگر هیچ‌کدام تطابق نداشت
    return botResponses['default'];
  }

  // ارسال با کلید Enter
  userInput.addEventListener('keydown', function(e) {
    if (e.key === 'Enter') {
      e.preventDefault();
      sendMessage();
    }
  });

  // ====== اسکرول خودکار به پایین بعد از لود ======
  window.addEventListener('load', function() {
    messagesBox.scrollTop = messagesBox.scrollHeight;
  });

  // ====== خوش‌آمدگویی دوباره بعد از ۳ ثانیه (اختیاری) ======
  setTimeout(() => {
    // اگر پیامی وجود نداشت (یا فقط خوش‌آمدگویی اولیه)، پیام اضافی نمی‌فرستیم
    // قبلاً خوش‌آمدگویی در HTML هست.
  }, 1000);
</script>

</body>
</html>
