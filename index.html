<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=yes">
    <title>شیشه‌ای زنده · بدون کارت</title>
    <!-- Font Awesome 6 (رایگان) -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <!-- فونت وزیر (با کیفیت بالا) -->
    <link href="https://cdn.jsdelivr.net/gh/rastikerdar/vazirmatn@v33.003/Vazirmatn-font-face.css" rel="stylesheet">
    <style>
        /* ریست و پایه */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Vazirmatn', 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            background: #0b0e1a; /* fallback */
            padding: 1rem;
            /* پس‌زمینه زنده با گرادیان متحرک و ابعاد بزرگ */
            background: linear-gradient(135deg, #0f0c29, #302b63, #24243e);
            background-size: 400% 400%;
            animation: gradientLive 18s ease-in-out infinite alternate;
            position: relative;
            overflow-x: hidden;
        }

        /* انیمیشن پس‌زمینه (زنده‌تر با چند لایه) */
        @keyframes gradientLive {
            0% { background-position: 0% 50%; }
            25% { background-position: 100% 0%; }
            50% { background-position: 100% 100%; }
            75% { background-position: 0% 100%; }
            100% { background-position: 0% 50%; }
        }

        /* لایه‌های اضافی برای عمق و حرکت (نورهای شناور) */
        body::before {
            content: '';
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: radial-gradient(circle at 20% 30%, rgba(255, 100, 200, 0.25) 0%, transparent 40%),
                        radial-gradient(circle at 80% 70%, rgba(0, 200, 255, 0.2) 0%, transparent 50%),
                        radial-gradient(circle at 40% 80%, rgba(255, 200, 0, 0.15) 0%, transparent 45%);
            background-blend-mode: overlay;
            pointer-events: none;
            z-index: 0;
            animation: floatLights 22s infinite alternate ease-in-out;
        }

        @keyframes floatLights {
            0% { opacity: 0.6; transform: scale(1) rotate(0deg); }
            50% { opacity: 1; transform: scale(1.1) rotate(3deg); }
            100% { opacity: 0.7; transform: scale(0.95) rotate(-2deg); }
        }

        /* کانتینر اصلی: بدون کارت، تمام صفحه با حاشیه‌های نرم */
        .glass-container {
            position: relative;
            z-index: 2;
            width: 100%;
            max-width: 1300px;
            min-height: 85vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 2.5rem 2rem;
            border-radius: 3.5rem;
            /* افکت شیشه‌ای خفن (گلاس مورفین) */
            background: rgba(255, 255, 255, 0.06);
            backdrop-filter: blur(22px) saturate(180%);
            -webkit-backdrop-filter: blur(22px) saturate(180%);
            border: 1px solid rgba(255, 255, 255, 0.12);
            box-shadow: 0 30px 60px rgba(0, 0, 0, 0.6), 
                        inset 0 1px 0 rgba(255, 255, 255, 0.15);
            transition: all 0.3s ease;
            /* هماهنگ با پس‌زمینه زنده */
            backdrop-filter: blur(20px) saturate(200%);
            -webkit-backdrop-filter: blur(20px) saturate(200%);
        }

        /* محتوای داخلی – بدون هیچ کارت اضافه */
        .content {
            width: 100%;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 1.8rem;
            text-align: center;
            color: rgba(255, 255, 255, 0.95);
            text-shadow: 0 4px 20px rgba(0, 0, 0, 0.3);
        }

        /* آیکون بزرگ (فانتزی) */
        .icon-big {
            font-size: 5.5rem;
            color: rgba(255, 255, 255, 0.9);
            filter: drop-shadow(0 0 20px rgba(200, 180, 255, 0.5));
            transition: transform 0.3s ease;
            background: rgba(255,255,255,0.03);
            padding: 0.8rem 1.2rem;
            border-radius: 80px;
            backdrop-filter: blur(4px);
            border: 1px solid rgba(255,255,255,0.08);
        }

        .icon-big i {
            background: linear-gradient(145deg, #f8cdda, #f5b8ea, #b8d4f0);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        /* تایتل با ترکیب رنگی شیشه‌ای */
        h1 {
            font-size: clamp(2.8rem, 10vw, 5.6rem);
            font-weight: 800;
            letter-spacing: -0.02em;
            line-height: 1.15;
            margin: 0.2rem 0;
            background: linear-gradient(135deg, #f6d5f7, #fbe9d7, #c7eafd, #d4c5f9);
            background-size: 300% 300%;
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            animation: gradientText 10s ease-in-out infinite alternate;
            text-shadow: 0 0 40px rgba(200, 150, 255, 0.2);
        }

        @keyframes gradientText {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }

        /* زیرنویس با ترکیب رنگی ملایم */
        .sub-head {
            font-size: clamp(1.2rem, 4vw, 2rem);
            font-weight: 400;
            opacity: 0.9;
            background: linear-gradient(135deg, #e0e7ff, #fbc7d3, #b5d9f7);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            letter-spacing: 0.02em;
            margin-top: -0.5rem;
        }

        /* دکمه‌ها / المان‌های تعاملی (بدون کارت) */
        .action-group {
            display: flex;
            flex-wrap: wrap;
            align-items: center;
            justify-content: center;
            gap: 1.2rem 1.8rem;
            margin: 1.2rem 0 0.5rem;
        }

        .glass-btn {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 0.7rem;
            padding: 0.9rem 2.2rem;
            border-radius: 60px;
            background: rgba(255, 255, 255, 0.07);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.13);
            box-shadow: 0 8px 25px rgba(0, 0, 0, 0.3);
            color: #f0edff;
            font-family: 'Vazirmatn', sans-serif;
            font-size: 1.1rem;
            font-weight: 500;
            transition: all 0.25s ease;
            cursor: pointer;
            text-decoration: none;
            letter-spacing: 0.3px;
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
        }

        .glass-btn i {
            font-size: 1.3rem;
            color: #c8b6ff;
            transition: transform 0.2s;
        }

        .glass-btn:hover {
            background: rgba(255, 255, 255, 0.17);
            border-color: rgba(255, 215, 255, 0.4);
            transform: translateY(-4px) scale(1.02);
            box-shadow: 0 14px 35px rgba(150, 100, 255, 0.35);
            color: #fff;
        }

        .glass-btn:hover i {
            transform: scale(1.2) rotate(3deg);
            color: #dcc9ff;
        }

        .glass-btn:active {
            transform: scale(0.95);
        }

        /* بخش پایین با آیکون‌های شبکه (با ترکیب رنگی) */
        .social-row {
            display: flex;
            flex-wrap: wrap;
            align-items: center;
            justify-content: center;
            gap: 1.8rem 3rem;
            margin-top: 2.5rem;
            padding: 0.8rem 2rem;
            border-radius: 60px;
            background: rgba(0, 0, 0, 0.08);
            backdrop-filter: blur(4px);
            -webkit-backdrop-filter: blur(4px);
            border: 1px solid rgba(255, 255, 255, 0.04);
        }

        .social-item {
            display: flex;
            align-items: center;
            gap: 0.6rem;
            font-size: 1.2rem;
            color: rgba(255, 245, 255, 0.7);
            transition: all 0.2s ease;
            text-decoration: none;
            backdrop-filter: blur(2px);
            padding: 0.3rem 0.8rem;
            border-radius: 40px;
        }

        .social-item i {
            font-size: 2rem;
            background: linear-gradient(145deg, #ffb6e6, #b4d6ff, #c6a2ff);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            filter: drop-shadow(0 0 10px rgba(200, 150, 255, 0.2));
            transition: transform 0.3s;
        }

        .social-item span {
            font-weight: 300;
            background: linear-gradient(145deg, #ece9ff, #d6d0ff);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        .social-item:hover {
            transform: translateY(-3px) scale(1.04);
            color: #fff;
        }

        .social-item:hover i {
            transform: scale(1.15) rotate(-2deg);
            filter: drop-shadow(0 0 18px #b78aff);
        }

        /* متن کوچک فوتر شیشه‌ای */
        .footer-note {
            margin-top: 2.2rem;
            font-size: 0.9rem;
            opacity: 0.5;
            letter-spacing: 0.5px;
            color: #cac5f0;
            backdrop-filter: blur(4px);
            padding: 0.4rem 1.6rem;
            border-radius: 40px;
            background: rgba(0,0,0,0.05);
            border: 1px solid rgba(255,255,255,0.02);
        }

        .footer-note i {
            margin: 0 4px;
            color: #f7b0d0;
        }

        /* کاملاً واکنش‌گرا */
        @media (max-width: 600px) {
            .glass-container {
                padding: 1.8rem 1.2rem;
                border-radius: 2.5rem;
                min-height: 75vh;
            }
            .icon-big {
                font-size: 4rem;
            }
            .action-group {
                flex-direction: column;
                width: 100%;
            }
            .glass-btn {
                width: 100%;
                justify-content: center;
            }
            .social-row {
                flex-direction: column;
                gap: 1rem;
                background: rgba(0,0,0,0.04);
                border: none;
                padding: 0.5rem;
            }
            .social-item {
                font-size: 1rem;
            }
        }
    </style>
</head>
<body>

    <div class="glass-container">
        <div class="content">

            <!-- آیکون بزرگ با فونت‌awesome (ترکیب رنگی خفن) -->
            <div class="icon-big">
                <i class="fas fa-gem"></i>
            </div>

            <!-- عنوان با گرادیان زنده -->
            <h1>شیشه‌ای زنده</h1>
            <div class="sub-head">
                <i class="fas fa-bolt" style="margin-left: 8px; color: #f5c2e0;"></i>
                بدون کارت · تمام صفحه
                <i class="fas fa-bolt" style="margin-right: 8px; color: #b2d5ff;"></i>
            </div>

            <!-- گروه دکمه‌های شیشه‌ای (تعامل) -->
            <div class="action-group">
                <a href="#" class="glass-btn">
                    <i class="fas fa-compass"></i> کاوش
                </a>
                <a href="#" class="glass-btn">
                    <i class="fas fa-cloud-moon"></i> شب‌روشن
                </a>
                <a href="#" class="glass-btn">
                    <i class="fas fa-wand-magic-sparkles"></i> جادو
                </a>
            </div>

            <!-- ردیف آیکون‌های اجتماعی با ترکیب رنگی -->
            <div class="social-row">
                <a href="#" class="social-item">
                    <i class="fab fa-instagram"></i>
                    <span>اینستاگرام</span>
                </a>
                <a href="#" class="social-item">
                    <i class="fab fa-x-twitter"></i>
                    <span>توییتر</span>
                </a>
                <a href="#" class="social-item">
                    <i class="fab fa-github"></i>
                    <span>گیت‌هاب</span>
                </a>
                <a href="#" class="social-item">
                    <i class="fab fa-telegram"></i>
                    <span>تلگرام</span>
                </a>
            </div>

            <!-- فوتر شیشه‌ای با آیکون -->
            <div class="footer-note">
                <i class="fas fa-circle-nodes"></i>  ترکیب رنگ‌های خفن · افکت شیشه‌ای  <i class="fas fa-circle-nodes"></i>
            </div>

        </div>
    </div>

    <!-- (اختیاری) هیچ کارت یا باکس اضافه‌ای وجود ندارد، تمام محتوا درون شیشه‌ی اصلی -->

</body>
</html>
