<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=yes" />
    <title>ZEROX.GAME.IR | بزرگترین بهتزین پرامت</title>
    
    <!-- ===== Font Awesome 6 (رایگان) ===== -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css" />

    <!-- ===== فونت استعداد اردیبهشت (اردکان) ===== -->
    <link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@300;400;700;900&display=swap" rel="stylesheet" />

    <style>
        /* ===== RESET & BASE ===== */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background: #0c0b0f;
            color: #f0eef7;
            font-family: 'Vazirmatn', 'Segoe UI', Tahoma, sans-serif;
            padding: 0 0 80px 0;
            min-height: 100vh;
            background-image: radial-gradient(circle at 20% 30%, #1a1720 0%, #0a090e 100%);
            line-height: 1.7;
        }

        /* ===== اسکرول نرم ===== */
        html {
            scroll-behavior: smooth;
        }

        /* ===== کانتینر ===== */
        .container {
            max-width: 1100px;
            margin: 0 auto;
            padding: 20px 16px;
        }

        /* ===== HEADER / لوگو ===== */
        .header {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 30px 0 10px 0;
            border-bottom: 2px solid #ff3c5f30;
            margin-bottom: 30px;
        }

        .logo-wrap {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .logo-img {
            max-width: 180px;
            height: auto;
            filter: drop-shadow(0 0 20px #ff3c5f55);
            transition: transform 0.25s ease;
        }

        .logo-img:hover {
            transform: scale(1.03);
        }

        .header h1 {
            font-size: 1.8rem;
            font-weight: 900;
            background: linear-gradient(135deg, #ff6b8a, #ff3c5f);
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
            letter-spacing: 1px;
            text-shadow: 0 0 30px #ff3c5f40;
            margin: 6px 0 2px 0;
        }

        .header .sub {
            font-size: 0.9rem;
            color: #b3aacb;
            background: #23202b;
            padding: 4px 18px;
            border-radius: 40px;
            border: 1px solid #ff3c5f30;
            letter-spacing: 0.5px;
        }

        /* ===== بخش‌های عمومی ===== */
        .section {
            margin: 60px 0 40px 0;
        }

        .section-title {
            font-size: 2rem;
            font-weight: 900;
            display: flex;
            align-items: center;
            gap: 12px;
            margin-bottom: 28px;
            border-right: 6px solid #ff3c5f;
            padding-right: 18px;
            background: linear-gradient(135deg, #fff, #c8bce6);
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
        }

        .section-title i {
            color: #ff3c5f;
            background: #231f2b;
            padding: 10px;
            border-radius: 50%;
            font-size: 1.4rem;
            box-shadow: 0 0 20px #ff3c5f30;
        }

        .section-title .badge {
            background: #ff3c5f;
            color: #fff;
            font-size: 0.8rem;
            padding: 0 12px;
            border-radius: 40px;
            font-weight: 700;
        }

        /* ===== کارت‌ها (شیشه‌ای) ===== */
        .glass-card {
            background: rgba(26, 23, 34, 0.65);
            backdrop-filter: blur(6px);
            -webkit-backdrop-filter: blur(6px);
            border: 1px solid rgba(255, 255, 255, 0.06);
            border-radius: 28px;
            padding: 20px 18px;
            box-shadow: 0 20px 40px -12px rgba(0, 0, 0, 0.8);
            transition: all 0.25s ease;
            margin-bottom: 28px;
        }

        .glass-card:hover {
            border-color: #ff3c5f60;
            transform: translateY(-4px);
            box-shadow: 0 30px 50px -16px #ff3c5f20;
        }

        /* ===== گرید ===== */
        .grid-2col,
        .grid-3col {
            display: grid;
            gap: 24px;
        }

        .grid-2col {
            grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
        }

        .grid-3col {
            grid-template-columns: repeat(auto-fit, minmax(240px, 1fr));
        }

        /* ===== کارت ویدیو ===== */
        .video-card img,
        .news-card img,
        .story-card img,
        .old-card img {
            width: 100%;
            border-radius: 18px;
            margin-bottom: 14px;
            border: 1px solid #ffffff10;
            transition: 0.2s;
        }

        .video-card img:hover,
        .news-card img:hover {
            filter: brightness(1.1);
        }

        .video-card h3,
        .news-card h3,
        .story-card h3,
        .old-card h3 {
            font-size: 1.2rem;
            font-weight: 700;
            margin: 8px 0 6px 0;
            color: #f2edff;
        }

        .video-card .meta,
        .news-card .meta {
            display: flex;
            flex-wrap: wrap;
            gap: 6px 14px;
            font-size: 0.75rem;
            color: #b5aad4;
            margin: 6px 0 10px 0;
        }

        .video-card .meta i,
        .news-card .meta i {
            color: #ff3c5f;
            width: 18px;
        }

        .tag {
            background: #ff3c5f20;
            color: #ff7c9a;
            padding: 2px 12px;
            border-radius: 30px;
            font-size: 0.7rem;
            font-weight: 700;
            border: 1px solid #ff3c5f30;
        }

        .btn {
            display: inline-block;
            background: #ff3c5f;
            color: #fff;
            padding: 8px 22px;
            border-radius: 60px;
            font-weight: 700;
            text-decoration: none;
            font-size: 0.9rem;
            transition: 0.2s;
            border: 1px solid #ff3c5f;
            margin-top: 8px;
        }

        .btn i {
            margin-left: 8px;
        }

        .btn:hover {
            background: transparent;
            color: #ff3c5f;
            box-shadow: 0 0 30px #ff3c5f40;
        }

        .btn-outline {
            background: transparent;
            border: 1px solid #7d6fa8;
            color: #d6cdf0;
        }

        .btn-outline:hover {
            background: #7d6fa8;
            color: #fff;
            border-color: #7d6fa8;
        }

        /* ===== دکمه نمایش متن کامل ===== */
        .full-text-toggle {
            background: none;
            border: none;
            color: #b5aad4;
            cursor: pointer;
            font-size: 0.8rem;
            padding: 4px 0;
            transition: 0.2s;
            display: inline-flex;
            align-items: center;
            gap: 6px;
        }

        .full-text-toggle:hover {
            color: #ff3c5f;
        }

        .full-text-content {
            display: none;
            margin-top: 12px;
            padding: 14px 16px;
            background: #16131e;
            border-radius: 16px;
            border-right: 4px solid #ff3c5f;
            font-size: 0.9rem;
            color: #d6cdf0;
            white-space: pre-line;
        }

        .full-text-content.show {
            display: block;
        }

        /* ===== کارت موسیقی ===== */
        .music-card {
            display: flex;
            flex-direction: column;
        }

        .music-card .cover {
            width: 100%;
            aspect-ratio: 1/1;
            object-fit: cover;
            border-radius: 20px;
            border: 1px solid #ffffff10;
        }

        .music-card audio {
            width: 100%;
            margin: 12px 0 6px 0;
            border-radius: 60px;
            background: #1e1b26;
            height: 40px;
        }

        .music-card .composers {
            font-size: 0.75rem;
            color: #b5aad4;
            margin: 6px 0;
        }

        /* ===== Old (زروکس اُلد) ===== */
        .old-card .gallery {
            display: flex;
            gap: 8px;
            flex-wrap: wrap;
            margin: 12px 0;
        }

        .old-card .gallery img {
            width: 70px;
            height: 70px;
            object-fit: cover;
            border-radius: 14px;
            border: 1px solid #ffffff15;
        }

        .old-card .info-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 4px 12px;
            font-size: 0.8rem;
            color: #b5aad4;
            margin: 8px 0;
        }

        .old-card .info-grid span {
            font-weight: 300;
        }

        .old-card .info-grid strong {
            color: #e8e0ff;
        }

        /* ===== لینک‌های اجتماعی ===== */
        .social-links {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            gap: 18px;
            margin: 30px 0 10px 0;
        }

        .social-links a {
            color: #b5aad4;
            font-size: 1.6rem;
            background: #1e1b26;
            width: 56px;
            height: 56px;
            display: flex;
            align-items: center;
            justify-content: center;
            border-radius: 50%;
            transition: 0.2s;
            border: 1px solid #ffffff08;
            text-decoration: none;
        }

        .social-links a:hover {
            color: #fff;
            background: #ff3c5f;
            transform: scale(1.1);
            box-shadow: 0 0 40px #ff3c5f50;
        }

        /* ===== فوتر ===== */
        .footer {
            text-align: center;
            padding: 30px 0 10px 0;
            border-top: 1px solid #ff3c5f20;
            margin-top: 40px;
            color: #867d9f;
            font-size: 0.8rem;
        }

        .footer i {
            color: #ff3c5f;
            margin: 0 4px;
        }

        /* ===== ریسپانسیو ===== */
        @media (max-width: 600px) {
            .header h1 {
                font-size: 1.3rem;
            }
            .section-title {
                font-size: 1.6rem;
            }
            .grid-2col,
            .grid-3col {
                grid-template-columns: 1fr;
            }
            .old-card .info-grid {
                grid-template-columns: 1fr;
            }
            .logo-img {
                max-width: 130px;
            }
            .btn {
                padding: 6px 16px;
                font-size: 0.8rem;
            }
        }

        /* ===== انیمیشن خفن ===== */
        @keyframes pulseGlow {
            0% { text-shadow: 0 0 10px #ff3c5f30; }
            50% { text-shadow: 0 0 30px #ff3c5f80; }
            100% { text-shadow: 0 0 10px #ff3c5f30; }
        }

        .glow-text {
            animation: pulseGlow 2.5s infinite;
        }
    </style>
</head>

    // ======== تابع کمکی برای نمایش/مخفی متن کامل ========
    function toggleFullText(btn) {
        const content = btn.parentElement.querySelector('.full-text-content');
        if (content) {
            content.classList.toggle('show');
            btn.innerHTML = content.classList.contains('show') ? 
                '<i class="fas fa-chevron-up"></i> بستن متن کامل' : 
                '<i class="fas fa-chevron-down"></i> نمایش متن کامل';
        }
    }

    // ======== رندر ویدیوها ========
    function renderVideos() {
        const container = document.getElementById('videoContainer');
        container.innerHTML = '';
        videosData.forEach(v => {
            const card = document.createElement('div');
            card.className = 'glass-card video-card';
            card.innerHTML = `
                <img src="${v.thumb}" alt="${v.title}" loading="lazy" />
                <div class="meta">
                    <span><i class="far fa-calendar-alt"></i> ${v.date}</span>
                    <span><i class="far fa-clock"></i> ${v.time}</span>
                    <span class="tag"><i class="fas fa-tag"></i> ${v.category}</span>
                </div>
                <h3>${v.title}</h3>
                <p style="font-size:0.9rem;color:#b5aad4;margin:6px 0;">${v.desc}</p>
                <div>
                    <a href="${v.link}" target="_blank" class="btn"><i class="fas fa-play"></i> تماشا در آپارات</a>
                    <button class="full-text-toggle" onclick="toggleFullText(this)"><i class="fas fa-chevron-down"></i> نمایش متن کامل</button>
                </div>
                <div class="full-text-content">${v.fullText}</div>
            `;
            container.appendChild(card);
        });
    }

                    <span><strong>پلتفرم:</strong> ${o.platform}</span>
