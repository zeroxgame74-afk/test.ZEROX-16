<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Gaming UI · انیمیشن خفن</title>
  <!-- Font Awesome 6 (رایگان) -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
  <!-- فونت وزیر (وزیرمتن بُلد) از CDN -->
  <link href="https://cdn.jsdelivr.net/gh/rastikerdar/vazirmatn@v33.003/Vazirmatn-font-face.css" rel="stylesheet">
  <style>
    /* ===== RESET & BASE ===== */
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: 'Vazirmatn', sans-serif;
      font-weight: 900;  /* بُلد (Black) */
      background: radial-gradient(circle at 20% 30%, #0b0e1a, #03050b);
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 1.5rem;
      color: #fff;
      overflow-x: hidden;
    }

    /* ===== کارت اصلی ===== */
    .gaming-card {
      max-width: 1100px;
      width: 100%;
      background: rgba(12, 16, 28, 0.7);
      backdrop-filter: blur(10px);
      -webkit-backdrop-filter: blur(10px);
      border-radius: 3rem 1rem 3rem 1rem;
      padding: 2.8rem 2.5rem;
      box-shadow: 0 20px 40px rgba(0, 0, 0, 0.8), 0 0 0 2px rgba(0, 255, 255, 0.15), 0 0 30px rgba(0, 255, 255, 0.2);
      border: 1px solid rgba(0, 255, 255, 0.15);
      transition: all 0.3s ease;
      animation: cardPulse 5s infinite alternate;
    }

    @keyframes cardPulse {
      0% { box-shadow: 0 20px 40px rgba(0, 0, 0, 0.8), 0 0 0 2px rgba(0, 255, 255, 0.1), 0 0 20px rgba(0, 255, 255, 0.1); }
      100% { box-shadow: 0 20px 50px rgba(0, 0, 0, 0.9), 0 0 0 3px rgba(255, 0, 200, 0.4), 0 0 60px rgba(255, 0, 200, 0.25); }
    }

    /* ===== HEADER ===== */
    .header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      flex-wrap: wrap;
      gap: 1rem;
      margin-bottom: 2.5rem;
      border-bottom: 2px solid rgba(255, 255, 255, 0.05);
      padding-bottom: 1.2rem;
    }

    .logo-area {
      display: flex;
      align-items: center;
      gap: 0.8rem;
    }

    .logo-icon {
      font-size: 2.8rem;
      color: #ff2d8f;
      animation: iconSpin 6s infinite linear;
      filter: drop-shadow(0 0 10px #ff2d8f);
    }

    @keyframes iconSpin {
      0% { transform: rotate(0deg) scale(1); }
      50% { transform: rotate(180deg) scale(1.1); }
      100% { transform: rotate(360deg) scale(1); }
    }

    .logo-text {
      font-size: 2rem;
      background: linear-gradient(135deg, #f7971e, #ffd200);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      text-shadow: 0 0 20px rgba(255, 215, 0, 0.3);
      letter-spacing: 1px;
    }

    .online-status {
      display: flex;
      align-items: center;
      gap: 0.5rem;
      background: rgba(0, 255, 200, 0.1);
      padding: 0.5rem 1.2rem;
      border-radius: 50px;
      border: 1px solid rgba(0, 255, 200, 0.2);
      font-size: 0.9rem;
      color: #7effe0;
    }

    .online-dot {
      width: 12px;
      height: 12px;
      background: #00ff88;
      border-radius: 50%;
      display: inline-block;
      animation: dotBlink 1.2s infinite;
      box-shadow: 0 0 12px #00ff88;
    }

    @keyframes dotBlink {
      0%, 100% { opacity: 1; transform: scale(1); }
      50% { opacity: 0.3; transform: scale(0.8); }
    }

    /* ===== STATS ===== */
    .stats {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
      gap: 1.2rem;
      margin-bottom: 2.5rem;
    }

    .stat-item {
      background: rgba(255, 255, 255, 0.03);
      border: 1px solid rgba(255, 255, 255, 0.06);
      border-radius: 1.5rem;
      padding: 1.2rem 0.8rem;
      text-align: center;
      backdrop-filter: blur(4px);
      transition: all 0.3s ease;
      animation: fadeInUp 0.8s ease backwards;
    }

    .stat-item:nth-child(1) { animation-delay: 0.1s; }
    .stat-item:nth-child(2) { animation-delay: 0.2s; }
    .stat-item:nth-child(3) { animation-delay: 0.3s; }

    .stat-item:hover {
      transform: translateY(-8px) scale(1.02);
      border-color: rgba(255, 0, 200, 0.3);
      box-shadow: 0 8px 25px rgba(255, 0, 200, 0.15);
      background: rgba(255, 255, 255, 0.06);
    }

    .stat-icon {
      font-size: 2.2rem;
      margin-bottom: 0.3rem;
      display: inline-block;
      animation: float 3s infinite alternate ease-in-out;
    }

    .stat-icon.fa-trophy { color: #ffd700; }
    .stat-icon.fa-crosshairs { color: #ff6b6b; }
    .stat-icon.fa-users { color: #4ecdc4; }

    @keyframes float {
      0% { transform: translateY(0px); }
      100% { transform: translateY(-10px); }
    }

    .stat-number {
      font-size: 2rem;
      font-weight: 900;
      background: linear-gradient(135deg, #fff, #a0c0ff);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      line-height: 1.2;
    }

    .stat-label {
      font-size: 0.9rem;
      color: rgba(255, 255, 255, 0.6);
      font-weight: 700;
      margin-top: 0.2rem;
    }

    /* ===== ACTIONS ===== */
    .actions {
      display: flex;
      flex-wrap: wrap;
      gap: 1.2rem;
      margin-bottom: 2.8rem;
    }

    .btn {
      flex: 1;
      min-width: 150px;
      padding: 0.9rem 1.8rem;
      border: none;
      border-radius: 3rem;
      font-family: 'Vazirmatn', sans-serif;
      font-weight: 900;
      font-size: 1.1rem;
      color: #fff;
      cursor: pointer;
      transition: all 0.3s ease;
      position: relative;
      overflow: hidden;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 0.7rem;
      letter-spacing: 0.5px;
    }

    .btn-primary {
      background: linear-gradient(135deg, #f093fb, #f5576c);
      box-shadow: 0 4px 20px rgba(245, 87, 108, 0.4);
    }

    .btn-primary:hover {
      transform: scale(1.04);
      box-shadow: 0 6px 30px rgba(245, 87, 108, 0.6);
    }

    .btn-secondary {
      background: rgba(255, 255, 255, 0.05);
      border: 2px solid rgba(255, 255, 255, 0.15);
      backdrop-filter: blur(4px);
    }

    .btn-secondary:hover {
      background: rgba(255, 255, 255, 0.12);
      border-color: #ffd700;
      transform: scale(1.04);
      box-shadow: 0 0 30px rgba(255, 215, 0, 0.15);
    }

    /* شیمّر روی دکمه‌ها */
    .btn::after {
      content: '';
      position: absolute;
      top: -50%;
      left: -60%;
      width: 200%;
      height: 200%;
      background: linear-gradient(45deg, transparent, rgba(255, 255, 255, 0.05), transparent);
      transform: rotate(25deg);
      transition: all 0.5s;
    }

    .btn:hover::after {
      left: 60%;
    }

    /* ===== GAMES SECTION ===== */
    .games-title {
      font-size: 1.4rem;
      margin-bottom: 1.5rem;
      display: flex;
      align-items: center;
      gap: 0.8rem;
      color: rgba(255, 255, 255, 0.8);
    }

    .games-title i {
      color: #ffd700;
      animation: glowText 2s infinite alternate;
    }

    @keyframes glowText {
      0% { text-shadow: 0 0 5px #ffd700; }
      100% { text-shadow: 0 0 25px #ff6b00, 0 0 50px #ff6b00; }
    }

    .games-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
      gap: 1.5rem;
    }

    .game-card {
      background: rgba(255, 255, 255, 0.03);
      border-radius: 2rem;
      padding: 1.5rem 1rem;
      text-align: center;
      border: 1px solid rgba(255, 255, 255, 0.05);
      transition: all 0.35s cubic-bezier(0.175, 0.885, 0.32, 1.275);
      animation: fadeInUp 0.7s ease backwards;
      backdrop-filter: blur(4px);
    }

    .game-card:nth-child(1) { animation-delay: 0.2s; }
    .game-card:nth-child(2) { animation-delay: 0.35s; }
    .game-card:nth-child(3) { animation-delay: 0.5s; }

    .game-card:hover {
      transform: translateY(-12px) scale(1.02);
      border-color: rgba(0, 255, 255, 0.3);
      background: rgba(255, 255, 255, 0.07);
      box-shadow: 0 15px 40px rgba(0, 255, 255, 0.08);
    }

    .game-icon {
      font-size: 3.5rem;
      margin-bottom: 0.8rem;
      display: inline-block;
      animation: float 3.5s infinite alternate ease-in-out;
    }

    .game-icon.fa-robot { color: #00d4ff; }
    .game-icon.fa-skull { color: #ff4757; }
    .game-icon.fa-crown { color: #ffd700; }

    .game-name {
      font-size: 1.2rem;
      margin-bottom: 0.3rem;
      background: linear-gradient(135deg, #f5f7fa, #b8c6db);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }

    .game-desc {
      font-size: 0.8rem;
      color: rgba(255, 255, 255, 0.4);
      font-weight: 700;
      letter-spacing: 0.5px;
    }

    .game-tag {
      display: inline-block;
      margin-top: 0.6rem;
      background: rgba(255, 215, 0, 0.1);
      padding: 0.2rem 1rem;
      border-radius: 50px;
      font-size: 0.7rem;
      color: #ffd700;
      border: 1px solid rgba(255, 215, 0, 0.1);
    }

    /* ===== FOOTER ===== */
    .footer {
      margin-top: 2.5rem;
      padding-top: 1.2rem;
      border-top: 1px solid rgba(255, 255, 255, 0.04);
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-wrap: wrap;
      gap: 1rem;
      font-size: 0.85rem;
      color: rgba(255, 255, 255, 0.25);
    }

    .footer i {
      color: #ff2d8f;
      animation: heartBeat 1.5s infinite;
    }

    @keyframes heartBeat {
      0%, 100% { transform: scale(1); }
      15% { transform: scale(1.3); }
      30% { transform: scale(1); }
      45% { transform: scale(1.2); }
      60% { transform: scale(1); }
    }

    .footer-social i {
      font-size: 1.2rem;
      margin: 0 0.4rem;
      color: rgba(255, 255, 255, 0.2);
      transition: all 0.3s;
      cursor: pointer;
    }

    .footer-social i:hover {
      color: #ffd700;
      transform: translateY(-3px);
      text-shadow: 0 0 20px #ffd700;
    }

    /* ===== ANIMATIONS ===== */
    @keyframes fadeInUp {
      from {
        opacity: 0;
        transform: translateY(30px);
      }
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    /* ===== RESPONSIVE ===== */
    @media (max-width: 600px) {
      .gaming-card {
        padding: 1.8rem 1.2rem;
        border-radius: 2rem 0.8rem 2rem 0.8rem;
      }
      .logo-text {
        font-size: 1.5rem;
      }
      .logo-icon {
        font-size: 2.2rem;
      }
      .stat-number {
        font-size: 1.6rem;
      }
      .btn {
        min-width: 120px;
        font-size: 0.95rem;
        padding: 0.7rem 1.2rem;
      }
    }
  </style>
</head>
<body>

<div class="gaming-card">

  <!-- ===== HEADER ===== -->
  <div class="header">
    <div class="logo-area">
      <i class="fas fa-gamepad logo-icon"></i>
      <span class="logo-text">گیمرز هاب</span>
    </div>
    <div class="online-status">
      <span class="online-dot"></span>
      <span>۲۴۷ آنلاین</span>
    </div>
  </div>

  <!-- ===== STATS ===== -->
  <div class="stats">
    <div class="stat-item">
      <i class="fas fa-trophy stat-icon"></i>
      <div class="stat-number">۱,۲۴۸</div>
      <div class="stat-label">پیروزی</div>
    </div>
    <div class="stat-item">
      <i class="fas fa-crosshairs stat-icon"></i>
      <div class="stat-number">۹۸٪</div>
      <div class="stat-label">دقت</div>
    </div>
    <div class="stat-item">
      <i class="fas fa-users stat-icon"></i>
      <div class="stat-number">۳.۲ک</div>
      <div class="stat-label">بازیکن</div>
    </div>
  </div>

  <!-- ===== ACTIONS ===== -->
  <div class="actions">
    <button class="btn btn-primary">
      <i class="fas fa-play"></i> بازی کن
    </button>
    <button class="btn btn-secondary">
      <i class="fas fa-chart-line"></i> مشاهده بیشتر
    </button>
  </div>

  <!-- ===== GAMES ===== -->
  <div class="games-title">
    <i class="fas fa-fire"></i> بازی‌های داغ
  </div>

  <div class="games-grid">
    <div class="game-card">
      <i class="fas fa-robot game-icon"></i>
      <div class="game-name">CYBERPUNK</div>
      <div class="game-desc">شهر آینده</div>
      <span class="game-tag"><i class="fas fa-star"></i> ۴.۸</span>
    </div>
    <div class="game-card">
      <i class="fas fa-skull game-icon"></i>
      <div class="game-name">VALORANT</div>
      <div class="game-desc">تیراندازی تاکتیکی</div>
      <span class="game-tag"><i class="fas fa-star"></i> ۴.۹</span>
    </div>
    <div class="game-card">
      <i class="fas fa-crown game-icon"></i>
      <div class="game-name">FORTNITE</div>
      <div class="game-desc">بتل رویال</div>
      <span class="game-tag"><i class="fas fa-star"></i> ۴.۷</span>
    </div>
  </div>

  <!-- ===== FOOTER ===== -->
  <div class="footer">
    <span>
      <i class="fas fa-heart"></i> ساخته شده با عشق برای گیمرها
    </span>
    <div class="footer-social">
      <i class="fab fa-discord"></i>
      <i class="fab fa-twitch"></i>
      <i class="fab fa-youtube"></i>
      <i class="fab fa-instagram"></i>
    </div>
  </div>

</div>

<!-- ===== (اختیاری) اسکریپت برای شمارشگر ===== -->
<script>
  // انیمیشن ساده برای اعداد (فقط جلوه بصری)
  document.querySelectorAll('.stat-number').forEach(el => {
    const original = el.textContent;
    // فقط برای نمایش، عدد رو ثابت نگه میداریم ولی یه افکت کوچک اضافه میکنیم
    el.addEventListener('mouseenter', function() {
      this.style.transition = 'transform 0.2s';
      this.style.transform = 'scale(1.2)';
      setTimeout(() => { this.style.transform = 'scale(1)'; }, 200);
    });
  });
</script>

</body>
</html>
