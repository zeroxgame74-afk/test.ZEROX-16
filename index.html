<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Gaming Zone | خفن‌ترین سایت گیمینگ</title>

    <!-- فونت Vazirmatn برای تیترها -->
    <link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@700;900&display=swap" rel="stylesheet" />
    <!-- فونت Stedad برای متن‌ها -->
    <link href="https://fonts.googleapis.com/css2?family=Stedad&display=swap" rel="stylesheet" />
    <!-- Font Awesome 6 (رایگان) -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css" />

    <style>
        /* ریست و تنظیمات پایه */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background: #0b0e1a;
            color: #e5e9f0;
            font-family: 'Stedad', sans-serif;
            padding: 20px;
            min-height: 100vh;
        }

        /* تیترها با Vazirmatn */
        h1, h2, h3, .heading {
            font-family: 'Vazirmatn', sans-serif;
            font-weight: 900;
            color: #f7c948;
            text-shadow: 0 0 20px rgba(247, 201, 72, 0.3);
        }

        h1 {
            font-size: 3.5rem;
            letter-spacing: 2px;
        }

        h2 {
            font-size: 2.5rem;
            border-bottom: 3px solid #f7c948;
            padding-bottom: 10px;
            margin-bottom: 30px;
        }

        /* متن اصلی با Stedad */
        p, li, .text, .card-text {
            font-family: 'Stedad', sans-serif;
            font-size: 1.1rem;
            line-height: 1.9;
            color: #c8d0e0;
        }

        /* کانتینر */
        .container {
            max-width: 1300px;
            margin: 0 auto;
        }

        /* هدر خفن */
        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 20px 0;
            border-bottom: 2px solid #f7c94855;
            flex-wrap: wrap;
        }

        .logo i {
            font-size: 2.8rem;
            color: #f7c948;
            margin-left: 12px;
        }

        .logo span {
            font-family: 'Vazirmatn', sans-serif;
            font-weight: 900;
            font-size: 2rem;
            color: #fff;
        }

        nav a {
            color: #e5e9f0;
            text-decoration: none;
            margin: 0 18px;
            font-family: 'Vazirmatn', sans-serif;
            font-weight: 700;
            transition: 0.3s;
            font-size: 1.1rem;
        }

        nav a:hover {
            color: #f7c948;
            text-shadow: 0 0 15px #f7c948;
        }

        nav a i {
            margin-left: 8px;
        }

        /* بخش Hero */
        .hero {
            background: linear-gradient(145deg, #141a2b, #1f2742);
            padding: 60px 40px;
            border-radius: 40px;
            margin: 40px 0;
            box-shadow: 0 20px 50px rgba(0, 0, 0, 0.7);
            border: 1px solid #f7c94833;
            text-align: center;
        }

        .hero i {
            font-size: 5rem;
            color: #f7c948;
            margin-bottom: 20px;
        }

        .hero p {
            font-size: 1.4rem;
            max-width: 700px;
            margin: 20px auto;
        }

        .btn {
            display: inline-block;
            background: #f7c948;
            color: #0b0e1a;
            font-family: 'Vazirmatn', sans-serif;
            font-weight: 900;
            padding: 16px 40px;
            border-radius: 60px;
            text-decoration: none;
            font-size: 1.2rem;
            transition: 0.3s;
            box-shadow: 0 0 30px #f7c94866;
            margin-top: 20px;
        }

        .btn i {
            margin-left: 12px;
        }

        .btn:hover {
            transform: scale(1.05);
            box-shadow: 0 0 60px #f7c948aa;
        }

        /* کارت‌های بازی */
        .game-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
            gap: 30px;
            margin: 40px 0;
        }

        .game-card {
            background: #161e32;
            padding: 30px 20px;
            border-radius: 30px;
            text-align: center;
            border: 1px solid #f7c94822;
            transition: 0.4s;
            cursor: pointer;
        }

        .game-card:hover {
            transform: translateY(-12px);
            border-color: #f7c948;
            box-shadow: 0 15px 40px #f7c94833;
        }

        .game-card i {
            font-size: 4.5rem;
            color: #f7c948;
            margin-bottom: 15px;
        }

        .game-card h3 {
            font-size: 1.8rem;
            margin: 10px 0;
        }

        .game-card .status {
            display: inline-block;
            background: #f7c94822;
            padding: 6px 18px;
            border-radius: 50px;
            font-size: 0.9rem;
            color: #f7c948;
            margin-top: 10px;
        }

        /* بخش پویا با JS */
        .live-section {
            background: #101624;
            padding: 40px;
            border-radius: 40px;
            border: 1px solid #f7c94844;
            margin: 40px 0;
        }

        .live-stats {
            display: flex;
            justify-content: space-around;
            flex-wrap: wrap;
            gap: 20px;
            text-align: center;
        }

        .stat-item {
            background: #1a2340;
            padding: 25px 35px;
            border-radius: 30px;
            min-width: 150px;
            border-bottom: 4px solid #f7c948;
        }

        .stat-item i {
            font-size: 2.5rem;
            color: #f7c948;
            display: block;
            margin-bottom: 10px;
        }

        .stat-number {
            font-family: 'Vazirmatn', sans-serif;
            font-weight: 900;
            font-size: 2.8rem;
            color: #fff;
        }

        .stat-label {
            font-size: 1rem;
            color: #aab2c9;
        }

        /* فوتر */
        footer {
            text-align: center;
            padding: 40px 0;
            border-top: 1px solid #f7c94833;
            margin-top: 40px;
        }

        footer i {
            color: #f7c948;
            margin: 0 10px;
        }

        /* ریسپانسیو */
        @media (max-width: 768px) {
            h1 { font-size: 2.4rem; }
            header { flex-direction: column; gap: 20px; }
            nav a { display: inline-block; margin: 8px; }
            .hero { padding: 30px 20px; }
            .stat-item { min-width: 120px; padding: 15px; }
        }
    </style>
</head>
<body>

<div class="container">

    <!-- هدر -->
    <header>
        <div class="logo">
            <i class="fas fa-gamepad"></i>
            <span>GamingZone</span>
        </div>
        <nav>
            <a href="#"><i class="fas fa-home"></i>خانه</a>
            <a href="#"><i class="fas fa-fire"></i>بازی‌ها</a>
            <a href="#"><i class="fas fa-trophy"></i>رتبه‌بندی</a>
            <a href="#"><i class="fas fa-users"></i>انجمن</a>
        </nav>
    </header>

    <!-- هیرو -->
    <section class="hero">
        <i class="fas fa-robot"></i>
        <h1>به جنگل بازی خوش اومدی!</h1>
        <p>با <strong>GamingZone</strong> به روزترین اخبار، بروزرسانی‌ها و تریلرهای بازی‌های دنیا رو لحظه‌ای دنبال کن.</p>
        <a href="#" class="btn"><i class="fas fa-rocket"></i>شروع ماجراجویی</a>
    </section>

    <!-- لیست بازی‌ها (پویا با JS) -->
    <h2><i class="fas fa-gamepad" style="margin-left: 15px;"></i>بازی‌های داغ امروز</h2>
    <div class="game-grid" id="gameGrid">
        <!-- کارت‌ها توسط جاوااسکریپت پر می‌شوند -->
    </div>

    <!-- بخش آمار زنده (پویا) -->
    <section class="live-section">
        <h2><i class="fas fa-chart-line" style="margin-left: 15px;"></i>آمار لحظه‌ای</h2>
        <div class="live-stats" id="liveStats">
            <!-- توسط JS پر می‌شه -->
        </div>
    </section>

    <!-- فوتر -->
    <footer>
        <p>
            <i class="fas fa-crown"></i>
            ساخته شده با عشق و کد
            <i class="fas fa-heart" style="color: #ff4477;"></i>
            | تمامی حقوق برای گیمینگ‌زونه
        </p>
        <p style="margin-top: 10px; font-size: 0.9rem;">
            <i class="fab fa-twitter"></i>
            <i class="fab fa-discord"></i>
            <i class="fab fa-youtube"></i>
        </p>
    </footer>

</div>

<script>
    // ---------- داده‌های بازی‌ها (پویا) ----------
    const games = [
        { name: 'Cyberpunk 2077', icon: 'fa-robot', status: '🔥 بروزرسانی جدید' },
        { name: 'God of War', icon: 'fa-hat-wizard', status: '⚡ محبوب ترین' },
        { name: 'FIFA 24', icon: 'fa-futbol', status: '🏆 لیگ جدید' },
        { name: 'Call of Duty', icon: 'fa-crosshairs', status: '🎯 بتا آنلاین' },
        { name: 'Minecraft', icon: 'fa-cubes', status: '🛠 آپدیت 1.21' },
        { name: 'Fortnite', icon: 'fa-bolt', status: '💃 رویداد ویژه' }
    ];

    const grid = document.getElementById('gameGrid');
    games.forEach(game => {
        const card = document.createElement('div');
        card.className = 'game-card';
        card.innerHTML = `
            <i class="fas ${game.icon}"></i>
            <h3>${game.name}</h3>
            <div class="status"><i class="fas fa-circle" style="color: #4caf50; font-size: 0.6rem; margin-left: 6px;"></i>${game.status}</div>
        `;
        grid.appendChild(card);
    });

    // ---------- آمار لحظه‌ای (تغییر تصادفی هر ۳ ثانیه) ----------
    const stats = [
        { label: 'بازیکن آنلاین', icon: 'fa-user', value: 1247 },
        { label: 'بازی در حال اجرا', icon: 'fa-play', value: 89 },
        { label: 'کامنت جدید', icon: 'fa-comment', value: 312 },
        { label: 'توییت گیمینگ', icon: 'fa-twitter', value: 567 }
    ];

    const statsContainer = document.getElementById('liveStats');

    function renderStats() {
        statsContainer.innerHTML = '';
        stats.forEach(stat => {
            const div = document.createElement('div');
            div.className = 'stat-item';
            div.innerHTML = `
                <i class="fas ${stat.icon}"></i>
                <div class="stat-number">${stat.value}</div>
                <div class="stat-label">${stat.label}</div>
            `;
            statsContainer.appendChild(div);
        });
    }

    // تغییر تصادفی اعداد
    function updateStats() {
        stats.forEach(stat => {
            const change = Math.floor(Math.random() * 21) - 10; // -10 تا +10
            stat.value = Math.max(0, stat.value + change);
        });
        renderStats();
    }

    // اجرا هر ۳ ثانیه
    renderStats();
    setInterval(updateStats, 3000);

    // کلیک روی کارت‌ها (پویا)
    document.addEventListener('click', function(e) {
        const card = e.target.closest('.game-card');
        if (card) {
            const name = card.querySelector('h3').innerText;
            alert(`🎮 وارد بازی ${name} شدی! آماده‌ای؟`);
        }
    });
</script>

</body>
</html>
