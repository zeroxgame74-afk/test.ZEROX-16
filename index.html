<!DOCTYPE html>
<html lang="fa">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>GTA Mobile 3D - Police & Shooting Edition</title>
    <style>
        * {
            box-sizing: border-box;
            user-select: none;
            -webkit-user-select: none;
            margin: 0;
            padding: 0;
        }
        body, html {
            width: 100%;
            height: 100%;
            overflow: hidden;
            background-color: #000;
            font-family: Arial, sans-serif;
        }
        #game-container {
            width: 100%;
            height: 100%;
            position: absolute;
            top: 0;
            left: 0;
        }
        /* HUD & UI */
        #hud {
            position: absolute;
            top: 15px;
            right: 15px;
            color: #fff;
            text-align: right;
            text-shadow: 2px 2px 4px #000;
            pointer-events: none;
            font-weight: bold;
            font-size: 18px;
            z-index: 10;
        }
        #money { color: #55ff55; font-size: 22px; }
        #wanted { color: #ff3333; font-size: 20px; letter-spacing: 2px; }
        #health-bar-bg {
            width: 120px;
            height: 12px;
            background: rgba(0,0,0,0.6);
            border: 1px solid #fff;
            margin-top: 5px;
            display: inline-block;
        }
        #health-bar {
            width: 100%;
            height: 100%;
            background: #22ff22;
        }

        /* Touch Controls */
        #joystick-zone {
            position: absolute;
            bottom: 30px;
            left: 30px;
            width: 120px;
            height: 120px;
            background: rgba(255, 255, 255, 0.15);
            border: 2px solid rgba(255, 255, 255, 0.4);
            border-radius: 50%;
            touch-action: none;
            z-index: 10;
        }
        #joystick-knob {
            position: absolute;
            top: 35px;
            left: 35px;
            width: 50px;
            height: 50px;
            background: rgba(255, 255, 255, 0.6);
            border-radius: 50%;
            box-shadow: 0 0 10px rgba(0,0,0,0.5);
        }
        
        /* Action Buttons Container */
        .btn-group {
            position: absolute;
            bottom: 30px;
            right: 20px;
            display: flex;
            flex-direction: column;
            gap: 15px;
            align-items: center;
            z-index: 10;
        }
        .action-btn {
            width: 65px;
            height: 65px;
            border: 2px solid #fff;
            border-radius: 50%;
            color: #fff;
            font-size: 12px;
            font-weight: bold;
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: 0 4px 10px rgba(0,0,0,0.4);
            touch-action: none;
        }
        #enter-btn { background: rgba(255, 170, 0, 0.8); }
        #fire-btn { background: rgba(255, 30, 30, 0.85); font-size: 14px; }
        .action-btn:active { transform: scale(0.92); }
    </style>
    <!-- Three.js Library -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
</head>
<body>

    <div id="game-container"></div>

    <div id="hud">
        <div id="money">$1,250,000</div>
        <div id="wanted">★☆☆☆☆</div>
        <div>HEALTH</div>
        <div id="health-bar-bg"><div id="health-bar"></div></div>
    </div>

    <!-- Joystick for Movement -->
    <div id="joystick-zone">
        <div id="joystick-knob"></div>
    </div>

    <!-- Action Buttons -->
    <div class="btn-group">
        <div id="fire-btn" class="action-btn">شلیک 🔥</div>
        <div id="enter-btn" class="action-btn">ورود/خروج</div>
    </div>

    <script>
        // --- 1. SETUP THREE.JS SCENE ---
        const container = document.getElementById('game-container');
        const scene = new THREE.Scene();
        scene.background = new THREE.Color(0x87ceeb);
        scene.fog = new THREE.FogExp2(0x87ceeb, 0.012);

        const camera = new THREE.PerspectiveCamera(60, window.innerWidth / window.innerHeight, 0.1, 1000);
        const renderer = new THREE.WebGLRenderer({ antialias: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
        renderer.shadowMap.enabled = true;
        renderer.shadowMap.type = THREE.PCFSoftShadowMap;
        container.appendChild(renderer.domElement);

        // --- 2. LIGHTS ---
        const ambientLight = new THREE.AmbientLight(0xffffff, 0.6);
        scene.add(ambientLight);

        const dirLight = new THREE.DirectionalLight(0xffffff, 0.8);
        dirLight.position.set(50, 80, 30);
        dirLight.castShadow = true;
        dirLight.shadow.mapSize.width = 1024;
        dirLight.shadow.mapSize.height = 1024;
        scene.add(dirLight);

        // --- 3. ENVIRONMENT & CITY ---
        const gridCanvas = document.createElement('canvas');
        gridCanvas.width = 512;
        gridCanvas.height = 512;
        const ctx = gridCanvas.getContext('2d');
        ctx.fillStyle = '#333333';
        ctx.fillRect(0, 0, 512, 512);
        ctx.fillStyle = '#e6b800';
        ctx.fillRect(250, 0, 12, 512);
        
        const roadTexture = new THREE.CanvasTexture(gridCanvas);
        roadTexture.wrapS = THREE.RepeatWrapping;
        roadTexture.wrapT = THREE.RepeatWrapping;
        roadTexture.repeat.set(25, 25);

        const planeGeo = new THREE.PlaneGeometry(400, 400);
        const planeMat = new THREE.MeshStandardMaterial({ map: roadTexture, roughness: 0.8 });
        const ground = new THREE.Mesh(planeGeo, planeMat);
        ground.rotation.x = -Math.PI / 2;
        ground.receiveShadow = true;
        scene.add(ground);

        // Buildings Generator
        const buildingMat = new THREE.MeshStandardMaterial({ color: 0x888888, roughness: 0.5 });
        for (let i = 0; i < 45; i++) {
            const h = 12 + Math.random() * 35;
            const w = 10 + Math.random() * 8;
            const d = 10 + Math.random() * 8;

            const bGeo = new THREE.BoxGeometry(w, h, d);
            const building = new THREE.Mesh(bGeo, buildingMat);
            
            let x = (Math.random() - 0.5) * 320;
            let z = (Math.random() - 0.5) * 320;
            if (Math.abs(x) < 20) x += 40;
            if (Math.abs(z) < 20) z += 40;

            building.position.set(x, h / 2, z);
            building.castShadow = true;
            building.receiveShadow = true;
            scene.add(building);
        }

        // --- 4. PLAYER & VEHICLES ---
        // Player
        const playerGroup = new THREE.Group();
        const bodyGeo = new THREE.CylinderGeometry(0.4, 0.4, 1.8, 16);
        const bodyMat = new THREE.MeshStandardMaterial({ color: 0x0055ff });
        const body = new THREE.Mesh(bodyGeo, bodyMat);
        body.position.y = 0.9;
        body.castShadow = true;
        playerGroup.add(body);

        const headGeo = new THREE.SphereGeometry(0.3, 16, 16);
        const headMat = new THREE.MeshStandardMaterial({ color: 0xffccaa });
        const head = new THREE.Mesh(headGeo, headMat);
        head.position.y = 1.9;
        playerGroup.add(head);

        // Gun model
        const gunGeo = new THREE.BoxGeometry(0.15, 0.15, 0.6);
        const gunMat = new THREE.MeshStandardMaterial({ color: 0x111111 });
        const gun = new THREE.Mesh(gunGeo, gunMat);
        gun.position.set(0.4, 1.2, 0.3);
        playerGroup.add(gun);

        playerGroup.position.set(0, 0, 10);
        scene.add(playerGroup);

        // Civil Vehicle
        const carGroup = createCarMesh(0xcc0000);
        carGroup.position.set(8, 0, 0);
        scene.add(carGroup);

        function createCarMesh(colorHex, isPolice = false) {
            const car = new THREE.Group();
            const carBodyGeo = new THREE.BoxGeometry(2.2, 1, 4.2);
            const carMat = new THREE.MeshStandardMaterial({ color: colorHex, metalness: 0.3, roughness: 0.3 });
            const carBody = new THREE.Mesh(carBodyGeo, carMat);
            carBody.position.y = 0.7;
            carBody.castShadow = true;
            car.add(carBody);

            const cabinGeo = new THREE.BoxGeometry(1.8, 0.8, 2);
            const cabinMat = new THREE.MeshStandardMaterial({ color: 0x111111, roughness: 0.1 });
            const cabin = new THREE.Mesh(cabinGeo, cabinMat);
            cabin.position.set(0, 1.4, -0.2);
            car.add(cabin);

            if (isPolice) {
                // Siren light
                const sirenGeo = new THREE.BoxGeometry(0.8, 0.2, 0.3);
                const sirenMat = new THREE.MeshStandardMaterial({ color: 0xff0000 });
                const siren = new THREE.Mesh(sirenGeo, sirenMat);
                siren.position.set(0, 1.9, -0.2);
                siren.name = "siren";
                car.add(siren);
            }

            return car;
        }

        // --- 5. GAME STATE & VARIABLES ---
        let playerHealth = 100;
        let wantedStars = 0;
        let isDriving = false;
        let bullets = [];
        let policeCars = [];

        // --- 6. CONTROLS LOGIC ---
        let moveVector = { x: 0, y: 0 };
        const joystickZone = document.getElementById('joystick-zone');
        const joystickKnob = document.getElementById('joystick-knob');
        let touchId = null;
        let center = { x: 0, y: 0 };

        joystickZone.addEventListener('touchstart', (e) => {
            const touch = e.changedTouches[0];
            touchId = touch.identifier;
            const rect = joystickZone.getBoundingClientRect();
            center = { x: rect.left + rect.width / 2, y: rect.top + rect.height / 2 };
            updateJoystick(touch);
        }, { passive: false });

        window.addEventListener('touchmove', (e) => {
            if (touchId === null) return;
            for (let i = 0; i < e.changedTouches.length; i++) {
                if (e.changedTouches[i].identifier === touchId) {
                    updateJoystick(e.changedTouches[i]);
                    break;
                }
            }
        }, { passive: false });

        const resetJoystick = () => {
            touchId = null;
            moveVector = { x: 0, y: 0 };
            joystickKnob.style.transform = `translate(0px, 0px)`;
        };

        window.addEventListener('touchend', resetJoystick);
        window.addEventListener('touchcancel', resetJoystick);

        function updateJoystick(touch) {
            const dx = touch.clientX - center.x;
            const dy = touch.clientY - center.y;
            const dist = Math.min(Math.hypot(dx, dy), 40);
            const angle = Math.atan2(dy, dx);
            
            const knX = Math.cos(angle) * dist;
            const knY = Math.sin(angle) * dist;
            
            joystickKnob.style.transform = `translate(${knX}px, ${knY}px)`;
            
            moveVector.x = knX / 40;
            moveVector.y = knY / 40;
        }

        // Camera Touch Drag
        let camYaw = 0;
        let camPitch = 0.3;
        let rightTouchId = null;
        let lastTouchPos = { x: 0, y: 0 };

        window.addEventListener('touchstart', (e) => {
            for (let i = 0; i < e.changedTouches.length; i++) {
                const t = e.changedTouches[i];
                if (t.clientX > window.innerWidth / 2 && rightTouchId === null) {
                    rightTouchId = t.identifier;
                    lastTouchPos = { x: t.clientX, y: t.clientY };
                }
            }
        });

        window.addEventListener('touchmove', (e) => {
            for (let i = 0; i < e.changedTouches.length; i++) {
                const t = e.changedTouches[i];
                if (t.identifier === rightTouchId) {
                    const dx = t.clientX - lastTouchPos.x;
                    const dy = t.clientY - lastTouchPos.y;
                    
                    camYaw -= dx * 0.008;
                    camPitch = Math.max(0.1, Math.min(Math.PI / 2.5, camPitch + dy * 0.008));
                    
                    lastTouchPos = { x: t.clientX, y: t.clientY };
                }
            }
        });

        const clearRightTouch = (e) => {
            for (let i = 0; i < e.changedTouches.length; i++) {
                if (e.changedTouches[i].identifier === rightTouchId) {
                    rightTouchId = null;
                }
            }
        };
        window.addEventListener('touchend', clearRightTouch);
        window.addEventListener('touchcancel', clearRightTouch);

        // Enter/Exit Vehicle Button
        document.getElementById('enter-btn').addEventListener('click', () => {
            if (!isDriving) {
                const dist = playerGroup.position.distanceTo(carGroup.position);
                if (dist < 4) {
                    isDriving = true;
                    playerGroup.visible = false;
                }
            } else {
                isDriving = false;
                playerGroup.position.copy(carGroup.position).add(new THREE.Vector3(2, 0, 0));
                playerGroup.visible = true;
            }
        });

        // Shooting Button Logic
        document.getElementById('fire-btn').addEventListener('click', () => {
            if (isDriving) return; // Cannot shoot inside vehicle in basic mode

            // Increase Wanted Level on Shoot
            increaseWanted();

            // Create Bullet Mesh
            const bulletGeo = new THREE.SphereGeometry(0.15, 8, 8);
            const bulletMat = new THREE.MeshBasicMaterial({ color: 0xffff00 });
            const bullet = new THREE.Mesh(bulletGeo, bulletMat);
            
            bullet.position.copy(playerGroup.position).add(new THREE.Vector3(0, 1.2, 0));
            
            // Calculate Dir from player rotation
            const dir = new THREE.Vector3(0, 0, 1).applyAxisAngle(new THREE.Vector3(0, 1, 0), playerGroup.rotation.y);
            bullet.userData = { dir: dir, speed: 60, life: 2.0 };
            
            bullets.push(bullet);
            scene.add(bullet);
        });

        function increaseWanted() {
            if (wantedStars < 5) {
                wantedStars++;
                let starsText = "★".repeat(wantedStars) + "☆".repeat(5 - wantedStars);
                document.getElementById('wanted').innerText = starsText;
                spawnPoliceCar();
            }
        }

        function spawnPoliceCar() {
            const police = createCarMesh(0x111111, true);
            // Spawn around player at distance
            const angle = Math.random() * Math.PI * 2;
            police.position.set(
                playerGroup.position.x + Math.cos(angle) * 80,
                0,
                playerGroup.position.z + Math.sin(angle) * 80
            );
            scene.add(police);
            policeCars.push(police);
        }

        // --- 7. MAIN GAME LOOP ---
        const clock = new THREE.Clock();

        function animate() {
            requestAnimationFrame(animate);
            const delta = clock.getDelta();

            const targetObj = isDriving ? carGroup : playerGroup;
            const speed = isDriving ? 22 : 8;

            // Movement logic
            if (Math.abs(moveVector.x) > 0.1 || Math.abs(moveVector.y) > 0.1) {
                const forward = new THREE.Vector3(-Math.sin(camYaw), 0, -Math.cos(camYaw)).normalize();
                const right = new THREE.Vector3().crossVectors(forward, new THREE.Vector3(0, 1, 0)).negate();

                const moveDir = new THREE.Vector3()
                    .addScaledVector(right, moveVector.x)
                    .addScaledVector(forward, -moveVector.y)
                    .normalize();

                targetObj.position.addScaledVector(moveDir, speed * delta);
                targetObj.rotation.y = Math.atan2(moveDir.x, moveDir.z);
            }

            // Bullet Physics & Hit Detection
            for (let i = bullets.length - 1; i >= 0; i--) {
                const b = bullets[i];
                b.position.addScaledVector(b.userData.dir, b.userData.speed * delta);
                b.userData.life -= delta;

                // Hit police car check
                for (let j = policeCars.length - 1; j >= 0; j--) {
                    const p = policeCars[j];
                    if (b.position.distanceTo(p.position) < 2.5) {
                        scene.remove(p);
                        policeCars.splice(j, 1);
                        scene.remove(b);
                        bullets.splice(i, 1);
                        break;
                    }
                }

                if (b.userData.life <= 0) {
                    scene.remove(b);
                    bullets.splice(i, 1);
                }
            }

            // Police AI Movement
            policeCars.forEach((police) => {
                const pDir = new THREE.Vector3().subVectors(targetObj.position, police.position).normalize();
                police.position.addScaledVector(pDir, 12 * delta);
                police.rotation.y = Math.atan2(pDir.x, pDir.z);

                // Siren Light animation
                const siren = police.getObjectByName("siren");
                if (siren) {
                    siren.material.color.setHex(Math.floor(Date.now() / 200) % 2 === 0 ? 0xff0000 : 0x0000ff);
                }

                // Damage player if close
                if (police.position.distanceTo(targetObj.position) < 2.2) {
                    playerHealth = Math.max(0, playerHealth - 15 * delta);
                    document.getElementById('health-bar').style.width = playerHealth + '%';
                    if (playerHealth <= 0) {
                        alert("دستگیر یا نابود شدید! (WASTED)");
                        location.reload();
                    }
                }
            });

            // Camera Follow System
            const camDistance = isDriving ? 10 : 6;
            const targetPos = targetObj.position.clone();
            
            const camX = targetPos.x + camDistance * Math.sin(camYaw) * Math.cos(camPitch);
            const camY = targetPos.y + camDistance * Math.sin(camPitch) + (isDriving ? 1 : 1.5);
            const camZ = targetPos.z + camDistance * Math.cos(camYaw) * Math.cos(camPitch);

            camera.position.set(camX, camY, camZ);
            camera.lookAt(targetPos.x, targetPos.y + 1, targetPos.z);

            renderer.render(scene, camera);
        }

        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });

        animate();
    </script>
</body>
</html>
