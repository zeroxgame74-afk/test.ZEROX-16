<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>🏰 Fantasy Kingdom - RTS</title>
    <style>
        * { margin: 0; padding: 0; }
        body { overflow: hidden; touch-action: none; background: #1a1a2e; font-family: 'Segoe UI', Tahoma, sans-serif; }
        canvas { display: block; width: 100vw; height: 100vh; }
        
        #ui { position: absolute; bottom: 0; left: 0; right: 0; padding: 10px; 
              background: linear-gradient(transparent, rgba(0,0,0,0.8)); pointer-events: none; }
        #ui > * { pointer-events: auto; }
        
        #topBar { position: absolute; top: 10px; left: 10px; right: 10px; display: flex; 
                  justify-content: space-between; color: white; text-shadow: 0 2px 4px rgba(0,0,0,0.8);
                  font-size: 14px; font-weight: bold; }
        .res { background: rgba(0,0,0,0.6); padding: 6px 14px; border-radius: 20px; 
               backdrop-filter: blur(4px); border: 1px solid rgba(255,255,255,0.1); }
        .res span { color: #ffd700; }
        .res .elixir { color: #9b59b6; }
        
        #buildMenu { display: flex; gap: 8px; flex-wrap: wrap; justify-content: center; 
                     margin-bottom: 10px; }
        .buildBtn { background: rgba(30,30,60,0.9); border: 2px solid #4a4a8a; color: white;
                    padding: 8px 14px; border-radius: 12px; font-size: 12px; font-weight: bold;
                    backdrop-filter: blur(4px); min-width: 60px; text-align: center; }
        .buildBtn:active { transform: scale(0.95); background: #4a4a8a; }
        .buildBtn .cost { font-size: 10px; color: #ffd700; display: block; }
        
        #infoPanel { position: absolute; top: 60px; right: 10px; background: rgba(0,0,0,0.7);
                     border-radius: 12px; padding: 8px 14px; color: white; font-size: 12px;
                     backdrop-filter: blur(4px); border: 1px solid rgba(255,255,255,0.1);
                     display: none; max-width: 150px; }
        #infoPanel .title { font-weight: bold; color: #ffd700; }
    </style>
</head>
<body>

<div id="topBar">
    <div class="res">💰 <span id="goldDisplay">100</span></div>
    <div class="res">🧪 <span class="elixir" id="elixirDisplay">50</span></div>
    <div class="res">⭐ <span id="starsDisplay">0</span></div>
</div>

<div id="infoPanel">
    <div class="title" id="infoTitle">Building</div>
    <div id="infoDesc">Level 1</div>
    <button id="upgradeBtn" style="margin-top:6px;background:#ffd700;border:none;border-radius:8px;padding:4px 12px;font-weight:bold;">⬆ Upgrade</button>
</div>

<div id="ui">
    <div id="buildMenu">
        <div class="buildBtn" data-type="house">🏠 House<br><span class="cost">💰30</span></div>
        <div class="buildBtn" data-type="farm">🌾 Farm<br><span class="cost">💰40</span></div>
        <div class="buildBtn" data-type="tower">🗼 Tower<br><span class="cost">💰50 🧪20</span></div>
        <div class="buildBtn" data-type="barracks">⚔️ Barracks<br><span class="cost">💰60 🧪30</span></div>
        <div class="buildBtn" data-type="wall">🧱 Wall<br><span class="cost">💰20</span></div>
    </div>
    <div style="text-align:center;color:white;font-size:11px;text-shadow:0 2px 4px black;">
        👆 Tap ground to build • Tap building to upgrade
    </div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/babylonjs/6.25.1/babylon.js"></script>
<script>
// ====== GAME STATE ======
const game = {
    gold: 100, elixir: 50, stars: 0, level: 1,
    buildings: [], enemies: [], troops: [],
    selectedBuilding: null,
    buildMode: null,
    gridSize: 2,
    mapSize: 20
};

// ====== BABYLON SETUP ======
const canvas = document.createElement('canvas');
document.body.prepend(canvas);
const engine = new BABYLON.Engine(canvas, true, { adaptToDeviceRatio: true });
const scene = new BABYLON.Scene(engine);
scene.clearColor = new BABYLON.Color3(0.1, 0.15, 0.25);
scene.ambientColor = new BABYLON.Color3(0.5, 0.5, 0.5);

// Camera
const camera = new BABYLON.ArcRotateCamera("cam", -Math.PI/2, Math.PI/3, 25, BABYLON.Vector3.Zero(), scene);
camera.attachControl(canvas, true);
camera.lowerRadiusLimit = 8;
camera.upperRadiusLimit = 40;
camera.wheelPrecision = 30;
camera.panningSensibility = 0;

// Lights
const hemi = new BABYLON.HemisphericLight("hemi", new BABYLON.Vector3(0, 1, 0), scene);
hemi.intensity = 0.8;
hemi.groundColor = new BABYLON.Color3(0.3, 0.2, 0.1);
const sun = new BABYLON.DirectionalLight("sun", new BABYLON.Vector3(-1, -2, -1), scene);
sun.intensity = 1.2;

// Ground
const groundMat = new BABYLON.StandardMaterial("groundMat", scene);
groundMat.diffuseColor = new BABYLON.Color3(0.2, 0.5, 0.15);
groundMat.specularColor = BABYLON.Color3.Black();
const ground = BABYLON.MeshBuilder.CreateGround("ground", {width: game.mapSize, height: game.mapSize}, scene);
ground.material = groundMat;
ground.position.y = -0.05;

// Grid helper
const gridMat = new BABYLON.StandardMaterial("gridMat", scene);
gridMat.diffuseColor = new BABYLON.Color3(1,1,1);
gridMat.alpha = 0.08;
gridMat.wireframe = true;
const gridPlane = BABYLON.MeshBuilder.CreateGround("grid", {width: game.mapSize, height: game.mapSize, subdivisions: 10}, scene);
gridPlane.material = gridMat;
gridPlane.position.y = 0.01;

// ====== BUILDING SYSTEM ======
const BUILDING_TYPES = {
    house: { name: 'House', cost: {gold:30, elixir:0}, color: [0.9,0.6,0.3], hp:50, size:1.2 },
    farm: { name: 'Farm', cost: {gold:40, elixir:0}, color: [0.3,0.8,0.2], hp:40, size:1.5 },
    tower: { name: 'Tower', cost: {gold:50, elixir:20}, color: [0.7,0.3,0.7], hp:80, size:1.2 },
    barracks: { name: 'Barracks', cost: {gold:60, elixir:30}, color: [0.8,0.2,0.2], hp:100, size:1.8 },
    wall: { name: 'Wall', cost: {gold:20, elixir:0}, color: [0.6,0.6,0.6], hp:120, size:1.0 }
};

function createBuildingMesh(type, pos) {
    const data = BUILDING_TYPES[type];
    const box = BABYLON.MeshBuilder.CreateBox(type + '_mesh', {size: data.size}, scene);
    box.position.copyFrom(pos);
    box.position.y = data.size/2;
    
    const mat = new BABYLON.StandardMaterial(type + '_mat', scene);
    mat.diffuseColor = new BABYLON.Color3(data.color[0], data.color[1], data.color[2]);
    mat.specularColor = new BABYLON.Color3(0.1, 0.1, 0.1);
    box.material = mat;
    
    // Roof for houses
    if (type === 'house' || type === 'tower') {
        const roof = BABYLON.MeshBuilder.CreateCylinder('roof', {diameter: data.size*0.9, height: data.size*0.6, tessellation: 4}, scene);
        roof.position.copyFrom(pos);
        roof.position.y = data.size + 0.2;
        const roofMat = new BABYLON.StandardMaterial('roof_mat', scene);
        roofMat.diffuseColor = new BABYLON.Color3(0.8, 0.2, 0.2);
        roof.material = roofMat;
        box.roof = roof;
    }
    
    // Add a glow ring for towers
    if (type === 'tower') {
        const ring = BABYLON.MeshBuilder.CreateTorus('ring', {diameter: data.size*1.5, thickness: 0.05}, scene);
        ring.position.copyFrom(pos);
        ring.position.y = 0.1;
        const ringMat = new BABYLON.StandardMaterial('ring_mat', scene);
        ringMat.diffuseColor = new BABYLON.Color3(1, 0.5, 0);
        ringMat.emissiveColor = new BABYLON.Color3(0.5, 0.2, 0);
        ring.material = ringMat;
        box.ring = ring;
    }
    
    return box;
}

function canAfford(cost) {
    return game.gold >= cost.gold && game.elixir >= (cost.elixir || 0);
}

function spend(cost) {
    game.gold -= cost.gold;
    game.elixir -= (cost.elixir || 0);
    updateUI();
}

function addBuilding(type, x, z) {
    const data = BUILDING_TYPES[type];
    if (!canAfford(data.cost)) return false;
    
    // Check grid placement (simple)
    const pos = new BABYLON.Vector3(x, 0, z);
    // Simple collision check
    for (let b of game.buildings) {
        if (BABYLON.Vector3.Distance(b.mesh.position, pos) < data.size + 0.5) return false;
    }
    
    spend(data.cost);
    const mesh = createBuildingMesh(type, pos);
    const building = {
        id: Date.now() + Math.random(),
        type: type,
        mesh: mesh,
        level: 1,
        hp: data.hp,
        maxHp: data.hp,
        pos: pos,
        size: data.size,
        attackCooldown: 0
    };
    game.buildings.push(building);
    
    // Add floating label
    const label = BABYLON.MeshBuilder.CreatePlane('label', {size: 0.8}, scene);
    label.position.copyFrom(pos);
    label.position.y = data.size + 1.5;
    label.billboardMode = BABYLON.Mesh.BILLBOARDMODE_ALL;
    const labelMat = new BABYLON.StandardMaterial('label_mat', scene);
    labelMat.diffuseColor = new BABYLON.Color3(1,1,0);
    labelMat.emissiveColor = new BABYLON.Color3(0.3,0.3,0);
    label.material = labelMat;
    building.label = label;
    
    // Particle effect on build
    createParticles(pos, new BABYLON.Color3(0,1,0.5), 20);
    
    updateUI();
    return true;
}

// ====== PARTICLES ======
function createParticles(pos, color, count=30) {
    const particleSystem = new BABYLON.ParticleSystem("particles", count, scene);
    particleSystem.particleTexture = new BABYLON.Texture("https://www.babylonjs.com/img/particles/star.png", scene);
    particleSystem.emitter = pos;
    particleSystem.minSize = 0.1;
    particleSystem.maxSize = 0.5;
    particleSystem.color1 = color;
    particleSystem.color2 = color;
    particleSystem.minLifeTime = 0.5;
    particleSystem.maxLifeTime = 1.5;
    particleSystem.emitRate = count;
    particleSystem.blendMode = BABYLON.ParticleSystem.BLENDMODE_ADD;
    particleSystem.minEmitBox = new BABYLON.Vector3(-0.5,0,-0.5);
    particleSystem.maxEmitBox = new BABYLON.Vector3(0.5,0,0.5);
    particleSystem.start();
    setTimeout(() => particleSystem.stop(), 100);
    setTimeout(() => particleSystem.dispose(), 2000);
}

// ====== ENEMY SYSTEM ======
let enemySpawnTimer = 0;

function spawnEnemy() {
    const angle = Math.random() * Math.PI * 2;
    const dist = 12 + Math.random() * 3;
    const pos = new BABYLON.Vector3(Math.cos(angle)*dist, 0, Math.sin(angle)*dist);
    
    const sphere = BABYLON.MeshBuilder.CreateSphere('enemy', {diameter: 0.8}, scene);
    sphere.position.copyFrom(pos);
    sphere.position.y = 0.4;
    const mat = new BABYLON.StandardMaterial('enemy_mat', scene);
    mat.diffuseColor = new BABYLON.Color3(1, 0.2, 0.2);
    mat.emissiveColor = new BABYLON.Color3(0.3, 0, 0);
    sphere.material = mat;
    
    const enemy = {
        mesh: sphere,
        pos: pos,
        hp: 20 + game.level * 5,
        maxHp: 20 + game.level * 5,
        speed: 1 + game.level * 0.2,
        target: null,
        attackCooldown: 0,
        attackDamage: 5 + game.level
    };
    game.enemies.push(enemy);
}

// ====== TROOP SYSTEM ======
function spawnTroop(type) {
    // Find barracks
    const barracks = game.buildings.find(b => b.type === 'barracks');
    if (!barracks) return false;
    if (game.elixir < 15) return false;
    
    game.elixir -= 15;
    const pos = barracks.pos.clone();
    pos.x += (Math.random() - 0.5) * 3;
    pos.z += (Math.random() - 0.5) * 3;
    
    const sphere = BABYLON.MeshBuilder.CreateSphere('troop', {diameter: 0.6}, scene);
    sphere.position.copyFrom(pos);
    sphere.position.y = 0.3;
    const mat = new BABYLON.StandardMaterial('troop_mat', scene);
    mat.diffuseColor = new BABYLON.Color3(0.2, 0.6, 1);
    sphere.material = mat;
    
    const troop = {
        mesh: sphere,
        pos: pos,
        hp: 30,
        speed: 2 + Math.random(),
        attackDamage: 8,
        attackCooldown: 0,
        target: null
    };
    game.troops.push(troop);
    createParticles(pos, new BABYLON.Color3(0.2, 0.6, 1), 15);
    updateUI();
    return true;
}

// ====== UPDATE LOOP ======
scene.onBeforeRenderObservable.add(() => {
    const delta = engine.getDeltaTime() / 1000;
    
    // Enemy spawn
    enemySpawnTimer += delta;
    if (enemySpawnTimer > 4 - game.level * 0.2 && game.enemies.length < 5 + game.level) {
        enemySpawnTimer = 0;
        spawnEnemy();
    }
    
    // Move enemies toward nearest building
    for (let i = game.enemies.length - 1; i >= 0; i--) {
        const e = game.enemies[i];
        let target = null;
        let minDist = Infinity;
        for (let b of game.buildings) {
            const d = BABYLON.Vector3.Distance(e.pos, b.mesh.position);
            if (d < minDist) { minDist = d; target = b; }
        }
        if (target) {
            const dir = target.mesh.position.subtract(e.pos).normalize();
            e.pos.x += dir.x * e.speed * delta;
            e.pos.z += dir.z * e.speed * delta;
            e.mesh.position.x = e.pos.x;
            e.mesh.position.z = e.pos.z;
            e.mesh.position.y = 0.4 + Math.sin(Date.now()/300 + i) * 0.1;
            
            // Attack building
            if (minDist < 1.5) {
                e.attackCooldown -= delta;
                if (e.attackCooldown <= 0) {
                    target.hp -= e.attackDamage;
                    e.attackCooldown = 1;
                    createParticles(target.mesh.position, new BABYLON.Color3(1,0.5,0), 8);
                    if (target.hp <= 0) {
                        // Destroy building
                        const idx = game.buildings.indexOf(target);
                        if (idx > -1) {
                            createParticles(target.mesh.position, new BABYLON.Color3(1,0,0), 40);
                            target.mesh.dispose();
                            if (target.mesh.roof) target.mesh.roof.dispose();
                            if (target.mesh.ring) target.mesh.ring.dispose();
                            if (target.label) target.label.dispose();
                            game.buildings.splice(idx, 1);
                            game.stars = Math.max(0, game.stars - 1);
                            updateUI();
                        }
                    }
                    updateUI();
                }
            }
        }
    }
    
    // Auto attack towers
    for (let b of game.buildings) {
        if (b.type === 'tower') {
            b.attackCooldown -= delta;
            for (let e of game.enemies) {
                if (BABYLON.Vector3.Distance(b.mesh.position, e.pos) < 5) {
                    if (b.attackCooldown <= 0) {
                        e.hp -= 10;
                        b.attackCooldown = 1.5;
                        createParticles(e.pos, new BABYLON.Color3(1,0.8,0.2), 5);
                        if (e.hp <= 0) {
                            const idx = game.enemies.indexOf(e);
                            if (idx > -1) {
                                createParticles(e.pos, new BABYLON.Color3(1,0.3,0), 20);
                                e.mesh.dispose();
                                game.enemies.splice(idx, 1);
                                game.gold += 10 + game.level * 2;
                                updateUI();
                                // Level up progression
                                if (game.enemies.length === 0 && game.buildings.length > 3) {
                                    game.level++;
                                    document.getElementById('infoTitle').innerText = '🎉 Level Up!';
                                    setTimeout(() => document.getElementById('infoTitle').innerText = 'Building', 2000);
                                }
                            }
                        }
                        break;
                    }
                }
            }
        }
    }
    
    // Move troops toward enemies
    for (let t of game.troops) {
        let target = null;
        let minDist = Infinity;
        for (let e of game.enemies) {
            const d = BABYLON.Vector3.Distance(t.pos, e.pos);
            if (d < minDist) { minDist = d; target = e; }
        }
        if (target) {
            const dir = target.pos.subtract(t.pos).normalize();
            t.pos.x += dir.x * t.speed * delta;
            t.pos.z += dir.z * t.speed * delta;
            t.mesh.position.x = t.pos.x;
            t.mesh.position.z = t.pos.z;
            if (minDist < 1.5) {
                t.attackCooldown -= delta;
                if (t.attackCooldown <= 0) {
                    target.hp -= t.attackDamage;
                    t.attackCooldown = 1;
                    createParticles(target.pos, new BABYLON.Color3(0.2,0.8,1), 5);
                    if (target.hp <= 0) {
                        const idx = game.enemies.indexOf(target);
                        if (idx > -1) {
                            createParticles(target.pos, new BABYLON.Color3(1,0.3,0), 20);
                            target.mesh.dispose();
                            game.enemies.splice(idx, 1);
                            game.gold += 15;
                            updateUI();
                        }
                    }
                }
            }
        }
    }
    
    // Resource generation
    for (let b of game.buildings) {
        if (b.type === 'farm') {
            if (Math.random() < 0.01 * delta * 10) {
                game.gold += 1;
                createParticles(b.mesh.position, new BABYLON.Color3(0,1,0), 3);
                updateUI();
            }
        }
        if (b.type === 'house') {
            if (Math.random() < 0.005 * delta * 10) {
                game.elixir += 1;
                createParticles(b.mesh.position, new BABYLON.Color3(0.8,0.3,1), 3);
                updateUI();
            }
        }
    }
});

// ====== UI INTERACTIONS ======
function updateUI() {
    document.getElementById('goldDisplay').innerText = Math.floor(game.gold);
    document.getElementById('elixirDisplay').innerText = Math.floor(game.elixir);
    document.getElementById('starsDisplay').innerText = game.stars;
}

// Build buttons
document.querySelectorAll('.buildBtn').forEach(btn => {
    btn.addEventListener('click', (e) => {
        e.stopPropagation();
        const type = btn.dataset.type;
        game.buildMode = type;
        document.querySelectorAll('.buildBtn').forEach(b => b.style.borderColor = '#4a4a8a');
        btn.style.borderColor = '#ffd700';
        document.getElementById('infoPanel').style.display = 'none';
    });
});

// Tap ground to build
canvas.addEventListener('click', (e) => {
    if (!game.buildMode) return;
    const pick = scene.pick(e.clientX, e.clientY, mesh => mesh === ground);
    if (pick && pick.pickedPoint) {
        const x = Math.round(pick.pickedPoint.x / game.gridSize) * game.gridSize;
        const z = Math.round(pick.pickedPoint.z / game.gridSize) * game.gridSize;
        if (Math.abs(x) < game.mapSize/2 - 1 && Math.abs(z) < game.mapSize/2 - 1) {
            if (addBuilding(game.buildMode, x, z)) {
                createParticles(new BABYLON.Vector3(x,0,z), new BABYLON.Color3(1,1,0.5), 15);
            }
        }
    }
});

// Select building for upgrade
canvas.addEventListener('dblclick', (e) => {
    const pick = scene.pick(e.clientX, e.clientY);
    if (pick && pick.pickedMesh) {
        for (let b of game.buildings) {
            if (b.mesh === pick.pickedMesh || (b.mesh.roof && b.mesh.roof === pick.pickedMesh)) {
                game.selectedBuilding = b;
                const panel = document.getElementById('infoPanel');
                panel.style.display = 'block';
                document.getElementById('infoTitle').innerText = b.type.toUpperCase() + ' Lv.' + b.level;
                document.getElementById('infoDesc').innerText = 'HP: ' + Math.floor(b.hp) + '/' + b.maxHp;
                document.getElementById('upgradeBtn').onclick = () => {
                    const cost = {gold: 30 * b.level, elixir: 10 * b.level};
                    if (canAfford(cost)) {
                        spend(cost);
                        b.level++;
                        b.maxHp += 20;
                        b.hp = b.maxHp;
                        // Visual upgrade: scale up slightly
                        b.mesh.scaling.x = 1 + b.level * 0.05;
                        b.mesh.scaling.z = 1 + b.level * 0.05;
                        b.mesh.scaling.y = 1 + b.level * 0.05;
                        createParticles(b.mesh.position, new BABYLON.Color3(1,1,0), 25);
                        updateUI();
                        document.getElementById('infoTitle').innerText = b.type.toUpperCase() + ' Lv.' + b.level;
                        document.getElementById('infoDesc').innerText = 'HP: ' + Math.floor(b.hp) + '/' + b.maxHp;
                    }
                };
                return;
            }
        }
    }
});

// ====== RESIZE ======
window.addEventListener('resize', () => engine.resize());

// ====== START ======
updateUI();

// Spawn initial buildings
addBuilding('house', -3, -3);
addBuilding('house', 3, -3);
addBuilding('farm', -4, 3);
addBuilding('tower', 4, 4);
addBuilding('barracks', 0, -5);

// Set camera target to center
camera.setTarget(BABYLON.Vector3.Zero());

engine.runRenderLoop(() => scene.render());

console.log('🏰 Fantasy Kingdom RTS started!');
console.log('📱 Tap ground to build, double-tap building to upgrade');
</script>
</body>
</html>
