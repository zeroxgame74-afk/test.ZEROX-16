<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Reward Ai | هوش مصنوعی پیشرو</title>
  <!-- Font Awesome 6 (رایگان) -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css" />
  <!-- فونت وزیر (وزیرمتن) -->
  <link href="https://cdn.jsdelivr.net/gh/rastikerdar/vazirmatn@v33.003/Vazirmatn-font-face.css" rel="stylesheet" />
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: 'Vazirmatn', 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background: radial-gradient(circle at 20% 30%, #0b0d1e, #03050f);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 1.5rem;
      color: #f0f4ff;
    }

    /* کانتینر اصلی با جلوۀ شیشه‌ای */
    .glass-card {
      max-width: 1000px;
      width: 100%;
      background: rgba(12, 16, 35, 0.65);
      backdrop-filter: blur(14px) saturate(180%);
      -webkit-backdrop-filter: blur(14px) saturate(180%);
      border-radius: 3.5rem;
      padding: 2.5rem 2.8rem;
      box-shadow: 0 30px 60px rgba(0, 0, 0, 0.8), 0 0 0 1px rgba(255, 255, 255, 0.03);
      border: 1px solid rgba(255, 255, 255, 0.06);
      transition: all 0.3s ease;
    }

    /* هدر با لوگو و عنوان */
    .header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      flex-wrap: wrap;
      margin-bottom: 2.2rem;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 1rem;
    }

    .brand i {
      font-size: 3.2rem;
      background: linear-gradient(145deg, #b388ff, #7c4dff);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      filter: drop-shadow(0 0 12px #7c4dff88);
    }

    .brand h1 {
      font-size: 2.4rem;
      font-weight: 800;
      letter-spacing: -0.5px;
      background: linear-gradient(to left, #e0e7ff, #a78bfa);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }

    .brand .badge {
      font-size: 0.9rem;
      background: rgba(124, 77, 255, 0.25);
      padding: 0.3rem 1rem;
      border-radius: 40px;
      border: 1px solid rgba(124, 77, 255, 0.3);
      color: #c4b5fd;
      font-weight: 500;
      margin-right: 0.5rem;
      backdrop-filter: blur(4px);
    }

    .status-pulse {
      display: flex;
      align-items: center;
      gap: 0.6rem;
      background: rgba(0, 255, 200, 0.08);
      padding: 0.5rem 1.2rem;
      border-radius: 60px;
      border: 1px solid rgba(0, 255, 200, 0.15);
    }

    .status-pulse i {
      color: #4ade80;
      font-size: 0.9rem;
      animation: pulse 1.8s infinite;
    }

    .status-pulse span {
      font-size: 0.9rem;
      font-weight: 400;
      color: #b0e0d0;
    }

    @keyframes pulse {
      0% { opacity: 0.3; transform: scale(0.9); }
      50% { opacity: 1; transform: scale(1.2); }
      100% { opacity: 0.3; transform: scale(0.9); }
    }

    /* بخش پاسخ هوش مصنوعی */
    .ai-response-box {
      background: rgba(0, 0, 0, 0.3);
      border-radius: 2.5rem;
      padding: 2rem 2.2rem;
      margin: 1.8rem 0 2rem 0;
      border-left: 4px solid #7c4dff;
      box-shadow: inset 0 6px 20px rgba(0, 0, 0, 0.5);
      backdrop-filter: blur(4px);
    }

    .ai-response-box .ai-header {
      display: flex;
      align-items: center;
      gap: 0.8rem;
      margin-bottom: 1.2rem;
    }

    .ai-response-box .ai-header i {
      font-size: 1.8rem;
      color: #a78bfa;
    }

    .ai-response-box .ai-header h3 {
      font-weight: 600;
      font-size: 1.3rem;
      color: #ddd6fe;
    }

    .ai-response-box .response-content {
      font-size: 1.2rem;
      line-height: 2rem;
      color: #e6edff;
      font-weight: 350;
      word-break: break-word;
      min-height: 4.5rem;
    }

    .ai-response-box .response-content i {
      color: #c4b5fd;
      margin: 0 0.2rem;
    }

    .response-time {
      margin-top: 1.2rem;
      font-size: 0.8rem;
      color: #7a84a8;
      display: flex;
      align-items: center;
      gap: 0.5rem;
      border-top: 1px solid rgba(255,255,255,0.04);
      padding-top: 1rem;
    }

    /* بخش مدل‌ها با آیکون‌های awesome */
    .models-section {
      display: flex;
      flex-wrap: wrap;
      gap: 0.8rem 1rem;
      margin: 2rem 0 2.2rem 0;
      padding: 0.5rem 0;
    }

    .model-chip {
      background: rgba(30, 34, 70, 0.5);
      backdrop-filter: blur(4px);
      padding: 0.6rem 1.5rem;
      border-radius: 60px;
      border: 1px solid rgba(255, 255, 255, 0.04);
      display: flex;
      align-items: center;
      gap: 0.7rem;
      font-size: 0.95rem;
      font-weight: 450;
      color: #d0d9ff;
      transition: all 0.25s;
      box-shadow: 0 4px 8px rgba(0,0,0,0.2);
    }

    .model-chip i {
      font-size: 1.2rem;
      color: #a78bfa;
      transition: 0.2s;
    }

    .model-chip:hover {
      background: rgba(124, 77, 255, 0.2);
      border-color: #7c4dff55;
      transform: translateY(-2px);
      box-shadow: 0 8px 20px rgba(124, 77, 255, 0.25);
    }

    .model-chip:hover i {
      color: #c4b5fd;
      transform: scale(1.2);
    }

    /* اینپوت و دکمه */
    .input-area {
      display: flex;
      flex-direction: row;
      align-items: center;
      gap: 0.8rem;
      background: rgba(0, 0, 0, 0.35);
      border-radius: 80px;
      padding: 0.4rem 0.4rem 0.4rem 1.8rem;
      backdrop-filter: blur(10px);
      border: 1px solid rgba(255, 255, 255, 0.03);
      margin-top: 0.8rem;
    }

    .input-area input {
      flex: 1;
      background: transparent;
      border: none;
      padding: 1rem 0.2rem;
      font-family: 'Vazirmatn', sans-serif;
      font-size: 1rem;
      color: #f0f4ff;
      outline: none;
      min-width: 0;
    }

    .input-area input::placeholder {
      color: #828bb0;
      font-weight: 300;
    }

    .input-area button {
      background: linear-gradient(145deg, #6c4ce0, #4f33b0);
      border: none;
      padding: 0.9rem 1.8rem;
      border-radius: 50px;
      color: white;
      font-weight: 600;
      font-size: 1rem;
      display: flex;
      align-items: center;
      gap: 0.8rem;
      cursor: pointer;
      transition: all 0.3s;
      box-shadow: 0 0 20px #4f33b066;
      font-family: 'Vazirmatn', sans-serif;
      border: 1px solid rgba(255, 255, 255, 0.05);
      letter-spacing: 0.3px;
    }

    .input-area button i {
      font-size: 1.2rem;
    }

    .input-area button:hover {
      transform: scale(1.02);
      background: linear-gradient(145deg, #7c5cec, #5a3ec9);
      box-shadow: 0 0 30px #6c4ce0aa;
    }

    .input-area button:active {
      transform: scale(0.97);
    }

    /* فوتر و آیکون‌های اجتماعی */
    .footer-extra {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-top: 2rem;
      flex-wrap: wrap;
      gap: 0.8rem;
      font-size: 0.85rem;
      color: #6a749b;
    }

    .footer-extra .social i {
      font-size: 1.3rem;
      margin-left: 0.8rem;
      color: #7a84ae;
      transition: 0.2s;
      cursor: default;
    }

    .footer-extra .social i:hover {
      color: #b7c0f0;
      transform: scale(1.2);
    }

    .footer-extra .hint i {
      margin-left: 0.3rem;
    }

    /* سازگاری موبایل */
    @media (max-width: 700px) {
      .glass-card {
        padding: 1.8rem;
        border-radius: 2.5rem;
      }
      .brand h1 {
        font-size: 1.8rem;
      }
      .brand i {
        font-size: 2.4rem;
      }
      .input-area {
        flex-wrap: wrap;
        background: transparent;
        padding: 0;
        border: none;
        gap: 0.8rem;
      }
      .input-area input {
        background: rgba(0, 0, 0, 0.3);
        padding: 1rem 1.5rem;
        border-radius: 60px;
        width: 100%;
        border: 1px solid rgba(255,255,255,0.05);
      }
      .input-area button {
        width: 100%;
        justify-content: center;
        padding: 1rem;
      }
      .models-section {
        justify-content: center;
      }
    }

    @media (max-width: 500px) {
      .brand .badge {
        display: none;
      }
      .status-pulse span {
        font-size: 0.7rem;
      }
    }
  </style>
</head>
<body>
  <div class="glass-card">
    <!-- هدر با آیکون awesome و نام Reward Ai -->
    <div class="header">
      <div class="brand">
        <i class="fas fa-robot"></i>
        <h1>Reward Ai</h1>
        <span class="badge"><i class="fas fa-crown" style="margin-left: 6px;"></i>نسخه ۳.۰</span>
      </div>
      <div class="status-pulse">
        <i class="fas fa-circle"></i>
        <span>آنلاین · پاسخ‌گو</span>
        <i class="fas fa-bolt" style="color: #c084fc; margin-right: 6px;"></i>
      </div>
    </div>

    <!-- جعبه پاسخ هوش مصنوعی (UX عالی) -->
    <div class="ai-response-box" id="responseBox">
      <div class="ai-header">
        <i class="fas fa-brain"></i>
        <h3>Reward Ai می‌گوید:</h3>
      </div>
      <div class="response-content" id="responseContent">
        <i class="fas fa-sparkles" style="margin-left: 8px;"></i>
        سلام! من Reward Ai هستم، آماده‌ام به سوالاتت پاسخ بدم.
      </div>
      <div class="response-time">
        <i class="far fa-clock"></i>
        <span id="timeStamp">همین الآن</span>
        <span style="margin-right: auto; opacity:0.6;">
          <i class="fas fa-database"></i> مدل‌های فعال: ۶
        </span>
      </div>
    </div>

    <!-- مدل‌ها با آیکون‌های awesome (تمامی مدل‌ها) -->
    <div class="models-section">
      <span class="model-chip"><i class="fas fa-microchip"></i> Reward-Neo</span>
      <span class="model-chip"><i class="fas fa-cloud"></i> Reward-Cloud</span>
      <span class="model-chip"><i class="fas fa-code"></i> Reward-Codex</span>
      <span class="model-chip"><i class="fas fa-palette"></i> Reward-Art</span>
      <span class="model-chip"><i class="fas fa-dna"></i> Reward-Bio</span>
      <span class="model-chip"><i class="fas fa-globe"></i> Reward-Lingua</span>
      <span class="model-chip"><i class="fas fa-cog"></i> Reward-Core</span>
    </div>

    <!-- ناحیه ورودی + دکمه ارسال (با آیکون awesome) -->
    <div class="input-area">
      <input type="text" id="userInput" placeholder="چیزی بپرس... من Reward Ai هستم" />
      <button id="sendBtn">
        <i class="fas fa-paper-plane"></i> بفرست
      </button>
    </div>

    <!-- فوتر با آیکون‌های awesome و توضیح -->
    <div class="footer-extra">
      <div class="social">
        <i class="fab fa-github"></i>
        <i class="fab fa-twitter"></i>
        <i class="fab fa-linkedin-in"></i>
        <i class="fas fa-cube"></i>
      </div>
      <div class="hint">
        <i class="fas fa-keyboard"></i> پرسش خود را تایپ کن &nbsp;•&nbsp; <i class="fas fa-bolt"></i> پاسخ‌گویی لحظه‌ای
      </div>
    </div>
  </div>

  <script>
    (function() {
      // عناصر
      const responseContent = document.getElementById('responseContent');
      const userInput = document.getElementById('userInput');
      const sendBtn = document.getElementById('sendBtn');
      const timeStamp = document.getElementById('timeStamp');

      // تابع تولید پاسخ‌های هوشمندانه (شبیه‌سازی Reward Ai)
      function generateRewardResponse(question) {
        const q = question.trim().toLowerCase();
        // چند پاسخ خفن و متنوع با آیکون‌های awesome
        const responses = [
          { keywords: ['سلام', 'درود', 'هی'], 
            reply: `<i class="fas fa-hand-peace"></i> درود! من Reward Ai، مشتاق هم‌کلامی با تو هستم.` },
          { keywords: ['چطوری', 'حالت', 'چی کار'], 
            reply: `<i class="fas fa-laugh-beam"></i> عالی! با <i class="fas fa-heart" style="color:#f472b6;"></i> در خدمت شما.` },
          { keywords: ['هوش مصنوعی', 'AI', 'مصنوعی'], 
            reply: `<i class="fas fa-robot"></i> من یک هوش مصنوعی نسل جدید هستم با هسته Reward. همه مدل‌ها در کنار هم!` },
          { keywords: ['نام', 'اسم', 'کیستی'], 
            reply: `<i class="fas fa-id-badge"></i> اسم من Reward Ai است، اما دوستان صدام می‌کنند <i class="fas fa-star"></i> "ری‌وارد".` },
          { keywords: ['قابلیت', 'توانایی', 'چه کار'], 
            reply: `<i class="fas fa-cogs"></i> از کدنویسی تا شعر، تحلیل داده و خلق تصویر! تمام مدل‌های Reward فعالند.` },
          { keywords: ['متشکرم', 'مرسی', 'ممنون'], 
            reply: `<i class="fas fa-smile-wink"></i> خواهش می‌کنم! خوشحالم که می‌تونم کمک کنم.` },
          { keywords: ['خداحافظ', 'بای'], 
            reply: `<i class="fas fa-wave-square"></i> خدانگهدار! هر وقت نیاز بود، من همینجام.` }
        ];

        // بررسی کلمات کلیدی
        for (let item of responses) {
          for (let kw of item.keywords) {
            if (q.includes(kw)) {
              return item.reply;
            }
          }
        }

        // پاسخ‌های تصادفی جذاب (در صورت عدم تطابق)
        const randomReplies = [
          `<i class="fas fa-brain"></i> فکر می‌کنم سوال جالبی پرسیدی! بذار دقیق‌تر بررسی کنم.`,
          `<i class="fas fa-sync-alt fa-spin"></i> درحال پردازش با مدل Reward-Neo ... پاسخ: این سوال نیاز به تحلیل عمیق‌تر داره.`,
          `<i class="fas fa-gem"></i> Reward Ai همیشه آماده‌ست! سوالت رو دقیق‌تر بپرس.`,
          `<i class="fas fa-code"></i> با Reward-Codex می‌تونم کد بنویسم، اما الان حس شاعری دارم!`,
          `<i class="fas fa-meteor"></i> پرسش تو مثل یک شهاب‌سنگ است! من Reward Ai پاسخ را می‌یابم.`,
          `<i class="fas fa-chess-queen"></i> حرکت بعدی: پاسخ به سوال تو با بهترین مدل Reward.`
        ];
        return randomReplies[Math.floor(Math.random() * randomReplies.length)];
      }

      // به‌روزرسانی تایم‌استمپ
      function updateTimestamp() {
        const now = new Date();
        const hour = String(now.getHours()).padStart(2, '0');
        const min = String(now.getMinutes()).padStart(2, '0');
        timeStamp.innerText = `${hour}:${min} · امروز`;
      }

      // تابع پردازش و نمایش پاسخ
      function handleSend() {
        const question = userInput.value.trim();
        if (question === '') {
          // اگر خالی بود، پاسخ پیش‌فرض با آیکون
          responseContent.innerHTML = `<i class="fas fa-exclamation-triangle" style="color:#fbbf24;"></i> لطفاً یک سوال بنویسید!`;
          updateTimestamp();
          return;
        }

        // شبیه‌سازی دریافت پاسخ از Reward Ai
        const reply = generateRewardResponse(question);
        responseContent.innerHTML = reply;
        updateTimestamp();

        // پاک کردن اینپوت بعد از ارسال (تجربه کاربری بهتر)
        userInput.value = '';
        // افکت کوچک
        const box = document.getElementById('responseBox');
        box.style.transition = '0.15s';
        box.style.borderLeftColor = '#a78bfa';
        setTimeout(() => {
          box.style.borderLeftColor = '#7c4dff';
        }, 200);
      }

      // رویدادها
      sendBtn.addEventListener('click', handleSend);

      userInput.addEventListener('keydown', (e) => {
        if (e.key === 'Enter') {
          e.preventDefault();
          handleSend();
        }
      });

      // تایم‌استمپ اولیه
      updateTimestamp();

      // پاسخ خوش‌آمدگویی هنگام لود (با تاخیر)
      setTimeout(() => {
        responseContent.innerHTML = `<i class="fas fa-sparkles" style="margin-left: 8px;"></i> 
        سلام! من Reward Ai هستم، آماده‌ام به سوالاتت پاسخ بدم. 
        <i class="fas fa-comment-dots" style="margin-right: 8px; color:#a78bfa;"></i>`;
      }, 300);
    })();
  </script>
</body>
</html>
