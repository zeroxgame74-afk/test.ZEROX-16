<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>🏰 دهکده فانتزی</title>
    
    <!-- ====== فقط فونت Estedad و Ardekan ====== -->
    <link href="https://fonts.googleapis.com/css2?family=Estedad:wght@300;400;600;700;900&display=swap" rel="stylesheet">
    <style>
        @font-face {
            font-family: 'Ardekan';
            src: url('https://cdn.jsdelivr.net/gh/rastikerdar/ardekan@v1.0.0/Ardekan-Regular.woff2') format('woff2');
            font-weight: normal;
        }
        @font-face {
            font-family: 'Ardekan';
            src: url('https://cdn.jsdelivr.net/gh/rastikerdar/ardekan@v1.0.0/Ardekan-Bold.woff2') format('woff2');
            font-weight: bold;
        }
        
        * { 
            margin: 0; 
            padding: 0; 
            box-sizing: border-box; 
            user-select: none; 
        }
        body {
            background: #0a0a1a;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            font-family: 'Estedad', 'Ardekan', sans-serif;
            overflow: hidden;
            direction: rtl;
        }
        #container {
            position: relative;
            width: 100vw;
            height: 100vh;
            max-width: 500px;
            max-height: 850px;
            border-radius: 24px;
            overflow: hidden;
            box-shadow: 0 0 60px rgba(0,0,0,0.9);
            background: #1a3a1a;
        }
        canvas {
            display: block;
            width: 100%;
            height: 100%;
            cursor: pointer;
        }
        
        /* ====== نوار بالایی ====== */
        #topBar {
            position: absolute;
            top: 12px;
            left: 12px;
            right: 12px;
            display: flex;
            justify-content: space-between;
            color: white;
            font-size: 14px;
            font-weight: 700;
            text-shadow: 0 2px 12px rgba(0,0,0,0.95);
            pointer-events: none;
            font-family: 'Estedad', 'Ardekan', sans-serif;
        }
        #topBar > div {
            background: rgba(0,0,0,0.6);
            padding: 6px 16px;
            border-radius: 30px;
            backdrop-filter: blur(6px);
            border: 1px solid rgba(255,255,255,0.08);
            font-size: 13px;
            display: flex;
            align-items: center;
            gap: 4px;
        }
        #topBar .gold { color: #ffd700; }
        #topBar .elixir { color: #9b59b6; }
        #topBar .star { color: #ff6b6b; }
        
        /* ====== پنل اطلاعات ====== */
        #infoPanel {
            position: absolute;
            top: 65px;
            left: 12px;
            right: 12px;
            background: rgba(0,0,0,0.85);
            border-radius: 16px;
            padding: 12px 16px;
            color: white;
            font-size: 14px;
            backdrop-filter: blur(8px);
            border: 1px solid rgba(255,215,0,0.25);
            display: none;
            font-family: 'Estedad', 'Ardekan', sans-serif;
            text-align: center;
            z-index: 10;
        }
        #infoPanel .title { 
            font-weight: 900; 
            color: #ffd700; 
            font-size: 18px;
            font-family: 'Estedad', 'Ardekan', sans-serif;
        }
        #infoPanel .desc {
            font-size: 13px;
            opacity: 0.8;
            margin: 4px 0;
            font-family: 'Estedad', 'Ardekan', sans-serif;
        }
        #upgradeBtn {
            margin-top: 8px;
            background: linear-gradient(135deg, #ffd700, #f9a825);
            border: none;
            border-radius: 12px;
            padding: 8px 20px;
            font-weight: 700;
            color: #1a1a2e;
            font-family: 'Estedad', 'Ardekan', sans-serif;
            font-size: 15px;
            width: 100%;
            cursor: pointer;
            transition: 0.15s;
        }
        #upgradeBtn:active { transform: scale(0.95); }
        
        /* ====== منوی ساخت ====== */
        #buildMenu {
            position: absolute;
            bottom: 12px;
            left: 12px;
            right: 12px;
            display: flex;
            flex-wrap: wrap;
            gap: 6px;
            justify-content: center;
            padding: 12px 8px 8px;
            background: linear-gradient(transparent, rgba(0,0,0,0.8));
            border-radius: 20px;
            pointer-events: none;
        }
        #buildMenu > * { pointer-events: auto; }
        .btn {
            background: rgba(20,20,50,0.88);
            border: 2px solid #5a5a9a;
            color: #fff;
            padding: 6px 10px;
            border-radius: 12px;
            font-size: 12px;
            font-weight: 700;
            backdrop-filter: blur(4px);
            min-width: 50px;
            text-align: center;
            transition: 0.1s;
            box-shadow: 0 2px 8px rgba(0,0,0,0.4);
            font-family: 'Estedad', 'Ardekan', sans-serif;
            cursor: pointer;
        }
        .btn:active { transform: scale(0.92); background: #4a4a8a; }
        .btn .cost { 
            display: block; 
            font-size: 9px; 
            color: #ffd700;
            font-weight: 400;
        }
        .btn.active {
            border-color: #ffd700;
            background: rgba(255,215,0,0.2);
        }
        #trainBtn {
            background: rgba(155,89,182,0.3);
            border-color: #9b59b6;
        }
        #trainBtn:active { background: #9b59b6; }
    </style>
</head>
<body>

<div id="container">
    <canvas id="gameCanvas"></canvas>

    <!-- نوار بالایی -->
    <div id="topBar">
        <div>💰 <span class="gold" id="goldDisplay">۱۰۰</span></div>
        <div>🧪 <span class="elixir" id="elixirDisplay">۴۰</span></div>
        <div>⭐ <span class="star" id="starsDisplay">۰</span></div>
    </div>

    <!-- پنل اطلاعات ساختمان -->
    <div id="infoPanel">
        <div class="title" id="infoTitle">🏠 کلبه</div>
        <div class="desc" id="infoDesc">سطح ۱</div>
        <button id="upgradeBtn">⬆ ارتقا</button>
    </div>

    <!-- منوی ساخت -->
    <div id="buildMenu">
        <div class="btn" data-type="house">🏠<span class="cost">💰۳۰</span></div>
        <div class="btn" data-type="farm">🌾<span class="cost">💰۴۰</span></div>
        <div class="btn" data-type="tower">🗼<span class="cost">💰۵۰🧪۲۰</span></div>
        <div class="btn" data-type="barracks">⚔️<span class="cost">💰۶۰🧪۳۰</span></div>
        <div class="btn" data-type="wall">🧱<span class="cost">💰۲۰</span></div>
        <div class="btn" id="trainBtn">👤 سرباز<span class="cost">🧪۱۵</span></div>
    </div>
</div>

<script>
// ============================================================
//  بازی کامل ۲D با عکس زمینه
// ============================================================

const canvas = document.getElementById('gameCanvas');
const ctx = canvas.getContext('2d');

let W, H;
function resize() {
    const rect = canvas.parentElement.getBoundingClientRect();
    canvas.width = rect.width * window.devicePixelRatio;
    canvas.height = rect.height * window.devicePixelRatio;
    W = canvas.width;
    H = canvas.height;
}
resize();
window.addEventListener('resize', resize);

// ====== بارگذاری عکس زمینه ======
const bgImage = new Image();
bgImage.crossOrigin = "Anonymous";
bgImage.src = "https://uploadkon.ir/uploads/ba7f30_261787609126995.jpg";
let bgLoaded = false;
bgImage.onload = () => { bgLoaded = true; };
bgImage.onerror = () => { 
    console.warn("عکس لود نشد، از گرادینت استفاده می‌شه");
    bgLoaded = false;
};

// ====== حالت بازی ======
const game = {
    gold: 100,
    elixir: 40,
    stars: 0,
    level: 1,
    buildings: [],
    enemies: [],
    troops: [],
    selectedBuilding: null,
    buildMode: null,
    gridSize: 40,
    mapSize: 300,
    camera: { x: 0, y: 0, zoom: 1 }
};

// ====== سیستم مختصات ایزومتریک ======
function toScreen(worldX, worldY) {
    const cx = W/2 + (worldX - worldY) * game.gridSize * 0.5 * game.camera.zoom;
    const cy = H/2 + (worldX + worldY) * game.gridSize * 0.25 * game.camera.zoom;
    return { x: cx, y: cy };
}

// ====== ساختمان‌ها ======
const BUILDINGS = {
    house: { name: 'کلبه', cost: {gold:30, elixir:0}, color: '#d4a373', hp:50, size:0.8, emoji: '🏠' },
    farm: { name: 'مزرعه', cost: {gold:40, elixir:0}, color: '#6a994e', hp:40, size:0.9, emoji: '🌾' },
    tower: { name: 'برج', cost: {gold:50, elixir:20}, color: '#7b2cbf', hp:80, size:0.7, emoji: '🗼' },
    barracks: { name: 'پادگان', cost: {gold:60, elixir:30}, color: '#d62828', hp:100, size:1.0, emoji: '⚔️' },
    wall: { name: 'دیوار', cost: {gold:20, elixir:0}, color: '#8d99ae', hp:120, size:0.6, emoji: '🧱' }
};

function addBuilding(type, wx, wy) {
    const data = BUILDINGS[type];
    if (game.gold < data.cost.gold || game.elixir < data.cost.elixir) return false;
    
    // برخورد ساده
    for (let b of game.buildings) {
        if (Math.abs(b.x - wx) < 0.8 && Math.abs(b.y - wy) < 0.8) return false;
    }
    
    game.gold -= data.cost.gold;
    game.elixir -= data.cost.elixir;
    
    game.buildings.push({
        type: type,
        x: wx, y: wy,
        level: 1,
        hp: data.hp,
        maxHp: data.hp,
        attackCooldown: 0,
        emoji: data.emoji
    });
    
    updateUI();
    return true;
}

// ====== دشمنان ======
let enemySpawnTimer = 0;

function spawnEnemy() {
    const angle = Math.random() * Math.PI * 2;
    const dist = 8 + Math.random() * 4;
    const wx = Math.cos(angle) * dist;
    const wy = Math.sin(angle) * dist;
    
    game.enemies.push({
        x: wx, y: wy,
        hp: 15 + game.level * 5,
        maxHp: 15 + game.level * 5,
        speed: 0.8 + game.level * 0.1,
        target: null,
        attackCooldown: 0,
        damage: 3 + game.level,
        emoji: '👹'
    });
}

// ====== سربازها ======
function spawnTroop() {
    const barracks = game.buildings.find(b => b.type === 'barracks');
    if (!barracks) return false;
    if (game.elixir < 15) return false;
    
    game.elixir -= 15;
    game.troops.push({
        x: barracks.x + (Math.random() - 0.5) * 1.5,
        y: barracks.y + (Math.random() - 0.5) * 1.5,
        hp: 30,
        speed: 1.5 + Math.random(),
        damage: 6,
        attackCooldown: 0,
        target: null,
        emoji: '⚔️'
    });
    updateUI();
    return true;
}

// ====== بروزرسانی ======
function update() {
    // تولید دشمن
    enemySpawnTimer += 1/60;
    if (enemySpawnTimer > 4 - game.level * 0.2 && game.enemies.length < 3 + game.level) {
        enemySpawnTimer = 0;
        spawnEnemy();
    }
    
    // حرکت دشمنان به سمت نزدیک‌ترین ساختمان
    for (let i = game.enemies.length - 1; i >= 0; i--) {
        const e = game.enemies[i];
        let target = null;
        let minDist = Infinity;
        for (let b of game.buildings) {
            const d = Math.hypot(e.x - b.x, e.y - b.y);
            if (d < minDist) { minDist = d; target = b; }
        }
        if (target) {
            const dx = target.x - e.x;
            const dy = target.y - e.y;
            const len = Math.hypot(dx, dy);
            if (len > 0.1) {
                e.x += (dx / len) * e.speed * 0.02;
                e.y += (dy / len) * e.speed * 0.02;
            }
            if (minDist < 0.8) {
                e.attackCooldown -= 1/60;
                if (e.attackCooldown <= 0) {
                    target.hp -= e.damage;
                    e.attackCooldown = 1;
                    if (target.hp <= 0) {
                        const idx = game.buildings.indexOf(target);
                        if (idx > -1) {
                            game.buildings.splice(idx, 1);
                            game.stars = Math.max(0, game.stars - 1);
                            updateUI();
                        }
                    }
                    updateUI();
                }
            }
        }
    }
    
    // برج‌ها حمله می‌کنن
    for (let b of game.buildings) {
        if (b.type === 'tower') {
            b.attackCooldown -= 1/60;
            for (let e of game.enemies) {
                if (Math.hypot(b.x - e.x, b.y - e.y) < 2.5) {
                    if (b.attackCooldown <= 0) {
                        e.hp -= 8;
                        b.attackCooldown = 1.2;
                        if (e.hp <= 0) {
                            const idx = game.enemies.indexOf(e);
                            if (idx > -1) {
                                game.enemies.splice(idx, 1);
                                game.gold += 8 + game.level * 2;
                                updateUI();
                                if (game.enemies.length === 0 && game.buildings.length > 2) {
                                    game.level++;
                                    document.getElementById('infoTitle').innerText = '🎉 سطح بالا رفت!';
                                    setTimeout(() => document.getElementById('infoTitle').innerText = '🏠 کلبه', 2000);
                                }
                            }
                        }
                        break;
                    }
                }
            }
        }
    }
    
    // سربازها به دشمن حمله می‌کنن
    for (let t of game.troops) {
        let target = null;
        let minDist = Infinity;
        for (let e of game.enemies) {
            const d = Math.hypot(t.x - e.x, t.y - e.y);
            if (d < minDist) { minDist = d; target = e; }
        }
        if (target) {
            const dx = target.x - t.x;
            const dy = target.y - t.y;
            const len = Math.hypot(dx, dy);
            if (len > 0.1) {
                t.x += (dx / len) * t.speed * 0.02;
                t.y += (dy / len) * t.speed * 0.02;
            }
            if (minDist < 0.6) {
                t.attackCooldown -= 1/60;
                if (t.attackCooldown <= 0) {
                    target.hp -= t.damage;
                    t.attackCooldown = 0.8;
                    if (target.hp <= 0) {
                        const idx = game.enemies.indexOf(target);
                        if (idx > -1) {
                            game.enemies.splice(idx, 1);
                            game.gold += 10;
                            updateUI();
                        }
                    }
                }
            }
        }
    }
    
    // تولید منابع
    for (let b of game.buildings) {
        if (b.type === 'farm' && Math.random() < 0.01) {
            game.gold += 1;
            updateUI();
        }
        if (b.type === 'house' && Math.random() < 0.008) {
            game.elixir += 1;
            updateUI();
        }
    }
}

// ====== رندر ======
function draw() {
    ctx.clearRect(0, 0, W, H);
    
    // ====== زمینه ======
    if (bgLoaded) {
        ctx.drawImage(bgImage, 0, 0, W, H);
    } else {
        const grad = ctx.createRadialGradient(W/2, H/2, 0, W/2, H/2, W*0.7);
        grad.addColorStop(0, '#4a7c3f');
        grad.addColorStop(1, '#1a3a1a');
        ctx.fillStyle = grad;
        ctx.fillRect(0, 0, W, H);
    }
    
    // ====== ساختمان‌ها ======
    for (let b of game.buildings) {
        const pos = toScreen(b.x, b.y);
        const size = game.gridSize * 0.5 * game.camera.zoom;
        
        // سایه
        ctx.shadowColor = 'rgba(0,0,0,0.3)';
        ctx.shadowBlur = 15;
        ctx.shadowOffsetY = 5;
        
        // بدنه
        ctx.font = `${size * 1.5}px 'Estedad', 'Ardekan', sans-serif`;
        ctx.textAlign = 'center';
        ctx.textBaseline = 'middle';
        ctx.shadowColor = 'rgba(0,0,0,0.5)';
        ctx.shadowBlur = 20;
        ctx.fillText(b.emoji, pos.x, pos.y - 5);
        
        // نوار HP
        ctx.shadowBlur = 0;
        const hpW = size * 0.8;
        const hpH = 4;
        const hpX = pos.x - hpW/2;
        const hpY = pos.y - size * 0.7;
        ctx.fillStyle = 'rgba(0,0,0,0.6)';
        ctx.roundRect(hpX, hpY, hpW, hpH, 2);
        ctx.fill();
        const hpRatio = b.hp / b.maxHp;
        ctx.fillStyle = hpRatio > 0.5 ? '#4caf50' : hpRatio > 0.25 ? '#ff9800' : '#f44336';
        ctx.roundRect(hpX, hpY, hpW * hpRatio, hpH, 2);
        ctx.fill();
        
        // سطح
        ctx.font = `${size * 0.4}px 'Estedad', 'Ardekan', sans-serif`;
        ctx.fillStyle = '#ffd700';
        ctx.shadowBlur = 8;
        ctx.fillText(`Lv${b.level}`, pos.x, hpY - 6);
    }
    
    // ====== دشمنان ======
    for (let e of game.enemies) {
        const pos = toScreen(e.x, e.y);
        const size = game.gridSize * 0.4 * game.camera.zoom;
        ctx.font = `${size * 1.8}px 'Estedad', 'Ardekan', sans-serif`;
        ctx.textAlign = 'center';
        ctx.textBaseline = 'middle';
        ctx.shadowColor = 'rgba(255,0,0,0.5)';
        ctx.shadowBlur = 25;
        ctx.fillText(e.emoji, pos.x, pos.y);
        
        // نوار HP دشمن
        ctx.shadowBlur = 0;
        const hpW = size * 0.6;
        const hpH = 3;
        const hpX = pos.x - hpW/2;
        const hpY = pos.y - size * 0.6;
        ctx.fillStyle = 'rgba(0,0,0,0.5)';
        ctx.roundRect(hpX, hpY, hpW, hpH, 2);
        ctx.fill();
        ctx.fillStyle = '#f44336';
        ctx.roundRect(hpX, hpY, hpW * (e.hp/e.maxHp), hpH, 2);
        ctx.fill();
    }
    
    // ====== سربازها ======
    for (let t of game.troops) {
        const pos = toScreen(t.x, t.y);
        const size = game.gridSize * 0.35 * game.camera.zoom;
        ctx.font = `${size * 1.8}px 'Estedad', 'Ardekan', sans-serif`;
        ctx.textAlign = 'center';
        ctx.textBaseline = 'middle';
        ctx.shadowColor = 'rgba(0,150,255,0.5)';
        ctx.shadowBlur = 20;
        ctx.fillText(t.emoji, pos.x, pos.y);
    }
    
    // ====== حالت ساخت (هایلایت) ======
    if (game.buildMode) {
        ctx.shadowBlur = 0;
        ctx.fillStyle = 'rgba(255,215,0,0.15)';
        ctx.fillRect(0, 0, W, H);
        ctx.font = '20px Estedad, Ardekan, sans-serif';
        ctx.fillStyle = '#ffd700';
        ctx.textAlign = 'center';
        ctx.shadowColor = 'rgba(0,0,0,0.8)';
        ctx.shadowBlur = 15;
        ctx.fillText(`📍 برای ساخت ${BUILDINGS[game.buildMode].name} روی زمین ضربه بزن`, W/2, 50);
    }
    
    ctx.shadowBlur = 0;
}

// ====== UI ======
function updateUI() {
    document.getElementById('goldDisplay').innerText = Math.floor(game.gold);
    document.getElementById('elixirDisplay').innerText = Math.floor(game.elixir);
    document.getElementById('starsDisplay').innerText = game.stars;
}

// ====== رویدادهای کلیک ======
canvas.addEventListener('click', (e) => {
    const rect = canvas.getBoundingClientRect();
    const mx = (e.clientX - rect.left) / rect.width;
    const my = (e.clientY - rect.top) / rect.height;
    const cx = mx * W;
    const cy = my * H;
    
    // اگر حالت ساخت فعاله
    if (game.buildMode) {
        // تبدیل مختصات صفحه به جهان (تقریبی)
        const wx = (cx - W/2) / (game.gridSize * 0.5 * game.camera.zoom) + (cy - H/2) / (game.gridSize * 0.25 * game.camera.zoom);
        const wy = (cy - H/2) / (game.gridSize * 0.25 * game.camera.zoom) - (cx - W/2) / (game.gridSize * 0.5 * game.camera.zoom);
        const gx = Math.round(wx / 0.8) * 0.8;
        const gy = Math.round(wy / 0.8) * 0.8;
        if (Math.abs(gx) < 6 && Math.abs(gy) < 6) {
            addBuilding(game.buildMode, gx, gy);
        }
        return;
    }
    
    // انتخاب ساختمان برای ارتقا
    for (let b of game.buildings) {
        const pos = toScreen(b.x, b.y);
        const size = game.gridSize * 0.5 * game.camera.zoom;
        if (Math.abs(cx - pos.x) < size && Math.abs(cy - pos.y) < size) {
            game.selectedBuilding = b;
            const panel = document.getElementById('infoPanel');
            panel.style.display = 'block';
            document.getElementById('infoTitle').innerHTML = `${b.emoji} ${BUILDINGS[b.type].name}`;
            document.getElementById('infoDesc').innerText = `سطح ${b.level} | 💚 ${Math.floor(b.hp)}/${b.maxHp}`;
            document.getElementById('upgradeBtn').onclick = () => {
                const cost = {gold: 25 * b.level, elixir: 10 * b.level};
                if (game.gold >= cost.gold && game.elixir >= cost.elixir) {
                    game.gold -= cost.gold;
                    game.elixir -= cost.elixir;
                    b.level++;
                    b.maxHp += 15;
                    b.hp = b.maxHp;
                    updateUI();
                    document.getElementById('infoDesc').innerText = `سطح ${b.level} | 💚 ${Math.floor(b.hp)}/${b.maxHp}`;
                }
            };
            return;
        }
    }
    document.getElementById('infoPanel').style.display = 'none';
});

// ====== دکمه‌ها ======
document.querySelectorAll('.btn[data-type]').forEach(btn => {
    btn.addEventListener('click', () => {
        const type = btn.dataset.type;
        game.buildMode = type;
        document.querySelectorAll('.btn[data-type]').forEach(b => b.classList.remove('active'));
        btn.classList.add('active');
        document.getElementById('infoPanel').style.display = 'none';
    });
});

document.getElementById('trainBtn').addEventListener('click', spawnTroop);

// ====== راند گیم ======
function gameLoop() {
    update();
    draw();
    requestAnimationFrame(gameLoop);
}

// ====== استارت ======
updateUI();
