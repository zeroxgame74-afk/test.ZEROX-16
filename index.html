<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>نئو | فردای دیجیتال</title>
  <!-- فونت عالی -->
  <link href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,400;14..32,600;14..32,800&display=swap" rel="stylesheet">
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: 'Inter', sans-serif;
      background: #0b0d15;
      color: #eef2ff;
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      padding: 2rem;
      background-image: radial-gradient(circle at 20% 30%, #1a1f33 0%, #0b0d15 80%);
    }

    .card {
      max-width: 1200px;
      width: 100%;
      background: rgba(22, 27, 45, 0.6);
      backdrop-filter: blur(14px);
      -webkit-backdrop-filter: blur(14px);
      border: 1px solid rgba(255, 255, 255, 0.06);
      border-radius: 3.5rem;
      padding: 3.5rem 4rem;
      box-shadow: 0 30px 60px -20px rgba(0,0,0,0.8), inset 0 1px 1px rgba(255,255,255,0.03);
      transition: all 0.25s ease;
    }

    .badge {
      display: inline-block;
      background: #2f3b6b;
      color: #b7c9ff;
      font-size: 0.75rem;
      font-weight: 600;
      padding: 0.35rem 1.2rem;
      border-radius: 40px;
      letter-spacing: 0.3px;
      border: 1px solid #4b5a8a;
      box-shadow: 0 0 12px #2f3b6b44;
      margin-bottom: 2rem;
    }

    h1 {
      font-size: 4.5rem;
      font-weight: 800;
      line-height: 1.1;
      letter-spacing: -0.03em;
      background: linear-gradient(to right, #ffffff, #b3cbff);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
      margin-bottom: 1.5rem;
    }

    .desc {
      font-size: 1.25rem;
      color: #a5b5e0;
      max-width: 600px;
      line-height: 1.7;
      margin-bottom: 2.8rem;
      font-weight: 400;
      border-right: 3px solid #4b6bcf;
      padding-right: 1.8rem;
    }

    .btn-group {
      display: flex;
      flex-wrap: wrap;
      gap: 1.2rem;
      margin-bottom: 4rem;
    }

    .btn-primary {
      background: #4b6bcf;
      border: none;
      padding: 0.9rem 2.8rem;
      border-radius: 60px;
      font-weight: 600;
      font-size: 1rem;
      color: #fff;
      cursor: pointer;
      transition: 0.2s;
      box-shadow: 0 6px 20px #3b56b044;
      border: 1px solid #6b8aff;
    }
    .btn-primary:hover {
      background: #5f7ee6;
      transform: scale(1.02);
      box-shadow: 0 10px 28px #3b56b088;
    }

    .btn-outline {
      background: transparent;
      border: 1px solid #3b4a78;
      padding: 0.9rem 2.8rem;
      border-radius: 60px;
      font-weight: 500;
      font-size: 1rem;
      color: #ccd9ff;
      cursor: pointer;
      transition: 0.2s;
      backdrop-filter: blur(4px);
    }
    .btn-outline:hover {
      background: #242d4f;
      border-color: #6b82cf;
      color: #fff;
    }

    .grid-features {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
      gap: 2rem;
      margin-top: 1.8rem;
      border-top: 1px solid #242d4f;
      padding-top: 3rem;
    }

    .feature-item {
      display: flex;
      flex-direction: column;
      gap: 0.5rem;
    }
    .feature-item .icon {
      font-size: 2rem;
      filter: drop-shadow(0 0 8px #4b6bcf66);
    }
    .feature-item h4 {
      font-size: 1.2rem;
      font-weight: 600;
      letter-spacing: -0.2px;
    }
    .feature-item p {
      color: #8b9ed6;
      font-size: 0.95rem;
      line-height: 1.5;
    }

    /* افکت شیشه‌ای و هاله */
    .glow {
      position: relative;
    }
    .glow::after {
      content: '';
      position: absolute;
      width: 300px;
      height: 300px;
      background: radial-gradient(circle, #4b6bcf22 0%, transparent 70%);
      top: -100px;
      right: -100px;
      z-index: -1;
      border-radius: 50%;
      filter: blur(60px);
    }

    @media (max-width: 700px) {
      .card { padding: 2rem 1.5rem; border-radius: 2.5rem; }
      h1 { font-size: 2.8rem; }
      .desc { font-size: 1rem; padding-right: 1rem; }
    }
  </style>
</head>
<body>
  <div class="card glow">
    <!-- برچسب -->
    <div class="badge">🚀 نسخه بتا</div>

    <!-- تایتل جذاب -->
    <h1>نئو<br>افق‌های تازه</h1>

    <!-- توضیحات -->
    <p class="desc">
      پلتفرم هوشمند برای تیم‌های خلاق. 
      طراحی، هم‌افزایی و اجرا در یک فضای یکپارچه.
    </p>

    <!-- دکمه‌ها -->
    <div class="btn-group">
      <button class="btn-primary">شروع رایگان</button>
      <button class="btn-outline">مشاهده دمو</button>
    </div>

    <!-- ویژگی‌های خفن با آیکون -->
    <div class="grid-features">
      <div class="feature-item">
        <span class="icon">⚡</span>
        <h4>سرعت نور</h4>
        <p>پاسخ‌دهی آنی با معماری لبه</p>
      </div>
      <div class="feature-item">
        <span class="icon">🔒</span>
        <h4>امنیت پیشرو</h4>
        <p>رمزنگاری کامل و حریم خصوصی</p>
      </div>
      <div class="feature-item">
        <span class="icon">🧩</span>
        <h4>ماژولار</h4>
        <p>قابل توسعه با هر نیاز</p>
      </div>
      <div class="feature-item">
        <span class="icon">🌐</span>
        <h4>همیشه آنلاین</h4>
        <p>زیرساخت توزیع‌شده</p>
      </div>
    </div>
  </div>
</body>
</html>
