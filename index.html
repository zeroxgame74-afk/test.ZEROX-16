<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Mohamad Hossein | پیدا نشد</title>

    <!-- ===== فونت‌ها ===== -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Arabic:wght@300;400;500;600;700&family=Vazirmatn:wght@400;600;700;800;900&display=swap" rel="stylesheet" />

    <!-- ===== Font Awesome 6 ===== -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css" />

    <style>
        /* ========== RESET ========== */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html,
        body {
            height: 100%;
            width: 100%;
        }

        body {
            background: #0b0b0e;
            color: #eaeef2;
            font-family: 'Noto Sans Arabic', 'Segoe UI', sans-serif;
            font-weight: 400;
            line-height: 1.8;
            overflow: hidden;
            background-image: radial-gradient(circle at 30% 20%, rgba(255, 200, 80, 0.03) 0%, transparent 60%);
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
        }

        /* ===== کانتینر ۴۰۴ ===== */
        .error-container {
            max-width: 800px;
            width: 100%;
            padding: 2rem;
            text-align: center;
            position: relative;
        }

        /* ===== لوگوی کوچک ===== */
        .mini-logo {
            display: inline-block;
            width: 56px;
            height: 56px;
            background: linear-gradient(145deg, #f5b042, #d48f2b);
            border-radius: 18px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-family: 'Vazirmatn', sans-serif;
            font-weight: 900;
            font-size: 2rem;
            color: #0b0b0e;
            box-shadow: 0 8px 18px -6px rgba(200, 150, 50, 0.25);
            margin: 0 auto 1.5rem auto;
            transition: 0.3s;
            animation: floatLogo 4s ease-in-out infinite;
            text-decoration: none;
            width: 60px;
            height: 60px;
            line-height: 60px;
        }

        @keyframes floatLogo {
            0%,
            100% {
                transform: translateY(0px);
            }
            50% {
                transform: translateY(-6px);
            }
        }

        .mini-logo:hover {
            transform: scale(1.08) rotate(-4deg);
            box-shadow: 0 12px 28px -8px rgba(200, 150, 50, 0.4);
        }

        /* ===== دایناسور ===== */
        .dino-area {
            position: relative;
            width: 100%;
            max-width: 400px;
            margin: 0 auto 1.5rem auto;
            aspect-ratio: 1/1;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .dino {
            font-size: 10rem;
            line-height: 1;
            animation: dinoJump 2s ease-in-out infinite;
            filter: drop-shadow(0 12px 40px rgba(245, 176, 66, 0.15));
            transition: 0.3s;
            cursor: default;
            user-select: none;
        }

        .dino:hover {
            transform: scale(1.08);
            filter: drop-shadow(0 16px 56px rgba(245, 176, 66, 0.25));
        }

        @keyframes dinoJump {
            0%,
            100% {
                transform: translateY(0px) rotate(-2deg);
            }
            50% {
                transform: translateY(-18px) rotate(2deg);
            }
        }

        /* ===== دایناسور با حرکت ===== */
        .dino.running {
            animation: dinoRun 0.4s steps(2) infinite;
        }

        @keyframes dinoRun {
            0% {
                transform: translateX(0px) scaleX(1);
            }
            25% {
                transform: translateX(8px) scaleX(1.02) rotate(-1deg);
            }
            50% {
                transform: translateX(0px) scaleX(1);
            }
            75% {
                transform: translateX(-8px) scaleX(0.98) rotate(1deg);
            }
            100% {
                transform: translateX(0px) scaleX(1);
            }
        }

        .dino.jumping {
            animation: dinoJumpBig 0.6s ease-in-out;
        }

        @keyframes dinoJumpBig {
            0% {
                transform: translateY(0px) scale(1);
            }
            40% {
                transform: translateY(-60px) scale(1.08);
            }
            60% {
                transform: translateY(-60px) scale(1.08);
            }
            100% {
                transform: translateY(0px) scale(1);
            }
        }

        /* ===== کاکتوس‌ها (تزئینی) ===== */
        .cactus {
            position: absolute;
            font-size: 2.5rem;
            opacity: 0.3;
            animation: cactusFloat 4s ease-in-out infinite;
            user-select: none;
            pointer-events: none;
        }

        .cactus:nth-child(2) {
            bottom: 10%;
            right: 5%;
            animation-delay: 0.5s;
            font-size: 3rem;
            opacity: 0.2;
        }

        .cactus:nth-child(3) {
            top: 10%;
            left: 5%;
            animation-delay: 1s;
            font-size: 2rem;
            opacity: 0.25;
        }

        .cactus:nth-child(4) {
            bottom: 20%;
            left: 15%;
            animation-delay: 1.5s;
            font-size: 2.8rem;
            opacity: 0.15;
        }

        @keyframes cactusFloat {
            0%,
            100% {
                transform: translateY(0px) rotate(-3deg);
            }
            50% {
                transform: translateY(-8px) rotate(3deg);
            }
        }

        /* ===== متن‌ها ===== */
        .error-code {
            font-family: 'Vazirmatn', sans-serif;
            font-weight: 900;
            font-size: 8rem;
            background: linear-gradient(135deg, #f5b042, #d48f2b);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            line-height: 1;
            margin-bottom: 0.5rem;
            text-shadow: 0 8px 32px rgba(245, 176, 66, 0.15);
            animation: pulse404 3s ease-in-out infinite;
        }

        @keyframes pulse404 {
            0%,
            100% {
                transform: scale(1);
                opacity: 1;
            }
            50% {
                transform: scale(1.02);
                opacity: 0.9;
            }
        }

        .error-title {
            font-family: 'Vazirmatn', sans-serif;
            font-weight: 800;
            font-size: 2.2rem;
            color: #f5efe6;
            margin-bottom: 0.8rem;
        }

        .error-title i {
            color: #f5b042;
            margin-left: 0.5rem;
        }

        .error-title .highlight {
            color: #f5b042;
        }

        .error-desc {
            font-family: 'Noto Sans Arabic', sans-serif;
            font-size: 1.1rem;
            color: #b0a99b;
            margin-bottom: 2rem;
            max-width: 500px;
            margin-left: auto;
            margin-right: auto;
        }

        /* ===== دکمه‌ها ===== */
        .error-buttons {
            display: flex;
            flex-wrap: wrap;
            gap: 1rem;
            justify-content: center;
            margin-top: 0.5rem;
        }

        .error-buttons a {
            font-family: 'Vazirmatn', sans-serif;
            font-weight: 600;
            text-decoration: none;
            padding: 0.8rem 2rem;
            border-radius: 40px;
            transition: 0.3s cubic-bezier(0.34, 1.56, 0.64, 1);
            display: inline-flex;
            align-items: center;
            gap: 0.7rem;
            font-size: 1.05rem;
            position: relative;
            overflow: hidden;
        }

        .btn-primary {
            background: linear-gradient(135deg, #f5b042, #d48f2b);
            color: #0b0b0e;
            border: none;
        }

        .btn-primary:hover {
            transform: scale(1.05) translateY(-3px);
            box-shadow: 0 12px 32px -8px rgba(245, 176, 66, 0.3);
        }

        .btn-primary::before {
            content: '';
            position: absolute;
            top: -50%;
            left: -50%;
            width: 200%;
            height: 200%;
            background: linear-gradient(45deg, transparent 30%, rgba(255, 255, 255, 0.1) 50%, transparent 70%);
            animation: shineBtn 3s ease-in-out infinite;
            pointer-events: none;
        }

        @keyframes shineBtn {
            0% {
                transform: translateX(-100%) rotate(25deg);
            }
            100% {
                transform: translateX(100%) rotate(25deg);
            }
        }

        .btn-secondary {
            background: rgba(255, 255, 255, 0.05);
            color: #f5efe6;
            border: 1px solid rgba(255, 215, 100, 0.15);
        }

        .btn-secondary:hover {
            background: rgba(255, 215, 100, 0.08);
            border-color: rgba(255, 215, 100, 0.25);
            transform: scale(1.05) translateY(-3px);
            box-shadow: 0 8px 24px -8px rgba(0, 0, 0, 0.3);
        }

        .btn-secondary i {
            color: #f5b042;
        }

        /* ===== بخش شوخی ===== */
        .fun-section {
            margin-top: 2rem;
            padding: 1rem 1.5rem;
            background: rgba(255, 215, 100, 0.03);
            border-radius: 20px;
            border: 1px solid rgba(255, 215, 100, 0.06);
            display: inline-block;
        }

        .fun-section p {
            font-family: 'Noto Sans Arabic', sans-serif;
            font-size: 0.9rem;
            color: #8f887c;
            margin: 0;
        }

        .fun-section p i {
            color: #f5b042;
            animation: floatIcon 2s ease-in-out infinite;
        }

        @keyframes floatIcon {
            0%,
            100% {
                transform: translateY(0px);
            }
            50% {
                transform: translateY(-4px);
            }
        }

        /* ===== راهنمای کیبورد ===== */
        .keyboard-hint {
            position: fixed;
            bottom: 2rem;
            left: 50%;
            transform: translateX(-50%);
            font-family: 'Noto Sans Arabic', sans-serif;
            font-size: 0.8rem;
            color: #5a5550;
            background: rgba(255, 255, 255, 0.02);
            padding: 0.5rem 1.5rem;
            border-radius: 40px;
            border: 1px solid rgba(255, 215, 100, 0.04);
            backdrop-filter: blur(8px);
            user-select: none;
            pointer-events: none;
            white-space: nowrap;
        }

        .keyboard-hint i {
            color: #f5b042;
            margin: 0 0.3rem;
        }

        /* ===== ریسپانسیو ===== */
        @media (max-width: 768px) {
            .error-code {
                font-size: 5rem;
            }
            .error-title {
                font-size: 1.6rem;
            }
            .dino {
                font-size: 7rem;
            }
            .error-container {
                padding: 1.5rem;
            }
            .error-buttons {
                flex-direction: column;
                align-items: center;
            }
            .error-buttons a {
                width: 100%;
                justify-content: center;
            }
            .keyboard-hint {
                font-size: 0.7rem;
                padding: 0.3rem 1rem;
                bottom: 1rem;
                white-space: normal;
            }
            .cactus {
                display: none;
            }
        }

        @media (max-width: 480px) {
            .error-code {
                font-size: 4rem;
            }
            .error-title {
                font-size: 1.3rem;
            }
            .dino {
                font-size: 5rem;
            }
            .error-desc {
                font-size: 0.95rem;
            }
            .mini-logo {
                width: 48px;
                height: 48px;
                font-size: 1.6rem;
                line-height: 48px;
            }
        }
    </style>
</head>
<body>

    <div class="error-container">

        <!-- ===== لوگو ===== -->
        <a href="/" class="mini-logo">M</a>

        <!-- ===== دایناسور با کاکتوس‌ها ===== -->
        <div class="dino-area">
            <div class="cactus">🌵</div>
            <div class="cactus">🌵</div>
            <div class="cactus">🌵</div>
            <div class="cactus">🌵</div>
            <div class="dino" id="dino">🦖</div>
        </div>

        <!-- ===== متن‌ها ===== -->
        <div class="error-code">۴۰۴</div>
        <h1 class="error-title">
            <i class="fas fa-compass"></i> 
            <span class="highlight">Mohamad Hossein</span> | پیدا نشد!
        </h1>
        <p class="error-desc">
            ای وای! به نظر می‌رسه دایناسور کوچولو این صفحه رو خورده! 🦖<br>
            صفحه‌ای که دنبالش هستی وجود نداره یا منتقل شده.
        </p>

        <!-- ===== دکمه‌ها ===== -->
        <div class="error-buttons">
            <a href="javascript:history.back()" class="btn-secondary">
                <i class="fas fa-arrow-right"></i> بازگشت به صفحه قبل
            </a>
            <a href="/" class="btn-primary">
                <i class="fas fa-home"></i> برو به خانه
            </a>
            <a href="javascript:location.reload()" class="btn-secondary">
                <i class="fas fa-sync"></i> دوباره امتحان کن
            </a>
        </div>

        <!-- ===== بخش شوخی ===== -->
        <div class="fun-section">
            <p>
                <i class="fas fa-gamepad"></i>
                فشار دهید <kbd style="background:rgba(255,215,100,0.1); padding:0.1rem 0.6rem; border-radius:6px; color:#f5b042; font-size:0.85rem;">Space</kbd> یا <kbd style="background:rgba(255,215,100,0.1); padding:0.1rem 0.6rem; border-radius:6px; color:#f5b042; font-size:0.85rem;">↑</kbd> تا دایناسور بپره!
                <span style="color:#5a5550; font-size:0.8rem;">(باحاله، نه؟)</span>
            </p>
        </div>

    </div>

    <!-- ===== راهنمای کیبورد ===== -->
    <div class="keyboard-hint">
        <i class="fas fa-keyboard"></i>
        برای حرکت دایناسور کلیدهای <kbd style="background:rgba(255,215,100,0.08); padding:0.1rem 0.5rem; border-radius:4px; color:#b0a99b; font-size:0.7rem;">←</kbd> <kbd style="background:rgba(255,215,100,0.08); padding:0.1rem 0.5rem; border-radius:4px; color:#b0a99b; font-size:0.7rem;">→</kbd> رو بزن
    </div>

    <script>
        // ===== دایناسور متحرک =====
        (function() {
            const dino = document.getElementById('dino');
            let isJumping = false;
            let isRunning = false;
            let runInterval = null;

            // ===== پرش =====
            function jump() {
                if (isJumping) return;
                isJumping = true;
                dino.classList.remove('running');
                dino.classList.add('jumping');

                if (runInterval) {
                    clearInterval(runInterval);
                    runInterval = null;
                    isRunning = false;
                }

                setTimeout(() => {
                    dino.classList.remove('jumping');
                    isJumping = false;
                    if (isRunning) {
                        dino.classList.add('running');
                    }
                }, 600);
            }

            // ===== حرکت چپ/راست =====
            function startRunning() {
                if (isRunning) return;
                isRunning = true;
                if (!isJumping) {
                    dino.classList.add('running');
                }
            }

            function stopRunning() {
                isRunning = false;
                dino.classList.remove('running');
            }

            // ===== کنترل با کیبورد =====
            document.addEventListener('keydown', function(e) {
                if (e.key === ' ' || e.key === 'Space' || e.key === 'ArrowUp') {
                    e.preventDefault();
                    jump();
                }

                if (e.key === 'ArrowLeft') {
                    e.preventDefault();
                    startRunning();
                    dino.style.transform = 'scaleX(-1)';
                }

                if (e.key === 'ArrowRight') {
                    e.preventDefault();
                    startRunning();
                    dino.style.transform = 'scaleX(1)';
                }
            });

            document.addEventListener('keyup', function(e) {
                if (e.key === 'ArrowLeft' || e.key === 'ArrowRight') {
                    stopRunning();
                    dino.style.transform = 'scaleX(1)';
                }
            });

            // ===== کلیک روی دایناسور =====
            dino.addEventListener('click', function() {
                jump();
            });

            // ===== حرکت خودکار =====
            setTimeout(() => {
                if (!isJumping) {
                    isRunning = true;
                    dino.classList.add('running');
                }
            }, 2000);

            // ===== حرکت تصادفی =====
            setInterval(() => {
                if (!isJumping && !isRunning) {
                    isRunning = true;
                    dino.classList.add('running');
                    setTimeout(() => {
                        if (!isJumping) {
                            isRunning = false;
                            dino.classList.remove('running');
                        }
                    }, 1500);
                }
            }, 5000);
        })();
    </script>

</body>
</html>
