<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>صفحه گیمینگ خفن</title>

    <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/rastikerdar/vazirmatn@v33.003/Vazirmatn-font-face.css" />
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css" />

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Vazirmatn', sans-serif;
            background: #0a0a0f;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
            overflow-x: hidden;
        }

        /* ===== پس‌زمینه گیمینگ با ذرات ===== */
        .bg-gaming {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 0;
            overflow: hidden;
            pointer-events: none;
            background: radial-gradient(ellipse at 20% 50%, #0d0d2b, #0a0a0f);
        }

        .bg-gaming .particle {
            position: absolute;
            width: 4px;
            height: 4px;
            background: #00ff88;
            border-radius: 50%;
            box-shadow: 0 0 20px #00ff88, 0 0 60px #00ff88;
            animation: particleFly 8s infinite linear;
        }

        .bg-gaming .particle:nth-child(1) {
            left: 10%;
            animation-duration: 10s;
            animation-delay: 0s;
            width: 6px;
            height: 6px;
        }
        .bg-gaming .particle:nth-child(2) {
            left: 25%;
            animation-duration: 12s;
            animation-delay: 2s;
            background: #ff00ff;
            box-shadow: 0 0 20px #ff00ff;
        }
        .bg-gaming .particle:nth-child(3) {
            left: 45%;
            animation-duration: 9s;
            animation-delay: 4s;
            background: #ffaa00;
            box-shadow: 0 0 20px #ffaa00;
        }
        .bg-gaming .particle:nth-child(4) {
            left: 65%;
            animation-duration: 14s;
            animation-delay: 1s;
            width: 8px;
            height: 8px;
        }
        .bg-gaming .particle:nth-child(5) {
            left: 85%;
            animation-duration: 11s;
            animation-delay: 3s;
            background: #00ccff;
            box-shadow: 0 0 20px #00ccff;
        }
        .bg-gaming .particle:nth-child(6) {
            left: 50%;
            animation-duration: 13s;
            animation-delay: 5s;
            background: #ff0066;
            box-shadow: 0 0 20px #ff0066;
        }

        @keyframes particleFly {
            0% {
                transform: translateY(100vh) scale(0) rotate(0deg);
                opacity: 0;
            }
            10% {
                opacity: 1;
            }
            90% {
                opacity: 1;
            }
            100% {
                transform: translateY(-10vh) scale(2) rotate(720deg);
                opacity: 0;
            }
        }

        /* ===== کارت گیمینگ ===== */
        .hero {
            position: relative;
            z-index: 1;
            background: rgba(10, 10, 20, 0.85);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 2px solid rgba(0, 255, 136, 0.15);
            border-radius: 40px;
            padding: 60px 50px;
            max-width: 750px;
            width: 100%;
            text-align: center;
            box-shadow: 0 30px 80px rgba(0, 0, 0, 0.8), inset 0 0 80px rgba(0, 255, 136, 0.03);
            animation: fadeInUp 0.8s ease forwards;
            opacity: 0;
        }

        @keyframes fadeInUp {
            0% {
                opacity: 0;
                transform: translateY(60px) scale(0.95);
            }
            100% {
                opacity: 1;
                transform: translateY(0) scale(1);
            }
        }

        /* ===== آواتار گیمینگ ===== */
        .avatar {
            width: 110px;
            height: 110px;
            background: linear-gradient(145deg, #00ff88, #00cc66);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0 auto 20px;
            font-size: 52px;
            color: #0a0a0f;
            box-shadow: 0 0 50px rgba(0, 255, 136, 0.3), 0 0 100px rgba(0, 255, 136, 0.1);
            animation: floatAvatar 3s ease-in-out infinite, pulseGlow 2s ease-in-out infinite;
            transition: 0.3s;
            border: 2px solid rgba(0, 255, 136, 0.3);
        }

        .avatar:hover {
            animation-play-state: paused;
            transform: scale(1.1) rotate(10deg);
            box-shadow: 0 0 80px rgba(0, 255, 136, 0.6);
        }

        @keyframes floatAvatar {
            0%,
            100% {
                transform: translateY(0);
            }
            50% {
                transform: translateY(-12px);
            }
        }

        @keyframes pulseGlow {
            0%,
            100% {
                box-shadow: 0 0 50px rgba(0, 255, 136, 0.3);
            }
            50% {
                box-shadow: 0 0 80px rgba(0, 255, 136, 0.6), 0 0 120px rgba(0, 255, 136, 0.2);
            }
        }

        /* ===== برچسب ===== */
        .badge {
            display: inline-block;
            background: rgba(0, 255, 136, 0.08);
            padding: 6px 22px;
            border-radius: 50px;
            font-size: 13px;
            color: #00ff88;
            border: 1px solid rgba(0, 255, 136, 0.15);
            margin-bottom: 16px;
            animation: blinkBadge 2s ease-in-out infinite;
            letter-spacing: 1px;
        }

        @keyframes blinkBadge {
            0%,
            100% {
                opacity: 1;
            }
            50% {
                opacity: 0.3;
            }
        }

        .badge i {
            color: #ffaa00;
            margin-left: 6px;
            animation: spinIcon 4s linear infinite;
        }

        @keyframes spinIcon {
            0% {
                transform: rotate(0deg);
            }
            100% {
                transform: rotate(360deg);
            }
        }

        /* ===== عنوان ===== */
        h1 {
            font-size: 44px;
            font-weight: 900;
            color: #fff;
            margin-bottom: 12px;
            line-height: 1.2;
            animation: slideTitle 1s ease 0.3s both;
        }

        @keyframes slideTitle {
            0% {
                opacity: 0;
                transform: translateX(-30px);
            }
            100% {
                opacity: 1;
                transform: translateX(0);
            }
        }

        h1 span {
            background: linear-gradient(90deg, #00ff88, #00ccff, #ff00ff, #00ff88);
            background-size: 300% 100%;
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            animation: gradientMove 4s ease-in-out infinite;
        }

        @keyframes gradientMove {
            0% {
                background-position: 0% 50%;
            }
            50% {
                background-position: 100% 50%;
            }
            100% {
                background-position: 0% 50%;
            }
        }

        /* ===== زیرنویس ===== */
        .subtitle {
            font-size: 18px;
            color: rgba(255, 255, 255, 0.5);
            line-height: 1.9;
            margin-bottom: 30px;
            animation: fadeInUp 1s ease 0.5s both;
        }

        .subtitle i {
            animation: pulseIcon 1.5s ease-in-out infinite;
            color: #ff0066;
        }

        @keyframes pulseIcon {
            0%,
            100% {
                transform: scale(1);
            }
            50% {
                transform: scale(1.3);
                color: #ff00ff;
            }
        }

        /* ===== دکمه‌ها ===== */
        .btn-group {
            display: flex;
            flex-wrap: wrap;
            gap: 14px;
            justify-content: center;
            margin-bottom: 35px;
            animation: fadeInUp 1s ease 0.7s both;
        }

        .btn {
            padding: 14px 34px;
            border-radius: 60px;
            text-decoration: none;
            font-weight: 700;
            font-size: 16px;
            display: inline-flex;
            align-items: center;
            gap: 10px;
            border: none;
            cursor: pointer;
            transition: 0.3s ease;
            position: relative;
            overflow: hidden;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .btn-primary {
            background: linear-gradient(135deg, #00ff88, #00cc66);
            color: #0a0a0f;
            box-shadow: 0 0 30px rgba(0, 255, 136, 0.2);
            animation: btnPulse 2s ease-in-out infinite;
        }

        @keyframes btnPulse {
            0%,
            100% {
                box-shadow: 0 0 30px rgba(0, 255, 136, 0.2);
            }
            50% {
                box-shadow: 0 0 60px rgba(0, 255, 136, 0.5);
            }
        }

        .btn-primary:hover {
            transform: scale(1.08) translateY(-3px);
            box-shadow: 0 0 80px rgba(0, 255, 136, 0.6);
            animation-play-state: paused;
        }

        .btn-secondary {
            background: rgba(255, 255, 255, 0.04);
            color: #fff;
            border: 1px solid rgba(255, 255, 255, 0.08);
            backdrop-filter: blur(10px);
        }

        .btn-secondary:hover {
            background: rgba(255, 255, 255, 0.08);
            transform: scale(1.06) translateY(-3px);
            border-color: rgba(0, 255, 136, 0.2);
        }

        /* ===== ویژگی‌های گیمینگ ===== */
        .features {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(140px, 1fr));
            gap: 14px;
            margin: 25px 0 30px;
            animation: fadeInUp 1s ease 0.9s both;
        }

        .feature-item {
            background: rgba(255, 255, 255, 0.02);
            padding: 14px 10px;
            border-radius: 16px;
            color: rgba(255, 255, 255, 0.6);
            font-size: 14px;
            font-weight: 600;
            border: 1px solid rgba(255, 255, 255, 0.03);
            transition: 0.4s ease;
            animation: featureSlide 0.8s ease both;
            animation-delay: calc(0.2s * var(--i, 0));
        }

        .feature-item:nth-child(1) {
            --i: 1;
        }
        .feature-item:nth-child(2) {
            --i: 2;
        }
        .feature-item:nth-child(3) {
            --i: 3;
        }
        .feature-item:nth-child(4) {
            --i: 4;
        }

        @keyframes featureSlide {
            0% {
                opacity: 0;
                transform: translateY(30px) scale(0.9);
            }
            100% {
                opacity: 1;
                transform: translateY(0) scale(1);
            }
        }

        .feature-item:hover {
            background: rgba(0, 255, 136, 0.05);
            transform: translateY(-6px) scale(1.03);
            border-color: rgba(0, 255, 136, 0.15);
            box-shadow: 0 10px 30px rgba(0, 255, 136, 0.05);
            color: #fff;
        }

        .feature-item i {
            color: #00ff88;
            margin-left: 6px;
            animation: pulseIcon 2s ease-in-out infinite;
        }

        /* ===== شبکه اجتماعی ===== */
        .social-row {
            display: flex;
            justify-content: center;
            gap: 18px;
            flex-wrap: wrap;
            padding-top: 20px;
            border-top: 1px solid rgba(255, 255, 255, 0.03);
            animation: fadeInUp 1s ease 1.1s both;
        }

        .social-row a {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            width: 50px;
            height: 50px;
            border-radius: 50%;
            background: rgba(255, 255, 255, 0.02);
            color: rgba(255, 255, 255, 0.3);
            font-size: 22px;
            border: 1px solid rgba(255, 255, 255, 0.03);
            text-decoration: none;
            transition: 0.4s ease;
            animation: socialPop 0.6s ease both;
            animation-delay: calc(0.1s * var(--s, 0));
        }

        .social-row a:nth-child(1) {
            --s: 1;
        }
        .social-row a:nth-child(2) {
            --s: 2;
        }
        .social-row a:nth-child(3) {
            --s: 3;
        }
        .social-row a:nth-child(4) {
            --s: 4;
        }
        .social-row a:nth-child(5) {
            --s: 5;
        }

        @keyframes socialPop {
            0% {
                opacity: 0;
                transform: scale(0) rotate(-180deg);
            }
            100% {
                opacity: 1;
                transform: scale(1) rotate(0deg);
            }
        }

        .social-row a:hover {
            background: rgba(0, 255, 136, 0.08);
            color: #00ff88;
            transform: translateY(-6px) scale(1.12);
            border-color: rgba(0, 255, 136, 0.2);
            box-shadow: 0 0 30px rgba(0, 255, 136, 0.1);
        }

        /* ===== ریسپانسیو ===== */
        @media (max-width: 600px) {
            .hero {
                padding: 35px 20px;
                border-radius: 28px;
            }
            h1 {
                font-size: 28px;
            }
            .btn {
                padding: 12px 24px;
                font-size: 14px;
            }
            .features {
                grid-template-columns: 1fr 1fr;
            }
            .avatar {
                width: 80px;
                height: 80px;
                font-size: 38px;
            }
        }
    </style>
</head>
<body>

    <!-- ===== پس‌زمینه گیمینگ ===== -->
    <div class="bg-gaming">
        <div class="particle"></div>
        <div class="particle"></div>
        <div class="particle"></div>
        <div class="particle"></div>
        <div class="particle"></div>
        <div class="particle"></div>
    </div>

    <!-- ===== کارت گیمینگ ===== -->
    <div class="hero">

        <div class="avatar">
            <i class="fa-solid fa-gamepad"></i>
        </div>

        <div class="badge">
            <i class="fa-solid fa-star"></i> سطح افسانه‌ای
        </div>

        <h1>
            <span>GAMER</span> پرو
        </h1>

        <p class="subtitle">
            <i class="fa-solid fa-joystick"></i>
            بازیکن حرفه‌ای | استریمر | عاشق بازی‌های رقابتی
        </p>

        <div class="btn-group">
            <a href="#" class="btn btn-primary">
                <i class="fa-solid fa-play"></i> شروع ماجراجویی
            </a>
            <a href="#" class="btn btn-secondary">
                <i class="fa-regular fa-eye"></i> تماشای جریان
            </a>
        </div>

        <div class="features">
            <div class="feature-item">
                <i class="fa-solid fa-trophy"></i> قهرمان
            </div>
            <div class="feature-item">
                <i class="fa-solid fa-bolt"></i> واکنش سریع
            </div>
            <div class="feature-item">
                <i class="fa-solid fa-headset"></i> تیم‌بازی
            </div>
            <div class="feature-item">
                <i class="fa-solid fa-fire"></i> بی‌رحم
            </div>
        </div>

        <div class="social-row">
            <a href="#"><i class="fa-brands fa-twitch"></i></a>
            <a href="#"><i class="fa-brands fa-youtube"></i></a>
            <a href="#"><i class="fa-brands fa-discord"></i></a>
            <a href="#"><i class="fa-brands fa-steam"></i></a>
            <a href="#"><i class="fa-brands fa-x-twitter"></i></a>
        </div>

    </div>

</body>
</html>
