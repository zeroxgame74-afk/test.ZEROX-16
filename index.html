<!DOCTYPE html>
<html lang="fa" dir="ltr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Zerox Game Studios - Gameplay Gallery</title>
    <style>
        /* ===== RESET & BASE ===== */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background: #000000;
            font-family: 'Segoe UI', 'Helvetica Neue', Arial, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 40px 20px;
        }

        /* ===== GALLERY WRAPPER ===== */
        .gallery-section {
            max-width: 1440px;
            width: 100%;
            background: #0A0A0A;
            padding: 70px 60px 80px;
            border-radius: 32px;
            position: relative;
        }

        /* ===== HEADER ===== */
        .gallery-header {
            display: flex;
            justify-content: space-between;
            align-items: flex-end;
            margin-bottom: 50px;
            border-bottom: 1px solid #2A2A2A;
            padding-bottom: 30px;
            flex-wrap: wrap;
            gap: 20px;
        }

        .gallery-header-left h2 {
            font-size: 72px;
            font-weight: 700;
            letter-spacing: -2px;
            color: #FFFFFF;
            line-height: 1;
            text-transform: uppercase;
        }

        .gallery-header-left p {
            font-size: 18px;
            color: #A0A0A0;
            margin-top: 12px;
            font-weight: 300;
            letter-spacing: 1px;
        }

        .gallery-header-right {
            font-size: 11px;
            letter-spacing: 4px;
            color: #A0A0A0;
            text-transform: uppercase;
            font-weight: 400;
            border: 1px solid #2A2A2A;
            padding: 10px 20px;
            border-radius: 40px;
            background: #0A0A0A;
            white-space: nowrap;
        }

        /* ===== MASONRY GRID ===== */
        .masonry-grid {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 20px;
            grid-auto-flow: dense;
        }

        /* ===== ITEM BASE ===== */
        .grid-item {
            position: relative;
            border-radius: 16px;
            overflow: hidden;
            border: 1px solid #2A2A2A;
            background: #0A0A0A;
            box-shadow: 0 20px 50px rgba(0, 0, 0, 0.8);
            transition: all 0.4s cubic-bezier(0.25, 0.46, 0.45, 0.94);
            cursor: pointer;
        }

        .grid-item img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            display: block;
            transition: transform 0.6s cubic-bezier(0.25, 0.46, 0.45, 0.94);
            filter: grayscale(100%) contrast(1.1);
        }

        /* ===== SIZES ===== */
        .grid-item--large {
            grid-column: span 2;
            grid-row: span 2;
            aspect-ratio: 16 / 10;
        }

        .grid-item--tall {
            grid-row: span 2;
            aspect-ratio: 9 / 16;
        }

        .grid-item--wide {
            grid-column: span 2;
            aspect-ratio: 16 / 9;
        }

        .grid-item--square {
            aspect-ratio: 1 / 1;
        }

        .grid-item--standard {
            aspect-ratio: 4 / 3;
        }

        /* ===== OVERLAY & LABEL ===== */
        .grid-item .overlay {
            position: absolute;
            inset: 0;
            background: rgba(0, 0, 0, 0.5);
            opacity: 0;
            transition: opacity 0.4s ease;
            display: flex;
            align-items: center;
            justify-content: center;
            backdrop-filter: blur(2px);
        }

        .grid-item .overlay span {
            color: #FFFFFF;
            font-size: 13px;
            letter-spacing: 3px;
            text-transform: uppercase;
            font-weight: 300;
            border: 1px solid #FFFFFF;
            padding: 10px 24px;
            border-radius: 40px;
            background: rgba(0, 0, 0, 0.6);
            transform: scale(0.9);
            transition: transform 0.4s ease;
        }

        /* ===== HOVER EFFECTS ===== */
        .grid-item:hover {
            border-color: #FFFFFF;
            box-shadow: 0 30px 80px rgba(0, 0, 0, 0.95);
            z-index: 10;
        }

        .grid-item:hover img {
            transform: scale(1.05);
        }

        .grid-item:hover .overlay {
            opacity: 1;
        }

        .grid-item:hover .overlay span {
            transform: scale(1);
        }

        /* ===== RESPONSIVE ===== */
        @media (max-width: 1200px) {
            .gallery-section {
                padding: 50px 30px 60px;
            }
            .gallery-header-left h2 {
                font-size: 56px;
            }
            .masonry-grid {
                gap: 16px;
            }
        }

        @media (max-width: 992px) {
            .masonry-grid {
                grid-template-columns: repeat(2, 1fr);
            }
            .grid-item--large {
                grid-column: span 2;
                grid-row: span 1;
                aspect-ratio: 16 / 9;
            }
            .grid-item--tall {
                grid-row: span 1;
                aspect-ratio: 4 / 3;
            }
            .grid-item--wide {
                grid-column: span 2;
            }
        }

        @media (max-width: 600px) {
            .gallery-section {
                padding: 30px 16px 40px;
                border-radius: 16px;
            }
            .gallery-header {
                flex-direction: column;
                align-items: flex-start;
            }
            .gallery-header-left h2 {
                font-size: 40px;
            }
            .gallery-header-left p {
                font-size: 15px;
            }
            .gallery-header-right {
                font-size: 9px;
                padding: 6px 14px;
            }
            .masonry-grid {
                grid-template-columns: 1fr;
                gap: 14px;
            }
            .grid-item--large,
            .grid-item--wide,
            .grid-item--tall,
            .grid-item--square,
            .grid-item--standard {
                grid-column: span 1;
                aspect-ratio: 16 / 9;
            }
        }

        /* ===== SCROLLBAR STYLING (optional) ===== */
        ::-webkit-scrollbar {
            width: 8px;
        }
        ::-webkit-scrollbar-track {
            background: #0A0A0A;
        }
        ::-webkit-scrollbar-thumb {
            background: #2A2A2A;
            border-radius: 10px;
        }
        ::-webkit-scrollbar-thumb:hover {
            background: #A0A0A0;
        }
    </style>
</head>
<body>

    <section class="gallery-section">
        
        <!-- HEADER -->
        <div class="gallery-header">
            <div class="gallery-header-left">
                <h2>GAMEPLAY</h2>
                <p>Explore the worlds we've created.</p>
            </div>
            <div class="gallery-header-right">ZEROX GAME STUDIOS</div>
        </div>

        <!-- MASONRY GRID -->
        <div class="masonry-grid">

            <!-- 1. LARGE (Prominent) -->
            <div class="grid-item grid-item--large">
                <img src="https://via.placeholder.com/800x500/1A1A1A/FFFFFF?text=SCREENSHOT+01" alt="Gameplay screenshot 1">
                <div class="overlay"><span>VIEW SCREENSHOT</span></div>
            </div>

            <!-- 2. STANDARD -->
            <div class="grid-item grid-item--standard">
                <img src="https://via.placeholder.com/400x300/1A1A1A/FFFFFF?text=SCREENSHOT+02" alt="Gameplay screenshot 2">
                <div class="overlay"><span>VIEW SCREENSHOT</span></div>
            </div>

            <!-- 3. TALL -->
            <div class="grid-item grid-item--tall">
                <img src="https://via.placeholder.com/400x600/1A1A1A/FFFFFF?text=SCREENSHOT+03" alt="Gameplay screenshot 3">
                <div class="overlay"><span>VIEW SCREENSHOT</span></div>
            </div>

            <!-- 4. SQUARE -->
            <div class="grid-item grid-item--square">
                <img src="https://via.placeholder.com/400x400/1A1A1A/FFFFFF?text=SCREENSHOT+04" alt="Gameplay screenshot 4">
                <div class="overlay"><span>VIEW SCREENSHOT</span></div>
            </div>

            <!-- 5. WIDE -->
            <div class="grid-item grid-item--wide">
                <img src="https://via.placeholder.com/800x450/1A1A1A/FFFFFF?text=SCREENSHOT+05" alt="Gameplay screenshot 5">
                <div class="overlay"><span>VIEW SCREENSHOT</span></div>
            </div>

            <!-- 6. STANDARD -->
            <div class="grid-item grid-item--standard">
                <img src="https://via.placeholder.com/400x300/1A1A1A/FFFFFF?text=SCREENSHOT+06" alt="Gameplay screenshot 6">
                <div class="overlay"><span>VIEW SCREENSHOT</span></div>
            </div>

            <!-- 7. STANDARD -->
            <div class="grid-item grid-item--standard">
                <img src="https://via.placeholder.com/400x300/1A1A1A/FFFFFF?text=SCREENSHOT+07" alt="Gameplay screenshot 7">
                <div class="overlay"><span>VIEW SCREENSHOT</span></div>
            </div>

        </div>
        <!-- END GRID -->

    </section>

</body>
</html>
