<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>AI Assistant | صفحه تمام‌صفحه</title>

    <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/rastikerdar/vazirmatn@v33.003/Vazirmatn-font-face.css" />
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css" />

    <style>
        /* ===== ریست کامل ===== */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html,
        body {
            width: 100%;
            height: 100%;
            overflow: hidden;
            /* مهم: اسکرول رو حذف میکنه */;
        }

        body {
            font-family: 'Vazirmatn', sans-serif;
            background: #050510;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        /* ===== پس‌زمینه با ذرات سه‌بعدی ===== */
        .bg-ai {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 0;
            overflow: hidden;
            background: radial-gradient(ellipse at center, #0a0a2a, #050510);
        }

        /* ذرات درخشان */
        .bg-ai .particle {
            position: absolute;
            width: 3px;
            height: 3px;
            background: #00d4ff;
            border-radius: 50%;
            box-shadow: 0 0 30px #00d4ff, 0 0 60px #00d4ff, 0 0 100px #00d4ff;
            animation: particleFly 12s infinite linear;
        }

        .bg-ai .particle:nth-child(1) {
            left: 5%;
            animation-duration: 14s;
            animation-delay: 0s;
            width: 5px;
            height: 5px;
        }
        .bg-ai .particle:nth-child(2) {
            left: 15%;
            animation-duration: 16s;
            animation-delay: 1s;
            background: #a855f7;
            box-shadow: 0 0 30px #a855f7;
        }
        .bg-ai .particle:nth-child(3) {
            left: 30%;
            animation-duration: 11s;
            animation-delay: 2s;
            background: #ec4899;
            box-shadow: 0 0 30px #ec4899;
        }
        .bg-ai .particle:nth-child(4) {
            left: 45%;
            animation-duration: 18s;
            animation-delay: 0.5s;
            width: 6px;
            height: 6px;
        }
        .bg-ai .particle:nth-child(5) {
            left: 55%;
            animation-duration: 13s;
            animation-delay: 3s;
            background: #f59e0b;
            box-shadow: 0 0 30px #f59e0b;
        }
        .bg-ai .particle:nth-child(6) {
            left: 70%;
            animation-duration: 15s;
            animation-delay: 1.5s;
            background: #06b6d4;
            box-shadow: 0 0 30px #06b6d4;
        }
        .bg-ai .particle:nth-child(7) {
            left: 85%;
            animation-duration: 12s;
            animation-delay: 2.5s;
            width: 7px;
            height: 7px;
            background: #8b5cf6;
            box-shadow: 0 0 30px #8b5cf6;
        }
        .bg-ai .particle:nth-child(8) {
            left: 95%;
            animation-duration: 17s;
            animation-delay: 4s;
            background: #f472b6;
            box-shadow: 0 0 30px #f472b6;
        }

        @keyframes particleFly {
            0% {
                transform: translateY(100vh) scale(0) rotate(0deg);
                opacity: 0;
            }
            10% {
                opacity: 1;
            }
            90% {
                opacity: 1;
            }
            100% {
                transform: translateY(-10vh) scale(3) rotate(720deg);
                opacity: 0;
            }
        }

        /* ===== حلقه‌های چرخان دور کارت (افکت هوش مصنوعی) ===== */
        .orbit-ring {
            position: fixed;
            top: 50%;
            left: 50%;
            width: 500px;
            height: 500px;
            transform: translate(-50%, -50%);
            z-index: 0;
            pointer-events: none;
        }

        .orbit-ring .ring {
            position: absolute;
            top: 50%;
            left: 50%;
            border-radius: 50%;
            border: 1px solid rgba(0, 212, 255, 0.08);
            animation: orbitSpin 20s linear infinite;
        }

        .orbit-ring .ring:nth-child(1) {
            width: 100%;
            height: 100%;
            transform: translate(-50%, -50%) rotate(0deg);
            border-color: rgba(0, 212, 255, 0.05);
            animation-duration: 25s;
        }

        .orbit-ring .ring:nth-child(2) {
            width: 75%;
            height: 75%;
            transform: translate(-50%, -50%) rotate(45deg);
            border-color: rgba(168, 85, 247, 0.05);
            animation-duration: 18s;
            animation-direction: reverse;
        }

        .orbit-ring .ring:nth-child(3) {
            width: 50%;
            height: 50%;
            transform: translate(-50%, -50%) rotate(90deg);
            border-color: rgba(236, 72, 153, 0.05);
            animation-duration: 12s;
        }

        @keyframes orbitSpin {
            0% {
                transform: translate(-50%, -50%) rotate(0deg);
            }
            100% {
                transform: translate(-50%, -50%) rotate(360deg);
            }
        }

        /* ===== کارت اصلی ===== */
        .hero {
            position: relative;
            z-index: 1;
            width: 90%;
            max-width: 750px;
            background: rgba(10, 10, 30, 0.75);
            backdrop-filter: blur(40px);
            -webkit-backdrop-filter: blur(40px);
            border: 1px solid rgba(0, 212, 255, 0.08);
            border-radius: 40px;
            padding: 50px 45px;
            text-align: center;
            box-shadow: 0 30px 100px rgba(0, 0, 0, 0.8), inset 0 0 100px rgba(0, 212, 255, 0.02);
            animation: fadeInUp 0.8s ease forwards;
            opacity: 0;
        }

        @keyframes fadeInUp {
            0% {
                opacity: 0;
                transform: translateY(40px) scale(0.95);
            }
            100% {
                opacity: 1;
                transform: translateY(0) scale(1);
            }
        }

        /* ===== آواتار AI ===== */
        .avatar {
            width: 120px;
            height: 120px;
            background: linear-gradient(145deg, #00d4ff, #7c3aed);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0 auto 20px;
            font-size: 56px;
            color: #fff;
            box-shadow: 0 0 60px rgba(0, 212, 255, 0.2), 0 0 120px rgba(124, 58, 237, 0.1);
            animation: floatAvatar 3s ease-in-out infinite, pulseGlow 2s ease-in-out infinite;
            transition: 0.3s;
            border: 2px solid rgba(0, 212, 255, 0.15);
        }

        .avatar:hover {
            animation-play-state: paused;
            transform: scale(1.08) rotate(5deg);
            box-shadow: 0 0 80px rgba(0, 212, 255, 0.4);
        }

        @keyframes floatAvatar {
            0%,
            100% {
                transform: translateY(0);
            }
            50% {
                transform: translateY(-14px);
            }
        }

        @keyframes pulseGlow {
            0%,
            100% {
                box-shadow: 0 0 60px rgba(0, 212, 255, 0.2);
            }
            50% {
                box-shadow: 0 0 100px rgba(0, 212, 255, 0.5), 0 0 150px rgba(124, 58, 237, 0.2);
            }
        }

        /* ===== برچسب ===== */
        .badge {
            display: inline-block;
            background: rgba(0, 212, 255, 0.06);
            padding: 6px 24px;
            border-radius: 50px;
            font-size: 13px;
            color: #00d4ff;
            border: 1px solid rgba(0, 212, 255, 0.08);
            margin-bottom: 16px;
            animation: blinkBadge 2s ease-in-out infinite;
            letter-spacing: 0.5px;
        }

        @keyframes blinkBadge {
            0%,
            100% {
                opacity: 1;
            }
            50% {
                opacity: 0.2;
            }
        }

        .badge i {
            color: #a855f7;
            margin-left: 6px;
            animation: spinIcon 4s linear infinite;
        }

        @keyframes spinIcon {
            0% {
                transform: rotate(0deg);
            }
            100% {
                transform: rotate(360deg);
            }
        }

        /* ===== عنوان ===== */
        h1 {
            font-size: 46px;
            font-weight: 900;
            color: #fff;
            margin-bottom: 10px;
            line-height: 1.2;
            animation: slideTitle 1s ease 0.3s both;
        }

        @keyframes slideTitle {
            0% {
                opacity: 0;
                transform: translateX(-40px);
            }
            100% {
                opacity: 1;
                transform: translateX(0);
            }
        }

        h1 span {
            background: linear-gradient(90deg, #00d4ff, #a855f7, #ec4899, #00d4ff);
            background-size: 300% 100%;
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            animation: gradientMove 3s ease-in-out infinite;
        }

        @keyframes gradientMove {
            0% {
                background-position: 0% 50%;
            }
            50% {
                background-position: 100% 50%;
            }
            100% {
                background-position: 0% 50%;
            }
        }

        /* ===== زیرنویس با تایپ‌رایتر ===== */
        .subtitle {
            font-size: 18px;
            color: rgba(255, 255, 255, 0.4);
            line-height: 1.9;
            margin-bottom: 25px;
            animation: fadeInUp 1s ease 0.5s both;
            min-height: 40px;
        }

        .subtitle i {
            color: #a855f7;
            animation: pulseIcon 1.2s ease-in-out infinite;
        }

        @keyframes pulseIcon {
            0%,
            100% {
                transform: scale(1);
            }
            50% {
                transform: scale(1.4);
                color: #ec4899;
            }
        }

        /* ===== دکمه‌ها ===== */
        .btn-group {
            display: flex;
            flex-wrap: wrap;
            gap: 14px;
            justify-content: center;
            margin-bottom: 30px;
            animation: fadeInUp 1s ease 0.7s both;
        }

        .btn {
            padding: 14px 36px;
            border-radius: 60px;
            text-decoration: none;
            font-weight: 700;
            font-size: 16px;
            display: inline-flex;
            align-items: center;
            gap: 10px;
            border: none;
            cursor: pointer;
            transition: 0.3s ease;
            position: relative;
            overflow: hidden;
        }

        .btn-primary {
            background: linear-gradient(135deg, #00d4ff, #7c3aed);
            color: #fff;
            box-shadow: 0 0 40px rgba(0, 212, 255, 0.15);
            animation: btnPulse 2.5s ease-in-out infinite;
        }

        @keyframes btnPulse {
            0%,
            100% {
                box-shadow: 0 0 40px rgba(0, 212, 255, 0.15);
            }
            50% {
                box-shadow: 0 0 80px rgba(0, 212, 255, 0.4), 0 0 120px rgba(124, 58, 237, 0.15);
            }
        }

        .btn-primary:hover {
            transform: scale(1.08) translateY(-3px);
            box-shadow: 0 0 100px rgba(0, 212, 255, 0.5);
            animation-play-state: paused;
        }

        .btn-secondary {
            background: rgba(255, 255, 255, 0.03);
            color: #fff;
            border: 1px solid rgba(255, 255, 255, 0.06);
            backdrop-filter: blur(10px);
        }

        .btn-secondary:hover {
            background: rgba(255, 255, 255, 0.06);
            transform: scale(1.06) translateY(-3px);
            border-color: rgba(0, 212, 255, 0.15);
        }

        /* ===== ویژگی‌های AI ===== */
        .features {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(130px, 1fr));
            gap: 12px;
            margin: 20px 0 25px;
            animation: fadeInUp 1s ease 0.9s both;
        }

        .feature-item {
            background: rgba(255, 255, 255, 0.02);
            padding: 12px 8px;
            border-radius: 16px;
            color: rgba(255, 255, 255, 0.5);
            font-size: 13px;
            font-weight: 600;
            border: 1px solid rgba(255, 255, 255, 0.02);
            transition: 0.4s ease;
            animation: featureSlide 0.8s ease both;
            animation-delay: calc(0.15s * var(--i, 0));
        }

        .feature-item:nth-child(1) {
            --i: 1;
        }
        .feature-item:nth-child(2) {
            --i: 2;
        }
        .feature-item:nth-child(3) {
            --i: 3;
        }
        .feature-item:nth-child(4) {
            --i: 4;
        }

        @keyframes featureSlide {
            0% {
                opacity: 0;
                transform: translateY(25px) scale(0.9);
            }
            100% {
                opacity: 1;
                transform: translateY(0) scale(1);
            }
        }

        .feature-item:hover {
            background: rgba(0, 212, 255, 0.04);
            transform: translateY(-5px) scale(1.04);
            border-color: rgba(0, 212, 255, 0.1);
            box-shadow: 0 10px 30px rgba(0, 212, 255, 0.03);
            color: #fff;
        }

        .feature-item i {
            color: #00d4ff;
            margin-left: 6px;
            animation: pulseIcon 2.5s ease-in-out infinite;
        }

        /* ===== شبکه اجتماعی ===== */
        .social-row {
            display: flex;
            justify-content: center;
            gap: 16px;
            flex-wrap: wrap;
            padding-top: 18px;
            border-top: 1px solid rgba(255, 255, 255, 0.02);
            animation: fadeInUp 1s ease 1.1s both;
        }

        .social-row a {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            width: 48px;
            height: 48px;
            border-radius: 50%;
            background: rgba(255, 255, 255, 0.02);
            color: rgba(255, 255, 255, 0.2);
            font-size: 20px;
            border: 1px solid rgba(255, 255, 255, 0.02);
            text-decoration: none;
            transition: 0.4s ease;
            animation: socialPop 0.5s ease both;
            animation-delay: calc(0.08s * var(--s, 0));
        }

        .social-row a:nth-child(1) {
            --s: 1;
        }
        .social-row a:nth-child(2) {
            --s: 2;
        }
        .social-row a:nth-child(3) {
            --s: 3;
        }
        .social-row a:nth-child(4) {
            --s: 4;
        }
        .social-row a:nth-child(5) {
            --s: 5;
        }

        @keyframes socialPop {
            0% {
                opacity: 0;
                transform: scale(0) rotate(-180deg);
            }
            100% {
                opacity: 1;
                transform: scale(1) rotate(0deg);
            }
        }

        .social-row a:hover {
            background: rgba(0, 212, 255, 0.06);
            color: #00d4ff;
            transform: translateY(-5px) scale(1.12);
            border-color: rgba(0, 212, 255, 0.12);
            box-shadow: 0 0 30px rgba(0, 212, 255, 0.05);
        }

        /* ===== ریسپانسیو ===== */
        @media (max-width: 600px) {
            .hero {
                padding: 30px 18px;
                border-radius: 28px;
                width: 95%;
            }
            h1 {
                font-size: 30px;
            }
            .btn {
                padding: 12px 22px;
                font-size: 14px;
            }
            .features {
                grid-template-columns: 1fr 1fr;
                gap: 8px;
            }
            .avatar {
                width: 85px;
                height: 85px;
                font-size: 40px;
            }
            .orbit-ring {
                display: none;
            }
        }
    </style>
</head>
<body>

    <!-- ===== پس‌زمینه ذرات ===== -->
    <div class="bg-ai">
        <div class="particle"></div>
        <div class="particle"></div>
        <div class="particle"></div>
        <div class="particle"></div>
        <div class="particle"></div>
        <div class="particle"></div>
        <div class="particle"></div>
        <div class="particle"></div>
    </div>

    <!-- ===== حلقه‌های چرخان ===== -->
    <div class="orbit-ring">
        <div class="ring"></div>
        <div class="ring"></div>
        <div class="ring"></div>
    </div>

    <!-- ===== کارت اصلی ===== -->
    <div class="hero">

        <div class="avatar">
            <i class="fa-solid fa-brain"></i>
        </div>

        <div class="badge">
            <i class="fa-solid fa-microchip"></i> نسخه 4.0
        </div>

        <h1>
            <span>AI</span> Assistant
        </h1>

        <p class="subtitle" id="typing-text">
            <i class="fa-regular fa-message"></i>
            <span id="typewriter"></span>
        </p>

        <div class="btn-group">
            <a href="#" class="btn btn-primary">
                <i class="fa-solid fa-microphone"></i> شروع مکالمه
            </a>
            <a href="#" class="btn btn-secondary">
                <i class="fa-regular fa-compass"></i> کاوش
            </a>
        </div>

        <div class="features">
            <div class="feature-item">
                <i class="fa-solid fa-brain"></i> یادگیری عمیق
            </div>
            <div class="feature-item">
                <i class="fa-solid fa-bolt"></i> پاسخ آنی
            </div>
            <div class="feature-item">
                <i class="fa-solid fa-shield-halved"></i> امنیت بالا
            </div>
            <div class="feature-item">
                <i class="fa-regular fa-comment-dots"></i> مکالمه طبیعی
            </div>
        </div>

        <div class="social-row">
            <a href="#"><i class="fa-brands fa-github"></i></a>
            <a href="#"><i class="fa-brands fa-linkedin-in"></i></a>
            <a href="#"><i class="fa-brands fa-x-twitter"></i></a>
            <a href="#"><i class="fa-brands fa-youtube"></i></a>
            <a href="#"><i class="fa-brands fa-discord"></i></a>
        </div>

    </div>

    <!-- ===== اسکریپت تایپ‌رایتر ===== -->
    <script>
        document.addEventListener('DOMContentLoaded', function() {
            const text = "هوش مصنوعی در خدمت شماست 🚀";
            const element = document.getElementById('typewriter');
            let index = 0;
            let isDeleting = false;

            function typeEffect() {
                if (!isDeleting) {
                    if (index < text.length) {
                        element.textContent += text.charAt(index);
                        index++;
                        setTimeout(typeEffect, 80);
                    } else {
                        isDeleting = true;
                        setTimeout(typeEffect, 1500);
                    }
                } else {
                    if (index > 0) {
                        element.textContent = text.substring(0, index - 1);
                        index--;
                        setTimeout(typeEffect, 40);
                    } else {
                        isDeleting = false;
                        setTimeout(typeEffect, 500);
                    }
                }
            }

            typeEffect();
        });
    </script>

</body>
</html>
