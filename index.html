<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>ZER0X GAME</title>

  <!-- ===== فاویکون ===== -->
  <link rel="icon" type="image/png" sizes="32x32" href="https://cdn.imgurl.ir/uploads/b18142_Negar_1789379626960.png" />
  <link rel="icon" type="image/png" sizes="16x16" href="https://cdn.imgurl.ir/uploads/b18142_Negar_1789379626960.png" />
  <link rel="apple-touch-icon" href="https://cdn.imgurl.ir/uploads/b18142_Negar_1789379626960.png" />

  <!-- ===== فونت‌ها ===== -->
  <link href="https://fonts.googleapis.com/css2?family=Estedad:wght@400;500;700;800;900&display=swap" rel="stylesheet" />
  <link href="https://fonts.googleapis.com/css2?family=Ardakan:wght@400;500;700&display=swap" rel="stylesheet" />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet" />

  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css" />

  <style>
    /* ===== RESET ===== */
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }
    html { scroll-behavior: smooth; }
    body {
      background-color: #0a0a0a;
      color: #e8e8e8;
      font-family: 'Estedad', 'Ardakan', 'Inter', sans-serif;
      line-height: 1.7;
      -webkit-font-smoothing: antialiased;
      overflow-x: hidden;
    }
    ::-webkit-scrollbar { width: 6px; }
    ::-webkit-scrollbar-track { background: #0a0a0a; }
    ::-webkit-scrollbar-thumb { background: #333; border-radius: 10px; }
    ::-webkit-scrollbar-thumb:hover { background: #555; }
    a { text-decoration: none; color: inherit; }
    .container {
      max-width: 1400px;
      margin: 0 auto;
      padding: 0 2rem;
      width: 100%;
      overflow: hidden;
    }

    /* ===== جلوگیری از دانلود عکس ===== */
    img {
      -webkit-user-drag: none;
      user-drag: none;
      -webkit-user-select: none;
      user-select: none;
      -webkit-touch-callout: none;
    }
    .card-img img,
    .hero-slide-bg,
    .detail-hero-bg,
    .gallery-grid img,
    .result-card .card-img img,
    .game-card .card-img img,
    .purchase-cover img {
      -webkit-user-drag: none;
      user-drag: none;
      -webkit-user-select: none;
      user-select: none;
      pointer-events: none;
    }

    /* ==================================================
       انیمیشن‌ها
    ================================================== */
    @keyframes fadeUp {
      from { opacity: 0; transform: translateY(40px); }
      to { opacity: 1; transform: translateY(0); }
    }
    @keyframes fadeDown {
      from { opacity: 0; transform: translateY(-30px); }
      to { opacity: 1; transform: translateY(0); }
    }
    @keyframes scaleIn {
      from { opacity: 0; transform: scale(0.85); }
      to { opacity: 1; transform: scale(1); }
    }
    @keyframes slideInRight {
      from { opacity: 0; transform: translateX(40px); }
      to { opacity: 1; transform: translateX(0); }
    }
    @keyframes shimmer {
      0% { background-position: -200% center; }
      100% { background-position: 200% center; }
    }
    @keyframes fadeIn {
      from { opacity: 0; }
      to { opacity: 1; }
    }
    @keyframes slideInRightMenu {
      from { opacity: 0; transform: translateX(50px); }
      to { opacity: 1; transform: translateX(0); }
    }
    @keyframes spinSlow {
      from { transform: rotate(0deg); }
      to { transform: rotate(360deg); }
    }
    @keyframes modalFade {
      from { opacity: 0; transform: scale(0.9); }
      to { opacity: 1; transform: scale(1); }
    }

    .animate-fade-up {
      animation: fadeUp 0.8s ease forwards;
      opacity: 0;
    }
    .animate-fade-down {
      animation: fadeDown 0.6s ease forwards;
      opacity: 0;
    }
    .animate-scale-in {
      animation: scaleIn 0.6s ease forwards;
      opacity: 0;
    }
    .animate-slide-right {
      animation: slideInRight 0.8s ease forwards;
      opacity: 0;
    }
    .delay-1 { animation-delay: 0.1s; }
    .delay-2 { animation-delay: 0.2s; }
    .delay-3 { animation-delay: 0.3s; }
    .delay-4 { animation-delay: 0.4s; }
    .delay-5 { animation-delay: 0.5s; }

    /* ==================================================
       HEADER
    ================================================== */
    .header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 1rem 2rem;
      background: rgba(10, 10, 10, 0.92);
      backdrop-filter: blur(16px);
      border-bottom: 1px solid rgba(255,255,255,0.04);
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      z-index: 1000;
      transition: 0.3s;
      animation: fadeDown 0.6s ease;
    }
    .header.scrolled {
      background: rgba(10, 10, 10, 0.98);
      border-bottom: 1px solid rgba(255,255,255,0.08);
    }
    .logo {
      font-size: 1.4rem;
      font-weight: 900;
      letter-spacing: 3px;
      color: #fff;
      text-transform: uppercase;
      cursor: pointer;
      font-family: 'Estedad', 'Ardakan', sans-serif;
      transition: 0.3s;
    }
    .logo:hover { transform: scale(1.05) rotate(-2deg); }
    .logo span { font-weight: 300; color: #555; }

    .nav {
      display: flex;
      gap: 2.2rem;
      font-size: 0.9rem;
      align-items: center;
    }
    .nav a {
      cursor: pointer;
      transition: 0.4s;
      position: relative;
      color: #777;
      font-weight: 400;
      padding: 4px 0;
      font-family: 'Estedad', 'Ardakan', sans-serif;
      display: flex;
      align-items: center;
      gap: 4px;
    }
    .nav a::after {
      content: '';
      position: absolute;
      bottom: -2px;
      right: 0;
      width: 0;
      height: 2px;
      background: linear-gradient(90deg, #fff, #888, #fff);
      background-size: 200% auto;
      transition: 0.4s;
    }
    .nav a:hover::after {
      width: 100%;
      animation: shimmer 1.5s linear infinite;
    }
    .nav a:hover { color: #fff; transform: translateY(-2px); }
    .nav a.active { color: #fff; }
    .nav a.active::after { width: 100%; }

    .header-actions {
      display: flex;
      align-items: center;
      gap: 1.5rem;
      color: #555;
    }
    .header-actions i {
      font-size: 1.2rem;
      cursor: pointer;
      transition: 0.4s;
    }
    .header-actions i:hover {
      color: #fff;
      transform: scale(1.2) rotate(15deg);
    }
    .menu-mobile { display: none; }

    /* ==================================================
       منوی موبایل
    ================================================== */
    .mobile-menu-overlay {
      position: fixed;
      inset: 0;
      background: rgba(0, 0, 0, 0.92);
      backdrop-filter: blur(24px);
      -webkit-backdrop-filter: blur(24px);
      z-index: 2000;
      display: none;
      align-items: center;
      justify-content: center;
      animation: fadeIn 0.3s ease;
      padding: 2rem;
    }
    .mobile-menu-overlay.active { display: flex; }

    .mobile-menu-content {
      width: 100%;
      max-width: 400px;
      padding: 2rem;
      text-align: center;
      position: relative;
    }
    .mobile-menu-content .close-menu {
      position: absolute;
      top: 0;
      left: 0;
      font-size: 2rem;
      color: #666;
      cursor: pointer;
      transition: 0.4s;
      background: none;
      border: none;
      font-family: inherit;
    }
    .mobile-menu-content .close-menu:hover {
      color: #fff;
      transform: rotate(90deg);
    }
    .mobile-menu-content .mobile-logo {
      font-size: 2.2rem;
      font-weight: 900;
      color: #fff;
      font-family: 'Estedad', 'Ardakan', sans-serif;
      letter-spacing: 3px;
      margin-bottom: 3rem;
    }
    .mobile-menu-content .mobile-logo span { color: #555; font-weight: 300; }
    .mobile-menu-content .mobile-nav {
      display: flex;
      flex-direction: column;
      gap: 1.5rem;
    }
    .mobile-menu-content .mobile-nav a {
      color: #888;
      font-size: 1.4rem;
      font-weight: 400;
      font-family: 'Estedad', 'Ardakan', sans-serif;
      transition: 0.4s;
      padding: 0.8rem 0;
      border-bottom: 1px solid rgba(255,255,255,0.04);
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 14px;
      opacity: 0;
      animation: slideInRightMenu 0.5s ease forwards;
    }
    .mobile-menu-content .mobile-nav a:nth-child(1) { animation-delay: 0.05s; }
    .mobile-menu-content .mobile-nav a:nth-child(2) { animation-delay: 0.1s; }
    .mobile-menu-content .mobile-nav a:nth-child(3) { animation-delay: 0.15s; }
    .mobile-menu-content .mobile-nav a:nth-child(4) { animation-delay: 0.2s; }
    .mobile-menu-content .mobile-nav a i {
      font-size: 1.2rem;
      color: #444;
      transition: 0.3s;
      width: 30px;
    }
    .mobile-menu-content .mobile-nav a:hover {
      color: #fff;
      transform: translateX(-6px);
      border-bottom-color: rgba(255,255,255,0.1);
    }
    .mobile-menu-content .mobile-nav a:hover i {
      color: #888;
      transform: scale(1.2);
    }
    .mobile-menu-content .mobile-nav a.active { color: #fff; }
    .mobile-menu-content .mobile-nav a.active i { color: #888; }
    .mobile-menu-content .mobile-social {
      margin-top: 3rem;
      display: flex;
      gap: 1.5rem;
      justify-content: center;
      border-top: 1px solid rgba(255,255,255,0.05);
      padding-top: 2rem;
      opacity: 0;
      animation: fadeIn 0.5s ease forwards;
      animation-delay: 0.2s;
    }
    .mobile-menu-content .mobile-social a {
      color: #444;
      font-size: 1.5rem;
      transition: 0.3s;
    }
    .mobile-menu-content .mobile-social a:hover {
      color: #fff;
      transform: translateY(-4px) scale(1.1);
    }

    /* ===== صفحات ===== */
    .page { display: none; padding-top: 70px; }
    .page.active { display: block; }

    /* ==================================================
       HERO SLIDER
    ================================================== */
    .hero-slider {
      position: relative;
      min-height: 88vh;
      overflow: hidden;
      background: #0a0a0a;
    }
    .hero-slide {
      position: absolute;
      inset: 0;
      min-height: 88vh;
      display: flex;
      align-items: flex-end;
      padding: 4rem 2rem 3rem;
      opacity: 0;
      visibility: hidden;
      transition: opacity 0.8s ease, visibility 0.8s ease;
      overflow: hidden;
    }
    .hero-slide.active {
      opacity: 1;
      visibility: visible;
      z-index: 2;
    }
    .hero-slide-bg {
      position: absolute;
      inset: 0;
      background-position: center;
      background-size: cover;
      background-repeat: no-repeat;
      transform: scale(1.02);
      filter: brightness(0.5) contrast(1.15) saturate(0.85);
      will-change: transform;
      z-index: 0;
      pointer-events: none;
    }
    .hero-slide-bg::after {
      content: '';
      position: absolute;
      inset: 0;
      background: linear-gradient(0deg, rgba(0,0,0,0.9) 15%, rgba(0,0,0,0.15) 70%, transparent 100%);
    }
    .hero-content {
      position: relative;
      z-index: 3;
      max-width: 720px;
      padding-bottom: 2rem;
    }
    .hero-content .game-tag {
      font-size: 0.7rem;
      letter-spacing: 5px;
      text-transform: uppercase;
      color: #555;
      margin-bottom: 0.5rem;
      font-weight: 300;
      opacity: 0;
    }
    .hero-slide.active .hero-content .game-tag {
      animation: fadeUp 1s ease 0.1s forwards;
    }
    .hero-content h1 {
      font-size: 4.8rem;
      font-weight: 900;
      line-height: 1.05;
      color: #fff;
      margin: 0.5rem 0 0.2rem;
      letter-spacing: -2px;
      font-family: 'Estedad', 'Ardakan', sans-serif;
      opacity: 0;
    }
    .hero-slide.active .hero-content h1 {
      animation: fadeUp 1.2s ease 0.2s forwards;
    }
    .hero-content .sub-title {
      font-size: 1.3rem;
      font-weight: 300;
      color: #888;
      margin-bottom: 0.6rem;
      opacity: 0;
    }
    .hero-slide.active .hero-content .sub-title {
      animation: fadeUp 1.4s ease 0.3s forwards;
    }
    .hero-content .meta {
      display: flex;
      gap: 1.5rem;
      font-size: 0.85rem;
      color: #666;
      margin: 0.8rem 0 2rem;
      flex-wrap: wrap;
      font-weight: 300;
      opacity: 0;
    }
    .hero-slide.active .hero-content .meta {
      animation: fadeUp 1.6s ease 0.4s forwards;
    }
    .hero-content .meta i { margin-left: 0.4rem; color: #444; }
    .hero-content .btn-ghost { opacity: 0; }
    .hero-slide.active .hero-content .btn-ghost {
      animation: fadeUp 1.8s ease 0.5s forwards;
    }

    .btn-ghost {
      display: inline-block;
      padding: 1rem 3rem;
      border: 1px solid rgba(255,255,255,0.15);
      color: #fff;
      font-weight: 600;
      font-size: 0.9rem;
      letter-spacing: 2px;
      background: transparent;
      transition: all 0.5s;
      border-radius: 2px;
      cursor: pointer;
      font-family: 'Estedad', 'Ardakan', sans-serif;
      position: relative;
      overflow: hidden;
    }
    .btn-ghost::before {
      content: '';
      position: absolute;
      inset: 0;
      background: linear-gradient(90deg, transparent, rgba(255,255,255,0.1), transparent);
      transform: translateX(-100%);
      transition: 0.6s;
    }
    .btn-ghost:hover::before { transform: translateX(100%); }
    .btn-ghost:hover {
      background: rgba(255,255,255,0.05);
      border-color: rgba(255,255,255,0.3);
      transform: translateY(-3px) scale(1.02);
    }

    /* ===== کنترل اسلایدر ===== */
    .hero-slider-controls {
      position: absolute;
      bottom: 35px;
      left: 50%;
      transform: translateX(-50%);
      z-index: 20;
      display: flex;
      gap: 8px;
      align-items: center;
    }
    .hero-slider-dot {
      width: 28px;
      height: 3px;
      border: none;
      outline: none;
      padding: 0;
      background: #333;
      cursor: pointer;
      transition: 0.4s;
    }
    .hero-slider-dot:hover { background: #666; }
    .hero-slider-dot.active {
      width: 50px;
      background: #fff;
    }

    /* ==================================================
       بخش بازی‌ها
    ================================================== */
    #games-section { scroll-margin-top: 80px; }
    .section-title {
      font-size: 2rem;
      font-weight: 800;
      margin: 4rem 0 2rem;
      border-right: 3px solid #333;
      padding-right: 1.2rem;
      color: #eee;
      font-family: 'Estedad', 'Ardakan', sans-serif;
      animation: slideInRight 0.8s ease;
    }
    .game-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
      gap: 2rem;
      margin-bottom: 4rem;
    }
    .game-card {
      background: #0f0f0f;
      border: 1px solid #181818;
      border-radius: 8px;
      overflow: hidden;
      transition: all 0.5s ease;
      cursor: pointer;
      animation: scaleIn 0.6s ease forwards;
      opacity: 0;
    }
    .game-card:nth-child(1) { animation-delay: 0.1s; }
    .game-card:nth-child(2) { animation-delay: 0.2s; }
    .game-card:nth-child(3) { animation-delay: 0.3s; }
    .game-card:hover {
      border-color: #444;
      transform: translateY(-10px) scale(1.02);
      box-shadow: 0 30px 80px rgba(0,0,0,0.8);
    }
    .game-card .card-img {
      width: 100%;
      aspect-ratio: 16/9;
      overflow: hidden;
      position: relative;
      background: #0a0a0a;
    }
    .game-card .card-img img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      transition: transform 0.7s ease;
      pointer-events: none;
    }
    .game-card:hover .card-img img { transform: scale(1.15); }
    .game-card .card-overlay {
      position: absolute;
      inset: 0;
      background: rgba(0,0,0,0.75);
      opacity: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: opacity 0.5s ease;
      backdrop-filter: blur(4px);
    }
    .game-card:hover .card-overlay { opacity: 1; }
    .game-card .card-overlay i {
      font-size: 3.5rem;
      color: #fff;
      opacity: 0;
      transform: translateY(30px) scale(0.7);
      transition: all 0.5s ease;
    }
    .game-card:hover .card-overlay i {
      opacity: 1;
      transform: translateY(0) scale(1);
    }
    .game-card .card-body {
      padding: 1.5rem;
      background: #0f0f0f;
    }
    .game-card .card-body h3 {
      font-size: 1.4rem;
      font-weight: 800;
      color: #fff;
      margin-bottom: 0.2rem;
      font-family: 'Estedad', 'Ardakan', sans-serif;
    }
    .game-card .card-body .genre {
      font-size: 0.8rem;
      color: #555;
      font-weight: 300;
      letter-spacing: 1px;
    }
    .game-card .card-body .status {
      display: inline-block;
      margin-top: 0.8rem;
      padding: 0.2rem 1.2rem;
      border: 1px solid #222;
      border-radius: 20px;
      font-size: 0.7rem;
      color: #666;
      letter-spacing: 1px;
    }

    /* ==================================================
       درباره ما
    ================================================== */
    .about-page {
      padding: 4rem 0;
      max-width: 800px;
      margin: 0 auto;
      width: 100%;
      overflow: hidden;
    }
    .about-page .about-header h1 {
      font-size: 2.8rem;
      font-weight: 900;
      font-family: 'Estedad', 'Ardakan', sans-serif;
      letter-spacing: -1px;
      margin-bottom: 2.5rem;
      border-right: 3px solid #333;
      padding-right: 1.2rem;
      color: #fff;
      word-wrap: break-word;
      animation: slideInRight 0.8s ease;
    }
    .about-page .about-content p {
      color: #aaa;
      font-size: 1.05rem;
      line-height: 2.2;
      margin-bottom: 1.5rem;
      font-weight: 300;
      word-wrap: break-word;
      overflow-wrap: break-word;
      max-width: 100%;
      padding: 0;
      animation: fadeUp 0.8s ease forwards;
      opacity: 0;
    }
    .about-page .about-content p:nth-child(1) { animation-delay: 0.1s; }
    .about-page .about-content p:nth-child(2) { animation-delay: 0.2s; }
    .about-page .about-content p:nth-child(3) { animation-delay: 0.3s; }
    .about-page .about-content p:nth-child(4) { animation-delay: 0.4s; }
    .about-page .about-content p:last-of-type { margin-bottom: 2.5rem; }
    .about-page .about-tagline {
      font-size: 2rem;
      font-weight: 900;
      font-family: 'Estedad', 'Ardakan', sans-serif;
      color: #fff;
      letter-spacing: -1px;
      border-top: 1px solid #1a1a1a;
      padding-top: 2rem;
      word-wrap: break-word;
      animation: fadeUp 0.8s ease forwards;
      opacity: 0;
      animation-delay: 0.5s;
    }
    .about-page .about-tagline span {
      display: block;
      font-size: 1rem;
      font-weight: 300;
      color: #555;
      letter-spacing: 2px;
      margin-top: 0.3rem;
      font-family: 'Inter', 'Estedad', 'Ardakan', sans-serif;
    }

    /* ==================================================
       صفحه جستجو
    ================================================== */
    .search-page {
      padding: 4rem 0 5rem;
      min-height: 80vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      text-align: center;
    }
    .search-page .search-header { margin-bottom: 2.5rem; }
    .search-page .search-header h1 {
      font-size: 2.8rem;
      font-weight: 900;
      font-family: 'Estedad', 'Ardakan', sans-serif;
      letter-spacing: -2px;
      color: #fff;
    }
    .search-page .search-header .sub {
      color: #666;
      font-size: 1rem;
      font-weight: 300;
      margin-top: 0.3rem;
    }
    .search-page .search-box {
      position: relative;
      width: 100%;
      max-width: 600px;
      margin: 0 auto 2rem;
    }
    .search-page .search-box input {
      width: 100%;
      padding: 1.3rem 2rem 1.3rem 3.5rem;
      background: rgba(255,255,255,0.03);
      border: 1px solid #222;
      border-radius: 50px;
      color: #fff;
      font-size: 1.2rem;
      font-family: 'Estedad', 'Ardakan', sans-serif;
      outline: none;
      transition: 0.4s;
      font-weight: 300;
      text-align: center;
    }
    .search-page .search-box input:focus {
      border-color: #555;
      background: rgba(255,255,255,0.05);
      box-shadow: 0 0 50px rgba(255,255,255,0.02);
      transform: scale(1.02);
    }
    .search-page .search-box input::placeholder { color: #333; font-weight: 300; }
    .search-page .search-box .search-icon {
      position: absolute;
      right: 1.5rem;
      top: 50%;
      transform: translateY(-50%);
      color: #444;
      font-size: 1.2rem;
      transition: 0.3s;
    }
    .search-page .search-box input:focus ~ .search-icon { color: #888; }
    .search-page .results-count {
      color: #555;
      font-size: 0.85rem;
      font-weight: 300;
      margin-bottom: 1.5rem;
    }
    .search-page .results-count span { color: #888; font-weight: 700; }
    .search-page .search-placeholder {
      grid-column: 1/-1;
      text-align: center;
      padding: 3rem 0;
      color: #444;
    }
    .search-page .search-placeholder i {
      font-size: 3.5rem;
      color: #222;
      display: block;
      margin-bottom: 1rem;
    }
    .search-page .search-placeholder p { font-weight: 300; font-size: 1rem; }
    .search-page .results-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
      gap: 2rem;
      width: 100%;
      max-width: 1200px;

    /* ==================================================

    .modal-overlay {
      position: fixed;
      inset: 0;
      background: rgba(0, 0, 0, 0.85);

      z-index: 3000;
      display: none;
      align-items: center;
      justify-content: center;
      padding: 2rem;
    }
    .modal-overlay.active { display: flex; }
    .modal-box {
      background: #0f0f0f;
      border: 1px solid #222;
      border-radius: 16px;
      padding: 2.5rem;
      max-width: 450px;
      width: 100%;
      text-align: center;
      animation: modalFade 0.3s ease;
    }
    .modal-box .modal-icon {
      font-size: 3.5rem;
      color: #444;
      margin-bottom: 1rem;
    }
    .modal-box h2 {
      font-size: 1.5rem;
      font-weight: 800;
      color: #fff;

    /* ==================================================
       کارت خرید (استیم-استایل) - SilentGears
    ================================================== */
    .purchase-card {

      border: 1px solid #1a1a1a;
      border-radius: 8px;
      padding: 1.5rem;
      margin: 2rem 0;
      transition: 0.3s ease;
      box-shadow: 0 4px 20px rgba(0,0,0,0.5);
    }
    .purchase-card:hover {
      border-color: #333;
      box-shadow: 0 8px 40px rgba(0,0,0,0.8);
    }
    .purchase-header {
      display: flex;

      padding-bottom: 0.8rem;
      border-bottom: 1px solid #181818;
    }
    .purchase-logo {

      font-weight: 900;
      letter-spacing: 2px;
      color: #fff;

    }
    .purchase-logo span { color: #555; font-weight: 300; }
    .purchase-badge {
      font-size: 0.65rem;
      color: #666;
      border: 1px solid #222;

      border-radius: 20px;

    }
    .purchase-body {
      display: flex;
      gap: 1.5rem;
      align-items: flex-start;
    }
    .purchase-cover {

      width: 140px;
      aspect-ratio: 16/9;
      border-radius: 4px;
      overflow: hidden;
      border: 1px solid #1a1a1a;
      background: #0a0a0a;
    }
    .purchase-cover img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
    }
    .purchase-info { flex: 1; min-width: 0; }
    .purchase-info h3 {
      font-size: 1.3rem;
      font-weight: 800;
      color: #fff;
      font-family: 'Estedad', 'Ardakan', sans-serif;
      margin-bottom: 0.2rem;
      letter-spacing: -0.5px;
    }
    .purchase-desc {
      color: #888;
      font-size: 0.85rem;
      font-weight: 300;
      margin-bottom: 0.8rem;
      line-height: 1.6;
      font-family: 'Estedad', 'Ardakan', sans-serif;
    }
    .purchase-meta {

      flex-wrap: wrap;
      margin-bottom: 1rem;
    }
    .purchase-meta span {
      color: #666;
      font-size: 0.75rem;
      font-weight: 300;
      font-family: 'Estedad', 'Ardakan', sans-serif;
    }
    .purchase-meta i { margin-left: 4px; color: #444; font-size: 0.7rem; }
    .purchase-status {
      margin: 0.8rem 0 1rem;
      padding: 0.8rem 1rem;
      background: rgba(255,255,255,0.02);
      border: 1px solid #1a1a1a;
      border-radius: 6px;
    }
    .status-badge {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      padding: 0.2rem 1rem;
      border: 1px solid #333;
      border-radius: 30px;
      font-size: 0.75rem;
      color: #aaa;
      letter-spacing: 0.5px;
      background: rgba(255,255,255,0.02);
      font-family: 'Estedad', 'Ardakan', sans-serif;
    }
    .status-badge i { color: #555; font-size: 0.8rem; }
    .status-desc {
      color: #666;
      font-size: 0.75rem;
      font-weight: 300;
      margin: 0.3rem 0 0;
      font-family: 'Estedad', 'Ardakan', sans-serif;
    }
    .purchase-btn {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      padding: 0.7rem 2rem;
      background: #fff;
      color: #0a0a0a;
      border: none;
      border-radius: 4px;
      font-size: 0.85rem;
      font-weight: 700;
      font-family: 'Estedad', 'Ardakan', sans-serif;
      cursor: pointer;
      transition: 0.2s;

    }
    .purchase-btn:hover { background: #ddd; transform: scale(1.02); }
    .purchase-btn i { font-size: 0.9rem; }
    .purchase-btn.disabled {
      background: transparent;
      color: #666;
      border: 1px solid #222;
      cursor: not-allowed;
      opacity: 0.6;
      pointer-events: none;
    }
    .purchase-btn.disabled i { color: #444; }
    .purchase-btn.disabled:hover { background: transparent; transform: none; }


    /* ==================================================
       صفحه اختصاصی SilentGears
    ================================================== */
    .detail-hero {
      position: relative;
      min-height: 75vh;
      display: flex;
      align-items: flex-end;
      padding: 5rem 2rem 4rem;
      margin-bottom: 3rem;
      overflow: hidden;
      border-radius: 0;
    }
    .detail-hero-bg {
      position: absolute;
      inset: 0;
      background: url('https://cdn.imgurl.ir/uploads/k51183_Negar_1788164380627.jpg') center/cover no-repeat;
      filter: brightness(0.25) contrast(1.2) saturate(0.7);
      z-index: 0;
      transform: scale(1.05);
      pointer-events: none;
    }
    .detail-hero-bg::after {
      content: '';
      position: absolute;
      inset: 0;
      background: linear-gradient(0deg, rgba(0,0,0,0.95) 20%, rgba(0,0,0,0.1) 60%, transparent 100%);
    }
    .detail-hero .detail-content {
      position: relative;
      z-index: 2;
      max-width: 1000px;
      margin: 0 auto;
      width: 100%;
    }
    .detail-hero .back-link {
      display: inline-flex;
      align-items: center;
      color: #555;
      margin-bottom: 2rem;
      font-size: 0.85rem;
      transition: 0.4s;
      cursor: pointer;
      gap: 8px;
      border-bottom: 1px solid #222;
      padding-bottom: 6px;
      font-weight: 300;
    }
    .detail-hero .back-link:hover {
      color: #fff;
      border-color: #555;
      transform: translateX(-5px);
    }
    .detail-hero h1 {
      font-size: 4.5rem;
      font-weight: 900;
      margin-bottom: 0.3rem;
      letter-spacing: -2px;
      line-height: 1.05;
      font-family: 'Estedad', 'Ardakan', sans-serif;
      animation: fadeUp 0.8s ease;
    }
    .detail-hero .sub {
      font-size: 1.4rem;
      color: #888;
      margin-bottom: 1.5rem;
      font-weight: 300;
      animation: fadeUp 1s ease forwards;
      opacity: 0;
    }
    .detail-info-box {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(180px, 1fr));
      gap: 1.5rem;
      margin: 2rem 0 2.5rem;
      background: rgba(255,255,255,0.02);
      padding: 2rem;
      border-radius: 10px;
      border: 1px solid #181818;
      animation: scaleIn 0.8s ease;
    }
    .detail-info-box .item { color: #666; }
    .detail-info-box .item strong {
      color: #fff;
      display: block;
      font-size: 0.7rem;
      text-transform: uppercase;
      letter-spacing: 2px;
      margin-bottom: 0.3rem;
      font-weight: 700;
      font-family: 'Estedad', 'Ardakan', sans-serif;
    }
    .detail-info-box .item span {
      font-size: 0.9rem;
      color: #aaa;
      font-weight: 300;
    }

    .detail-body {
      max-width: 1000px;
      margin: 0 auto;
      padding: 0 0 3rem;
    }
    .detail-body .full-desc {
      background: rgba(255,255,255,0.015);
      padding: 2.5rem;
      border-radius: 10px;
      border: 1px solid #161616;
      white-space: pre-line;
      color: #aaa;
      line-height: 2.2;
      margin: 2rem 0;
      font-size: 1rem;
      font-weight: 300;
      animation: scaleIn 0.8s ease;
    }
    .detail-body .full-desc::first-letter {
      font-size: 3.5rem;
      color: #fff;
      float: right;
      margin-left: 10px;
      line-height: 1;
      font-weight: 900;
      font-family: 'Estedad', 'Ardakan', sans-serif;
    }
    .trailer-section {
      margin: 2.5rem 0;
      padding: 2rem;
      border: 1px solid #161616;
      border-radius: 10px;
      background: rgba(255,255,255,0.015);
      animation: scaleIn 0.8s ease;
    }
    .trailer-section h3 {
      font-size: 1.1rem;
      font-weight: 700;
      margin-bottom: 1.2rem;
      color: #ddd;
      font-family: 'Estedad', 'Ardakan', sans-serif;
    }
    .trailer-section h3 i { margin-left: 12px; color: #444; }
    .trailer-placeholder {
      background: #0a0a0a;
      aspect-ratio: 16/9;
      border-radius: 6px;
      display: flex;
      align-items: center;
      justify-content: center;
      border: 1px solid #1a1a1a;
      color: #333;
      font-size: 4rem;
      transition: 0.4s;
      cursor: pointer;
    }
    .trailer-placeholder:hover {
      border-color: #444;
      color: #666;
      transform: scale(1.02) rotate(2deg);
    }
    .gallery-section {
      margin: 2.5rem 0;
      animation: scaleIn 0.8s ease;
    }
    .gallery-section h3 {
      font-size: 1.1rem;
      font-weight: 700;
      margin-bottom: 1.2rem;
      color: #ddd;
      font-family: 'Estedad', 'Ardakan', sans-serif;
    }
    .gallery-section h3 i { margin-left: 12px; color: #444; }
    .gallery-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
      gap: 1.2rem;
    }
    .gallery-grid img {
      width: 100%;
      border-radius: 8px;
      border: 1px solid #161616;
      transition: all 0.5s ease;
      aspect-ratio: 16/9;
      object-fit: cover;
      cursor: default;
      pointer-events: none;
    }
    .gallery-grid img:hover {
      transform: scale(1.04);
      border-color: #444;
      box-shadow: 0 15px 50px rgba(0,0,0,0.7);
    }

    /* ==================================================
       FOOTER
    ================================================== */
    .footer {
      border-top: 1px solid #0f0f0f;
      padding: 2.5rem 2rem;
      display: flex;
      flex-wrap: wrap;
      justify-content: space-between;
      align-items: center;
      gap: 1.5rem;
      background: #0a0a0a;
      margin-top: 2rem;
      animation: fadeUp 0.8s ease;
    }
    .footer .logo {
      font-size: 1.2rem;
      cursor: pointer;
      transition: 0.3s;
    }
    .footer .logo:hover { transform: scale(1.05); }
    .footer-links {
      display: flex;
      gap: 2rem;
      color: #444;
      font-size: 0.85rem;
    }
    .footer-links a {
      cursor: pointer;
      transition: 0.4s;
      font-weight: 300;
      position: relative;
    }
    .footer-links a::after {
      content: '';
      position: absolute;
      bottom: -2px;
      right: 0;
      width: 0;
      height: 1px;
      background: #fff;
      transition: 0.3s;
    }
    .footer-links a:hover { color: #fff; }
    .footer-links a:hover::after { width: 100%; }
    .footer-social {
      display: flex;
      gap: 1.2rem;
      color: #333;
      font-size: 1.2rem;
    }
    .footer-social a {
      color: #444;
      transition: 0.4s;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      width: 40px;
      height: 40px;
      border-radius: 50%;
      border: 1px solid transparent;
    }
    .footer-social a:hover {
      color: #fff;
      transform: translateY(-5px) scale(1.1);
      border-color: rgba(255,255,255,0.1);
      background: rgba(255,255,255,0.03);
    }
    .footer-social a i {
      font-size: 1.2rem;
      transition: 0.3s;
    }
    .footer-social a:hover i { transform: rotate(10deg); }
    .footer-copy {
      width: 100%;
      text-align: center;
      color: #222;
      font-size: 0.75rem;
      margin-top: 0.5rem;
      border-top: 1px solid #0f0f0f;
      padding-top: 1.2rem;
      font-weight: 300;
    }

    /* ==================================================
       RESPONSIVE
    ================================================== */
    @media (max-width: 768px) {
      .nav { display: none; }
      .menu-mobile { display: inline-block; }
      .header { padding: 0.8rem 1.2rem; }
      .hero-slider { min-height: 70vh; }
      .hero-slide { min-height: 70vh; padding: 2rem 1rem 2rem; }
      .hero-content h1 { font-size: 2.8rem; }
      .game-grid { grid-template-columns: 1fr; }
      .section-title { font-size: 1.6rem; }
      .detail-hero h1 { font-size: 2.8rem; }
      .detail-hero { min-height: 60vh; padding: 3rem 1rem 2rem; }
      .detail-info-box { grid-template-columns: 1fr 1fr; padding: 1.2rem; }
      .detail-body .full-desc { padding: 1.2rem; font-size: 0.95rem; }
      .footer { flex-direction: column; align-items: flex-start; }
      .about-page .about-header h1 { font-size: 2.2rem; }
      .about-page .about-content p { font-size: 0.95rem; }
      .about-page .about-tagline { font-size: 1.5rem; }
      .search-page .search-header h1 { font-size: 2rem; }
      .search-page .search-box input { font-size: 1rem; padding: 1rem 1.5rem 1rem 3rem; }
      .search-page .results-grid { grid-template-columns: 1fr 1fr; gap: 1rem; }
      .purchase-body { flex-direction: column; align-items: center; }
      .purchase-cover { flex: 0 0 auto; width: 100%; max-width: 280px; }
      .purchase-info { width: 100%; }
      .purchase-info h3 { font-size: 1.1rem; }
      .modal-box { padding: 2rem; }
    }
    @media (max-width: 480px) {
      .detail-info-box { grid-template-columns: 1fr; }
      .gallery-grid { grid-template-columns: 1fr; }
      .detail-hero h1 { font-size: 2.2rem; }
      .about-page .about-header h1 { font-size: 1.8rem; }
      .about-page .about-tagline { font-size: 1.3rem; }
      .footer-social { gap: 0.8rem; }
      .footer-social a { width: 35px; height: 35px; }
      .search-page .results-grid { grid-template-columns: 1fr; }
      .search-page .search-header h1 { font-size: 1.6rem; }
      .search-page .search-box input { font-size: 0.9rem; padding: 0.8rem 1.2rem 0.8rem 2.5rem; }
      .purchase-card { padding: 1rem; }
      .purchase-header { flex-direction: column; gap: 0.5rem; align-items: flex-start; }
      .purchase-btn { width: 100%; justify-content: center; }
      .hero-content h1 { font-size: 2.2rem; }
      .hero-content .sub-title { font-size: 1rem; }
      .hero-content .meta { font-size: 0.72rem; gap: 0.8rem; }
      .hero-slider-controls { bottom: 20px; }
      .hero-slider-dot { width: 20px; }
      .hero-slider-dot.active { width: 38px; }
      .modal-box { padding: 1.5rem; }
      .modal-box h2 { font-size: 1.2rem; }
      .modal-box .modal-icon { font-size: 2.5rem; }
    }

    /* ===== بخش استیم‌مانند صفحه‌ی بازی (.sx) ===== */
    .sx{margin:2.5rem 0}
    .sx img{-webkit-user-drag:none;user-select:none}
    .sx-top{display:grid;grid-template-columns:1fr 300px;gap:1.5rem;align-items:start}
    .sx-stage{position:relative;aspect-ratio:16/9;background:#0a0a0a;border:1px solid #1a1a1a;border-radius:8px;overflow:hidden;cursor:zoom-in;display:flex;align-items:center;justify-content:center}
    .sx-stage img{width:100%;height:100%;object-fit:cover}
    .sx-vid{display:flex;flex-direction:column;align-items:center;gap:.6rem;color:#444;cursor:default}
    .sx-vid i{font-size:4rem}.sx-vid span{font-size:.8rem;color:#666}
    .sx-nav{position:absolute;top:50%;transform:translateY(-50%);width:36px;height:36px;border-radius:50%;border:1px solid #333;background:rgba(10,10,10,.8);color:#ccc;cursor:pointer;transition:.2s}
    .sx-nav:hover{background:#fff;color:#0a0a0a}.sx-nav.p{right:10px}.sx-nav.n{left:10px}
    .sx-thumbs{display:flex;gap:.6rem;margin-top:.7rem;overflow-x:auto;padding-bottom:4px}
    .sx-th{flex:0 0 110px;aspect-ratio:16/9;border:1px solid #1a1a1a;border-radius:4px;overflow:hidden;background:#0d0d0d;display:flex;align-items:center;justify-content:center;color:#444;cursor:pointer;opacity:.5;transition:.25s}
    .sx-th img{width:100%;height:100%;object-fit:cover}
    .sx-th.on,.sx-th:hover{opacity:1;border-color:#888}
    .sx-side{background:#0d0d0d;border:1px solid #1a1a1a;border-radius:8px;padding:1rem}
    .sx-side>img{width:100%;aspect-ratio:16/9;object-fit:cover;border-radius:4px;border:1px solid #1a1a1a}
    .sx-short{color:#888;font-size:.82rem;font-weight:300;line-height:1.9;margin:.8rem 0}
    .sx-row{display:flex;justify-content:space-between;gap:.6rem;font-size:.75rem;padding:.45rem 0;border-top:1px solid #151515}
    .sx-row b{color:#666;font-weight:400}.sx-row span{color:#ccc;text-align:left}
    .sx-tags{display:flex;flex-wrap:wrap;gap:.4rem;margin:.9rem 0}
    .sx-tags span{font-size:.7rem;color:#999;background:#161616;border-radius:3px;padding:.15rem .6rem;transition:.2s}
    .sx-tags span:hover{background:#fff;color:#0a0a0a}
    .sx-btns{display:flex;gap:.5rem}
    .sx-btn{flex:1;font:inherit;font-size:.75rem;padding:.55rem .4rem;background:transparent;color:#aaa;border:1px solid #222;border-radius:4px;cursor:pointer;transition:.2s}
    .sx-btn:hover{border-color:#666;color:#fff}.sx-btn.on{background:#fff;color:#0a0a0a;border-color:#fff}
    .sx-sec{margin:2rem 0;padding:1.6rem;border:1px solid #161616;border-radius:10px;background:rgba(255,255,255,.015)}
    .sx-sec h3{font-size:1.05rem;font-weight:700;color:#ddd;margin-bottom:1.1rem}
