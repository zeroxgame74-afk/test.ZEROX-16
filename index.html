<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>دستیار هوش مصنوعی</title>

    <!-- فونت وزیر -->
    <link href="https://cdn.jsdelivr.net/gh/rastikerdar/vazirmatn@v33.003/Vazirmatn-font-face.css" rel="stylesheet" />
    <!-- Font Awesome 6 -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css" />

    <style>
        /* ===== ریست و پس‌زمینه ===== */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html,
        body {
            width: 100%;
            height: 100%;
            overflow: hidden;
        }

        body {
            font-family: 'Vazirmatn', sans-serif;
            background: radial-gradient(ellipse at center, #0a0a2a, #050510);
            display: flex;
            justify-content: center;
            align-items: center;
        }

        /* ===== کارت اصلی ===== */
        .chat-container {
            width: 90%;
            max-width: 800px;
            height: 90vh;
            max-height: 700px;
            background: rgba(10, 10, 30, 0.8);
            backdrop-filter: blur(30px);
            border-radius: 30px;
            border: 1px solid rgba(0, 212, 255, 0.08);
            box-shadow: 0 30px 80px rgba(0, 0, 0, 0.7);
            display: flex;
            flex-direction: column;
            overflow: hidden;
            animation: fadeInUp 0.8s ease forwards;
            opacity: 0;
        }

        @keyframes fadeInUp {
            0% {
                opacity: 0;
                transform: translateY(30px) scale(0.95);
            }
            100% {
                opacity: 1;
                transform: translateY(0) scale(1);
            }
        }

        /* ===== هدر ===== */
        .chat-header {
            padding: 20px 25px;
            border-bottom: 1px solid rgba(255, 255, 255, 0.04);
            display: flex;
            align-items: center;
            justify-content: space-between;
            flex-shrink: 0;
        }

        .chat-header .brand {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .chat-header .brand i {
            font-size: 28px;
            color: #00d4ff;
            animation: pulseIcon 2s ease-in-out infinite;
        }

        .chat-header .brand h1 {
            font-size: 20px;
            color: #fff;
            font-weight: 700;
        }

        .chat-header .brand h1 span {
            background: linear-gradient(90deg, #00d4ff, #a855f7);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .status {
            display: flex;
            align-items: center;
            gap: 8px;
            color: rgba(255, 255, 255, 0.4);
            font-size: 13px;
        }

        .status .dot {
            width: 8px;
            height: 8px;
            border-radius: 50%;
            background: #22c55e;
            animation: blinkDot 1.5s ease-in-out infinite;
        }

        @keyframes blinkDot {
            0%,
            100% {
                opacity: 1;
            }
            50% {
                opacity: 0.2;
            }
        }

        @keyframes pulseIcon {
            0%,
            100% {
                transform: scale(1);
            }
            50% {
                transform: scale(1.2);
            }
        }

        /* ===== بخش پیام‌ها ===== */
        .chat-messages {
            flex: 1;
            padding: 20px 25px;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 12px;
            scroll-behavior: smooth;
        }

        .chat-messages::-webkit-scrollbar {
            width: 4px;
        }
        .chat-messages::-webkit-scrollbar-track {
            background: transparent;
        }
        .chat-messages::-webkit-scrollbar-thumb {
            background: rgba(0, 212, 255, 0.2);
            border-radius: 10px;
        }

        /* ===== پیام‌ها ===== */
        .message {
            max-width: 80%;
            padding: 12px 18px;
            border-radius: 18px;
            font-size: 15px;
            line-height: 1.7;
            animation: msgSlide 0.3s ease forwards;
            opacity: 0;
            word-wrap: break-word;
        }

        @keyframes msgSlide {
            0% {
                opacity: 0;
                transform: translateY(10px) scale(0.95);
            }
            100% {
                opacity: 1;
                transform: translateY(0) scale(1);
            }
        }

        .message.user {
            align-self: flex-end;
            background: linear-gradient(135deg, #00d4ff, #7c3aed);
            color: #fff;
            border-bottom-right-radius: 4px;
        }

        .message.ai {
            align-self: flex-start;
            background: rgba(255, 255, 255, 0.05);
            color: rgba(255, 255, 255, 0.85);
            border-bottom-left-radius: 4px;
            border: 1px solid rgba(255, 255, 255, 0.03);
        }

        .message.ai .loading-dots {
            display: inline-flex;
            gap: 4px;
        }

        .message.ai .loading-dots span {
            width: 6px;
            height: 6px;
            background: rgba(255, 255, 255, 0.3);
            border-radius: 50%;
            animation: dotBounce 1.4s ease-in-out infinite;
        }

        .message.ai .loading-dots span:nth-child(2) {
            animation-delay: 0.2s;
        }
        .message.ai .loading-dots span:nth-child(3) {
            animation-delay: 0.4s;
        }

        @keyframes dotBounce {
            0%,
            80%,
            100% {
                transform: scale(0.6);
                opacity: 0.3;
            }
            40% {
                transform: scale(1);
                opacity: 1;
            }
        }

        /* ===== بخش ورودی ===== */
        .chat-input {
            padding: 16px 25px 20px;
            border-top: 1px solid rgba(255, 255, 255, 0.04);
            display: flex;
            gap: 12px;
            flex-shrink: 0;
        }

        .chat-input input {
            flex: 1;
            padding: 14px 20px;
            border-radius: 60px;
            border: 1px solid rgba(255, 255, 255, 0.06);
            background: rgba(255, 255, 255, 0.03);
            color: #fff;
            font-family: 'Vazirmatn', sans-serif;
            font-size: 15px;
            outline: none;
            transition: 0.3s;
        }

        .chat-input input::placeholder {
            color: rgba(255, 255, 255, 0.25);
        }

        .chat-input input:focus {
            border-color: rgba(0, 212, 255, 0.2);
            background: rgba(255, 255, 255, 0.05);
        }

        .chat-input input:disabled {
            opacity: 0.4;
        }

        .chat-input button {
            padding: 14px 28px;
            border-radius: 60px;
            border: none;
            background: linear-gradient(135deg, #00d4ff, #7c3aed);
            color: #fff;
            font-weight: 700;
            font-size: 15px;
            cursor: pointer;
            transition: 0.3s ease;
            display: flex;
            align-items: center;
            gap: 8px;
            flex-shrink: 0;
            font-family: 'Vazirmatn', sans-serif;
        }

        .chat-input button:hover:not(:disabled) {
            transform: scale(1.04);
            box-shadow: 0 0 40px rgba(0, 212, 255, 0.2);
        }

        .chat-input button:disabled {
            opacity: 0.4;
            cursor: not-allowed;
        }

        /* ===== تنظیمات API Key ===== */
        .settings-bar {
            padding: 12px 25px;
            border-bottom: 1px solid rgba(255, 255, 255, 0.03);
            display: flex;
            gap: 12px;
            align-items: center;
            flex-shrink: 0;
            flex-wrap: wrap;
        }

        .settings-bar label {
            color: rgba(255, 255, 255, 0.4);
            font-size: 13px;
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .settings-bar input[type="password"] {
            flex: 1;
            min-width: 200px;
            padding: 8px 16px;
            border-radius: 30px;
            border: 1px solid rgba(255, 255, 255, 0.06);
            background: rgba(255, 255, 255, 0.03);
            color: #fff;
            font-size: 13px;
            font-family: 'Vazirmatn', sans-serif;
            outline: none;
        }

        .settings-bar input[type="password"]:focus {
            border-color: rgba(0, 212, 255, 0.15);
        }

        .settings-bar .save-key-btn {
            padding: 8px 18px;
            border-radius: 30px;
            border: none;
            background: rgba(0, 212, 255, 0.1);
            color: #00d4ff;
            font-size: 13px;
            cursor: pointer;
            transition: 0.3s;
            font-family: 'Vazirmatn', sans-serif;
        }

        .settings-bar .save-key-btn:hover {
            background: rgba(0, 212, 255, 0.2);
        }

        /* ===== ریسپانسیو ===== */
        @media (max-width: 600px) {
            .chat-container {
                width: 100%;
                height: 100vh;
                max-height: none;
                border-radius: 0;
            }
            .chat-header {
                padding: 14px 16px;
            }
            .chat-messages {
                padding: 14px 16px;
            }
            .chat-input {
                padding: 12px 16px 16px;
                flex-wrap: wrap;
            }
            .chat-input input {
                font-size: 14px;
                padding: 12px 16px;
            }
            .chat-input button {
                padding: 12px 20px;
                font-size: 14px;
                width: 100%;
                justify-content: center;
            }
            .settings-bar {
                padding: 10px 16px;
                flex-direction: column;
                align-items: stretch;
            }
            .settings-bar input[type="password"] {
                min-width: unset;
            }
            .message {
                max-width: 90%;
                font-size: 14px;
                padding: 10px 14px;
            }
        }
    </style>
</head>
<body>

    <div class="chat-container">

        <!-- ===== هدر ===== -->
        <div class="chat-header">
            <div class="brand">
                <i class="fa-solid fa-brain"></i>
                <h1><span>AI</span> دستیار</h1>
            </div>
            <div class="status">
                <span class="dot"></span>
                آنلاین
            </div>
        </div>

        <!-- ===== نوار تنظیمات API Key ===== -->
        <div class="settings-bar">
            <label>
                <i class="fa-solid fa-key"></i> کلید API:
            </label>
            <input type="password" id="apiKeyInput" placeholder="کلید Gemini خود را وارد کن..." />
            <button class="save-key-btn" id="saveKeyBtn">
                <i class="fa-regular fa-floppy-disk"></i> ذخیره
            </button>
        </div>

        <!-- ===== بخش پیام‌ها ===== -->
        <div class="chat-messages" id="chatMessages">
            <div class="message ai">
                <i class="fa-regular fa-hand-peace" style="margin-left:8px;"></i>
                سلام! من دستیار هوش مصنوعی هستم. سوالی داری؟
            </div>
        </div>

        <!-- ===== بخش ورودی ===== -->
        <div class="chat-input">
            <input type="text" id="userInput" placeholder="پیام خود را بنویس..." />
            <button id="sendBtn">
                <i class="fa-regular fa-paper-plane"></i> ارسال
            </button>
        </div>

    </div>

    <script>
        // ============================================================
        //  بخش جاوااسکریپت - اتصال به Gemini API
        // ============================================================

        const chatMessages = document.getElementById('chatMessages');
        const userInput = document.getElementById('userInput');
        const sendBtn = document.getElementById('sendBtn');
        const apiKeyInput = document.getElementById('apiKeyInput');
        const saveKeyBtn = document.getElementById('saveKeyBtn');

        // بارگذاری کلید ذخیره شده از localStorage
        const savedKey = localStorage.getItem('gemini_api_key');
        if (savedKey) {
            apiKeyInput.value = savedKey;
        }

        // ذخیره کلید در localStorage
        saveKeyBtn.addEventListener('click', function() {
            const key = apiKeyInput.value.trim();
            if (key) {
                localStorage.setItem('gemini_api_key', key);
                showMessage('ai', '✅ کلید API با موفقیت ذخیره شد!');
                apiKeyInput.value = '';
            } else {
                showMessage('ai', '⚠️ لطفاً کلید معتبر وارد کن.');
            }
        });

        // ارسال پیام با دکمه یا Enter
        sendBtn.addEventListener('click', sendMessage);
        userInput.addEventListener('keydown', function(e) {
            if (e.key === 'Enter') {
                sendMessage();
            }
        });

        // تابع نمایش پیام
        function showMessage(type, content) {
            const div = document.createElement('div');
            div.className = `message ${type}`;

            if (type === 'ai' && content === '...') {
                // حالت لودینگ
                div.innerHTML = `
                    <div class="loading-dots">
                        <span></span><span></span><span></span>
                    </div>
                `;
            } else {
                div.textContent = content;
            }

            chatMessages.appendChild(div);
            chatMessages.scrollTop = chatMessages.scrollHeight;
            return div;
        }

        // تابع اصلی ارسال پیام
        async function sendMessage() {
            const text = userInput.value.trim();
            if (!text) return;

            // گرفتن API Key
            const apiKey = localStorage.getItem('gemini_api_key');
            if (!apiKey) {
                showMessage('ai', '⚠️ لطفاً ابتدا کلید API خود را در نوار بالا وارد و ذخیره کن.');
                return;
            }

            // نمایش پیام کاربر
            showMessage('user', text);
            userInput.value = '';
            userInput.disabled = true;
            sendBtn.disabled = true;

            // نمایش لودینگ
            const loadingMsg = showMessage('ai', '...');

            try {
                // ============================================================
                //  درخواست به Gemini API (با فرمت OpenAI)
                // ============================================================
                const response = await fetch('https://generativelanguage.googleapis.com/v1beta/openai/chat/completions', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                        'Authorization': `Bearer ${apiKey}`
                    },
                    body: JSON.stringify({
                        model: 'gemini-2.0-flash',
                        messages: [
                            { role: 'user', content: text }
                        ],
                        temperature: 0.7,
                        max_tokens: 500
                    })
                });

                // حذف لودینگ
                loadingMsg.remove();

                if (!response.ok) {
                    const errorData = await response.json().catch(() => ({}));
                    console.error('خطای API:', errorData);
                    showMessage('ai', '❌ خطا در ارتباط با AI. لطفاً کلید API را بررسی کن.');
                    return;
                }

                const data = await response.json();
                const reply = data.choices?.[0]?.message?.content;

                if (reply) {
                    showMessage('ai', reply);
                } else {
                    showMessage('ai', '⚠️ پاسخی دریافت نشد. دوباره تلاش کن.');
                }

            } catch (error) {
                loadingMsg.remove();
                console.error('خطا:', error);
                showMessage('ai', '❌ خطا در اتصال به سرور. اینترنت خود را بررسی کن.');
            } finally {
                userInput.disabled = false;
                sendBtn.disabled = false;
                userInput.focus();
            }
        }

        // ارسال پیام خوش‌آمدگویی با Enter
        userInput.focus();
    </script>

</body>
</html>
