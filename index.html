<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=yes">
    <title>Zerox | پلتفرم ویدیو</title>
    <link href="https://cdn.jsdelivr.net/gh/rastikerdar/vazirmatn@v33.003/Vazirmatn-font-face.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html, body {
            font-family: 'Vazirmatn', sans-serif;
            background: #0f0f0f;
            color: #fff;
            direction: rtl;
            overflow-x: hidden;
            width: 100%;
            max-width: 100%;
        }

        /* ===== اسکرول بار ===== */
        ::-webkit-scrollbar {
            width: 5px;
            height: 5px;
        }
        ::-webkit-scrollbar-track {
            background: #1a1a1a;
        }
        ::-webkit-scrollbar-thumb {
            background: linear-gradient(180deg, #ff0033, #ff6600);
            border-radius: 10px;
        }

        /* ===== هدر ===== */
        .header {
            background: linear-gradient(135deg, #0a0a0a, #1a0a0a);
            padding: 8px 14px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            border-bottom: 2px solid;
            border-image: linear-gradient(90deg, #ff0033, #ff6600, #ffcc00) 1;
            position: sticky;
            top: 0;
            z-index: 1000;
            flex-wrap: wrap;
            gap: 8px;
            min-height: 54px;
        }

        .header-left {
            display: flex;
            align-items: center;
            gap: 10px;
            flex-shrink: 0;
        }

        .menu-toggle {
            font-size: 20px;
            color: #aaa;
            cursor: pointer;
            transition: 0.3s;
            padding: 4px;
        }

        .menu-toggle:hover {
            color: #ff6600;
        }

        .logo {
            font-size: 22px;
            font-weight: 900;
            background: linear-gradient(135deg, #ff0033, #ff6600, #ffcc00);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            display: flex;
            align-items: center;
            gap: 4px;
            cursor: pointer;
            user-select: none;
            white-space: nowrap;
        }

        .logo i {
            background: linear-gradient(135deg, #ff0033, #ff6600);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            font-size: 26px;
        }

        .search-box {
            display: flex;
            align-items: center;
            background: rgba(255, 255, 255, 0.06);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 40px;
            padding: 2px 14px;
            flex: 1;
            max-width: 480px;
            min-width: 100px;
            transition: 0.3s;
            height: 38px;
        }

        .search-box:focus-within {
            border-color: #ff6600;
            box-shadow: 0 0 25px rgba(255, 102, 0, 0.12);
            background: rgba(255, 255, 255, 0.08);
        }

        .search-box input {
            flex: 1;
            border: none;
            background: transparent;
            padding: 6px 0;
            font-family: 'Vazirmatn', sans-serif;
            font-size: 14px;
            outline: none;
            color: #fff;
            min-width: 40px;
        }

        .search-box input::placeholder {
            color: #666;
            font-size: 13px;
        }

        .search-box i {
            color: #666;
            font-size: 16px;
            cursor: pointer;
            padding: 4px;
            transition: 0.3s;
            flex-shrink: 0;
        }

        .search-box i:hover {
            color: #ff6600;
        }

        .header-icons {
            display: flex;
            align-items: center;
            gap: 12px;
            font-size: 18px;
            color: #ccc;
            flex-shrink: 0;
        }

        .header-icons i {
            cursor: pointer;
            transition: 0.3s;
            position: relative;
        }

        .header-icons i:hover {
            color: #ff6600;
        }

        .badge {
            position: absolute;
            top: -6px;
            right: -6px;
            background: linear-gradient(135deg, #ff0033, #ff6600);
            color: #fff;
            font-size: 9px;
            padding: 1px 5px;
            border-radius: 50%;
            font-weight: 700;
        }

        .avatar {
            width: 32px;
            height: 32px;
            border-radius: 50%;
            background: linear-gradient(135deg, #ff0033, #ff6600);
            color: #fff;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: 700;
            font-size: 13px;
            cursor: pointer;
            transition: 0.3s;
            flex-shrink: 0;
        }

        .avatar:hover {
            transform: scale(1.05);
        }

        /* ===== بدنه ===== */
        .container {
            display: flex;
            min-height: calc(100vh - 54px);
            width: 100%;
            max-width: 100%;
        }

        /* ===== سایدبار ===== */
        .sidebar {
            width: 220px;
            background: linear-gradient(180deg, #0f0f0f, #1a0a0a);
            padding: 10px 4px;
            height: calc(100vh - 54px);
            position: sticky;
            top: 54px;
            overflow-y: auto;
            border-left: 1px solid rgba(255, 255, 255, 0.05);
            flex-shrink: 0;
            transition: 0.3s;
        }

        .sidebar.closed {
            width: 0;
            padding: 0;
            overflow: hidden;
            border: none;
        }

        .sidebar-item {
            display: flex;
            align-items: center;
            gap: 12px;
            padding: 8px 14px;
            border-radius: 8px;
            cursor: pointer;
            color: #aaa;
            font-size: 13px;
            transition: 0.3s;
            margin-bottom: 1px;
        }

        .sidebar-item:hover {
            background: rgba(255, 255, 255, 0.06);
            color: #fff;
        }

        .sidebar-item.active {
            background: linear-gradient(135deg, rgba(255, 0, 51, 0.12), rgba(255, 102, 0, 0.12));
            color: #ff6600;
            border-right: 2px solid #ff6600;
        }

        .sidebar-item i {
            width: 18px;
            font-size: 16px;
            flex-shrink: 0;
        }

        .sidebar-divider {
            height: 1px;
            background: linear-gradient(90deg, transparent, rgba(255, 102, 0, 0.2), transparent);
            margin: 8px 14px;
        }

        .sidebar-label {
            color: #555;
            font-size: 12px;
            padding: 4px 14px;
            font-weight: 700;
        }

        /* ===== محتوای اصلی ===== */
        .main-content {
            flex: 1;
            padding: 12px 14px;
            background: radial-gradient(ellipse at 50% 0%, #1a0a0a, #0f0f0f);
            min-width: 0;
            width: 100%;
        }

        /* ===== چیپس‌ها ===== */
        .chips {
            display: flex;
            gap: 8px;
            overflow-x: auto;
            padding-bottom: 12px;
            margin-bottom: 16px;
            scrollbar-width: none;
            -webkit-overflow-scrolling: touch;
        }

        .chips::-webkit-scrollbar {
            display: none;
        }

        .chip {
            padding: 6px 16px;
            border-radius: 30px;
            background: rgba(255, 255, 255, 0.06);
            color: #ccc;
            font-size: 13px;
            white-space: nowrap;
            cursor: pointer;
            transition: 0.3s;
            border: 1px solid rgba(255, 255, 255, 0.06);
            font-family: 'Vazirmatn', sans-serif;
            user-select: none;
            flex-shrink: 0;
        }

        .chip:hover {
            background: rgba(255, 255, 255, 0.1);
            color: #fff;
        }

        .chip.active {
            background: linear-gradient(135deg, #ff0033, #ff6600);
            color: #fff;
            border-color: transparent;
            font-weight: 700;
        }

        /* ===== گرید ویدیوها ===== */
        .video-grid {
            display: grid;
            gap: 16px;
            width: 100%;
        }

        /* ===== کارت ویدیو ===== */
        .video-card {
            background: rgba(255, 255, 255, 0.03);
            border-radius: 10px;
            overflow: hidden;
            cursor: pointer;
            transition: 0.3s;
            border: 1px solid rgba(255, 255, 255, 0.04);
            width: 100%;
        }

        .video-card:hover {
            transform: translateY(-3px);
            border-color: rgba(255, 102, 0, 0.2);
            box-shadow: 0 8px 30px rgba(255, 0, 51, 0.1);
            background: rgba(255, 255, 255, 0.05);
        }

        .video-thumb {
            position: relative;
            aspect-ratio: 16/9;
            overflow: hidden;
            background: #000;
            width: 100%;
        }

        .video-thumb video {
            width: 100%;
            height: 100%;
            object-fit: cover;
            display: block;
        }

        .video-thumb::after {
            content: '';
            position: absolute;
            bottom: 0;
            left: 0;
            right: 0;
            height: 30%;
            background: linear-gradient(to top, rgba(0,0,0,0.5), transparent);
            pointer-events: none;
        }

        .video-duration {
            position: absolute;
            bottom: 6px;
            right: 6px;
            background: rgba(0,0,0,0.85);
            padding: 1px 7px;
            border-radius: 3px;
            font-size: 11px;
            font-weight: 700;
            color: #fff;
            z-index: 2;
        }

        .video-info {
            padding: 10px 12px;
        }

        .video-title {
            font-size: 14px;
            font-weight: 700;
            line-height: 1.4;
            display: -webkit-box;
            -webkit-line-clamp: 2;
            -webkit-box-orient: vertical;
            overflow: hidden;
            color: #fff;
        }

        .video-channel {
            display: flex;
            align-items: center;
            gap: 6px;
            margin-top: 6px;
            color: #aaa;
            font-size: 12px;
        }

        .video-channel .ch-avatar {
            width: 22px;
            height: 22px;
            border-radius: 50%;
            background: linear-gradient(135deg, #ff0033, #ff6600);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 10px;
            font-weight: 700;
            color: #fff;
            flex-shrink: 0;
        }

        .video-meta {
            color: #666;
            font-size: 11px;
            margin-top: 3px;
            display: flex;
            align-items: center;
            gap: 4px;
        }

        .video-meta i {
            font-size: 2px;
            color: #444;
        }

        /* ===== مودال ===== */
        .modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: rgba(0,0,0,0.95);
            z-index: 2000;
            padding: 16px 10px;
            align-items: center;
            justify-content: center;
            backdrop-filter: blur(10px);
        }

        .modal.active {
            display: flex;
        }

        .modal-content {
            background: linear-gradient(135deg, #1a1a1a, #0f0f0f);
            border-radius: 12px;
            max-width: 860px;
            width: 100%;
            max-height: 94vh;
            overflow-y: auto;
            position: relative;
            animation: modalIn 0.3s ease;
            border: 1px solid rgba(255,255,255,0.05);
        }

        @keyframes modalIn {
            from {
                transform: scale(0.95) translateY(15px);
                opacity: 0;
            }
            to {
                transform: scale(1) translateY(0);
                opacity: 1;
            }
        }

        .modal-close {
            position: absolute;
            top: 10px;
            left: 10px;
            font-size: 20px;
            color: #fff;
            cursor: pointer;
            background: rgba(0,0,0,0.7);
            width: 36px;
            height: 36px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: 0.3s;
            z-index: 10;
            border: 1px solid rgba(255,255,255,0.08);
        }

        .modal-close:hover {
            background: linear-gradient(135deg, #ff0033, #ff6600);
            transform: rotate(90deg);
        }

        .modal-video {
            width: 100%;
            aspect-ratio: 16/9;
            background: #000;
        }

        .modal-video video {
            width: 100%;
            height: 100%;
            display: block;
        }

        .modal-info {
            padding: 16px 18px;
        }

        .modal-title {
            font-size: 18px;
            font-weight: 700;
            color: #fff;
        }

        .modal-channel {
            display: flex;
            align-items: center;
            gap: 10px;
            margin-top: 10px;
            flex-wrap: wrap;
        }

        .modal-channel .ch-avatar {
            width: 36px;
            height: 36px;
            border-radius: 50%;
            background: linear-gradient(135deg, #ff0033, #ff6600);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 14px;
            font-weight: 700;
            color: #fff;
            flex-shrink: 0;
        }

        .modal-channel .ch-name {
            font-weight: 700;
            color: #fff;
            font-size: 14px;
        }

        .modal-channel .ch-subs {
            color: #888;
            font-size: 12px;
        }

        .modal-actions {
            display: flex;
            gap: 8px;
            margin-top: 12px;
            flex-wrap: wrap;
        }

        .modal-btn {
            padding: 6px 14px;
            border-radius: 30px;
            border: 1px solid rgba(255,255,255,0.08);
            background: rgba(255,255,255,0.05);
            font-family: 'Vazirmatn', sans-serif;
            font-size: 13px;
            font-weight: 500;
            cursor: pointer;
            transition: 0.3s;
            display: flex;
            align-items: center;
            gap: 5px;
            color: #ccc;
            white-space: nowrap;
        }

        .modal-btn:hover {
            background: rgba(255,255,255,0.1);
            color: #fff;
        }

        .modal-btn.like {
            background: linear-gradient(135deg, #ff0033, #ff6600);
            color: #fff;
            border-color: transparent;
        }

        .modal-btn.like:hover {
            transform: scale(1.05);
            box-shadow: 0 4px 15px rgba(255, 0, 51, 0.3);
        }

        .modal-btn i {
            font-size: 14px;
        }

        /* ===== فوتر ===== */
        .footer {
            text-align: center;
            padding: 16px 12px;
            border-top: 1px solid rgba(255,255,255,0.05);
            margin-top: 16px;
            color: #555;
            font-size: 12px;
            background: rgba(0,0,0,0.2);
        }

        .footer i {
            background: linear-gradient(135deg, #ff0033, #ff6600);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        /* ===================================================== */
        /* ===== ریسپانسیو حرفه‌ای ===== */
        /* ===================================================== */

        /* دسکتاپ بزرگ (4 ستون) */
        @media (min-width: 1200px) {
            .video-grid {
                grid-template-columns: repeat(4, 1fr);
                gap: 18px;
            }
            .main-content {
                padding: 18px 28px;
            }
            .video-title {
                font-size: 15px;
            }
        }

        /* لپ‌تاپ (3 ستون) */
        @media (min-width: 992px) and (max-width: 1199px) {
            .video-grid {
                grid-template-columns: repeat(3, 1fr);
                gap: 16px;
            }
            .sidebar {
                width: 200px;
            }
            .main-content {
                padding: 14px 20px;
            }
            .video-title {
                font-size: 14px;
            }
        }

        /* تبلت (2 ستون) */
        @media (min-width: 601px) and (max-width: 991px) {
            .video-grid {
                grid-template-columns: repeat(2, 1fr);
                gap: 14px;
            }
            .sidebar {
                width: 70px;
                padding: 8px 4px;
            }
            .sidebar-item span {
                display: none;
            }
            .sidebar-item {
                justify-content: center;
                padding: 10px;
            }
            .sidebar-label {
                display: none;
            }
            .sidebar-divider {
                margin: 6px 8px;
            }
            .main-content {
                padding: 12px 16px;
            }
            .video-title {
                font-size: 14px;
            }
            .search-box {
                max-width: 300px;
            }
        }

        /* موبایل (1 ستون) */
        @media (max-width: 600px) {
            .video-grid {
                grid-template-columns: 1fr;
                gap: 12px;
            }
            .sidebar {
                display: none;
            }
            .main-content {
                padding: 8px 10px;
            }
            .video-title {
                font-size: 15px;
            }
            .video-channel {
                font-size: 13px;
            }
            .video-meta {
                font-size: 12px;
            }
            .video-info {
                padding: 10px 12px;
            }
            .video-channel .ch-avatar {
                width: 24px;
                height: 24px;
                font-size: 11px;
            }
            .video-duration {
                font-size: 12px;
                bottom: 8px;
                right: 8px;
                padding: 2px 8px;
            }
            .chip {
                font-size: 13px;
                padding: 6px 16px;
            }
            .header {
                padding: 6px 10px;
                min-height: 48px;
            }
            .logo {
                font-size: 18px;
            }
            .logo i {
                font-size: 22px;
            }
            .menu-toggle {
                font-size: 18px;
            }
            .search-box {
                order: 3;
                flex: 1 1 100%;
                max-width: 100%;
                min-width: unset;
                height: 36px;
                margin-top: 2px;
            }
            .search-box input {
                font-size: 14px;
                padding: 4px 0;
            }
            .search-box input::placeholder {
                font-size: 13px;
            }
            .header-icons {
                gap: 10px;
                font-size: 17px;
            }
            .avatar {
                width: 30px;
                height: 30px;
                font-size: 12px;
            }
            .badge {
                font-size: 8px;
                padding: 0px 4px;
                top: -5px;
                right: -5px;
            }
            .modal {
                padding: 10px 6px;
            }
            .modal-title {
                font-size: 17px;
            }
            .modal-info {
                padding: 12px 14px;
            }
            .modal-btn {
                font-size: 13px;
                padding: 6px 14px;
            }
            .modal-channel .ch-avatar {
                width: 36px;
                height: 36px;
                font-size: 14px;
            }
            .modal-channel .ch-name {
                font-size: 14px;
            }
            .video-card:hover {
                transform: none;
            }
        }

        /* موبایل خیلی کوچک (iPhone SE) */
        @media (max-width: 400px) {
            .video-grid {
                gap: 10px;
            }
            .video-title {
                font-size: 14px;
            }
            .video-channel {
                font-size: 12px;
            }
            .video-meta {
                font-size: 11px;
            }
            .video-info {
                padding: 8px 10px;
            }
            .video-channel .ch-avatar {
                width: 20px;
                height: 20px;
                font-size: 9px;
            }
            .video-duration {
                font-size: 10px;
                bottom: 5px;
                right: 5px;
                padding: 1px 6px;
            }
            .chip {
                font-size: 12px;
                padding: 5px 12px;
            }
            .logo {
                font-size: 16px;
            }
            .logo i {
                font-size: 18px;
            }
            .menu-toggle {
                font-size: 16px;
            }
            .search-box {
                height: 32px;
            }
            .search-box input {
                font-size: 13px;
            }
            .search-box input::placeholder {
                font-size: 12px;
            }
            .search-box i {
                font-size: 14px;
            }
            .header-icons {
                gap: 8px;
                font-size: 15px;
            }
            .avatar {
                width: 26px;
                height: 26px;
                font-size: 10px;
            }
            .modal-title {
                font-size: 15px;
            }
            .modal-btn {
                font-size: 12px;
                padding: 5px 12px;
            }
            .modal-info {
                padding: 10px 12px;
            }
            .modal-channel .ch-avatar {
                width: 32px;
                height: 32px;
                font-size: 12px;
            }
            .modal-channel .ch-name {
                font-size: 13px;
            }
            .main-content {
                padding: 6px 8px;
            }
        }
    </style>
</head>
<body>

    <!-- ===== هدر ===== -->
    <header class="header">
        <div class="header-left">
            <i class="fas fa-bars menu-toggle" onclick="toggleSidebar()"></i>
            <div class="logo" onclick="location.reload()">
                <i class="fab fa-youtube"></i> Zerox
            </div>
        </div>

        <div class="search-box">
            <i class="fas fa-search" onclick="searchVideos()"></i>
            <input type="text" id="searchInput" placeholder="جستجو..." onkeyup="if(event.key==='Enter') searchVideos()">
            <i class="fas fa-microphone" onclick="alert('🎤 حالت صوتی فعال شد!')"></i>
        </div>

        <div class="header-icons">
            <i class="fas fa-video" onclick="alert('📹 آپلود ویدیو جدید')"></i>
            <i class="fas fa-bell"><span class="badge">۳</span></i>
            <div class="avatar" onclick="alert('👤 پروفایل کاربر')">Z</div>
        </div>
    </header>

    <!-- ===== بدنه ===== -->
    <div class="container">

        <!-- ===== سایدبار ===== -->
        <nav class="sidebar" id="sidebar">
            <div class="sidebar-item active" onclick="filterVideos('همه')">
                <i class="fas fa-home"></i> <span>خانه</span>
            </div>
            <div class="sidebar-item" onclick="filterVideos('اکسپلور')">
                <i class="fas fa-compass"></i> <span>اکسپلور</span>
            </div>
            <div class="sidebar-item" onclick="filterVideos('داغ')">
                <i class="fas fa-fire"></i> <span>داغ‌ترین</span>
            </div>
            <div class="sidebar-item" onclick="filterVideos('تاریخچه')">
                <i class="fas fa-history"></i> <span>تاریخچه</span>
            </div>
            <div class="sidebar-divider"></div>
            <div class="sidebar-label">اشتراک‌ها</div>
            <div class="sidebar-item"><i class="fas fa-circle" style="color:#ff0033;"></i> <span>Zerox Academy</span></div>
            <div class="sidebar-item"><i class="fas fa-circle" style="color:#3ea6ff;"></i> <span>Game Zone</span></div>
            <div class="sidebar-item"><i class="fas fa-circle" style="color:#ffcc00;"></i> <span>Music Plus</span></div>
            <div class="sidebar-divider"></div>
            <div class="sidebar-label">کتابخانه</div>
            <div class="sidebar-item"><i class="fas fa-clock"></i> <span>بعداً تماشا</span></div>
            <div class="sidebar-item"><i class="fas fa-thumbs-up"></i> <span>لایک‌ها</span></div>
        </nav>

        <!-- ===== محتوای اصلی ===== -->
        <main class="main-content">

            <!-- ===== چیپس‌ها ===== -->
            <div class="chips" id="chipsContainer">
                <span class="chip active" onclick="filterVideos('همه')">همه</span>
                <span class="chip" onclick="filterVideos('آموزشی')">آموزشی</span>
                <span class="chip" onclick="filterVideos('گیمینگ')">گیمینگ</span>
                <span class="chip" onclick="filterVideos('موسیقی')">موسیقی</span>
                <span class="chip" onclick="filterVideos('ورزشی')">ورزشی</span>
                <span class="chip" onclick="filterVideos('برنامه‌نویسی')">برنامه‌نویسی</span>
                <span class="chip" onclick="filterVideos('تکنولوژی')">تکنولوژی</span>
                <span class="chip" onclick="filterVideos('فیلم')">فیلم</span>
            </div>

            <!-- ===== گرید ویدیوها ===== -->
            <div class="video-grid" id="videoGrid"></div>
        </main>
    </div>

    <!-- ===== مودال ===== -->
    <div class="modal" id="videoModal">
        <div class="modal-content">
            <button class="modal-close" onclick="closeModal()">✕</button>
            <div class="modal-video">
                <video id="modalVideo" controls autoplay></video>
            </div>
            <div class="modal-info">
                <div class="modal-title" id="modalTitle">عنوان ویدیو</div>
                <div class="modal-channel">
                    <div class="ch-avatar" id="modalChannelAvatar">Z</div>
                    <div>
                        <div class="ch-name" id="modalChannelName">Zerox Academy</div>
                        <div class="ch-subs" id="modalSubs">۱.۲ میلیون دنبال‌کننده</div>
                    </div>
                    <button class="modal-btn" style="background:linear-gradient(135deg,#ff0033,#ff6600);color:#fff;border-color:transparent;" onclick="alert('✅ دنبال کردید!')">
                        <i class="fas fa-bell"></i> دنبال‌کن
                    </button>
                </div>
                <div class="modal-actions">
                    <button class="modal-btn like" onclick="likeVideo()">
                        <i class="fas fa-thumbs-up"></i> <span id="likeCount">۱۲۳۴</span>
                    </button>
                    <button class="modal-btn" onclick="alert('👎 دیسلایک کردید')">
                        <i class="fas fa-thumbs-down"></i> دیسلایک
                    </button>
                    <button class="modal-btn" onclick="alert('🔗 لینک کپی شد!')">
                        <i class="fas fa-share"></i> اشتراک
                    </button>
                    <button class="modal-btn" onclick="alert('💾 ذخیره شد')">
                        <i class="fas fa-save"></i> ذخیره
                    </button>
                </div>
            </div>
        </div>
    </div>

    <!-- ===== فوتر ===== -->
    <footer class="footer">
        <i class="fab fa-youtube"></i> Zerox &bull; ۲۰۲۶ &bull;
        <i class="fas fa-heart"></i> ساخته شده با عشق
    </footer>

    <script>
        // ===== دیتابیس ویدیوها =====
        const videos = [
            { id: 1, title: 'آموزش کامل React.js از صفر تا صد - پروژه محور', channel: 'Zerox Academy', avatar: 'Z', category: 'برنامه‌نویسی', views: '۲.۱ میلیون', date: '۳ روز پیش', duration: '۱۲:۳۴', src: 'https://www.w3schools.com/html/mov_bbb.mp4', likes: 1234 },
            { id: 2, title: 'بهترین بازی‌های ۲۰۲۶ - بررسی کامل و نقد', channel: 'Game Zone', avatar: 'G', category: 'گیمینگ', views: '۸۹۰ هزار', date: '۵ روز پیش', duration: '۰۸:۲۱', src: 'https://www.w3schools.com/html/mov_bbb.mp4', likes: 567 },
            { id: 3, title: 'آهنگ جدید با کیفیت ۴K - آرامش‌بخش و زیبا', channel: 'Music Plus', avatar: 'M', category: 'موسیقی', views: '۵۶۰ هزار', date: '۱ هفته پیش', duration: '۰۴:۵۶', src: 'https://www.w3schools.com/html/mov_bbb.mp4', likes: 890 },
            { id: 4, title: 'بررسی آیفون ۱۷ پرو - هر آنچه باید بدانید', channel: 'Tech World', avatar: 'T', category: 'تکنولوژی', views: '۳.۴ میلیون', date: '۲ روز پیش', duration: '۱۵:۴۰', src: 'https://www.w3schools.com/html/mov_bbb.mp4', likes: 2100 },
            { id: 5, title: 'طراحی سایت با CSS مدرن - پروژه عملی کامل', channel: 'Zerox Academy', avatar: 'Z', category: 'آموزشی', views: '۱.۷ میلیون', date: '۴ روز پیش', duration: '۲۲:۱۰', src: 'https://www.w3schools.com/html/mov_bbb.mp4', likes: 1567 },
            { id: 6, title: 'مسابقات جهانی فوتبال - خلاصه بازی‌های برتر', channel: 'Sport World', avatar: 'S', category: 'ورزشی', views: '۴.۲ میلیون', date: '۱ روز پیش', duration: '۰۹:۱۵', src: 'https://www.w3schools.com/html/mov_bbb.mp4', likes: 3400 },
            { id: 7, title: 'آموزش هوش مصنوعی با پایتون - مقدماتی تا پیشرفته', channel: 'AI Lab', avatar: 'A', category: 'برنامه‌نویسی', views: '۹۷۰ هزار', date: '۶ روز پیش', duration: '۱۸:۴۵', src: 'https://www.w3schools.com/html/mov_bbb.mp4', likes: 743 },
            { id: 8, title: 'کد نویسی زنده - ساخت اپلیکیشن موبایل با React Native', channel: 'Zerox Live', avatar: 'Z', category: 'برنامه‌نویسی', views: '۶۵۰ هزار', date: '۸ ساعت پیش', duration: '۰۶:۳۰', src: 'https://www.w3schools.com/html/mov_bbb.mp4', likes: 432 },
            { id: 9, title: 'آموزش گیت و گیت‌هاب - پروژه محور و عملی', channel: 'Zerox Academy', avatar: 'Z', category: 'آموزشی', views: '۱.۱ میلیون', date: '۲ هفته پیش', duration: '۱۴:۲۰', src: 'https://www.w3schools.com/html/mov_bbb.mp4', likes: 987 },
            { id: 10, title: 'بهترین فیلم‌های ۲۰۲۶ - نقد و بررسی کامل', channel: 'Cine World', avatar: 'C', category: 'فیلم', views: '۲.۸ میلیون', date: '۳ روز پیش', duration: '۱۱:۵۰', src: 'https://www.w3schools.com/html/mov_bbb.mp4', likes: 2300 },
            { id: 11, title: 'آموزش طراحی UI/UX با Figma - از مبتدی تا حرفه‌ای', channel: 'Design Hub', avatar: 'D', category: 'آموزشی', views: '۴۵۰ هزار', date: '۴ روز پیش', duration: '۱۹:۳۰', src: 'https://www.w3schools.com/html/mov_bbb.mp4', likes: 345 },
            { id: 12, title: 'گیم‌پلی جدید Call of Duty - جنگ‌های مدرن ۳', channel: 'Game Zone', avatar: 'G', category: 'گیمینگ', views: '۱.۹ میلیون', date: '۶ ساعت پیش', duration: '۲۵:۱۰', src: 'https://www.w3schools.com/html/mov_bbb.mp4', likes: 1654 }
        ];

        let currentVideos = [...videos];

        const channelColors = {
            'Zerox Academy': '#ff0033',
            'Game Zone': '#3ea6ff',
            'Music Plus': '#ffcc00',
            'Tech World': '#00ccff',
            'Sport World': '#00ff88',
            'AI Lab': '#cc00ff',
            'Zerox Live': '#ff6600',
            'Cine World': '#ff00aa',
            'Design Hub': '#00cc66'
        };

        function getChannelColor(name) {
            return channelColors[name] || '#ff0033';
        }

        function renderVideos(list) {
            const grid = document.getElementById('videoGrid');
            if (list.length === 0) {
                grid.innerHTML = `
                    <div style="grid-column:1/-1;text-align:center;padding:60px 16px;color:#666;">
                        <i class="fas fa-search" style="font-size:40px;display:block;margin-bottom:12px;background:linear-gradient(135deg,#ff0033,#ff6600);-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;"></i>
                        <h3 style="color:#fff;font-size:18px;">نتیجه‌ای پیدا نشد</h3>
                        <p style="color:#888;font-size:14px;">ویدیویی با این دسته‌بندی وجود ندارد</p>
                    </div>
                `;
                return;
            }

            grid.innerHTML = list.map(v => `
                <div class="video-card" onclick="openModal(${v.id})">
                    <div class="video-thumb">
                        <video src="${v.src}" muted preload="metadata"></video>
                        <span class="video-duration">${v.duration}</span>
                    </div>
                    <div class="video-info">
                        <div class="video-title">${v.title}</div>
                        <div class="video-channel">
                            <div class="ch-avatar" style="background:${getChannelColor(v.channel)}">${v.avatar}</div>
                            ${v.channel}
                        </div>
                        <div class="video-meta">
                            ${v.views} بازدید <i class="fas fa-circle"></i> ${v.date}
                        </div>
                    </div>
                </div>
            `).join('');
        }

        function filterVideos(category) {
            document.querySelectorAll('.chip').forEach(c => c.classList.remove('active'));
            document.querySelectorAll('.chip').forEach(c => {
                if (c.textContent.trim() === category) c.classList.add('active');
            });

            document.querySelectorAll('.sidebar-item').forEach(i => i.classList.remove('active'));
            document.querySelectorAll('.sidebar-item').forEach(i => {
                if (i.textContent.trim().includes(category)) i.classList.add('active');
            });

            if (category === 'همه') {
                currentVideos = [...videos];
            } else {
                currentVideos = videos.filter(v => v.category === category);
            }
            renderVideos(currentVideos);
        }

        function searchVideos() {
            const q = document.getElementById('searchInput').value.trim().toLowerCase();
            if (!q) { renderVideos(currentVideos); return; }

            const results = currentVideos.filter(v =>
                v.title.toLowerCase().includes(q) ||
                v.channel.toLowerCase().includes(q) ||
                v.category.toLowerCase().includes(q)
            );
            renderVideos(results);
        }

        function openModal(id) {
            const v = videos.find(x => x.id === id);
            if (!v) return;

            const modal = document.getElementById('videoModal');
            const videoEl = document.getElementById('modalVideo');
            document.getElementById('modalTitle').textContent = v.title;
            document.getElementById('modalChannelName').textContent = v.channel;
            const avatar = document.getElementById('modalChannelAvatar');
            avatar.textContent = v.avatar;
            avatar.style.background = getChannelColor(v.channel);
            document.getElementById('likeCount').textContent = v.likes;

            videoEl.src = v.src;
            modal.classList.add('active');
            document.body.style.overflow = 'hidden';
            modal.dataset.videoId = id;
        }

        function closeModal() {
            const modal = document.getElementById('videoModal');
            const videoEl = document.getElementById('modalVideo');
            modal.classList.remove('active');
            videoEl.pause();
            videoEl.src = '';
            document.body.style.overflow = 'auto';
        }

        function likeVideo() {
            const span = document.getElementById('likeCount');
            let current = parseInt(span.textContent.replace(/,/g, ''));
            current++;
            span.textContent = current.toLocaleString();

            const btn = document.querySelector('.modal-btn.like');
            btn.style.background = '#0066cc';
            setTimeout(() => btn.style.background = 'linear-gradient(135deg,#ff0033,#ff6600)', 500);
        }

        function toggleSidebar() {
            document.getElementById('sidebar').classList.toggle('closed');
        }

        document.getElementById('videoModal').addEventListener('click', function(e) {
            if (e.target === this) closeModal();
        });

        document.addEventListener('keydown', function(e) {
            if (e.key === 'Escape') closeModal();
        });

        renderVideos(videos);
    </script>

</body>
