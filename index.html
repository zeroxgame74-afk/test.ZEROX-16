<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Mohamad Hossein | پیدا نشد</title>

    <!-- ===== فونت‌ها ===== -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Arabic:wght@300;400;500;600;700&family=Vazirmatn:wght@400;600;700;800;900&display=swap" rel="stylesheet" />

    <!-- ===== Font Awesome 6 ===== -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css" />

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background: #0b0b0e;
            color: #eaeef2;
            font-family: 'Noto Sans Arabic', 'Segoe UI', sans-serif;
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            padding: 2rem;
            background-image: radial-gradient(circle at 30% 20%, rgba(255, 200, 80, 0.03) 0%, transparent 60%);
        }

        .error-container {
            max-width: 700px;
            width: 100%;
            text-align: center;
        }

        .mini-logo {
            display: inline-block;
            width: 60px;
            height: 60px;
            line-height: 60px;
            background: linear-gradient(145deg, #f5b042, #d48f2b);
            border-radius: 18px;
            font-family: 'Vazirmatn', sans-serif;
            font-weight: 900;
            font-size: 2rem;
            color: #0b0b0e;
            box-shadow: 0 8px 18px -6px rgba(200, 150, 50, 0.25);
            margin-bottom: 2rem;
            transition: 0.3s;
            animation: floatLogo 4s ease-in-out infinite;
            text-decoration: none;
        }

        @keyframes floatLogo {
            0%,
            100% {
                transform: translateY(0px);
            }
            50% {
                transform: translateY(-6px);
            }
        }

        .mini-logo:hover {
            transform: scale(1.08) rotate(-4deg);
            box-shadow: 0 12px 28px -8px rgba(200, 150, 50, 0.4);
        }

        .dino {
            font-size: 8rem;
            display: inline-block;
            margin-bottom: 1rem;
            animation: dinoJump 2s ease-in-out infinite;
            filter: drop-shadow(0 12px 40px rgba(245, 176, 66, 0.15));
            cursor: pointer;
            user-select: none;
        }

        .dino.running {
            animation: dinoRun 0.4s steps(2) infinite;
        }

        .dino.jumping {
            animation: dinoJumpBig 0.6s ease-in-out;
        }

        @keyframes dinoJump {
            0%,
            100% {
                transform: translateY(0px) rotate(-2deg);
            }
            50% {
                transform: translateY(-18px) rotate(2deg);
            }
        }

        @keyframes dinoRun {
            0% {
                transform: translateX(0px) scaleX(1);
            }
            50% {
                transform: translateX(10px) scaleX(1.02);
            }
            100% {
                transform: translateX(0px) scaleX(1);
            }
        }

        @keyframes dinoJumpBig {
            0% {
                transform: translateY(0px) scale(1);
            }
            40% {
                transform: translateY(-60px) scale(1.08);
            }
            60% {
                transform: translateY(-60px) scale(1.08);
            }
            100% {
                transform: translateY(0px) scale(1);
            }
        }

        .error-code {
            font-family: 'Vazirmatn', sans-serif;
            font-weight: 900;
            font-size: 7rem;
            background: linear-gradient(135deg, #f5b042, #d48f2b);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            line-height: 1;
            margin-bottom: 0.5rem;
        }

        .error-title {
            font-family: 'Vazirmatn', sans-serif;
            font-weight: 800;
            font-size: 2rem;
            color: #f5efe6;
            margin-bottom: 1rem;
        }

        .error-title .highlight {
            color: #f5b042;
        }

        .error-desc {
            font-size: 1.1rem;
            color: #b0a99b;
            margin-bottom: 2rem;
            max-width: 450px;
            margin-left: auto;
            margin-right: auto;
        }

        .error-buttons {
            display: flex;
            flex-wrap: wrap;
            gap: 1rem;
            justify-content: center;
        }

        .error-buttons a {
            font-family: 'Vazirmatn', sans-serif;
            font-weight: 600;
            text-decoration: none;
            padding: 0.8rem 2rem;
            border-radius: 40px;
            transition: 0.3s;
            display: inline-flex;
            align-items: center;
            gap: 0.7rem;
            font-size: 1rem;
        }

        .btn-primary {
            background: linear-gradient(135deg, #f5b042, #d48f2b);
            color: #0b0b0e;
        }

        .btn-primary:hover {
            transform: scale(1.05) translateY(-3px);
            box-shadow: 0 12px 32px -8px rgba(245, 176, 66, 0.3);
        }

        .btn-secondary {
            background: rgba(255, 255, 255, 0.05);
            color: #f5efe6;
            border: 1px solid rgba(255, 215, 100, 0.15);
        }

        .btn-secondary:hover {
            background: rgba(255, 215, 100, 0.08);
            border-color: rgba(255, 215, 100, 0.25);
            transform: scale(1.05) translateY(-3px);
        }

        .btn-secondary i {
            color: #f5b042;
        }

        .fun-section {
            margin-top: 2rem;
            padding: 0.8rem 1.5rem;
            background: rgba(255, 215, 100, 0.03);
            border-radius: 20px;
            border: 1px solid rgba(255, 215, 100, 0.06);
            display: inline-block;
        }

        .fun-section p {
            font-size: 0.9rem;
            color: #8f887c;
            margin: 0;
        }

        .fun-section p i {
            color: #f5b042;
        }

        .fun-section kbd {
            background: rgba(255, 215, 100, 0.1);
            padding: 0.1rem 0.6rem;
            border-radius: 6px;
            color: #f5b042;
            font-size: 0.85rem;
        }

        .keyboard-hint {
            margin-top: 2rem;
            font-size: 0.8rem;
            color: #5a5550;
        }

        .keyboard-hint i {
            color: #f5b042;
        }

        .keyboard-hint kbd {
            background: rgba(255, 215, 100, 0.08);
            padding: 0.1rem 0.5rem;
            border-radius: 4px;
            color: #b0a99b;
            font-size: 0.7rem;
        }

        @media (max-width: 600px) {
            .error-code {
                font-size: 5rem;
            }
            .error-title {
                font-size: 1.5rem;
            }
            .dino {
                font-size: 6rem;
            }
            .error-buttons {
                flex-direction: column;
                align-items: center;
            }
            .error-buttons a {
                width: 100%;
                justify-content: center;
            }
        }
    </style>
</head>
<body>

    <div class="error-container">

        <a href="/" class="mini-logo">M</a>

        <div class="dino" id="dino">🦖</div>

        <div class="error-code">۴۰۴</div>

        <h1 class="error-title">
            <span class="highlight">Mohamad Hossein</span> | پیدا نشد!
        </h1>

        <p class="error-desc">
            ای وای! دایناسور کوچولو این صفحه رو خورده! 🦖<br>
            صفحه‌ای که دنبالش هستی وجود نداره.
        </p>

        <div class="error-buttons">
            <a href="javascript:history.back()" class="btn-secondary">
                <i class="fas fa-arrow-right"></i> بازگشت
            </a>
            <a href="/" class="btn-primary">
                <i class="fas fa-home"></i> خانه
            </a>
            <a href="javascript:location.reload()" class="btn-secondary">
                <i class="fas fa-sync"></i> تلاش مجدد
            </a>
        </div>

        <div class="fun-section">
            <p>
                <i class="fas fa-gamepad"></i>
                <kbd>Space</kbd> یا <kbd>↑</kbd> برای پرش دایناسور!
            </p>
        </div>

        <div class="keyboard-hint">
            <i class="fas fa-keyboard"></i>
            <kbd>←</kbd> <kbd>→</kbd> برای حرکت دایناسور
        </div>

    </div>

    <script>
        const dino = document.getElementById('dino');
        let isJumping = false;
        let isRunning = false;

        function jump() {
            if (isJumping) return;
            isJumping = true;
            dino.classList.remove('running');
            dino.classList.add('jumping');

            setTimeout(() => {
                dino.classList.remove('jumping');
                isJumping = false;
                if (isRunning) dino.classList.add('running');
            }, 600);
        }

        document.addEventListener('keydown', function(e) {
            if (e.key === ' ' || e.key === 'Space' || e.key === 'ArrowUp') {
                e.preventDefault();
                jump();
            }
            if (e.key === 'ArrowLeft') {
                e.preventDefault();
                isRunning = true;
                if (!isJumping) dino.classList.add('running');
                dino.style.transform = 'scaleX(-1)';
            }
            if (e.key === 'ArrowRight') {
                e.preventDefault();
                isRunning = true;
                if (!isJumping) dino.classList.add('running');
                dino.style.transform = 'scaleX(1)';
            }
        });

        document.addEventListener('keyup', function(e) {
            if (e.key === 'ArrowLeft' || e.key === 'ArrowRight') {
                isRunning = false;
                dino.classList.remove('running');
                dino.style.transform = 'scaleX(1)';
            }
        });

        dino.addEventListener('click', jump);

        // حرکت خودکار
        setTimeout(() => {
            if (!isJumping) {
                isRunning = true;
                dino.classList.add('running');
            }
        }, 2000);

        setInterval(() => {
            if (!isJumping && !isRunning) {
                isRunning = true;
                dino.classList.add('running');
                setTimeout(() => {
                    if (!isJumping) {
                        isRunning = false;
                        dino.classList.remove('running');
                    }
                }, 1500);
            }
        }, 5000);
    </script>

</body>
</html>
