<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>MH Assistant | دستیار هوشمند</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Arabic:wght@300;400;500;600;700&family=Vazirmatn:wght@400;600;700;800;900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">

  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    
    body {
      background: #0b0b0e;
      color: #eaeef2;
      font-family: 'Noto Sans Arabic', 'Segoe UI', sans-serif;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 1.5rem;
      background-image: 
        radial-gradient(circle at 20% 30%, rgba(255, 200, 80, 0.05) 0%, transparent 50%),
        radial-gradient(circle at 80% 70%, rgba(255, 200, 80, 0.03) 0%, transparent 50%);
    }

    .chat-container {
      width: 100%;
      max-width: 880px;
      background: rgba(255, 255, 255, 0.02);
      backdrop-filter: blur(16px);
      border: 1px solid rgba(255, 215, 100, 0.12);
      border-radius: 40px;
      padding: 2rem 2.2rem 2.2rem;
      box-shadow: 0 32px 96px -16px rgba(0, 0, 0, 0.8), inset 0 1px 0 rgba(255, 215, 100, 0.05);
      transition: 0.4s cubic-bezier(0.34, 1.56, 0.64, 1);
    }

    .chat-container:hover {
      border-color: rgba(255, 215, 100, 0.25);
      box-shadow: 0 40px 120px -16px rgba(245, 176, 66, 0.12), inset 0 1px 0 rgba(255, 215, 100, 0.08);
      transform: translateY(-3px);
    }

    .chat-header {
      display: flex;
      align-items: center;
      gap: 1rem;
      padding-bottom: 1.2rem;
      border-bottom: 1px solid rgba(255, 215, 100, 0.06);
      margin-bottom: 1.2rem;
    }

    .chat-avatar {
      width: 60px;
      height: 60px;
      background: linear-gradient(145deg, #f5b042, #d48f2b);
      border-radius: 20px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: 'Vazirmatn', sans-serif;
      font-weight: 900;
      font-size: 1.8rem;
      color: #0b0b0e;
      box-shadow: 0 8px 28px -6px rgba(200, 150, 50, 0.35);
      flex-shrink: 0;
      animation: floatLogo 3s ease-in-out infinite;
      position: relative;
    }

    .chat-avatar::after {
      content: '';
      position: absolute;
      inset: -3px;
      border-radius: 22px;
      background: linear-gradient(145deg, rgba(245, 176, 66, 0.3), transparent);
      z-index: -1;
      animation: glowRing 3s ease-in-out infinite;
    }

    @keyframes glowRing {
      0%, 100% { opacity: 0.5; transform: scale(1); }
      50% { opacity: 1; transform: scale(1.05); }
    }

    @keyframes floatLogo {
      0%, 100% { transform: translateY(0); }
      50% { transform: translateY(-8px); }
    }

    .chat-title {
      font-family: 'Vazirmatn', sans-serif;
      font-weight: 800;
      font-size: 1.6rem;
      color: #f5efe6;
      letter-spacing: -0.5px;
    }

    .chat-title .highlight {
      background: linear-gradient(145deg, #f5b042, #d48f2b);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
    }

    .chat-title small {
      display: block;
      font-family: 'Noto Sans Arabic', sans-serif;
      font-weight: 300;
      font-size: 0.75rem;
      color: #b0a99b;
      margin-top: 2px;
      letter-spacing: 0.5px;
      -webkit-text-fill-color: #b0a99b;
    }

    .chat-title small i {
      color: #f5b042;
      -webkit-text-fill-color: #f5b042;
      animation: pulseIcon 2s ease-in-out infinite;
    }

    @keyframes pulseIcon {
      0%, 100% { transform: scale(1); }
      50% { transform: scale(1.3); }
    }

    .chat-status {
      margin-right: auto;
      background: rgba(245, 176, 66, 0.12);
      border: 1px solid rgba(245, 176, 66, 0.15);
      border-radius: 40px;
      padding: 0.2rem 1.2rem;
      font-size: 0.7rem;
      color: #f5b042;
      font-family: 'Vazirmatn', sans-serif;
      font-weight: 600;
      display: flex;
      align-items: center;
      gap: 0.5rem;
      backdrop-filter: blur(4px);
    }

    .chat-status i {
      font-size: 0.55rem;
      color: #4caf50;
      animation: pulseDot 1.8s ease-in-out infinite;
    }

    @keyframes pulseDot {
      0%, 100% { opacity: 1; transform: scale(1); }
      50% { opacity: 0.2; transform: scale(0.6); }
    }

    .messages {
      max-height: 460px;
      overflow-y: auto;
      margin-bottom: 1.2rem;
      display: flex;
      flex-direction: column;
      gap: 1rem;
      padding-right: 0.2rem;
      scrollbar-width: thin;
      scrollbar-color: rgba(255, 215, 100, 0.15) transparent;
    }

    .messages::-webkit-scrollbar { width: 4px; }
    .messages::-webkit-scrollbar-track { background: transparent; }
    .messages::-webkit-scrollbar-thumb { background: rgba(255, 215, 100, 0.25); border-radius: 10px; }

    .message {
      display: flex;
      gap: 0.8rem;
      align-items: flex-start;
      animation: msgIn 0.4s cubic-bezier(0.22, 1, 0.36, 1);
    }

    .message.bot { flex-direction: row; }
    .message.user { flex-direction: row-reverse; }

    @keyframes msgIn {
      0% { opacity: 0; transform: translateY(16px) scale(0.96); }
      100% { opacity: 1; transform: translateY(0) scale(1); }
    }

    .message .avatar {
      width: 38px;
      height: 38px;
      border-radius: 14px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 1rem;
      flex-shrink: 0;
      background: rgba(255, 255, 255, 0.04);
      border: 1px solid rgba(255, 215, 100, 0.06);
      color: #b0a99b;
    }

    .message.bot .avatar {
      background: rgba(245, 176, 66, 0.12);
      color: #f5b042;
      border-color: rgba(245, 176, 66, 0.1);
    }

    .message.user .avatar {
      background: rgba(255, 255, 255, 0.06);
      color: #eaeef2;
    }

    .message .bubble {
      max-width: 80%;
      padding: 0.8rem 1.4rem;
      border-radius: 20px;
      font-family: 'Noto Sans Arabic', sans-serif;
      font-size: 0.95rem;
      line-height: 2;
      word-break: break-word;
      background: rgba(255, 255, 255, 0.03);
      border: 1px solid rgba(255, 215, 100, 0.06);
      color: #d6d0c4;
      box-shadow: 0 2px 16px -4px rgba(0, 0, 0, 0.3);
    }

    .message.bot .bubble {
      background: rgba(255, 215, 100, 0.04);
      border-color: rgba(255, 215, 100, 0.08);
      border-top-right-radius: 4px;
    }

    .message.user .bubble {
      background: rgba(245, 176, 66, 0.08);
      border-color: rgba(245, 176, 66, 0.12);
      border-top-left-radius: 4px;
      color: #f5efe6;
    }

    .message .bubble strong { color: #f5b042; font-weight: 700; }
    .message .bubble i { color: #f5b042; margin-left: 0.3rem; }

    .message .bubble .site-card {
      background: rgba(255, 255, 255, 0.03);
      border: 1px solid rgba(255, 215, 100, 0.08);
      border-radius: 16px;
      padding: 0.8rem 1rem;
      margin: 0.5rem 0;
      display: flex;
      align-items: center;
      gap: 1rem;
      transition: 0.3s;
    }

    .message .bubble .site-card:hover {
      background: rgba(255, 215, 100, 0.04);
      border-color: rgba(255, 215, 100, 0.15);
      transform: translateX(-4px);
    }

    .message .bubble .site-card .site-img {
      width: 50px;
      height: 50px;
      border-radius: 12px;
      object-fit: cover;
      background: #0b0b0e;
      border: 1px solid rgba(255, 215, 100, 0.05);
      flex-shrink: 0;
    }

    .message .bubble .site-card .site-info {
      flex: 1;
    }

    .message .bubble .site-card .site-info .site-name {
      font-family: 'Vazirmatn', sans-serif;
      font-weight: 700;
      color: #f5efe6;
      font-size: 0.95rem;
    }

    .message .bubble .site-card .site-info .site-desc {
      font-size: 0.8rem;
      color: #b0a99b;
    }

    .message .bubble .site-card .site-link {
      color: #f5b042;
      text-decoration: none;
      font-size: 0.8rem;
      font-weight: 600;
      padding: 0.3rem 1rem;
      border: 1px solid rgba(245, 176, 66, 0.15);
      border-radius: 40px;
      transition: 0.3s;
      display: inline-flex;
      align-items: center;
      gap: 0.4rem;
    }

    .message .bubble .site-card .site-link:hover {
      background: rgba(245, 176, 66, 0.08);
      border-color: #f5b042;
      transform: scale(1.04);
    }

    .quick-replies {
      display: flex;
      flex-wrap: wrap;
      gap: 0.6rem;
      margin-top: 0.2rem;
      margin-bottom: 0.5rem;
    }

    .quick-replies button {
      background: rgba(255, 255, 255, 0.03);
      border: 1px solid rgba(255, 215, 100, 0.08);
      color: #b0a99b;
      padding: 0.3rem 1.2rem;
      border-radius: 40px;
      font-family: 'Vazirmatn', sans-serif;
      font-size: 0.75rem;
      font-weight: 600;
      cursor: pointer;
      transition: 0.3s;
      backdrop-filter: blur(4px);
      display: inline-flex;
      align-items: center;
      gap: 0.5rem;
    }

    .quick-replies button i { color: #f5b042; font-size: 0.7rem; }

    .quick-replies button:hover {
      background: rgba(245, 176, 66, 0.08);
      border-color: rgba(245, 176, 66, 0.2);
      color: #f5efe6;
      transform: translateY(-3px) scale(1.02);
      box-shadow: 0 4px 20px -6px rgba(245, 176, 66, 0.12);
    }

    .input-area {
      display: flex;
      align-items: center;
      gap: 0.8rem;
      background: rgba(255, 255, 255, 0.02);
      border: 1px solid rgba(255, 215, 100, 0.06);
      border-radius: 60px;
      padding: 0.3rem 0.3rem 0.3rem 1.2rem;
      transition: 0.3s;
      margin-top: 0.3rem;
    }

    .input-area:focus-within {
      border-color: rgba(245, 176, 66, 0.25);
      background: rgba(255, 255, 255, 0.04);
      box-shadow: 0 0 0 4px rgba(245, 176, 66, 0.04);
    }

    .input-area input {
      flex: 1;
      background: transparent;
      border: none;
      color: #eaeef2;
      font-family: 'Noto Sans Arabic', sans-serif;
      font-size: 0.95rem;
      padding: 0.7rem 0;
      outline: none;
      min-width: 0;
    }

    .input-area input::placeholder { color: #5f5a50; font-weight: 300; }

    .input-area button {
      background: linear-gradient(145deg, #f5b042, #d48f2b);
      border: none;
      color: #0b0b0e;
      width: 48px;
      height: 48px;
      border-radius: 50%;
      font-size: 1.2rem;
      cursor: pointer;
      transition: 0.3s cubic-bezier(0.34, 1.56, 0.64, 1);
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
      box-shadow: 0 4px 20px -6px rgba(245, 176, 66, 0.3);
    }

    .input-area button:hover {
      transform: scale(1.08) rotate(-4deg);
      box-shadow: 0 8px 32px -6px rgba(245, 176, 66, 0.5);
    }

    .input-area button:active { transform: scale(0.93); }

    .typing-indicator {
      display: none;
      padding: 0.5rem 1.2rem;
      background: rgba(255, 215, 100, 0.04);
      border: 1px solid rgba(255, 215, 100, 0.06);
      border-radius: 40px;
      color: #b0a99b;
      font-size: 0.8rem;
      align-self: flex-start;
      margin-bottom: 0.5rem;
      animation: msgIn 0.3s ease;
    }

    .typing-indicator i {
      color: #f5b042;
      animation: pulseIcon 1s ease-in-out infinite;
    }

    .typing-indicator.show { display: inline-flex; align-items: center; gap: 0.5rem; }

    @media (max-width: 600px) {
      .chat-container { padding: 1.2rem 1rem; border-radius: 28px; }
      .chat-title { font-size: 1.2rem; }
      .chat-avatar { width: 48px; height: 48px; font-size: 1.4rem; }
      .message .bubble { font-size: 0.85rem; padding: 0.5rem 1rem; max-width: 90%; }
      .input-area input { font-size: 0.85rem; }
      .quick-replies button { font-size: 0.7rem; padding: 0.2rem 0.8rem; }
      .message .bubble .site-card { flex-wrap: wrap; }
      .message .bubble .site-card .site-img { width: 40px; height: 40px; }
    }

    @media (max-width: 400px) {
      .chat-container { padding: 1rem 0.8rem; }
      .chat-status { font-size: 0.6rem; padding: 0.1rem 0.6rem; }
      .message .avatar { width: 30px; height: 30px; font-size: 0.7rem; }
    }

    ::-webkit-scrollbar { width: 5px; }
    ::-webkit-scrollbar-track { background: #0b0b0e; }
    ::-webkit-scrollbar-thumb { background: linear-gradient(145deg, #f5b042, #d48f2b); border-radius: 10px; }
  </style>
</head>
<body>

<div class="chat-container">
  
  <div class="chat-header">
    <div class="chat-avatar">M</div>
    <div class="chat-title">
      <span class="highlight">MH Assistant</span>
      <small><i class="fas fa-robot"></i> دستیار هوشمند حرفه‌ای</small>
    </div>
    <div class="chat-status">
      <i class="fas fa-circle"></i> آنلاین
    </div>
  </div>

  <div class="messages" id="messagesBox">
    <div class="message bot">
      <div class="avatar"><i class="fas fa-robot"></i></div>
      <div class="bubble">
        <i class="fas fa-hand-peace"></i> سلام! من <strong>MH Assistant</strong> هستم.<br>
        <strong>هر سوالی</strong> داری، هر چیزی که می‌خوای بدونی، بپرس.<br>
        <span style="color:#f5b042; font-size:0.85rem;">👇 از دکمه‌های پایین استفاده کن یا هر چیزی بنویس!</span>
      </div>
    </div>
  </div>

  <div class="quick-replies">
    <button onclick="askQuestion('کی هستی؟')"><i class="fas fa-user-astronaut"></i> کی هستی؟</button>
    <button onclick="askQuestion('چه سایت‌هایی ساختی؟')"><i class="fas fa-laptop-code"></i> سایت‌ها</button>
    <button onclick="askQuestion('نمونه طراحی‌هات')"><i class="fas fa-palette"></i> طراحی‌ها</button>
    <button onclick="askQuestion('برنامه‌ها')"><i class="fas fa-puzzle-piece"></i> برنامه‌ها</button>
    <button onclick="askQuestion('مهارت‌هات')"><i class="fas fa-code"></i> مهارت‌ها</button>
    <button onclick="askQuestion('راه‌های ارتباطی')"><i class="fas fa-share-alt"></i> ارتباط</button>
  </div>

  <div class="input-area">
    <input type="text" id="userInput" placeholder="هر سوالی داری بپرس..." autocomplete="off">
    <button onclick="sendMessage()" aria-label="ارسال">
      <i class="fas fa-paper-plane"></i>
    </button>
  </div>

</div>

<script>
  // ============================================================
  //  دیتابیس کامل اطلاعات
  // ============================================================
  const siteData = {
    name: 'mohamad hossein snti',
    job: 'توسعه‌دهنده وب و طراح گرافیک',
    startYear: '۱۴۰۳',
    skills: ['HTML', 'CSS', 'JavaScript', 'طراحی گرافیک', 'تولید محتوا', 'UI/UX', 'React', 'Node.js'],
    goal: 'ترکیب هنر و تکنولوژی برای خلق فضاهای دیجیتال خاص',
    bio: 'توسعه‌دهنده وب و طراح گرافیک از سال ۱۴۰۳. عاشق کد تمیز، طراحی مینیمال و تجربه کاربری روان.',
    
    sites: [
      { 
        name: 'ZEROX', 
        desc: 'پلتفرم تخصصی گیم و اخبار', 
        link: 'https://zeroxgame74-afk.github.io/zeroxgamee/',
        img: 'https://uploadkon.ir/uploads/511301_26Zerox-۱۲۱۲.jpg'
      },
      { 
        name: 'کالفود', 
        desc: 'پلتفرم سفارش غذای لذیذ', 
        link: 'https://zeroxgame74-afk.github.io/call-food.ir/',
        img: 'https://uploadkon.ir/uploads/481d01_26call-food-۱۲۱۲۳.jpg'
      },
      { 
        name: 'کوروش گیم', 
        desc: 'فروشگاه اکانت گیم', 
        link: 'https://zeroxgame74-afk.github.io/Kourosh-Game.ir/',
        img: 'https://uploadkon.ir/uploads/d66b01_26Kourosh-Gameir۱۲.jpg'
      }
    ],
    
    designs: [
      { 
        name: 'گفتند زلف یار...', 
        desc: 'ادای احترام به نام علی (ع)',
        img: 'https://uploadkon.ir/uploads/6d9428_26ya-ali-m-h-snti.jpg'
      },
      { 
        name: 'اهواز... خاک غسل‌شده', 
        desc: 'یاد شهدای جنوب ایران',
        img: 'https://uploadkon.ir/uploads/99ce24_26jonoob-iran.png'
      }
    ],
    
    apps: 'در حال توسعه',
    
    social: {
      telegram: 'https://t.me/@mohamad_hossein_ev18',
      instagram: 'https://www.instagram.com/mohamad_hossein_ev18'
    }
  };

  // ============================================================
  //  موتور هوشمند پاسخ‌گویی (نسخه نهایی)
  // ============================================================
  function getSmartReply(input) {
    const text = input.trim().toLowerCase();
    
    // ===== ۱. سوال "کی هستی؟" - پاسخ اختصاصی =====
    if (text.includes('کی هستی') || text.includes('کی هست') || text.includes('چیستی') || 
        text.includes('هستی') || text.includes('کیایی') || text.includes('چه کسی') ||
        text.includes('تو کی') || text.includes('کیا هستی') || text.includes('تو چیستی') ||
        text.includes('چه کاری') || text.includes('چی هستی')) {
      return `
        <i class="fas fa-robot"></i> <strong>من ربات دستیار MH Assistant هستم!</strong><br><br>
        <i class="fas fa-user-astronaut"></i> ساخته‌شده توسط <strong>${siteData.name}</strong><br>
        <i class="fas fa-code"></i> وظیفه‌ام: پاسخ به سوالات شما درباره سایت، طراحی‌ها و پروژه‌ها<br>
        <i class="fas fa-heart" style="color:#f5b042;"></i> هدفم: کمک سریع و هوشمندانه به کاربران<br><br>
        <span style="color:#b0a99b; font-size:0.85rem;">
          <i class="fas fa-smile"></i> هر سوالی داری، بپرس!
        </span>
      `;
    }

    // ===== ۲. معرفی صاحب سایت =====
    if (text.includes('معرفی') || text.includes('کی هست') || text.includes('خودت') || 
        text.includes('چه کاره') || text.includes('شناخت') || text.includes('درباره من') || 
        text.includes('بیو') || text.includes('رزومه') || text.includes('چه کسی') ||
        text.includes('هستید') && !text.includes('کی هستی') && !text.includes('هستی')) {
      return `
        <i class="fas fa-user-astronaut"></i> <strong>${siteData.name}</strong><br>
        ${siteData.job}<br>
        از سال ${siteData.startYear} وارد دنیای برنامه‌نویسی شدم.<br>
        <i class="fas fa-heart" style="color:#f5b042;"></i> هدف: ${siteData.goal}<br><br>
        <span style="color:#b0a99b; font-size:0.85rem;">
          <i class="fas fa-tools"></i> مهارت‌ها: ${siteData.skills.join(' • ')}
        </span>
      `;
    }

    // ===== ۳. مهارت‌ها =====
    if (text.includes('مهارت') || text.includes('توانایی') || text.includes('بلد') || 
        text.includes('تخصص') || text.includes('چه چیزایی') || text.includes('چی یاد') ||
        text.includes('چه کارهایی') || text.includes('توانمندی')) {
      return `
        <i class="fas fa-code"></i> <strong>مهارت‌های من:</strong><br>
        ${siteData.skills.map(s => `🔹 ${s}`).join('<br>')}<br><br>
        <span style="color:#b0a99b; font-size:0.85rem;">
          <i class="fas fa-rocket"></i> همیشه در حال یادگیری و به‌روزرسانی
        </span>
      `;
    }

    // ===== ۴. سایت‌ها =====
    if (text.includes('سایت') || text.includes('وب') || text.includes('پروژه') || 
        text.includes('نمونه کار') || text.includes('لینک') || text.includes('zerox') ||
        text.includes('کالفود') || text.includes('کوروش') || text.includes('گیم') ||
        text.includes('آدرس') || text.includes('مشاهده') || text.includes('چی ساختی') ||
        text.includes('چه سایت') || text.includes('ساختی') || text.includes('نمونه') ||
        text.includes('پروژه‌ها') || text.includes('کارها') || text.includes('وب‌سایت')) {
      
      let reply = `<i class="fas fa-laptop-code"></i> <strong>سایت‌های طراحی شده توسط ${siteData.name}:</strong><br>`;
      
      siteData.sites.forEach(s => {
        reply += `
          <div class="site-card">
            <img class="site-img" src="${s.img}" alt="${s.name}" onerror="this.style.display='none'">
            <div class="site-info">
              <div class="site-name">🎮 ${s.name}</div>
              <div class="site-desc">${s.desc}</div>
            </div>
            <a href="${s.link}" target="_blank" class="site-link">
              <i class="fas fa-external-link-alt"></i> مشاهده
            </a>
          </div>
        `;
      });
      
      reply += `<span style="color:#b0a99b; font-size:0.85rem;">🔗 برای مشاهده هرکدوم روی دکمه <strong>مشاهده</strong> بزن.</span>`;
      return reply;
    }

    // ===== ۵. طراحی‌ها =====
    if (text.includes('طراحی') || text.includes('گرافیک') || text.includes('هنری') || 
        text.includes('عکس') || text.includes('تصویر') || text.includes('یا علی') || 
        text.includes('اهواز') || text.includes('شهید') || text.includes('پالت') ||
        text.includes('نقاشی') || text.includes('اثر') || text.includes('هنر') ||
        text.includes('نمونه طراحی')) {
      
      let reply = `<i class="fas fa-palette"></i> <strong>نمونه طراحی‌های هنری ${siteData.name}:</strong><br>`;
      
      siteData.designs.forEach(d => {
        reply += `
          <div style="background:rgba(255,255,255,0.02); border:1px solid rgba(255,215,100,0.06); border-radius:14px; padding:0.6rem 1rem; margin:0.4rem 0; display:flex; align-items:center; gap:0.8rem;">
            <div style="font-size:1.5rem; color:#f5b042;"><i class="fas fa-paint-brush"></i></div>
            <div>
              <div style="font-family:'Vazirmatn',sans-serif; font-weight:600; color:#f5efe6;">🖼 ${d.name}</div>
              <div style="font-size:0.8rem; color:#b0a99b;">${d.desc}</div>
            </div>
          </div>
        `;
      });
      
      reply += `<br><span style="color:#b0a99b; font-size:0.85rem;">📥 برای دانلود به بخش <strong>طراحی‌هام</strong> برو.</span>`;
      return reply;
    }

    // ===== ۶. برنامه‌ها =====
    if (text.includes('برنامه') || text.includes('اپ') || text.includes('نرم‌افزار') || 
        text.includes('ابزار') || text.includes('اپلیکیشن') || text.includes('موبایل') ||
        text.includes('اندروید') || text.includes('ios') || text.includes('ویندوز') ||
        text.includes('ساخت اپ') || text.includes('نرم افزار') || text.includes('اپلیکیشن‌ها')) {
      return `
        <i class="fas fa-puzzle-piece"></i> بخش <strong>برنامه‌ها</strong> ${siteData.apps} است.<br>
        به زودی اپلیکیشن‌ها و ابزارهای جدیدی اضافه می‌شه.<br>
        <i class="fas fa-code" style="color:#f5b042;"></i> منتظر آپدیت‌های بعدی باش!<br><br>
        <span style="color:#b0a99b; font-size:0.85rem;">
          <i class="fas fa-lightbulb"></i> اگه ایده‌ای داری، خوشحال می‌شم بشنوم.
        </span>
      `;
    }

    // ===== ۷. شبکه‌های اجتماعی =====
    if (text.includes('تلگرام') || text.includes('اینستاگرام') || text.includes('شبکه') || 
        text.includes('اجتماعی') || text.includes('تماس') || text.includes('ارتباط') ||
        text.includes('پیام') || text.includes('آیدی') || text.includes('کانال') ||
        text.includes('راه ارتباطی') || text.includes('چت') || text.includes('پشتیبانی')) {
      return `
        <i class="fas fa-share-alt"></i> <strong>راه‌های ارتباطی با ${siteData.name}:</strong><br>
        <div style="display:flex; gap:0.8rem; margin-top:0.5rem; flex-wrap:wrap;">
          <a href="${siteData.social.telegram}" target="_blank" style="color:#f5b042; text-decoration:none; background:rgba(255,215,100,0.05); padding:0.4rem 1.2rem; border-radius:40px; border:1px solid rgba(255,215,100,0.1); display:inline-flex; align-items:center; gap:0.5rem; transition:0.3s;">
            <i class="fab fa-telegram-plane"></i> تلگرام
          </a>
          <a href="${siteData.social.instagram}" target="_blank" style="color:#f5b042; text-decoration:none; background:rgba(255,215,100,0.05); padding:0.4rem 1.2rem; border-radius:40px; border:1px solid rgba(255,215,100,0.1); display:inline-flex; align-items:center; gap:0.5rem; transition:0.3s;">
            <i class="fab fa-instagram"></i> اینستاگرام
          </a>
        </div>
        <span style="color:#b0a99b; font-size:0.85rem;">📩 خوشحال می‌شم پیام بدی!</span>
      `;
    }

    // ===== ۸. سلام و احوالپرسی =====
    if (text.includes('سلام') || text.includes('درود') || text.includes('هی') || 
        text.includes('الو') || text.includes('هلو') || text.includes('سلامت') ||
        text.includes('صبح') || text.includes('عصر') || text.includes('شب') ||
        text.includes('بخیر')) {
      return `
        <i class="fas fa-hand-peace"></i> سلام! خوش اومدی به <strong>MH Assistant</strong>.<br>
        من <strong>دستیار هوشمند</strong> این سایت هستم.<br>
        هر سوالی داری بپرس، <strong>همون لحظه</strong> جواب میدم.<br><br>
        <span style="color:#b0a99b; font-size:0.85rem;">
          <i class="fas fa-lightbulb"></i> مثلاً بپرس: 
          <strong style="color:#f5b042;">کی هستی؟</strong> 
          یا <strong style="color:#f5b042;">چه سایت‌هایی ساختی؟</strong>
        </span>
      `;
    }

    // ===== ۹. حال و احوال =====
    if (text.includes('خوب') || text.includes('چطوری') || text.includes('حالت') || 
        text.includes('اوضاع') || text.includes('چه خبر') || text.includes('خبر') ||
        text.includes('چی می‌کنی') || text.includes('چی کار') || text.includes('خوشی') ||
        text.includes('خسته') || text.includes('انرژی') || text.includes('احساس')) {
      return `
        <i class="fas fa-smile"></i> ممنون که پرسیدی!<br>
        من <strong>MH Assistant</strong> هستم و همیشه آماده کمکم.<br>
        <i class="fas fa-rocket" style="color:#f5b042;"></i> پر انرژی و منتظر سوال بعدی‌ات.<br>
        <span style="color:#b0a99b; font-size:0.85rem;">اگه سوال خاصی داری، بپرس!</span>
      `;
    }

    // ===== ۱۰. تشکر =====
    if (text.includes('ممنون') || text.includes('مرسی') || text.includes('متشکرم') || 
        text.includes('دمت گرم') || text.includes('دستت') || text.includes('تشکر') ||
        text.includes('سپاس') || text.includes('مرحمت') || text.includes('احسان')) {
      return `
        <i class="fas fa-heart" style="color:#f5b042;"></i> خواهش می‌کنم!<br>
        خوشحالم که تونستم به عنوان <strong>MH Assistant</strong> کمک کنم.<br>
        <i class="fas fa-smile"></i> هر وقت سوالی داشتی، من اینجام.<br>
        <span style="color:#b0a99b; font-size:0.85rem;">🙏 بازم خوش اومدی!</span>
      `;
    }

    // ===== ۱۱. پاسخ پیش‌فرض =====
    return `
      <i class="fas fa-robot"></i> <strong>من MH Assistant هستم!</strong><br>
      متوجه شدم، ولی برای کمک بهتر این سوالات رو بپرس:<br><br>
      <span style="color:#f5b042; display:inline-block; background:rgba(245,176,66,0.04); padding:0.2rem 0.8rem; border-radius:40px; border:1px solid rgba(245,176,66,0.06); margin:0.2rem;">
        <i class="fas fa-question"></i> کی هستی؟
      </span>
      <span style="color:#f5b042; display:inline-block; background:rgba(245,176,66,0.04); padding:0.2rem 0.8rem; border-radius:40px; border:1px solid rgba(245,176,66,0.06); margin:0.2rem;">
        <i class="fas fa-laptop-code"></i> چه سایت‌هایی ساختی؟
      </span>
      <span style="color:#f5b042; display:inline-block; background:rgba(245,176,66,0.04); padding:0.2rem 0.8rem; border-radius:40px; border:1px solid rgba(245,176,66,0.06); margin:0.2rem;">
        <i class="fas fa-palette"></i> نمونه طراحی‌هات
      </span>
      <span style="color:#f5b042; display:inline-block; background:rgba(245,176,66,0.04); padding:0.2rem 0.8rem; border-radius:40px; border:1px solid rgba(245,176,66,0.06); margin:0.2rem;">
        <i class="fas fa-code"></i> مهارت‌هات
      </span>
      <br><br>
      <span style="color:#b0a99b; font-size:0.85rem;">
        <i class="fas fa-comment"></i> یا هر چیزی که دوست داری بپرس!
      </span>
    `;
  }

  // ============================================================
  //  توابع اصلی
  // ============================================================

  const messagesBox = document.getElementById('messagesBox');
  const userInput = document.getElementById('userInput');

  let isTyping = false;

  function sendMessage() {
    const text = userInput.value.trim();
    if (!text || isTyping) return;

    addMessage('user', text);
    userInput.value = '';
    userInput.focus();

    isTyping = true;
    showTyping();

    setTimeout(() => {
      hideTyping();
      const reply = getSmartReply(text);
      addMessage('bot', reply);
      messagesBox.scrollTop = messagesBox.scrollHeight;
      isTyping = false;
    }, 400);
  }

  function askQuestion(text) {
    userInput.value = text;
    sendMessage();
  }

  function addMessage(type, content) {
    const div = document.createElement('div');
    div.className = `message ${type}`;

    const avatar = document.createElement('div');
    avatar.className = 'avatar';
    avatar.innerHTML = type === 'bot' ? '<i class="fas fa-robot"></i>' : '<i class="fas fa-user"></i>';

    const bubble = document.createElement('div');
    bubble.className = 'bubble';
    bubble.innerHTML = content;

    div.appendChild(avatar);
    div.appendChild(bubble);
    messagesBox.appendChild(div);
    messagesBox.scrollTop = messagesBox.scrollHeight;
  }

  function showTyping() {
    let typing = document.querySelector('.typing-indicator');
    if (!typing) {
      typing = document.createElement('div');
      typing.className = 'typing-indicator';
      typing.innerHTML = '<i class="fas fa-robot"></i> <strong>MH Assistant</strong> در حال تایپ...';
      messagesBox.appendChild(typing);
    }
    typing.classList.add('show');
    messagesBox.scrollTop = messagesBox.scrollHeight;
  }

  function hideTyping() {
    const typing = document.querySelector('.typing-indicator');
    if (typing) typing.classList.remove('show');
  }

  userInput.addEventListener('keydown', function(e) {
    if (e.key === 'Enter') {
      e.preventDefault();
      sendMessage();
    }
  });

  window.addEventListener('load', function() {
    messagesBox.scrollTop = messagesBox.scrollHeight;
  });
</script>

</body>
</html>
