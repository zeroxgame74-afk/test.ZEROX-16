<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>MH Assistant | دستیار هوشمند</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Arabic:wght@300;400;500;600;700&family=Vazirmatn:wght@400;600;700;800;900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    html, body {
      height: 100%;
      width: 100%;
      overflow: hidden;
      background: #0b0b0e;
    }

    body {
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: 'Noto Sans Arabic', 'Segoe UI', sans-serif;
      background-image:
        radial-gradient(circle at 20% 30%, rgba(255, 200, 80, 0.04) 0%, transparent 50%),
        radial-gradient(circle at 80% 70%, rgba(255, 200, 80, 0.02) 0%, transparent 50%);
      padding: 6px;
    }

    .chat-container {
      width: 100%;
      height: 100%;
      max-width: 480px;
      max-height: 100vh;
      background: rgba(255, 255, 255, 0.02);
      backdrop-filter: blur(16px);
      border: 1px solid rgba(255, 215, 100, 0.08);
      display: flex;
      flex-direction: column;
      padding: 10px 12px 10px;
      box-shadow: 0 0 60px -16px rgba(0, 0, 0, 0.7);
      position: relative;
      overflow: hidden;
      border-radius: 28px;
    }

    @media (max-width: 480px) {
      .chat-container {
        border-radius: 16px;
        padding: 8px 10px 8px;
        max-height: 100vh;
        height: 100vh;
      }
      body {
        padding: 4px;
      }
    }

    /* ===== هدر ===== */
    .chat-header {
      display: flex;
      align-items: center;
      gap: 0.7rem;
      padding-bottom: 8px;
      border-bottom: 1px solid rgba(255, 215, 100, 0.06);
      margin-bottom: 8px;
      flex-shrink: 0;
      min-height: 52px;
    }

    .chat-avatar {
      width: 42px;
      height: 42px;
      background: linear-gradient(145deg, #f5b042, #d48f2b);
      border-radius: 14px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: 'Vazirmatn', sans-serif;
      font-weight: 900;
      font-size: 1.3rem;
      color: #0b0b0e;
      box-shadow: 0 6px 18px -6px rgba(200, 150, 50, 0.25);
      flex-shrink: 0;
      animation: floatLogo 3s ease-in-out infinite;
      position: relative;
    }

    .chat-avatar::after {
      content: '';
      position: absolute;
      inset: -2px;
      border-radius: 16px;
      background: linear-gradient(145deg, rgba(245, 176, 66, 0.25), transparent);
      z-index: -1;
      animation: glowRing 3s ease-in-out infinite;
    }

    @keyframes glowRing {
      0%, 100% { opacity: 0.4; transform: scale(1); }
      50% { opacity: 0.8; transform: scale(1.05); }
    }

    @keyframes floatLogo {
      0%, 100% { transform: translateY(0); }
      50% { transform: translateY(-4px); }
    }

    .chat-title {
      font-family: 'Vazirmatn', sans-serif;
      font-weight: 800;
      font-size: 1.1rem;
      color: #f5efe6;
      letter-spacing: -0.3px;
      flex: 1;
      min-width: 0;
    }

    .chat-title .highlight {
      background: linear-gradient(145deg, #f5b042, #d48f2b);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
    }

    .chat-title small {
      display: block;
      font-family: 'Noto Sans Arabic', sans-serif;
      font-weight: 300;
      font-size: 0.55rem;
      color: #b0a99b;
      margin-top: 0px;
      letter-spacing: 0.3px;
      -webkit-text-fill-color: #b0a99b;
    }

    .chat-title small i {
      color: #f5b042;
      -webkit-text-fill-color: #f5b042;
    }

    .chat-status {
      background: rgba(245, 176, 66, 0.1);
      border: 1px solid rgba(245, 176, 66, 0.1);
      border-radius: 40px;
      padding: 2px 10px;
      font-size: 0.5rem;
      color: #f5b042;
      font-family: 'Vazirmatn', sans-serif;
      font-weight: 600;
      display: flex;
      align-items: center;
      gap: 4px;
      backdrop-filter: blur(4px);
      flex-shrink: 0;
      white-space: nowrap;
    }

    .chat-status i {
      font-size: 0.4rem;
      color: #4caf50;
      animation: pulseDot 1.8s ease-in-out infinite;
    }

    @keyframes pulseDot {
      0%, 100% { opacity: 1; transform: scale(1); }
      50% { opacity: 0.2; transform: scale(0.6); }
    }

    /* ===== پیام‌ها ===== */
    .messages {
      flex: 1;
      overflow-y: auto;
      margin-bottom: 6px;
      display: flex;
      flex-direction: column;
      gap: 6px;
      padding: 4px 2px;
      min-height: 0;
      scroll-behavior: smooth;
      scrollbar-width: thin;
      scrollbar-color: rgba(255, 215, 100, 0.15) transparent;
      max-height: 100%;
    }

    .messages::-webkit-scrollbar { width: 3px; }
    .messages::-webkit-scrollbar-track { background: transparent; }
    .messages::-webkit-scrollbar-thumb { background: rgba(255, 215, 100, 0.2); border-radius: 10px; }

    .message {
      display: flex;
      gap: 6px;
      align-items: flex-start;
      animation: msgIn 0.35s cubic-bezier(0.22, 1, 0.36, 1);
      flex-shrink: 0;
    }

    .message.bot { flex-direction: row; }
    .message.user { flex-direction: row-reverse; }

    @keyframes msgIn {
      0% { opacity: 0; transform: translateY(10px) scale(0.97); }
      100% { opacity: 1; transform: translateY(0) scale(1); }
    }

    .message .avatar {
      width: 28px;
      height: 28px;
      border-radius: 10px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 0.75rem;
      flex-shrink: 0;
      background: rgba(255, 255, 255, 0.04);
      border: 1px solid rgba(255, 215, 100, 0.06);
      color: #b0a99b;
    }

    .message.bot .avatar {
      background: rgba(245, 176, 66, 0.12);
      color: #f5b042;
      border-color: rgba(245, 176, 66, 0.1);
    }

    .message.user .avatar {
      background: rgba(255, 255, 255, 0.06);
      color: #eaeef2;
    }

    .message .bubble {
      max-width: 80%;
      padding: 6px 12px;
      border-radius: 14px;
      font-family: 'Noto Sans Arabic', sans-serif;
      font-size: 0.8rem;
      line-height: 1.7;
      word-break: break-word;
      background: rgba(255, 255, 255, 0.03);
      border: 1px solid rgba(255, 215, 100, 0.06);
      color: #d6d0c4;
      box-shadow: 0 2px 10px -4px rgba(0, 0, 0, 0.2);
    }

    .message.bot .bubble {
      background: rgba(255, 215, 100, 0.04);
      border-color: rgba(255, 215, 100, 0.08);
      border-top-right-radius: 4px;
    }

    .message.user .bubble {
      background: rgba(245, 176, 66, 0.08);
      border-color: rgba(245, 176, 66, 0.12);
      border-top-left-radius: 4px;
      color: #f5efe6;
    }

    .message .bubble strong { color: #f5b042; font-weight: 700; }
    .message .bubble i { color: #f5b042; margin-left: 2px; }

    /* ===== کارت سایت ===== */
    .message .bubble .site-card {
      background: rgba(255, 255, 255, 0.03);
      border: 1px solid rgba(255, 215, 100, 0.08);
      border-radius: 10px;
      padding: 6px 8px;
      margin: 4px 0;
      display: flex;
      align-items: center;
      gap: 8px;
      transition: 0.3s;
      flex-wrap: wrap;
    }

    .message .bubble .site-card:hover {
      background: rgba(255, 215, 100, 0.04);
      border-color: rgba(255, 215, 100, 0.15);
    }

    .message .bubble .site-card .site-img {
      width: 34px;
      height: 34px;
      border-radius: 8px;
      object-fit: cover;
      background: #0b0b0e;
      border: 1px solid rgba(255, 215, 100, 0.05);
      flex-shrink: 0;
    }

    .message .bubble .site-card .site-info {
      flex: 1;
      min-width: 60px;
    }

    .message .bubble .site-card .site-info .site-name {
      font-family: 'Vazirmatn', sans-serif;
      font-weight: 700;
      color: #f5efe6;
      font-size: 0.75rem;
    }

    .message .bubble .site-card .site-info .site-desc {
      font-size: 0.6rem;
      color: #b0a99b;
    }

    .message .bubble .site-card .site-link {
      color: #f5b042;
      text-decoration: none;
      font-size: 0.6rem;
      font-weight: 600;
      padding: 2px 10px;
      border: 1px solid rgba(245, 176, 66, 0.15);
      border-radius: 40px;
      transition: 0.3s;
      display: inline-flex;
      align-items: center;
      gap: 4px;
      flex-shrink: 0;
    }

    .message .bubble .site-card .site-link:hover {
      background: rgba(245, 176, 66, 0.08);
      border-color: #f5b042;
      transform: scale(1.03);
    }

    .message .bubble .design-mini {
      background: rgba(255, 255, 255, 0.02);
      border: 1px solid rgba(255, 215, 100, 0.06);
      border-radius: 10px;
      padding: 4px 8px;
      margin: 3px 0;
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .message .bubble .design-mini .d-icon {
      font-size: 1rem;
      color: #f5b042;
    }

    .message .bubble .design-mini .d-name {
      font-family: 'Vazirmatn', sans-serif;
      font-weight: 600;
      color: #f5efe6;
      font-size: 0.75rem;
    }

    .message .bubble .design-mini .d-desc {
      font-size: 0.6rem;
      color: #b0a99b;
    }

    /* ===== دکمه‌های سریع ===== */
    .quick-replies {
      display: flex;
      flex-wrap: wrap;
      gap: 4px;
      margin-bottom: 6px;
      flex-shrink: 0;
    }

    .quick-replies button {
      background: rgba(255, 255, 255, 0.03);
      border: 1px solid rgba(255, 215, 100, 0.08);
      color: #b0a99b;
      padding: 3px 10px;
      border-radius: 40px;
      font-family: 'Vazirmatn', sans-serif;
      font-size: 0.6rem;
      font-weight: 600;
      cursor: pointer;
      transition: 0.3s;
      backdrop-filter: blur(4px);
      display: inline-flex;
      align-items: center;
      gap: 4px;
      white-space: nowrap;
    }

    .quick-replies button i { color: #f5b042; font-size: 0.55rem; }

    .quick-replies button:hover {
      background: rgba(245, 176, 66, 0.08);
      border-color: rgba(245, 176, 66, 0.2);
      color: #f5efe6;
      transform: translateY(-2px);
      box-shadow: 0 4px 14px -6px rgba(245, 176, 66, 0.1);
    }

    /* ===== ورودی ===== */
    .input-area {
      display: flex;
      align-items: center;
      gap: 6px;
      background: rgba(255, 255, 255, 0.02);
      border: 1px solid rgba(255, 215, 100, 0.06);
      border-radius: 60px;
      padding: 2px 2px 2px 12px;
      transition: 0.3s;
      flex-shrink: 0;
    }

    .input-area:focus-within {
      border-color: rgba(245, 176, 66, 0.25);
      background: rgba(255, 255, 255, 0.04);
      box-shadow: 0 0 0 3px rgba(245, 176, 66, 0.04);
    }

    .input-area input {
      flex: 1;
      background: transparent;
      border: none;
      color: #eaeef2;
      font-family: 'Noto Sans Arabic', sans-serif;
      font-size: 0.8rem;
      padding: 8px 0;
      outline: none;
      min-width: 0;
    }

    .input-area input::placeholder { color: #5f5a50; font-weight: 300; }

    .input-area button {
      background: linear-gradient(145deg, #f5b042, #d48f2b);
      border: none;
      color: #0b0b0e;
      width: 38px;
      height: 38px;
      border-radius: 50%;
      font-size: 0.95rem;
      cursor: pointer;
      transition: 0.3s cubic-bezier(0.34, 1.56, 0.64, 1);
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
      box-shadow: 0 4px 14px -6px rgba(245, 176, 66, 0.25);
    }

    .input-area button:hover {
      transform: scale(1.05) rotate(-3deg);
      box-shadow: 0 6px 24px -6px rgba(245, 176, 66, 0.4);
    }

    .input-area button:active { transform: scale(0.93); }

    /* ===== تایپینگ ===== */
    .typing-indicator {
      display: none;
      padding: 3px 10px;
      background: rgba(255, 215, 100, 0.04);
      border: 1px solid rgba(255, 215, 100, 0.06);
      border-radius: 40px;
      color: #b0a99b;
      font-size: 0.65rem;
      align-self: flex-start;
      margin-bottom: 3px;
      animation: msgIn 0.3s ease;
      flex-shrink: 0;
    }

    .typing-indicator i {
      color: #f5b042;
      animation: pulseIcon 1s ease-in-out infinite;
    }

    @keyframes pulseIcon {
      0%, 100% { transform: scale(1); }
      50% { transform: scale(1.2); }
    }

    .typing-indicator.show { display: inline-flex; align-items: center; gap: 4px; }

    /* ===== اسکرول ===== */
    ::-webkit-scrollbar { width: 3px; }
    ::-webkit-scrollbar-track { background: transparent; }
    ::-webkit-scrollbar-thumb { background: rgba(255, 215, 100, 0.2); border-radius: 10px; }
  </style>
</head>
<body>

<div class="chat-container">

  <!-- هدر -->
  <div class="chat-header">
    <div class="chat-avatar">M</div>
    <div class="chat-title">
      <span class="highlight">MH Assistant</span>
      <small><i class="fas fa-robot"></i> پردازش هوشمند کلمات</small>
    </div>
    <div class="chat-status">
      <i class="fas fa-circle"></i> آنلاین
    </div>
  </div>

  <!-- پیام‌ها -->
  <div class="messages" id="messagesBox">
    <div class="message bot">
      <div class="avatar"><i class="fas fa-robot"></i></div>
      <div class="bubble">
        <i class="fas fa-hand-peace"></i> سلام! من <strong>MH Assistant</strong> هستم.<br>
        <strong>هر کلمه‌ای</strong> بگی، پردازش میکنم و جواب میدم.<br>
        <span style="color:#f5b042; font-size:0.7rem;">👇 حتی یه کلمه واحد بپرس، میفهمم!</span>
      </div>
    </div>
  </div>

  <!-- دکمه‌های سریع -->
  <div class="quick-replies">
    <button onclick="askQuestion('کی هستی؟')"><i class="fas fa-question"></i> کی هستی؟</button>
    <button onclick="askQuestion('سایت')"><i class="fas fa-laptop-code"></i> سایت</button>
    <button onclick="askQuestion('طراحی')"><i class="fas fa-palette"></i> طراحی</button>
    <button onclick="askQuestion('برنامه')"><i class="fas fa-puzzle-piece"></i> برنامه</button>
    <button onclick="askQuestion('مهارت')"><i class="fas fa-code"></i> مهارت</button>
    <button onclick="askQuestion('ارتباط')"><i class="fas fa-share-alt"></i> ارتباط</button>
  </div>

  <!-- ورودی -->
  <div class="input-area">
    <input type="text" id="userInput" placeholder="هر چیزی بگو..." autocomplete="off">
    <button onclick="sendMessage()" aria-label="ارسال">
      <i class="fas fa-paper-plane"></i>
    </button>
  </div>

</div>

<script>
  // ============================================================
  //  دیتابیس کامل اطلاعات
  // ============================================================
  const siteData = {
    name: 'mohamad hossein snti',
    job: 'توسعه‌دهنده وب و طراح گرافیک',
    startYear: '۱۴۰۳',
    skills: ['HTML', 'CSS', 'JavaScript', 'طراحی گرافیک', 'تولید محتوا', 'UI/UX', 'React', 'Node.js'],
    goal: 'ترکیب هنر و تکنولوژی برای خلق فضاهای دیجیتال خاص',
    
    sites: [
      { 
        name: 'ZEROX', 
        desc: 'پلتفرم تخصصی گیم و اخبار', 
        link: 'https://zeroxgame74-afk.github.io/zeroxgamee/',
        img: 'https://uploadkon.ir/uploads/511301_26Zerox-۱۲۱۲.jpg'
      },
      { 
        name: 'کالفود', 
        desc: 'پلتفرم سفارش غذای لذیذ', 
        link: 'https://zeroxgame74-afk.github.io/call-food.ir/',
        img: 'https://uploadkon.ir/uploads/481d01_26call-food-۱۲۱۲۳.jpg'
      },
      { 
        name: 'کوروش گیم', 
        desc: 'فروشگاه اکانت گیم', 
        link: 'https://zeroxgame74-afk.github.io/Kourosh-Game.ir/',
        img: 'https://uploadkon.ir/uploads/d66b01_26Kourosh-Gameir۱۲.jpg'
      }
    ],
    
    designs: [
      { name: 'گفتند زلف یار...', desc: 'ادای احترام به نام علی (ع)' },
      { name: 'اهواز... خاک غسل‌شده', desc: 'یاد شهدای جنوب ایران' }
    ],
    
    apps: 'در حال توسعه',
    
    social: {
      telegram: 'https://t.me/@mohamad_hossein_ev18',
      instagram: 'https://www.instagram.com/mohamad_hossein_ev18'
    }
  };

  // ============================================================
  //  موتور پردازش کلمه‌به‌کلمه
  // ============================================================
  function getSmartReply(input) {
    const text = input.trim().toLowerCase();
    
    if (!text) {
      return `
        <i class="fas fa-robot"></i> <strong>سلام!</strong><br>
        چیزی ننوشتی. هر سوالی داری بپرس!<br>
        <span style="color:#b0a99b; font-size:0.7rem;">مثلاً <strong style="color:#f5b042;">کی هستی؟</strong></span>
      `;
    }

    // ===== تشخیص مستقیم =====
    
    if (text === 'کی' || text === 'هستی' || text === 'کیا' || text.includes('کی هستی') || text.includes('تو کی')) {
      return `
        <i class="fas fa-robot"></i> <strong>من ربات دستیار MH Assistant هستم!</strong><br><br>
        <i class="fas fa-user-astronaut"></i> ساخته‌شده توسط <strong>${siteData.name}</strong><br>
        <i class="fas fa-code"></i> وظیفه‌ام: پاسخ به سوالات شما
      `;
    }

    if (text.includes('معرفی') || text.includes('خودت') || text.includes('چه کاره') || text.includes('درباره من')) {
      return `
        <i class="fas fa-user-astronaut"></i> <strong>${siteData.name}</strong><br>
        ${siteData.job}<br>
        از سال ${siteData.startYear} وارد دنیای برنامه‌نویسی شدم.<br>
        <i class="fas fa-heart" style="color:#f5b042;"></i> هدف: ${siteData.goal}
      `;
    }

    if (text.includes('سایت') || text.includes('پروژه') || text.includes('لینک') || text.includes('zerox') || text.includes('کالفود') || text.includes('کوروش')) {
      let reply = `<i class="fas fa-laptop-code"></i> <strong>سایت‌های ${siteData.name}:</strong><br>`;
      siteData.sites.forEach(s => {
        reply += `
          <div class="site-card">
            <img class="site-img" src="${s.img}" alt="${s.name}" onerror="this.style.display='none'">
            <div class="site-info">
              <div class="site-name">🎮 ${s.name}</div>
              <div class="site-desc">${s.desc}</div>
            </div>
            <a href="${s.link}" target="_blank" class="site-link">
              <i class="fas fa-external-link-alt"></i> مشاهده
            </a>
          </div>
        `;
      });
      return reply;
    }

    if (text.includes('طراحی') || text.includes('گرافیک') || text.includes('هنری') || text.includes('یا علی') || text.includes('اهواز')) {
      let reply = `<i class="fas fa-palette"></i> <strong>طراحی‌های ${siteData.name}:</strong><br>`;
      siteData.designs.forEach(d => {
        reply += `
          <div class="design-mini">
            <div class="d-icon"><i class="fas fa-paint-brush"></i></div>
            <div>
              <div class="d-name">🖼 ${d.name}</div>
              <div class="d-desc">${d.desc}</div>
            </div>
          </div>
        `;
      });
      return reply;
    }

    if (text.includes('برنامه') || text.includes('اپ') || text.includes('اپلیکیشن')) {
      return `
        <i class="fas fa-puzzle-piece"></i> بخش <strong>برنامه‌ها</strong> ${siteData.apps} است.<br>
        به زودی اپلیکیشن‌های جدید اضافه می‌شه.
      `;
    }

    if (text.includes('مهارت') || text.includes('توانایی') || text.includes('تخصص') || text.includes('چی بلدی')) {
      return `
        <i class="fas fa-code"></i> <strong>مهارت‌ها:</strong><br>
        ${siteData.skills.map(s => `🔹 ${s}`).join('<br>')}
      `;
    }

    if (text.includes('تلگرام') || text.includes('اینستاگرام') || text.includes('ارتباط') || text.includes('تماس')) {
      return `
        <i class="fas fa-share-alt"></i> <strong>راه‌های ارتباطی:</strong><br>
        <div style="display:flex; gap:6px; margin-top:4px; flex-wrap:wrap;">
          <a href="${siteData.social.telegram}" target="_blank" style="color:#f5b042; text-decoration:none; background:rgba(255,215,100,0.05); padding:3px 10px; border-radius:40px; border:1px solid rgba(255,215,100,0.1); display:inline-flex; align-items:center; gap:4px; font-size:0.7rem;">
            <i class="fab fa-telegram-plane"></i> تلگرام
          </a>
          <a href="${siteData.social.instagram}" target="_blank" style="color:#f5b042; text-decoration:none; background:rgba(255,215,100,0.05); padding:3px 10px; border-radius:40px; border:1px solid rgba(255,215,100,0.1); display:inline-flex; align-items:center; gap:4px; font-size:0.7rem;">
            <i class="fab fa-instagram"></i> اینستاگرام
          </a>
        </div>
      `;
    }

    if (text.includes('سلام') || text.includes('درود') || text.includes('الو')) {
      return `
        <i class="fas fa-hand-peace"></i> سلام! خوش اومدی به <strong>MH Assistant</strong>.<br>
        <span style="color:#b0a99b; font-size:0.7rem;">هر چیزی بپرس، پردازش میکنم!</span>
      `;
    }

    if (text.includes('خوب') || text.includes('چطوری') || text.includes('حالت') || text.includes('اوضاع')) {
      return `
        <i class="fas fa-smile"></i> ممنون! من <strong>MH Assistant</strong> هستم و عالی‌ام.<br>
        <i class="fas fa-rocket" style="color:#f5b042;"></i> منتظر سوال بعدی‌ات.
      `;
    }

    if (text.includes('ممنون') || text.includes('مرسی') || text.includes('متشکرم') || text.includes('دمت گرم')) {
      return `
        <i class="fas fa-heart" style="color:#f5b042;"></i> خواهش می‌کنم!<br>
        خوشحالم که کمک کردم.
      `;
    }

    // ===== پاسخ پیش‌فرض =====
    return `
      <i class="fas fa-robot"></i> <strong>من MH Assistant هستم!</strong><br>
      کلمه "<strong>${text}</strong>" رو پردازش کردم.<br><br>
      می‌تونی از اینا بپرسی:<br>
      <span style="color:#f5b042;">کی هستی؟</span> • <span style="color:#f5b042;">سایت</span> • <span style="color:#f5b042;">طراحی</span> • <span style="color:#f5b042;">مهارت</span>
    `;
  }

  // ============================================================
  //  توابع اصلی
  // ============================================================

  const messagesBox = document.getElementById('messagesBox');
  const userInput = document.getElementById('userInput');
  let isTyping = false;
  let isUserScrolled = false;

  messagesBox.addEventListener('scroll', function() {
    const isAtBottom = messagesBox.scrollHeight - messagesBox.scrollTop <= messagesBox.clientHeight + 30;
    isUserScrolled = !isAtBottom;
  });

  function scrollToBottom() {
    if (!isUserScrolled) {
      messagesBox.scrollTop = messagesBox.scrollHeight;
    }
  }

  function sendMessage() {
    const text = userInput.value.trim();
    if (!text || isTyping) return;

    addMessage('user', text);
    userInput.value = '';
    userInput.focus();

    isTyping = true;
    showTyping();

    setTimeout(() => {
      hideTyping();
      const reply = getSmartReply(text);
      addMessage('bot', reply);
      isTyping = false;
    }, 350);
  }

  function askQuestion(text) {
    userInput.value = text;
    sendMessage();
  }

  function addMessage(type, content) {
    const div = document.createElement('div');
    div.className = `message ${type}`;

    const avatar = document.createElement('div');
    avatar.className = 'avatar';
    avatar.innerHTML = type === 'bot' ? '<i class="fas fa-robot"></i>' : '<i class="fas fa-user"></i>';

    const bubble = document.createElement('div');
    bubble.className = 'bubble';
    bubble.innerHTML = content;

    div.appendChild(avatar);
    div.appendChild(bubble);
    messagesBox.appendChild(div);
    
    setTimeout(scrollToBottom, 50);
  }

  function showTyping() {
    let typing = document.querySelector('.typing-indicator');
    if (!typing) {
      typing = document.createElement('div');
      typing.className = 'typing-indicator';
      typing.innerHTML = '<i class="fas fa-robot"></i> در حال پردازش...';
      messagesBox.appendChild(typing);
    }
    typing.classList.add('show');
    setTimeout(scrollToBottom, 50);
  }

  function hideTyping() {
    const typing = document.querySelector('.typing-indicator');
    if (typing) typing.classList.remove('show');
  }

  userInput.addEventListener('keydown', function(e) {
    if (e.key === 'Enter') {
      e.preventDefault();
      sendMessage();
    }
  });

  window.addEventListener('load', function() {
    messagesBox.scrollTop = messagesBox.scrollHeight;
  });
</script>

</body>
</html>
