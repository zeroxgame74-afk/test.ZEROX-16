<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Tiva AI - دستیار هوشمند</title>

    <link href="https://cdn.jsdelivr.net/gh/rastikerdar/vazirmatn@v33.003/Vazirmatn-font-face.css" rel="stylesheet" />
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css" />

    <style>
        /* ===== ریست کامل ===== */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html,
        body {
            width: 100%;
            height: 100%;
            overflow: hidden;
            font-family: 'Vazirmatn', sans-serif;
            background: #070714;
        }

        /* ===== پس‌زمینه سبک (بهینه برای سرعت) ===== */
        .bg {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 0;
            background: radial-gradient(ellipse at 30% 40%, #0d0d2b, #050510);
        }

        /* فقط ۴ تا ذره (برای کاهش لگ) */
        .bg .dot {
            position: absolute;
            border-radius: 50%;
            animation: floatDot 10s infinite linear;
            opacity: 0.3;
        }

        .bg .dot:nth-child(1) {
            width: 4px;
            height: 4px;
            background: #00d4ff;
            left: 15%;
            animation-duration: 12s;
            box-shadow: 0 0 20px #00d4ff;
        }
        .bg .dot:nth-child(2) {
            width: 3px;
            height: 3px;
            background: #a855f7;
            left: 45%;
            animation-duration: 15s;
            animation-delay: 2s;
            box-shadow: 0 0 15px #a855f7;
        }
        .bg .dot:nth-child(3) {
            width: 5px;
            height: 5px;
            background: #ec4899;
            left: 75%;
            animation-duration: 11s;
            animation-delay: 4s;
            box-shadow: 0 0 25px #ec4899;
        }
        .bg .dot:nth-child(4) {
            width: 3px;
            height: 3px;
            background: #f59e0b;
            left: 90%;
            animation-duration: 14s;
            animation-delay: 1s;
            box-shadow: 0 0 15px #f59e0b;
        }

        @keyframes floatDot {
            0% {
                transform: translateY(100vh) scale(0);
                opacity: 0;
            }
            15% {
                opacity: 0.4;
            }
            85% {
                opacity: 0.4;
            }
            100% {
                transform: translateY(-10vh) scale(2);
                opacity: 0;
            }
        }

        /* ===== کارت اصلی ===== */
        .hero {
            position: relative;
            z-index: 1;
            width: 92%;
            max-width: 720px;
            max-height: 92vh;
            margin: 20px auto;
            background: rgba(10, 10, 30, 0.8);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border-radius: 32px;
            border: 1px solid rgba(255, 255, 255, 0.04);
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.6);
            display: flex;
            flex-direction: column;
            overflow: hidden;
            animation: fadeUp 0.6s ease forwards;
            opacity: 0;
        }

        @keyframes fadeUp {
            0% {
                opacity: 0;
                transform: translateY(20px);
            }
            100% {
                opacity: 1;
                transform: translateY(0);
            }
        }

        /* ===== هدر ===== */
        .header {
            padding: 18px 22px 14px;
            border-bottom: 1px solid rgba(255, 255, 255, 0.03);
            display: flex;
            align-items: center;
            justify-content: space-between;
            flex-shrink: 0;
        }

        .header .logo {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .header .logo i {
            font-size: 26px;
            color: #00d4ff;
            animation: iconPulse 2.5s ease-in-out infinite;
        }

        @keyframes iconPulse {
            0%,
            100% {
                transform: scale(1);
            }
            50% {
                transform: scale(1.1);
            }
        }

        .header .logo h1 {
            font-size: 20px;
            color: #fff;
            font-weight: 800;
        }

        .header .logo h1 span {
            background: linear-gradient(90deg, #00d4ff, #a855f7);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .header .status {
            display: flex;
            align-items: center;
            gap: 6px;
            font-size: 12px;
            color: rgba(255, 255, 255, 0.3);
        }

        .header .status .led {
            width: 6px;
            height: 6px;
            border-radius: 50%;
            background: #22c55e;
            animation: ledBlink 2s ease-in-out infinite;
        }

        @keyframes ledBlink {
            0%,
            100% {
                opacity: 1;
            }
            50% {
                opacity: 0.2;
            }
        }

        /* ===== بخش مشخصات ===== */
        .profile {
            padding: 16px 22px 12px;
            display: flex;
            align-items: center;
            gap: 16px;
            flex-shrink: 0;
            border-bottom: 1px solid rgba(255, 255, 255, 0.03);
        }

        .profile .avatar {
            width: 56px;
            height: 56px;
            border-radius: 50%;
            background: linear-gradient(135deg, #00d4ff, #7c3aed);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 26px;
            color: #fff;
            flex-shrink: 0;
            box-shadow: 0 0 30px rgba(0, 212, 255, 0.1);
        }

        .profile .info {
            flex: 1;
            min-width: 0;
        }

        .profile .info .name {
            font-size: 16px;
            font-weight: 700;
            color: #fff;
        }

        .profile .info .name i {
            color: #f59e0b;
            font-size: 12px;
            margin-right: 4px;
        }

        .profile .info .desc {
            font-size: 12px;
            color: rgba(255, 255, 255, 0.35);
            margin-top: 2px;
        }

        .profile .info .desc i {
            margin-left: 4px;
            color: #a855f7;
        }

        .profile .version {
            font-size: 11px;
            color: rgba(255, 255, 255, 0.15);
            background: rgba(255, 255, 255, 0.03);
            padding: 4px 12px;
            border-radius: 30px;
            border: 1px solid rgba(255, 255, 255, 0.03);
            flex-shrink: 0;
        }

        /* ===== بخش پیام‌ها (با اسکرول نرم) ===== */
        .chat-area {
            flex: 1;
            padding: 14px 22px;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 10px;
            min-height: 200px;
            max-height: 400px;
            scroll-behavior: smooth;
        }

        .chat-area::-webkit-scrollbar {
            width: 3px;
        }
        .chat-area::-webkit-scrollbar-thumb {
            background: rgba(0, 212, 255, 0.15);
            border-radius: 10px;
        }

        .msg {
            max-width: 82%;
            padding: 10px 16px;
            border-radius: 16px;
            font-size: 14px;
            line-height: 1.7;
            animation: msgIn 0.25s ease forwards;
            opacity: 0;
            word-wrap: break-word;
        }

        @keyframes msgIn {
            0% {
                opacity: 0;
                transform: translateY(6px);
            }
            100% {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .msg.user {
            align-self: flex-end;
            background: linear-gradient(135deg, #00d4ff, #7c3aed);
            color: #fff;
            border-bottom-right-radius: 4px;
        }

        .msg.ai {
            align-self: flex-start;
            background: rgba(255, 255, 255, 0.04);
            color: rgba(255, 255, 255, 0.8);
            border-bottom-left-radius: 4px;
            border: 1px solid rgba(255, 255, 255, 0.03);
        }

        .msg.ai .dot-load {
            display: inline-flex;
            gap: 4px;
        }

        .msg.ai .dot-load span {
            width: 5px;
            height: 5px;
            background: rgba(255, 255, 255, 0.2);
            border-radius: 50%;
            animation: dotJump 1.2s ease-in-out infinite;
        }

        .msg.ai .dot-load span:nth-child(2) {
            animation-delay: 0.2s;
        }
        .msg.ai .dot-load span:nth-child(3) {
            animation-delay: 0.4s;
        }

        @keyframes dotJump {
            0%,
            80%,
            100% {
                transform: scale(0.5);
                opacity: 0.3;
            }
            40% {
                transform: scale(1);
                opacity: 1;
            }
        }

        /* ===== بخش ورودی (سبک و سریع) ===== */
        .input-area {
            padding: 12px 22px 18px;
            border-top: 1px solid rgba(255, 255, 255, 0.03);
            display: flex;
            gap: 10px;
            flex-shrink: 0;
        }

        .input-area input {
            flex: 1;
            padding: 12px 18px;
            border-radius: 40px;
            border: 1px solid rgba(255, 255, 255, 0.04);
            background: rgba(255, 255, 255, 0.02);
            color: #fff;
            font-family: 'Vazirmatn', sans-serif;
            font-size: 14px;
            outline: none;
            transition: 0.2s;
        }

        .input-area input::placeholder {
            color: rgba(255, 255, 255, 0.15);
        }

        .input-area input:focus {
            border-color: rgba(0, 212, 255, 0.1);
            background: rgba(255, 255, 255, 0.04);
        }

        .input-area input:disabled {
            opacity: 0.3;
        }

        .input-area button {
            padding: 12px 24px;
            border-radius: 40px;
            border: none;
            background: linear-gradient(135deg, #00d4ff, #7c3aed);
            color: #fff;
            font-weight: 700;
            font-size: 14px;
            cursor: pointer;
            transition: 0.2s;
            display: flex;
            align-items: center;
            gap: 8px;
            flex-shrink: 0;
            font-family: 'Vazirmatn', sans-serif;
        }

        .input-area button:hover:not(:disabled) {
            transform: scale(1.03);
        }

        .input-area button:disabled {
            opacity: 0.3;
            cursor: not-allowed;
        }

        /* ===== ریسپانسیو ===== */
        @media (max-width: 600px) {
            .hero {
                width: 100%;
                max-height: 100vh;
                margin: 0;
                border-radius: 0;
            }
            .header {
                padding: 14px 16px 10px;
            }
            .header .logo h1 {
                font-size: 17px;
            }
            .profile {
                padding: 12px 16px 10px;
                flex-wrap: wrap;
            }
            .profile .avatar {
                width: 44px;
                height: 44px;
                font-size: 20px;
            }
            .profile .info .name {
                font-size: 14px;
            }
            .profile .version {
                font-size: 10px;
                padding: 2px 10px;
            }
            .chat-area {
                padding: 10px 16px;
                min-height: 150px;
                max-height: 300px;
            }
            .msg {
                max-width: 90%;
                font-size: 13px;
                padding: 8px 14px;
            }
            .input-area {
                padding: 10px 16px 14px;
                flex-wrap: wrap;
            }
            .input-area input {
                font-size: 13px;
                padding: 10px 14px;
                min-width: 0;
            }
            .input-area button {
                padding: 10px 18px;
                font-size: 13px;
                width: 100%;
                justify-content: center;
            }
        }
    </style>
</head>
<body>

    <div class="bg">
        <div class="dot"></div>
        <div class="dot"></div>
        <div class="dot"></div>
        <div class="dot"></div>
    </div>

    <div class="hero">

        <!-- ===== هدر ===== -->
        <div class="header">
            <div class="logo">
                <i class="fa-solid fa-microchip"></i>
                <h1><span>Tiva</span> AI</h1>
            </div>
            <div class="status">
                <span class="led"></span>
                <span>آماده</span>
            </div>
        </div>

        <!-- ===== مشخصات ===== -->
        <div class="profile">
            <div class="avatar">
                <i class="fa-regular fa-user"></i>
            </div>
            <div class="info">
                <div class="name">
                    Tiva <i class="fa-regular fa-circle-check"></i>
                </div>
                <div class="desc">
                    <i class="fa-regular fa-comment"></i> دستیار هوشمند | پاسخ‌های آنی
                </div>
            </div>
            <div class="version">v2.0</div>
        </div>

        <!-- ===== بخش پیام‌ها ===== -->
        <div class="chat-area" id="chatArea">
            <div class="msg ai">
                <i class="fa-regular fa-hand-peace" style="margin-left:6px;"></i>
                سلام! من <strong>Tiva</strong> هستم. هر سوالی داری بپرس.
            </div>
        </div>

        <!-- ===== بخش ورودی ===== -->
        <div class="input-area">
            <input type="text" id="userInput" placeholder="سوال خود را بنویس..." />
            <button id="sendBtn">
                <i class="fa-regular fa-paper-plane"></i> ارسال
            </button>
        </div>

    </div>

    <script>
        // ============================================================
        //  Tiva AI - کاملاً آفلاین و سریع (پردازش داخلی)
        // ============================================================

        const chatArea = document.getElementById('chatArea');
        const userInput = document.getElementById('userInput');
        const sendBtn = document.getElementById('sendBtn');

        // ===== دانش اولیه Tiva =====
        const knowledge = {
            'سلام': 'سلام! چطور می‌تونم کمکت کنم؟',
            'خوبی': 'عالی‌ام! ممنون که پرسیدی. تو چطوری؟',
            'اسمت چیه': 'اسم من Tiva هست. دستیار هوشمند شما!',
            'کی هستی': 'من Tiva هستم، یک دستیار هوشمند که برای کمک به شما ساخته شدم.',
            'چیکار میکنی': 'به سوالاتت جواب می‌دم، ایده می‌دم و در هر چیزی که نیاز داری کمک می‌کنم.',
            'چه کاری بلدی': 'بلدم به سوالات جواب بدم، ایده بدم، راهنمایی کنم و کلی چیز دیگه!',
            'ممنون': 'خواهش می‌کنم! هر وقت نیاز داشتی من اینجام.',
            'خداحافظ': 'خداحافظ! روز خوبی داشته باشی 🌟',
            'عشق': '❤️ ممنون! تو هم عشقی!',
            'باحالی': 'ممنون! تو هم باحالی 😎',
            'تاریخ': `امروز ${new Date().toLocaleDateString('fa-IR')} هست.`,
            'ساعت': `ساعت الان ${new Date().toLocaleTimeString('fa-IR')} هست.`,
        };

        // ===== جستجوی هوشمند (سریع) =====
        function getReply(text) {
            const clean = text.trim().toLowerCase();

            // بررسی تطابق کامل
            for (const [key, value] of Object.entries(knowledge)) {
                if (clean.includes(key)) {
                    return value;
                }
            }

            // پاسخ‌های هوشمند ساده
            if (clean.includes('چند') || clean.includes('چطور') || clean.includes('چرا')) {
                return 'سوال خوبی پرسیدی! ولی فعلاً دانش من محدوده. می‌تونی دقیق‌تر بپرسی؟';
            }

            if (clean.includes('اسم') || clean.includes('نام')) {
                return 'اسم من Tiva هست! خوشحالم که باهام حرف می‌زنی.';
            }

            if (clean.includes('کار') || clean.includes('شغل')) {
                return 'من یک دستیار هوشمند هستم و وظیفه‌ام کمک به شماست!';
            }

            if (clean.includes('خنده') || clean.includes('جک')) {
                return '😂 یه جوک: چرا کامپیوترها خوشحال نیستن؟ چون مادربردشون خرابه!';
            }

            // پاسخ پیش‌فرض
            const defaults = [
                'سوال خوبی پرسیدی! بیشتر توضیح بده تا بهتر کمک کنم.',
                'هوم... بذار فکر کنم. کمی دقیق‌تر بپرس.',
                'متوجه شدم! ولی برای جواب دقیق‌تر، کمی بیشتر توضیح بده.',
                'آره! ولی راستش رو بخوای فعلاً دانش من محدوده. سعی کن ساده‌تر بپرسی.',
            ];
            return defaults[Math.floor(Math.random() * defaults.length)];
        }

        // ===== نمایش پیام =====
        function showMessage(type, content) {
            const div = document.createElement('div');
            div.className = `msg ${type}`;

            if (type === 'ai' && content === '...') {
                div.innerHTML = `
                    <div class="dot-load">
                        <span></span><span></span><span></span>
                    </div>
                `;
            } else {
                div.textContent = content;
            }

            chatArea.appendChild(div);
            chatArea.scrollTop = chatArea.scrollHeight;
            return div;
        }

        // ===== ارسال پیام =====
        function sendMessage() {
            const text = userInput.value.trim();
            if (!text) return;

            // نمایش پیام کاربر
            showMessage('user', text);
            userInput.value = '';
            userInput.disabled = true;
            sendBtn.disabled = true;

            // نمایش لودینگ سریع
            const loading = showMessage('ai', '...');

            // پردازش با تأخیر بسیار کم (برای نمایش لودینگ)
            setTimeout(() => {
                loading.remove();
                const reply = getReply(text);
                showMessage('ai', reply);
                userInput.disabled = false;
                sendBtn.disabled = false;
                userInput.focus();
            }, 180); // تأخیر ۱۸۰ میلی‌ثانیه (بی‌لگ)
        }

        // ===== رویدادها =====
        sendBtn.addEventListener('click', sendMessage);
        userInput.addEventListener('keydown', function(e) {
            if (e.key === 'Enter') {
                sendMessage();
            }
        });

        userInput.focus();
    </script>

</body>
</html>
